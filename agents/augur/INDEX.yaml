schema: agent-index/v1
agent: augur
description: Static Augur bundle manifest for architecture analysis preload
usage:
  preload: included in generated AGENT.md and intended to support Augur `/analyze` only, not generic consultation
  ondemand: not included in the generated bundle; read only when needed
  runtime: mutable or generated at runtime; never compiled into the static bundle
entries:
  - path: IDENTITY.md
    kind: file
    purpose: Stable role, capabilities, and hard rules for Augur
    preload: preload
    include: true
    mutable: false
    source_of_truth: repo
  - path: memory/MEMORY.md
    kind: file
    purpose: Augur memory entrypoint
    preload: preload
    include: true
    mutable: false
    source_of_truth: repo
  - path: memory/workflow.md
    kind: file
    purpose: Core analysis and design workflow
    preload: preload
    include: true
    mutable: false
    source_of_truth: repo
  - path: memory/tools.md
    kind: file
    purpose: Tooling reference for analysis and validation
    preload: preload
    include: true
    mutable: false
    source_of_truth: repo
  - path: memory/indexes
    kind: dir
    purpose: Stable ontology and index layer for preload
    preload: preload
    include: true
    mutable: false
    source_of_truth: repo
  - path: memory/contracts
    kind: dir
    purpose: Normative architectural contracts
    preload: preload
    include: true
    mutable: false
    source_of_truth: repo
  - path: memory/concepts
    kind: dir
    purpose: Canonical semantic library split by concept family, including frameworks
    preload: ondemand
    include: false
    mutable: false
    source_of_truth: repo
  - path: detectors/frameworks
    kind: dir
    purpose: Framework detector source assets
    preload: ondemand
    include: false
    mutable: false
    source_of_truth: repo
  - path: detectors/concepts
    kind: dir
    purpose: Concept detector source assets
    preload: ondemand
    include: false
    mutable: false
    source_of_truth: repo
  - path: benchmarks
    kind: dir
    purpose: Evaluation datasets, ablation definitions, and benchmark runners for analyze
    preload: ondemand
    include: false
    mutable: false
    source_of_truth: repo
  - path: docs/release-contract.md
    kind: file
    purpose: External publication contract for shipping Augur as a versioned artifact outside the monorepo
    preload: ondemand
    include: false
    mutable: false
    source_of_truth: repo
  - path: schemas/augur-release-schema.md
    kind: file
    purpose: Canonical manifest contract for publishable Augur release artifacts
    preload: ondemand
    include: false
    mutable: false
    source_of_truth: repo
  - path: .generated/bundles/memory
    kind: dir
    purpose: Generated semantic memory bundles for analyze holistic and selective preload profiles
    preload: runtime
    include: false
    mutable: true
    source_of_truth: generated
  - path: .generated/bundles/runtime
    kind: dir
    purpose: Final runtime analyze bundles with distinct cacheable prefixes for holistic and selective execution
    preload: runtime
    include: false
    mutable: true
    source_of_truth: generated
  - path: .generated/bundles/detectors
    kind: dir
    purpose: Generated detector bundles and execution plan
    preload: runtime
    include: false
    mutable: true
    source_of_truth: generated
