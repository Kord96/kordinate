name: angular
kind: framework
language: typescript
framework_kind: ui-app
summary: TypeScript frontend application framework with dependency injection, components, routing, and structured forms
status: primary
scope: frontend
relationships:
  implements:
    - component
  supports:
    - dependency-injection
    - form-binding
    - route-guard
    - hydration
  related_to:
