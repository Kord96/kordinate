name: fastapi
kind: framework
language: python
framework_kind: api-server
summary: Async Python API framework with typed routing and validation
status: primary
scope: backend
relationships:
  implements:
    - rest
  supports:
    - dependency-injection
    - input-validation
  uses:
    - server-route-registration
  related_to:
    - layered
    - hexagonal
traits:
  api_surface: true
  async_native: true
  validation_native: true
  dependency_injection_native: true
common_concepts:
  - repository
common_failure_modes:
  - business-logic-in-routes
  - mixed-sync-async
  - leaking-persistence-models
