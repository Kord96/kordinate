schema: augur-concept-meta/v2
concept: copy-paste-programming
kind: anti-pattern
summary: Copy-Paste Programming anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-two-or-more-code-blocks-of-10-lines-that-are-textually
    prompt: Are there two or more code blocks of 10+ lines that are textually identical or differ only in variable names?
    weight: 3
    signals:
    - duplicated code blocks
    - textually identical functions
    - clone pair across files
  - id: does-the-same-business-rule-validation-regex-or-transformation-l
    prompt: Does the same business rule, validation regex, or transformation logic appear in 3 or more locations?
    weight: 3
    signals:
    - repeated validation logic
    - duplicated regex across modules
    - same rule in multiple places
  - id: are-there-comments-like-copied-from-or-todo-deduplicate-indicati
    prompt: 'Are there comments like ''copied from'' or ''TODO: deduplicate'' indicating known duplication?'
    weight: 2
    signals:
    - copied-from comment
    - deduplicate TODO
    - acknowledged duplication
  - id: does-fixing-a-bug-in-one-location-leave-the-same-bug-unfixed-in-
    prompt: Does fixing a bug in one location leave the same bug unfixed in duplicated code elsewhere?
    weight: 1
    signals:
    - diverged copies
    - fix applied to one clone only
    - inconsistent duplicated behavior
