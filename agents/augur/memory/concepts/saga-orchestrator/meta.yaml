schema: augur-concept-meta/v2
concept: saga-orchestrator
kind: pattern
summary: Saga Orchestrator architectural pattern
taxonomy:
  type: pattern
  categories:
  - messaging
  - integration
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-there-a-central-coordinator-class-managing-a-sequence-of-saga
    prompt: Is there a central coordinator class managing a sequence of saga steps with forward and compensating actions?
    weight: 3
    signals:
    - SagaOrchestrator or SagaCoordinator class
    - step definitions with execute and compensate methods
    - central class driving step sequence
  - id: is-saga-state-persisted-so-recovery-can-resume-or-compensate-aft
    prompt: Is saga state persisted so recovery can resume or compensate after a crash?
    weight: 3
    signals:
    - saga state written to database
    - step status tracked as pending/completed/compensated
    - persistent saga log or event store
  - id: is-compensation-executed-in-reverse-order-of-completed-steps-on-
    prompt: Is compensation executed in reverse order of completed steps on failure?
    weight: 2
    signals:
    - reverse-order compensation on failure
    - rollback completed steps from last to first
    - compensate only completed steps
  - id: are-step-executions-idempotent-so-retries-do-not-cause-duplicate
    prompt: Are step executions idempotent so retries do not cause duplicate side effects?
    weight: 1
    signals:
    - idempotency key on step execution
    - deduplication on retry
    - safe to replay step
