schema: augur-concept-meta/v2
concept: training-pipeline
kind: pattern
summary: Training Pipeline architectural pattern
taxonomy:
  type: pattern
  categories:
  - data
  - ml
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
traits:
  testable: true
  observable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-the-code-contain-sequential-stages-for-data-loading-preproc
    prompt: Does the code contain sequential stages for data loading, preprocessing, training (fit/train), evaluation, and model export?
    weight: 3
    signals:
    - fit() or train() method
    - evaluate() and save_model()
    - sequential pipeline stages
  - id: are-hyperparameters-externalized-in-configuration-files-rather-t
    prompt: Are hyperparameters externalized in configuration files rather than hardcoded throughout the training code?
    weight: 2
    signals:
    - hyperparameter config YAML or JSON
    - config objects for training params
    - externalized learning rate and batch size
  - id: is-experiment-tracking-present-with-run-ids-logged-metrics-and-p
    prompt: Is experiment tracking present with run IDs, logged metrics, and parameter recording across training runs?
    weight: 2
    signals:
    - experiment tracking with run_id
    - metric logging per run
    - parameter recording for reproducibility
  - id: are-checkpoints-saved-periodically-during-training-to-enable-res
    prompt: Are checkpoints saved periodically during training to enable resumption after failures?
    weight: 2
    signals:
    - checkpoint saving
    - training resumption from checkpoint
    - periodic model state persistence
analysis:
  testing:
    summary: '# Testing - Test each pipeline stage (load, preprocess, train, evaluate, export) independently with small datasets - Verify reproducibility: same data + same hyperparameters + same seed = same training result - Test checkpoint save and resume: interrupt training, restore from checkpoint, and verify continued training matches uninterrupted - Test the evaluation gate: models below threshold metrics must not be exported - Verify hyperparameter externalization — changing config without code changes produces different training runs - Test data versioning: training with a pinned data snapshot produces reproducible results - Integration test the full pipeline end-to-end with a tiny dataset to verify stage wiring - Assert that experiment tracking logs all parameters, metrics, and artifacts for every run'
  monitoring:
    summary: Track per-stage execution, training convergence, resource utilization, and checkpoint reliability across training runs.
    metrics:
    - name: training_stage_duration_seconds
      kind: histogram
      description: execution time per pipeline stage (load, preprocess, train, evaluate, export)
    - name: training_loss
      kind: gauge
      description: current loss value per run, tracked per epoch for convergence monitoring
    - name: training_evaluation_metric
      kind: gauge
      description: accuracy, F1, or domain-specific metric per run at evaluation stage
    - name: training_gpu_utilization_ratio
      kind: gauge
      description: GPU utilization during training, detects resource starvation or underuse
    - name: training_checkpoint_failures_total
      kind: counter
      description: failed checkpoint saves that risk losing training progress
    - name: training_evaluation_gate_results_total
      kind: counter
      description: evaluation gate outcomes (pass/fail) controlling model export
    alerts:
    - Training loss plateaued or diverging after expected number of epochs
    - Checkpoint save failed (potential loss of hours of training progress)
    - GPU/CPU utilization abnormally low during training (resource starvation or misconfiguration)
    - Evaluation gate blocking model export (model does not meet quality threshold)
    - Pipeline stage duration significantly exceeding historical baseline (bottleneck or regression)
