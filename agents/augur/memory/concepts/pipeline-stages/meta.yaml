schema: augur-concept-meta/v2
concept: pipeline-stages
kind: structure-shape
summary: Pipeline stages structure — components arranged as sequential processing stages
taxonomy:
  type: structure-shape
  categories:
  - architectural
  - data
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
diagnostic_questions:
  threshold: 3
  questions:
  - id: are-there-components-named-stage-step-phase-or-processor-arrange
    prompt: Are there components named Stage, Step, Phase, or Processor arranged sequentially?
    weight: 1
    signals:
    - Stage
    - Step
    - Phase
    - Processor
    - Pipeline
  - id: does-the-output-of-one-stage-feed-as-input-to-the-next
    prompt: Does the output of one stage feed as input to the next?
    weight: 1
  - id: is-there-a-pipeline-class-composing-stage-instances
    prompt: Is there a Pipeline class composing Stage instances?
    weight: 1
    signals:
    - Pipeline
    - pipe(
    - compose
  - id: are-stages-independently-testable-or-replaceable
    prompt: Are stages independently testable or replaceable?
    weight: 1
