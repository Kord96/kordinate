schema: augur-concept-meta/v2
concept: chatty-api
kind: anti-pattern
summary: Chatty API anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-a-single-user-action-or-page-load-require-10-or-more-sequen
    prompt: Does a single user action or page load require 10 or more sequential API calls to the same backend?
    weight: 3
    signals:
    - sequential API call cascade
    - many requests per action
    - 10+ calls for one view
  - id: are-there-n-individual-requests-made-to-fetch-n-items-instead-of
    prompt: Are there N individual requests made to fetch N items instead of a batch or bulk endpoint?
    weight: 3
    signals:
    - fetch-by-id in a loop
    - no batch endpoint
    - one request per item
  - id: does-the-client-contain-orchestration-logic-to-sequence-merge-an
    prompt: Does the client contain orchestration logic to sequence, merge, and error-handle multiple API responses?
    weight: 2
    signals:
    - client-side response merging
    - frontend orchestration of backend calls
    - waterfall API requests
  - id: does-the-api-lack-bulk-or-aggregation-endpoints-for-operations-t
    prompt: Does the API lack bulk or aggregation endpoints for operations that naturally apply to collections?
    weight: 1
    signals:
    - no bulk endpoint
    - single-resource-only API
    - missing collection operations
