schema: augur-concept-meta/v2
concept: worker-pool
kind: pattern
summary: Worker/Thread Pool architectural pattern
taxonomy:
  type: pattern
  categories:
  - concurrency
  - infrastructure
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
traits:
  testable: true
  observable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-the-code-create-a-fixed-pool-of-workers-threads-processes-o
    prompt: Does the code create a fixed pool of workers (threads, processes, or goroutines) that pull tasks from a shared queue?
    weight: 3
    signals:
    - ThreadPoolExecutor or ProcessPoolExecutor
    - fixed worker count
    - shared task queue
  - id: are-tasks-submitted-to-the-pool-via-submit-map-or-apply-async-ra
    prompt: Are tasks submitted to the pool via submit(), map(), or apply_async() rather than spawning new threads per task?
    weight: 3
    signals:
    - submit() or map() to pool
    - task dispatch to existing workers
    - reusable worker threads
  - id: is-the-pool-size-configurable-and-is-graceful-shutdown-implement
    prompt: Is the pool size configurable and is graceful shutdown implemented so pending tasks complete before termination?
    weight: 2
    signals:
    - max_workers configuration
    - graceful pool shutdown
    - pending tasks complete on exit
  - id: are-exceptions-from-worker-tasks-captured-and-reported-rather-th
    prompt: Are exceptions from worker tasks captured and reported rather than silently swallowed?
    weight: 1
    signals:
    - exception capture from futures
    - worker error reporting
    - task failure not silently lost
analysis:
  testing:
    summary: '# Testing - Test that pool size is configurable and tasks execute concurrently up to the pool limit - Verify graceful shutdown: pending tasks complete before the pool terminates - Test exception handling in worker tasks — exceptions must be captured and reported, not silently lost - Test task timeout enforcement: long-running tasks are terminated after the configured timeout - Verify that submitted tasks are independent — no hidden shared mutable state between tasks - Test queue depth limits: submitting beyond capacity rejects or blocks as configured - Test that future/result objects are properly consumed and not leaked - Load test the pool with burst submissions to verify backpressure and queue behavior'
  monitoring:
    summary: Track pool utilization, queue depth, and per-task execution health to prevent saturation and detect failures.
    metrics:
    - name: pool_active_workers
      kind: gauge
      description: workers currently executing tasks versus total pool size
    - name: pool_utilization_ratio
      kind: gauge
      description: fraction of workers busy, indicates headroom or saturation
    - name: pool_queue_depth
      kind: gauge
      description: tasks waiting in the submission queue for an available worker
    - name: pool_task_duration_seconds
      kind: histogram
      description: per-task execution time, partitioned by task type
    - name: pool_task_failures_total
      kind: counter
      description: task exceptions partitioned by error type
    - name: pool_submitted_tasks_total
      kind: counter
      description: tasks submitted to the pool over time
    alerts:
    - Queue depth exceeding threshold (backlog building, pool cannot keep up)
    - All workers busy with long-running tasks (worker starvation, new submissions blocked)
    - Task execution exceeding configured timeout (hung task consuming a worker)
    - Task failure rate elevated for a specific task type (systematic error)
    - Submitted tasks whose futures are never consumed (leaked futures, resource waste)
