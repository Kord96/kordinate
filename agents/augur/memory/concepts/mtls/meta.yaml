schema: augur-concept-meta/v2
concept: mtls
kind: pattern
summary: Mutual TLS architectural pattern
taxonomy:
  type: pattern
  categories:
  - security
  - infrastructure
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-the-server-require-and-verify-client-certificates-not-just-
    prompt: Does the server require and verify client certificates, not just its own server certificate?
    weight: 3
    signals:
    - 'ClientAuth: RequireAndVerifyClientCert'
    - ssl_verify_client on
    - client cert required
  - id: is-a-scoped-ca-bundle-loaded-for-validating-client-certificates-
    prompt: Is a scoped CA bundle loaded for validating client certificates rather than the system-wide CA store?
    weight: 3
    signals:
    - ClientCAs configured
    - ssl_client_certificate path
    - narrow CA trust
  - id: is-the-client-certificate-identity-cn-or-san-checked-after-the-t
    prompt: Is the client certificate identity (CN or SAN) checked after the TLS handshake for authorization decisions?
    weight: 2
    signals:
    - SAN extraction from peer cert
    - subject CN checked
    - identity-based access control
  - id: are-certificates-rotated-automatically-with-defined-validity-per
    prompt: Are certificates rotated automatically with defined validity periods?
    weight: 2
    signals:
    - cert-manager renewal
    - Vault PKI auto-rotation
    - certificate expiry monitoring
analysis:
  testing:
    summary: Verify bidirectional certificate verification, rejection of invalid certs, and correct identity extraction.
    unit:
    - Present a valid client certificate and assert the server accepts the connection and extracts the correct identity (CN/SAN)
    - Present no client certificate and assert the server rejects the connection
    - Present a certificate signed by an untrusted CA and assert the handshake fails
    integration:
    - Establish an mTLS connection between two services and verify end-to-end request/response works
    - Rotate the client certificate and verify the new certificate is accepted without service restart
    - Verify that the server's CA bundle is scoped narrowly (rejects certificates from unexpected CAs)
    additional_sections:
    - title: Expiry and Revocation Tests
      items:
      - Present an expired certificate and assert the handshake is rejected
      - If CRL/OCSP is configured, revoke a certificate and verify the server rejects it
      - 'Test certificate renewal automation end-to-end: trigger renewal and verify the new cert is used'
  monitoring:
    summary: Track certificate health, handshake failures, and expiry to prevent authentication outages.
    metrics:
    - name: tls_handshake_failures_total
      kind: counter
      description: failed mTLS handshakes by reason (expired cert, unknown CA, no client cert)
    - name: certificate_expiry_seconds
      kind: gauge
      description: time remaining until the client or server certificate expires
    - name: tls_connections_active
      kind: gauge
      description: current number of established mTLS connections
    - name: certificate_rotation_total
      kind: counter
      description: successful certificate rotations
    alerts:
    - Certificate expiring within the rotation safety window (e.g., 7 days before expiry)
    - Handshake failure rate spike (new deployment presenting wrong cert or CA mismatch)
    - Any plaintext connections on ports that should enforce mTLS
    - Certificate rotation failure (automated renewal did not complete)
  deployment:
    summary: Coordinate certificate provisioning with service rollouts to avoid handshake failures during deployment.
    rollout_implications:
    - New service versions must have valid client certificates provisioned before they attempt connections
    - CA bundle updates must be deployed to servers before clients present certificates signed by the new CA
    - Rolling updates should maintain at least one pod with a valid certificate at all times during transition
    - Certificate rotation and service deployment should not overlap to isolate failure causes
    pre_deploy_checklist:
    - Verify client and server certificates are provisioned and not expired in the target environment
    - Confirm the CA bundle on the server includes the CA that signed the new client certificates
    - Test mTLS handshake between the new service version and its dependencies in a staging environment
    - Ensure plaintext fallback is disabled -- TLS enforcement is not optional
