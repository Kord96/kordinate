schema: augur-concept-meta/v2
concept: mvc
kind: pattern
summary: Model-View-Controller architectural pattern
taxonomy:
  type: pattern
  categories:
  - architectural
  - frontend
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-separate-model-view-and-controller-layers-with-distinc
    prompt: Are there separate model, view, and controller layers with distinct responsibilities in the directory structure?
    weight: 3
    signals:
    - models/ views/ controllers/ directories
    - UserController class
    - UserModel class
  - id: do-controllers-handle-http-input-and-delegate-to-models-services
    prompt: Do controllers handle HTTP input and delegate to models/services without containing business logic themselves?
    weight: 3
    signals:
    - thin controller delegating to service
    - controller calls model method
    - no SQL in controller
  - id: do-views-contain-only-presentation-logic-with-no-database-querie
    prompt: Do views contain only presentation logic with no database queries or business rules?
    weight: 2
    signals:
    - template renders model data
    - no DB calls in view
    - no business logic in template
  - id: do-models-manage-data-access-and-business-logic-without-knowledg
    prompt: Do models manage data access and business logic without knowledge of the HTTP or view layer?
    weight: 2
    signals:
    - model has no request/response imports
    - model unaware of views
    - pure domain logic in model
analysis:
  testing:
    summary: Verify layer separation by testing models, views, and controllers independently.
    unit:
    - 'Test models in isolation: business logic and data access without importing views or controllers'
    - 'Test controllers with mock models: assert correct delegation, input validation, and response selection'
    - Test views/templates with known model data and assert rendered output matches expectations
    integration:
    - Send HTTP requests through the full stack and verify the response body, status code, and headers
    - Verify that invalid input is caught at the controller layer, not deep in the model
    - Test that model changes propagate correctly to the view (no stale data in rendered output)
    additional_sections:
    - title: Architectural Tests
      items:
      - Assert that model modules have no imports from view or controller modules (enforce layer direction)
      - 'Verify controllers are thin: no database queries or business logic in controller test files'
      - Check that views contain no data mutation or business logic
