schema: augur-concept-meta/v2
concept: read-write-lock
kind: pattern
summary: Read-Write Lock architectural pattern
taxonomy:
  type: pattern
  categories:
  - concurrency
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-separate-lock-acquisition-paths-for-read-versus-write-
    prompt: Are there separate lock acquisition paths for read versus write operations on shared resources?
    weight: 3
    signals:
    - RWMutex with RLock and Lock
    - ReentrantReadWriteLock with readLock and writeLock
    - shared_lock and unique_lock on same resource
  - id: are-multiple-concurrent-readers-permitted-while-writers-get-excl
    prompt: Are multiple concurrent readers permitted while writers get exclusive access?
    weight: 3
    signals:
    - concurrent reads allowed
    - exclusive write lock blocks readers
    - shared access for reads only
  - id: is-the-lock-scope-minimal-held-only-for-the-duration-of-the-crit
    prompt: Is the lock scope minimal, held only for the duration of the critical section?
    weight: 2
    signals:
    - lock released immediately after read
    - defer unlock after critical section
    - lock not held during I/O or network calls
  - id: is-write-starvation-addressed-so-writers-eventually-acquire-the-
    prompt: Is write starvation addressed so writers eventually acquire the lock under heavy read load?
    weight: 1
    signals:
    - writer priority or fairness policy
    - lock acquisition timeout configured
    - fair read-write lock
analysis:
  testing:
    summary: Verify concurrent reader access, exclusive writer access, and absence of deadlock or starvation.
    unit:
    - Acquire a read lock from two threads simultaneously and verify both succeed (shared access)
    - Acquire a write lock and verify a concurrent read lock acquisition blocks until the write lock is released
    - Acquire a read lock and verify a concurrent write lock acquisition blocks until all read locks are released
    - 'Test lock timeout: attempt to acquire a write lock while readers hold it, and verify timeout fires correctly'
    additional_sections:
    - title: Starvation Tests
      items:
      - Run continuous readers and verify a waiting writer eventually acquires the lock (no write starvation)
      - Run a long-running writer and verify waiting readers are served promptly after the write lock is released
      - 'Verify lock fairness: writers waiting before readers are served first (if the implementation guarantees fairness)'
    - title: Deadlock Tests
      items:
      - Attempt to upgrade a read lock to a write lock and verify the behavior matches the contract (atomic upgrade or explicit error)
      - Acquire locks in nested order from multiple threads and verify no deadlock occurs with consistent ordering
      - Verify lock acquisition with timeout prevents indefinite blocking in all contention scenarios
