schema: augur-concept-meta/v2
concept: sql-injection
kind: anti-pattern
summary: SQL Injection anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: true
    file: semgrep.yaml
    detector_strength: 5
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: semgrep.yaml
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-sql-queries-built-using-string-concatenation-or-f-strings-wi
    prompt: Are SQL queries built using string concatenation or f-strings with user-controlled input?
    weight: 3
    signals:
    - f-string inside cursor.execute()
    - string concatenation building SQL with user input
    - format() inserting variables into SQL
  - id: are-parameterized-queries-absent-where-raw-sql-strings-are-used
    prompt: Are parameterized queries absent where raw SQL strings are used?
    weight: 3
    signals:
    - no ? or $1 placeholders in SQL
    - no parameterized bind variables
    - raw SQL without parameter substitution
  - id: are-orm-raw-or-extra-methods-used-with-unsanitized-user-input
    prompt: Are ORM raw or extra methods used with unsanitized user input?
    weight: 2
    signals:
    - raw() with user input in Django
    - extra() with unvalidated parameters
    - raw SQL in ORM bypassing query builder
  - id: are-static-analysis-tools-with-sql-injection-rules-absent-from-t
    prompt: Are static analysis tools with SQL injection rules absent from the CI pipeline?
    weight: 1
    signals:
    - no Bandit or Semgrep SQL rules
    - no SQL injection scanning in CI
    - no SAST for query safety
analysis:
  testing:
    summary: '# Testing - Run static analysis (Bandit, Semgrep) with SQL injection rules to flag string concatenation in queries - Test all user-facing inputs with SQL injection payloads (`'' OR 1=1 --`, `''; DROP TABLE users;--`) - Verify that all SQL execution paths use parameterized queries by inspecting generated SQL in tests - Test ORM `raw()` and `extra()` calls to confirm user input is never interpolated into the SQL string - Fuzz test query parameters with special characters (quotes, semicolons, comment markers) - Assert that database accounts used by the application have least-privilege permissions - Run integration tests with a real database to verify parameterized queries execute correctly - Verify that error messages do not leak database schema information to the caller'
