schema: augur-concept-meta/v2
concept: circuit-breaker
kind: pattern
summary: Circuit Breaker architectural pattern
taxonomy:
  type: pattern
  categories:
  - resilience
  - integration
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-there-a-state-machine-with-closed-open-and-half-open-states-t
    prompt: Is there a state machine with closed, open, and half-open states that governs calls to an external dependency?
    weight: 3
    signals:
    - circuit breaker state machine
    - closed-open-half-open transitions
    - state-based call gating
  - id: does-a-failure-count-threshold-trigger-the-circuit-to-open-stopp
    prompt: Does a failure count threshold trigger the circuit to open, stopping calls to the failing dependency?
    weight: 3
    signals:
    - failure threshold
    - trip on error count
    - circuit opens after N failures
  - id: is-there-a-half-open-probe-mechanism-that-allows-limited-test-re
    prompt: Is there a half-open probe mechanism that allows limited test requests to determine if the dependency has recovered?
    weight: 2
    signals:
    - half-open probe
    - limited test requests
    - recovery check calls
  - id: is-fallback-behavior-explicitly-defined-for-when-the-circuit-is-
    prompt: Is fallback behavior explicitly defined for when the circuit is open?
    weight: 1
    signals:
    - fallback on open circuit
    - degraded response
    - circuit-open handler
analysis:
  testing:
    summary: Test the full state machine lifecycle and verify fallback behavior activates correctly at each transition.
    unit:
    - 'Verify closed-to-open transition: inject failures up to the threshold and assert the circuit opens on the next failure'
    - 'Test half-open behavior: after recovery timeout, assert exactly the configured number of probe requests are allowed through'
    - 'Verify open-to-closed transition: successful probes in half-open state return the circuit to closed'
    - Assert fallback is invoked when the circuit is open — callers receive the fallback response, not an exception
    integration:
    - Wire a circuit breaker around a real dependency, degrade the dependency, and verify the breaker opens and closes as expected
    - Test that circuit state is per-dependency — degrading one dependency does not open the breaker for another
    - 'Verify metrics emission: state transitions, failure counts, and recovery probes all emit correct metric values'
    failure_injection:
    - Simulate a flapping dependency (alternating success/failure) and verify the circuit does not oscillate rapidly between states
    - Inject total dependency failure and verify the circuit opens, then restore the dependency and confirm recovery through half-open probes
    - Introduce latency exceeding the timeout threshold and verify slow responses count as failures toward the breaker threshold
  monitoring:
    summary: Track circuit state transitions and dependency failure rates.
    metrics:
    - name: circuit_state
      kind: gauge
      description: current state per dependency (0=closed, 1=open, 2=half-open)
    - name: circuit_failures_total
      kind: counter
      description: failure count that drives the breaker
    - name: circuit_open_duration_seconds
      kind: histogram
      description: how long circuits stay open before recovery
    - name: circuit_recovery_success_total
      kind: counter
      description: successful half-open probes
    alerts:
    - Circuit open for longer than expected recovery window
    - High failure rate approaching breaker threshold (early warning)
    - Repeated open-close cycling (flapping dependency)
  deployment:
    summary: Consider dependency health and connection draining during rollouts.
    rollout_implications:
    - Drain existing connections before terminating pods — open circuits may not recover if pod dies mid-request
    - 'Health gate: do not mark new pods as ready until circuit breakers for critical dependencies are in closed state'
    - Rolling restart may temporarily spike circuit opens — expected, but monitor for cascading failures
    - If a dependency is already degraded, pause rollout to avoid all pods opening circuits simultaneously
    pre_deploy_checklist:
    - Verify circuit breaker recovery timeouts are shorter than readiness probe intervals
    - Check that pod terminationGracePeriodSeconds allows in-flight requests to complete
