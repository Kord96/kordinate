schema: augur-concept-meta/v2
concept: refresh-ahead
kind: pattern
summary: Refresh-Ahead Cache architectural pattern
taxonomy:
  type: pattern
  categories:
  - data
  - resilience
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
traits:
  testable: true
  observable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-cache-entries-proactively-refreshed-before-their-ttl-expires
    prompt: Are cache entries proactively refreshed before their TTL expires?
    weight: 3
    signals:
    - refreshAfterWrite configuration
    - background thread refreshing entries before expiry
    - probabilistic early expiration
  - id: does-the-refresh-execute-asynchronously-without-blocking-callers
    prompt: Does the refresh execute asynchronously without blocking callers serving the stale value?
    weight: 3
    signals:
    - async reload function
    - stale value served while refresh in progress
    - non-blocking refresh task
  - id: is-the-refresh-bounded-to-hot-keys-only-allowing-cold-keys-to-ex
    prompt: Is the refresh bounded to hot keys only, allowing cold keys to expire normally?
    weight: 2
    signals:
    - refresh only for recently accessed keys
    - access frequency check before refresh
    - cold entries expire without refresh
  - id: are-failed-refreshes-handled-by-keeping-the-existing-cached-valu
    prompt: Are failed refreshes handled by keeping the existing cached value?
    weight: 1
    signals:
    - keep stale on refresh failure
    - fallback to cached value on error
    - no eviction on refresh source unavailability
analysis:
  testing:
    summary: Verify proactive refresh triggers before expiry, async execution, and correct fallback behavior on refresh failure.
    unit:
    - Populate a cache entry, advance time past the refresh threshold but before TTL, and verify a background refresh is triggered
    - Verify the caller receives the stale cached value immediately while the refresh executes asynchronously
    - After refresh completes, verify the next read returns the fresh value
    - Simulate a refresh failure and verify the existing cached value is retained (not evicted)
    additional_sections:
    - title: Timing Tests
      items:
      - 'Verify refresh interval is shorter than TTL: entries are always refreshed before they would naturally expire'
      - Access a cold key (no recent reads) and verify it is not refreshed (only hot keys trigger refresh-ahead)
      - Advance time past TTL without any access and verify the entry expires normally
    - title: Concurrency Tests
      items:
      - Trigger refresh from multiple concurrent readers and verify the backing source is called only once per refresh cycle
      - 'Verify the refresh thread pool is bounded: saturate it and confirm excess refreshes are queued, not spawned unboundedly'
      - 'Test shutdown: stop the cache and verify all pending refreshes complete or are cancelled cleanly'
  monitoring:
    summary: Track refresh success rates, stale-serve frequency, and background thread pool health.
    metrics:
    - name: cache_refresh_total
      kind: counter
      description: '- background refresh attempts, by cache name'
    - name: cache_refresh_errors_total
      kind: counter
      description: '- failed refresh attempts (backing source timeout, error)'
    - name: cache_stale_serves_total
      kind: counter
      description: '- requests served from a stale entry while refresh is in progress'
    - name: cache_refresh_latency_seconds
      kind: histogram
      description: '- time to complete a background refresh from the source'
    - name: cache_refresh_pool_active
      kind: gauge
      description: '- active threads in the refresh executor pool'
    alerts:
    - Refresh error rate exceeds threshold (backing source degraded, risk of entries expiring without replacement)
    - Stale-serve rate spikes (refreshes not completing before TTL, callers getting outdated data)
    - Refresh thread pool saturated (all threads busy, queued refreshes backing up)
    - Refresh latency exceeds the gap between refresh interval and TTL (entries may expire before refresh completes)
