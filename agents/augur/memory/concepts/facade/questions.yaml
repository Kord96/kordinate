questions:
  - q: "Does a single class provide a simplified interface that delegates to multiple subsystem classes?"
    weight: 3
    signals: ["one class orchestrating calls to several internal components", "simplified method hiding multi-step subsystem interaction"]
  - q: "Does the facade delegate to subsystem classes without containing business logic itself?"
    weight: 3
    signals: ["facade methods only coordinate and delegate", "no domain rules or computations in the facade"]
  - q: "Are the underlying subsystem classes still directly accessible for advanced use cases?"
    weight: 2
    signals: ["subsystem classes have public APIs independent of facade", "facade is optional convenience, not mandatory indirection"]
  - q: "Is the facade interface stable even as subsystem internals change?"
    weight: 1
    signals: ["subsystem refactors do not change facade method signatures", "facade shields callers from internal restructuring"]
threshold: 6
