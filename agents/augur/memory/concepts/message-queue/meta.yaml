schema: augur-concept-meta/v2
concept: message-queue
kind: pattern
summary: Message Queue architectural pattern
taxonomy:
  type: pattern
  categories:
  - messaging
  - infrastructure
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-messages-delivered-point-to-point-where-each-message-is-cons
    prompt: Are messages delivered point-to-point where each message is consumed by exactly one consumer?
    weight: 3
    signals:
    - single consumer per message
    - worker dequeues from named queue
    - visibility timeout
  - id: is-there-explicit-message-acknowledgment-after-successful-proces
    prompt: Is there explicit message acknowledgment after successful processing?
    weight: 3
    signals:
    - ack() after processing
    - message.acknowledge()
    - nack on failure
  - id: are-failed-messages-retried-with-backoff-and-eventually-routed-t
    prompt: Are failed messages retried with backoff and eventually routed to a dead-letter queue?
    weight: 2
    signals:
    - dead-letter queue configured
    - retry with backoff
    - max delivery attempts
  - id: do-consumers-handle-redelivered-messages-idempotently-in-case-of
    prompt: Do consumers handle redelivered messages idempotently in case of ack timeout or crash?
    weight: 2
    signals:
    - idempotent consumer
    - deduplication by message ID
    - at-least-once with idempotency
analysis:
  testing:
    summary: Verify message delivery, acknowledgment semantics, and dead-letter handling under normal and failure conditions.
    unit:
    - Produce a message, consume it, and assert the payload matches and the message is acknowledged
    - Verify that unacknowledged messages become visible again after the visibility timeout
    - Assert that messages exceeding the retry limit are routed to the dead-letter queue
    integration:
    - Produce and consume messages through a real broker and verify end-to-end delivery
    - 'Test consumer idempotency: redeliver a message and confirm no duplicate side effects'
    - Validate message ordering guarantees (FIFO or best-effort) match the queue configuration
    failure_injection:
    - Kill a consumer mid-processing (before ack) and verify the message is redelivered to another consumer
    - Produce a poison message that always fails processing and verify it lands in the dead-letter queue after retries
    - Simulate broker unavailability and verify the producer retries or buffers messages without data loss
  monitoring:
    summary: Track queue depth, consumer throughput, and dead-letter activity to detect processing bottlenecks.
    metrics:
    - name: queue_depth
      kind: gauge
      description: number of messages waiting to be consumed
    - name: messages_consumed_total
      kind: counter
      description: messages successfully processed and acknowledged
    - name: messages_dead_lettered_total
      kind: counter
      description: messages routed to the dead-letter queue after retry exhaustion
    - name: message_processing_duration_seconds
      kind: histogram
      description: time from dequeue to acknowledgment
    alerts:
    - Queue depth growing monotonically (consumers not keeping up with producers)
    - Dead-letter queue receiving messages (poison messages or persistent processing failures)
    - Processing duration exceeding the visibility timeout (risk of duplicate delivery)
    - Consumer count dropping to zero (all consumers crashed or disconnected)
  deployment:
    summary: Coordinate consumer rollouts with message processing to avoid message loss or duplicate processing.
    rollout_implications:
    - Drain in-flight messages before terminating consumer pods (graceful shutdown with ack completion)
    - During rolling updates, old and new consumer versions process from the same queue -- message format must be backward-compatible
    - Scale consumers based on queue depth, but avoid scaling to zero if message loss is unacceptable
    - Dead-letter queue configuration must exist before deploying consumers that rely on it
    pre_deploy_checklist:
    - Verify queue and dead-letter queue exist in the target environment before deploying producers or consumers
    - Confirm visibility timeout is tuned for the expected processing duration of the new consumer version
    - Test that the new consumer version handles messages produced by the old producer version (schema compatibility)
    - Ensure consumer graceful shutdown completes pending acks within `terminationGracePeriodSeconds`
