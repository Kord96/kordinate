schema: augur-concept-meta/v2
concept: unit-of-work
kind: pattern
summary: Unit of Work architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
  - data
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-there-an-explicit-unit-of-work-object-or-session-that-tracks-
    prompt: Is there an explicit unit-of-work object or session that tracks changes across multiple repositories and flushes them in a single commit?
    weight: 3
    signals:
    - UoW class with commit and rollback
    - Session tracking dirty objects
    - register_new and register_dirty methods
  - id: does-commit-happen-once-at-the-end-of-a-business-operation-rathe
    prompt: Does commit happen once at the end of a business operation rather than per-repository call?
    weight: 3
    signals:
    - single commit at operation boundary
    - no commit inside repository methods
    - atomic flush at end of use case
  - id: is-transaction-rollback-on-failure-coordinated-to-revert-all-cha
    prompt: Is transaction rollback on failure coordinated to revert all changes, not just the last write?
    weight: 2
    signals:
    - rollback reverts all changes
    - transaction.atomic scope
    - coordinated rollback across repositories
  - id: is-the-unit-of-work-lifetime-scoped-to-a-single-request-or-use-c
    prompt: Is the unit of work lifetime scoped to a single request or use case rather than being a long-lived singleton?
    weight: 1
    signals:
    - UoW per request scope
    - context manager scoping transaction
    - not a singleton session
analysis:
  testing:
    summary: '# Testing - Test that commit flushes all tracked changes atomically — partial commits should not be possible - Test that rollback on failure reverts all changes, not just the last write - Verify that all repository operations within a use case share the same UoW instance - Test nested units of work: ensure savepoints are used or nesting is explicitly prohibited - Assert that the UoW lifetime is scoped to the request or use case, not a singleton - Test exception handling: an error in one repository operation should trigger full rollback - Verify that no individual repository method commits independently of the UoW boundary - Test that long-lived UoW instances are detected and prevented (session leak protection)'
