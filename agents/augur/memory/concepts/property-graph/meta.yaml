schema: augur-concept-meta/v2
concept: property-graph
kind: domain-model
summary: Property graph model with typed nodes and edges carrying attributes
taxonomy:
  type: domain-model
  categories:
  - data
  - graph
  legacy:
    type: pattern
    category: domain-model
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-nodes-and-edges-explicitly-typed-with-properties-attributes-
    prompt: Are nodes and edges explicitly typed with properties/attributes attached to each?
    weight: 3
    signals:
    - Node class with label and properties dict
    - Edge with type and attributes
    - typed relationships in graph schema
  - id: does-the-system-use-a-graph-database-or-library-for-traversal-qu
    prompt: Does the system use a graph database or library for traversal queries?
    weight: 3
    signals:
    - Neo4j or Gremlin client
    - Cypher MATCH queries
    - networkx or petgraph traversal calls
  - id: are-multi-hop-traversal-queries-a-core-access-pattern
    prompt: Are multi-hop traversal queries a core access pattern?
    weight: 2
    signals:
    - path queries with variable depth
    - shortest path computations
    - MATCH (a)-[*2..5]->(b) patterns
  - id: is-there-a-defined-graph-schema-specifying-valid-node-labels-and
    prompt: Is there a defined graph schema specifying valid node labels and relationship types?
    weight: 1
    signals:
    - schema definition for node types
    - relationship type enum or constants
    - graph schema migration
