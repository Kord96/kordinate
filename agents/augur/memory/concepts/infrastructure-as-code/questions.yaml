questions:
  - q: "Is all infrastructure defined in declarative, version-controlled files such as Terraform, Pulumi, or CloudFormation?"
    weight: 3
    signals: [".tf files with resource blocks", "pulumi program", "CloudFormation template"]
  - q: "Are infrastructure changes applied through a plan/review/apply workflow in CI/CD rather than manually?"
    weight: 3
    signals: ["terraform plan in CI", "pulumi preview", "plan step before apply"]
  - q: "Is infrastructure state stored remotely with locking to prevent concurrent modifications?"
    weight: 2
    signals: ["S3 backend with DynamoDB lock", "remote state", "state locking enabled"]
  - q: "Are parameterized modules used to avoid duplication across environments?"
    weight: 1
    signals: ["module block with variables", "reusable module", "environment parameterization"]
threshold: 6
