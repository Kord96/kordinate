# Score 2: Infrastructure as Code is a practice pattern identified by file types and
# project organization, not by code structure within any single file.
#
# Detection is based on:
#   - Presence of .tf files, CloudFormation templates, Pulumi programs, Ansible playbooks
#   - CI/CD pipelines that run terraform plan/apply or pulumi up
#   - Remote state configuration with locking
#   - All infrastructure being defined in code (absence of manual resources)
#
# These are file-type and project-structure indicators, not AST patterns. A .tf file's
# internal structure (resource blocks, data sources, modules) is specific to HCL, which
# ast-grep may not even support as a language grammar.
#
# Even if we matched Terraform's resource blocks, finding them just confirms "Terraform
# is used" -- not that the IaC practice is followed correctly (no manual resources,
# state is remote, secrets aren't hardcoded, drift detection exists).
#
# This pattern is best detected by:
#   - File type inventory (glob for *.tf, cloudformation*.yaml, playbook.yml)
#   - CI pipeline inspection for IaC apply steps
#   - IaC scanning tools (checkov, tfsec, terrascan) for quality assessment
