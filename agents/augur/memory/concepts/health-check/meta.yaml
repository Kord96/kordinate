schema: augur-concept-meta/v2
concept: health-check
kind: pattern
summary: Health Check architectural pattern
taxonomy:
  type: pattern
  categories:
  - lifecycle
  - observability
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-separate-liveness-and-readiness-endpoints-that-check-d
    prompt: Are there separate liveness and readiness endpoints that check different aspects of application health?
    weight: 3
    signals:
    - /healthz endpoint
    - /readyz endpoint
    - livenessProbe vs readinessProbe
  - id: does-the-readiness-probe-verify-dependency-connectivity-such-as-
    prompt: Does the readiness probe verify dependency connectivity such as database and cache availability?
    weight: 2
    signals:
    - check database connection
    - verify cache reachable
    - dependency health aggregation
  - id: are-kubernetes-probe-configurations-present-with-appropriate-tim
    prompt: Are Kubernetes probe configurations present with appropriate timeouts and intervals?
    weight: 2
    signals:
    - livenessProbe in pod spec
    - readinessProbe configured
    - startupProbe for slow start
  - id: does-the-liveness-probe-check-only-process-health-without-depend
    prompt: Does the liveness probe check only process health without depending on external service availability?
    weight: 2
    signals:
    - liveness returns 200 unconditionally
    - no DB check in liveness
    - process-only health
analysis:
  testing:
    summary: Verify that health endpoints accurately reflect application and dependency state under all conditions.
    unit:
    - Assert liveness endpoint returns 200 when the process is healthy, independent of dependency state
    - Assert readiness endpoint returns 503 when any critical dependency is unreachable
    - Verify that individual dependency checks have their own timeouts and do not hang the health endpoint
    integration:
    - Bring down a dependency (database, cache) and confirm the readiness endpoint transitions to unhealthy
    - Restore the dependency and verify the readiness endpoint recovers within the expected window
    - Validate that health endpoints are not exposed on public-facing ports or are properly authenticated
    failure_injection:
    - Introduce latency on a dependency check exceeding the probe timeout and verify the probe reports failure, not a hang
    - Simulate a slow-starting application and confirm the startup probe keeps the pod alive until ready
  monitoring:
    summary: Track probe outcomes and dependency health to detect degraded service before users are affected.
    metrics:
    - name: health_check_status
      kind: gauge
      description: current health state per endpoint (0=down, 1=degraded, 2=up)
    - name: health_check_duration_seconds
      kind: histogram
      description: latency of health endpoint responses
    - name: readiness_probe_failures_total
      kind: counter
      description: readiness failures triggering traffic removal
    - name: dependency_health_status
      kind: gauge
      description: per-dependency connectivity state checked by readiness
    alerts:
    - Readiness probe failing for longer than one probe interval (pod removed from service)
    - Liveness probe failing (pod restart imminent)
    - Health check latency exceeding probe timeout (false failures likely)
    - Dependency health degraded across multiple pods simultaneously
  deployment:
    summary: Ensure probes are tuned for the rollout strategy and slow-starting services do not get killed prematurely.
    rollout_implications:
    - Configure startup probes for slow-starting applications to prevent liveness failures during initialization
    - Set `initialDelaySeconds` on readiness probes so new pods are not expected to serve traffic before startup completes
    - Rolling updates should wait for readiness before proceeding to the next pod (maxUnavailable and maxSurge tuning)
    - Verify that liveness probes do not check external dependencies -- a database outage should not restart all pods
    pre_deploy_checklist:
    - Confirm probe timeouts are shorter than probe periods to avoid overlapping checks
    - Validate that readiness probe failure removes the pod from the Service endpoint list without killing it
    - Test that a new deployment rolls back automatically when readiness probes fail consistently
