schema: augur-concept-meta/v2
concept: test-doubles
kind: pattern
summary: Test Doubles (Mock/Stub/Fake/Spy) architectural pattern
taxonomy:
  type: pattern
  categories:
  - testing
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-test-files-contain-mock-stub-fake-or-spy-classes-that-impleme
    prompt: Do test files contain mock, stub, fake, or spy classes that implement the same interface as production dependencies?
    weight: 3
    signals:
    - Mock or Fake or Stub classes in tests
    - implements production interface
    - test double matching real dependency
  - id: are-spy-assertions-used-to-verify-meaningful-call-behavior-such-
    prompt: Are spy assertions used to verify meaningful call behavior such as call counts or argument matching?
    weight: 2
    signals:
    - called_with assertions
    - toHaveBeenCalledTimes
    - call_count verification
  - id: are-test-doubles-scoped-to-test-directories-with-no-imports-from
    prompt: Are test doubles scoped to test directories with no imports from production code into test double modules or vice versa?
    weight: 2
    signals:
    - doubles in test directories only
    - no production import of test doubles
    - clean test boundary
  - id: is-there-a-distinction-between-mocks-behavior-verification-stubs
    prompt: Is there a distinction between mocks (behavior verification), stubs (canned answers), and fakes (working implementations) in how they are used?
    weight: 2
    signals:
    - behavior verification vs canned responses
    - fake with working logic
    - intentional double type selection
analysis:
  testing:
    summary: '# Testing - Verify that doubles implement the same interface/protocol as the real dependency (type check in tests) - Test that mocks verify meaningful behavior (method called with correct args), not implementation details - Verify stubs return realistic values — stubs that always succeed hide real failure paths - Test that fakes for external services (database, API) behave consistently with the real implementation - Assert that test doubles live in test directories and are never imported by production code - Test spy assertions on observable outcomes, not internal call ordering - Verify that double setup is extracted into reusable fixtures to avoid repetition across tests - Test that production code works correctly when doubles are replaced with real dependencies (integration test)'
