rules:
  - id: check-then-act-file
    pattern: |
      if os.path.exists($PATH):
          ...
          open($PATH, ...)
    message: "Check-then-act on file — race condition between exists() and open()"
    severity: WARNING
    languages: [python]
  - id: check-then-act-dict
    pattern: |
      if $KEY in $DICT:
          $VAL = $DICT[$KEY]
    message: "Check-then-act on dict — use dict.get() or try/except for thread safety"
    severity: INFO
    languages: [python]
