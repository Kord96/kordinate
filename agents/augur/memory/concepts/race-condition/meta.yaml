schema: augur-concept-meta/v2
concept: race-condition
kind: anti-pattern
summary: Race Condition anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: true
    file: semgrep.yaml
    detector_strength: 5
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: semgrep.yaml
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-shared-mutable-state-read-and-written-by-multiple-threads-or-
    prompt: Is shared mutable state read and written by multiple threads or goroutines without synchronization primitives?
    weight: 3
    signals:
    - count = count + 1 without lock
    - concurrent map access without mutex
    - global variable modified from multiple goroutines
  - id: are-there-check-then-act-sequences-on-shared-resources-without-a
    prompt: Are there check-then-act sequences on shared resources without atomicity guarantees?
    weight: 3
    signals:
    - if not exists then create without lock
    - check-then-act without compare-and-swap
    - uniqueness check followed by insert without transaction
  - id: are-read-modify-write-operations-performed-without-atomic-operat
    prompt: Are read-modify-write operations performed without atomic operations or locking?
    weight: 2
    signals:
    - increment without atomic
    - append to shared list without lock
    - update dict entry without synchronization
  - id: do-tests-pass-locally-but-fail-intermittently-under-parallel-ci-
    prompt: Do tests pass locally but fail intermittently under parallel CI execution?
    weight: 1
    signals:
    - flaky test under concurrency
    - heisenbug disappears under debugger
    - non-deterministic test failures
analysis:
  testing:
    summary: Detect and verify fixes for race conditions using concurrency stress tests, race detectors, and deterministic scheduling.
    additional_sections:
    - title: Static Analysis
      items:
      - Enable race detector in CI (Go `-race` flag, ThreadSanitizer for C/C++/Rust) and run the full test suite
      - Scan for unsynchronized read-modify-write patterns on shared mutable state
      - Check for check-then-act sequences without atomicity (TOCTOU bugs)
    - title: Concurrency Tests
      items:
      - Run the suspected racy operation from multiple threads/goroutines simultaneously and verify the outcome is consistent
      - Increment a shared counter from N threads and verify the final value equals N (detects missing synchronization)
      - Execute the check-then-act path concurrently and verify no duplicate records or double-execution
    - title: Deterministic Reproduction
      items:
      - Use controlled scheduling (thread barriers, latches) to force the exact interleaving that triggers the race
      - Inject a delay between the check and the act to widen the race window and make it reproducible
      - After fixing, re-run the stress test to confirm the fix holds under contention
    - title: Regression
      items:
      - Add the failing concurrent test case to CI as a permanent regression test
      - Document the race scenario (which threads, which shared state, which interleaving) in the test for future maintainers
