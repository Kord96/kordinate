schema: augur-concept-meta/v2
concept: service-mesh
kind: pattern
summary: Service Mesh architectural pattern
taxonomy:
  type: pattern
  categories:
  - infrastructure
  - integration
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - monitoring.md
  - deployment.md
traits:
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-sidecar-proxy-containers-injected-into-pods-for-transparent-
    prompt: Are sidecar proxy containers injected into pods for transparent service-to-service communication?
    weight: 3
    signals:
    - istio-proxy or linkerd-proxy container in pod
    - sidecar.istio.io/inject annotation
    - Envoy sidecar alongside application container
  - id: is-mtls-enforced-between-services-at-the-mesh-level
    prompt: Is mTLS enforced between services at the mesh level?
    weight: 3
    signals:
    - PeerAuthentication with STRICT mode
    - mesh-wide mTLS enabled
    - mutual TLS between service proxies
  - id: are-traffic-policies-like-retries-timeouts-and-circuit-breaking-
    prompt: Are traffic policies like retries, timeouts, and circuit breaking managed by mesh CRDs?
    weight: 2
    signals:
    - VirtualService with timeout config
    - DestinationRule with retry policy
    - TrafficSplit for canary routing
  - id: are-sidecar-resource-limits-configured-to-prevent-proxies-from-s
    prompt: Are sidecar resource limits configured to prevent proxies from starving application containers?
    weight: 1
    signals:
    - resource limits on proxy container
    - CPU and memory bounds on sidecar
    - proxy resource requests defined
analysis:
  monitoring:
    summary: Track sidecar proxy health, mTLS certificate status, and service-to-service traffic quality through the mesh.
    metrics:
    - name: mesh_sidecar_cpu_usage_ratio
      kind: gauge
      description: sidecar proxy CPU consumption relative to container limits, per pod
    - name: mesh_sidecar_memory_bytes
      kind: gauge
      description: sidecar proxy memory usage per pod
    - name: mesh_mtls_handshake_failures_total
      kind: counter
      description: mTLS handshake errors indicating certificate or config problems
    - name: mesh_request_error_rate
      kind: gauge
      description: 5xx error rate per service pair through the mesh
    - name: mesh_request_latency_seconds
      kind: histogram
      description: p50/p95/p99 latency per service pair
    - name: mesh_control_plane_sync_latency_seconds
      kind: histogram
      description: time for configuration pushes from control plane to proxies
    - name: mesh_certificate_expiry_seconds
      kind: gauge
      description: time remaining before mesh-managed mTLS certificates expire
    alerts:
    - Sidecar proxy consuming excessive resources and starving the application container
    - mTLS handshake failure rate elevated (certificate expiry or misconfiguration)
    - Service pair error rate exceeding acceptable threshold
    - Control plane xDS sync errors or disconnected proxies
    - mTLS certificate approaching expiry without rotation
  deployment:
    summary: Upgrade the control plane and data plane sidecars in the correct order, and verify that security policies survive the transition.
    rollout_implications:
    - Control plane must be upgraded before data plane sidecars — new proxy versions may depend on control plane APIs that the old version does not serve
    - Rolling sidecar restarts cause brief connection drops between services — during the restart window, mTLS handshakes may fail between old and new proxy versions
    - mTLS enforcement mode can silently revert to permissive after a control plane upgrade, allowing plaintext traffic without alerting
    - Sidecar resource limits that are not set explicitly in the deployment manifest may change after an upgrade, causing proxy resource contention or OOM kills
    - Traffic policies (retries, timeouts, circuit breaking) configured at the mesh level may behave differently with a new proxy version — compounding with application-level settings
    pre_deploy_checklist:
    - Verify mTLS enforcement mode after control plane upgrade — confirm it has not reverted to permissive
    - Set explicit sidecar resource limits in deployment manifests to prevent proxy starvation
    - Test traffic policies in staging with the new proxy version before promoting to production
    - Confirm sidecar injection is working for new pods after control plane upgrades
    - Coordinate namespace-level authorization policy changes with the teams owning affected services
