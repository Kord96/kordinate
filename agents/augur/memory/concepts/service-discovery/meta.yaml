schema: augur-concept-meta/v2
concept: service-discovery
kind: pattern
summary: Service Discovery architectural pattern
taxonomy:
  type: pattern
  categories:
  - infrastructure
  - integration
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-services-register-themselves-on-startup-and-consumers-resolve
    prompt: Do services register themselves on startup and consumers resolve endpoints dynamically?
    weight: 3
    signals:
    - service registration on startup
    - DNS-based discovery via Consul or CoreDNS
    - K8s Service with DNS resolution
  - id: are-health-checks-configured-so-unhealthy-instances-are-removed-
    prompt: Are health checks configured so unhealthy instances are removed from the registry?
    weight: 3
    signals:
    - health check with TTL on registration
    - heartbeat-based liveness
    - unhealthy instance deregistered automatically
  - id: is-endpoint-resolution-done-through-the-registry-rather-than-har
    prompt: Is endpoint resolution done through the registry rather than hardcoded addresses?
    weight: 2
    signals:
    - no hardcoded IPs in config
    - dynamic endpoint lookup
    - service name resolved to address at runtime
  - id: is-there-a-defined-load-balancing-strategy-for-discovered-endpoi
    prompt: Is there a defined load balancing strategy for discovered endpoints?
    weight: 1
    signals:
    - round-robin or least-connections selection
    - client-side load balancer
    - consistent hashing for routing
analysis:
  testing:
    summary: '# Testing - Test registration and deregistration lifecycle: service starts, registers, shuts down, deregisters - Simulate health check failures and verify the instance is removed from the registry within the TTL - Test consumer behavior when the registry returns zero healthy instances (fallback or clear error) - Verify stale registration cleanup by letting TTL expire without heartbeat renewal - Test network partition scenarios: registry unreachable, verify consumers use cached endpoints - Load test the registry with rapid registration/deregistration cycles to verify stability - Test load balancing strategy by resolving endpoints repeatedly and checking distribution - Verify that DNS-based discovery respects TTL expiry and does not cache stale addresses indefinitely'
  monitoring:
    summary: Track registry health, instance availability, and lookup performance across the discovery infrastructure.
    metrics:
    - name: discovery_registered_instances
      kind: gauge
      description: number of registered instances per service
    - name: discovery_registration_events_total
      kind: counter
      description: registrations and deregistrations over time
    - name: discovery_lookup_latency_seconds
      kind: histogram
      description: time to resolve a service endpoint from the consumer side
    - name: discovery_health_check_failures_total
      kind: counter
      description: failed health checks per service instance
    - name: discovery_stale_registrations
      kind: gauge
      description: instances whose health check has not succeeded within the TTL window
    - name: discovery_dns_cache_hit_ratio
      kind: gauge
      description: cache effectiveness for DNS-based discovery lookups
    alerts:
    - Service has zero healthy instances in the registry (complete outage for that service)
    - Stale registrations detected beyond the configured TTL (zombie instances receiving traffic)
    - Health check failure rate rising for a service (degrading instances not yet removed)
    - Lookup latency exceeding acceptable threshold (slows every service-to-service call)
    - Unexpected drop in registered instance count (scaling event or mass deregistration)
  deployment:
    summary: Coordinate registry state with pod lifecycle to avoid routing traffic to instances that are not yet ready or already draining.
    rollout_implications:
    - New pods must pass health checks before registering in the discovery service — premature registration sends traffic to instances that are not ready to serve
    - Deregister instances before initiating connection draining during rolling updates — stale registry entries route traffic to terminating pods
    - DNS-based discovery is subject to TTL caching — if TTLs are longer than the rollout window, clients may resolve to pods that no longer exist
    - Rolling restarts temporarily reduce the number of healthy registered endpoints — consumers relying on cached endpoint lists may see a higher error rate during the window
    - If the registry itself is temporarily unreachable during a deploy, clients fall back to cached endpoints which may include pods that have already been replaced
    pre_deploy_checklist:
    - Verify DNS TTLs are short enough for endpoint changes to propagate within the rollout window
    - Confirm that new service versions register under the same service name with correct metadata and tags
    - Test that cached endpoint lists expire gracefully when the registry is unreachable
    - Ensure registry infrastructure upgrades are scheduled separately from application deployments
