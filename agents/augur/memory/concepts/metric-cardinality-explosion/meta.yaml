schema: augur-concept-meta/v2
concept: metric-cardinality-explosion
kind: anti-pattern
summary: Metric Cardinality Explosion anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  observable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-metric-labels-populated-from-unbounded-user-supplied-or-requ
    prompt: Are metric labels populated from unbounded user-supplied or request-specific data like user IDs or full URL paths?
    weight: 3
    signals:
    - labels=["user_id"]
    - labels=["request_id"]
    - raw URL path as label value
  - id: are-metric-names-generated-dynamically-using-string-formatting-o
    prompt: Are metric names generated dynamically using string formatting or interpolation?
    weight: 3
    signals:
    - f"request_{endpoint}_total"
    - dynamic metric name construction
    - metric name from user input
  - id: do-label-values-come-from-a-set-that-grows-with-traffic-rather-t
    prompt: Do label values come from a set that grows with traffic rather than a fixed low-cardinality enumeration?
    weight: 2
    signals:
    - email as label
    - session ID in labels
    - unbounded label values
  - id: is-there-evidence-of-prometheus-memory-pressure-or-growing-scrap
    prompt: Is there evidence of Prometheus memory pressure or growing scrape duration related to metric volume?
    weight: 2
    signals:
    - prometheus_tsdb_head_series growing
    - scrape duration increasing
    - OOM on metrics endpoint
