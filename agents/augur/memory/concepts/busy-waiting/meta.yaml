schema: augur-concept-meta/v2
concept: busy-waiting
kind: anti-pattern
summary: Busy Waiting anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  observable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-loops-that-repeatedly-check-a-condition-with-a-sleep-d
    prompt: Are there loops that repeatedly check a condition with a sleep/delay call, polling for state changes instead of being notified?
    weight: 3
    signals:
    - while loop with sleep and condition check
    - polling loop
    - sleep-then-check pattern
  - id: could-the-polling-be-replaced-by-an-event-driven-mechanism-callb
    prompt: Could the polling be replaced by an event-driven mechanism (callbacks, condition variables, pub/sub, filesystem watchers)?
    weight: 3
    signals:
    - event-driven alternative exists
    - webhooks available but unused
    - OS wait primitives not used
  - id: is-cpu-usage-or-thread-consumption-elevated-during-idle-periods-
    prompt: Is CPU usage or thread consumption elevated during idle periods due to continuous polling?
    weight: 2
    signals:
    - CPU busy while idle
    - threads consumed by polling
    - unnecessary resource drain
  - id: is-response-to-state-changes-delayed-by-a-fixed-polling-interval
    prompt: Is response to state changes delayed by a fixed polling interval rather than being immediate?
    weight: 2
    signals:
    - latency floor equals poll interval
    - delayed detection
    - response time bound by sleep duration
