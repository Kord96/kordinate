schema: augur-concept-meta/v2
concept: retry
kind: pattern
summary: Retry architectural pattern
taxonomy:
  type: pattern
  categories:
  - resilience
  - integration
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-retries-bounded-with-a-maximum-attempt-count-and-exponential
    prompt: Are retries bounded with a maximum attempt count and exponential backoff with jitter?
    weight: 3
    signals:
    - max_retries configured
    - wait_exponential with jitter
    - stop_after_attempt limiting retries
  - id: are-retryable-errors-distinguished-from-non-retryable-errors
    prompt: Are retryable errors distinguished from non-retryable errors?
    weight: 3
    signals:
    - retry_on_exception predicate
    - only retry 5xx not 4xx
    - retryable error classification
  - id: is-there-a-dead-letter-path-for-operations-that-exhaust-all-retr
    prompt: Is there a dead-letter path for operations that exhaust all retry attempts?
    weight: 2
    signals:
    - dead letter queue on exhaustion
    - DLQ routing after max retries
    - failed operation captured for review
  - id: are-retry-attempts-observable-through-metrics-or-logging
    prompt: Are retry attempts observable through metrics or logging?
    weight: 1
    signals:
    - retry count metric emitted
    - log on each retry attempt
    - DLQ depth monitored
analysis:
  testing:
    summary: Validate backoff timing, retry bounds, dead-letter routing, and idempotency safety across retry attempts.
    unit:
    - 'Test backoff timing: assert delays follow exponential progression with jitter and do not exceed max backoff'
    - 'Verify max retry enforcement: after N configured attempts, assert the operation is not retried and routes to DLQ'
    - 'Test retryable vs non-retryable classification: assert 5xx errors trigger retry while 4xx errors fail immediately'
    - 'Verify idempotency: assert that retrying the same operation with the same idempotency key produces no duplicate side effects'
    integration:
    - Fail an operation repeatedly until it hits max retries, then verify the message lands in the actual DLQ with correct metadata
    - Test end-to-end retry with a flaky dependency that succeeds on the third attempt — verify the operation completes successfully
    - 'Verify DLQ consumption: read from the DLQ and confirm failed messages contain the original payload and failure reason'
    failure_injection:
    - Simulate a dependency that fails indefinitely and verify retry exhaustion routes to DLQ within bounded time (no infinite loop)
    - Inject clock skew to test that jitter produces varied delays across concurrent retriers (no thundering herd)
    - Kill the DLQ broker and verify the retry mechanism surfaces the DLQ write failure rather than silently discarding the message
  monitoring:
    summary: Track retry attempt distribution and dead-letter depth to distinguish transient blips from persistent failures.
    metrics:
    - name: retry_attempts_total
      kind: counter
      description: retry attempts by operation and attempt number
    - name: retry_success_after_retry_total
      kind: counter
      description: operations that succeeded on a retry (not first attempt)
    - name: retry_exhausted_total
      kind: counter
      description: operations that exhausted all retries and were sent to dead-letter
    - name: dead_letter_queue_depth
      kind: gauge
      description: current number of messages in the dead-letter queue
    - name: retry_backoff_duration_seconds
      kind: histogram
      description: actual backoff delay distribution
    alerts:
    - Dead-letter queue depth growing without being drained
    - Retry exhaustion rate exceeding threshold (persistent downstream failure)
    - High ratio of success-after-retry indicating flaky dependency
    - 'Retry storm: sudden spike in retry attempts across multiple callers (thundering herd)'
  deployment:
    summary: Retry configuration changes and DLQ backlog must be managed carefully to avoid retry storms during rollout.
    rollout_implications:
    - Lowering max retry counts during rollout causes in-flight retries to DLQ sooner than expected — monitor DLQ depth during transition
    - Changing backoff parameters while retries are in progress may cause a burst of simultaneous retries from pods on different configurations
    - Rolling restart of consumers with pending retries may lose retry state if it is held in memory — persist retry state externally
    - Deploying new retry policies alongside a degraded dependency amplifies load — consider pausing retries until the dependency recovers
    pre_deploy_checklist:
    - Verify DLQ consumers are healthy and processing before deploying retry config changes
    - Confirm retry state is persisted externally (not in-memory) so rolling restarts do not lose pending retries
    - Check that backoff parameters include jitter to prevent thundering herd after fleet-wide restart
