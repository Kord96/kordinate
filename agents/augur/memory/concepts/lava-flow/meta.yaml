schema: augur-concept-meta/v2
concept: lava-flow
kind: anti-pattern
summary: Lava Flow (Dead Code) anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-functions-or-methods-with-zero-callers-anywhere-in-the
    prompt: Are there functions or methods with zero callers anywhere in the codebase?
    weight: 3
    signals:
    - function with no references
    - method never called
    - dead symbol
  - id: are-there-commented-out-code-blocks-exceeding-a-few-lines-left-i
    prompt: Are there commented-out code blocks exceeding a few lines left in production source files?
    weight: 3
    signals:
    - large commented block
    - commented-out function
    - disabled code not removed
  - id: do-todo-or-fixme-comments-reference-removing-code-that-was-never
    prompt: Do TODO or FIXME comments reference removing code that was never cleaned up?
    weight: 2
    signals:
    - 'TODO: remove'
    - 'FIXME: delete this'
    - no longer used comment
  - id: are-there-deprecated-annotations-or-markers-with-no-removal-date
    prompt: Are there @deprecated annotations or markers with no removal date or migration timeline?
    weight: 1
    signals:
    - '@deprecated without date'
    - deprecated no replacement
    - stale feature flag
