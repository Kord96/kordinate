schema: augur-concept-meta/v2
concept: future-promise
kind: pattern
summary: Future/Promise architectural pattern
taxonomy:
  type: pattern
  categories:
  - concurrency
  - design
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-deferred-computations-represented-as-future-promise-or-compl
    prompt: Are deferred computations represented as Future, Promise, or CompletableFuture objects?
    weight: 3
    signals:
    - Promise or Future type wrapping async result
    - CompletableFuture or asyncio.Future instances
  - id: are-results-composed-using-chaining-or-parallel-combinators-rath
    prompt: Are results composed using chaining or parallel combinators rather than sequential awaits in loops?
    weight: 2
    signals:
    - Promise.all() or asyncio.gather() for parallel work
    - .then().then() chaining or thenCompose()
  - id: does-every-future-or-promise-have-an-explicit-error-handling-pat
    prompt: Does every future or promise have an explicit error handling path?
    weight: 2
    signals:
    - .catch() or except handler on every promise chain
    - error callback registered on future completion
  - id: are-timeouts-applied-to-prevent-indefinite-waits-on-unresolved-f
    prompt: Are timeouts applied to prevent indefinite waits on unresolved futures?
    weight: 1
    signals:
    - timeout parameter on await or .get()
    - asyncio.wait_for with timeout
  - id: are-orphaned-futures-avoided-so-exceptions-are-never-silently-lo
    prompt: Are orphaned futures avoided so exceptions are never silently lost?
    weight: 1
    signals:
    - all created futures are awaited or observed
    - no fire-and-forget promise without error handler
analysis:
  testing:
    summary: Verify that async computations resolve correctly, propagate errors, and compose without deadlocks or lost results.
    unit:
    - Resolve a future with a value and assert the continuation receives the expected result
    - Reject a future with an error and assert the error handler is invoked with the correct error
    - 'Test chaining: future.then(a).then(b) should apply transformations in order and propagate the final result'
    - Verify that an unhandled rejection is surfaced (logged, thrown) rather than silently swallowed
    - 'Test timeout: a future that never resolves should be cancellable or should trigger a timeout error'
    additional_sections:
    - title: Composition Tests
      items:
      - Combine multiple futures with all/when-all and verify the result contains all resolved values in order
      - 'Test any/race semantics: the first future to resolve wins, and remaining futures are cancelled or ignored'
      - Verify that a single failure in an all-composition rejects the aggregate with the correct error
    - title: Concurrency Tests
      items:
      - Resolve a future from one thread and await it from another — verify cross-thread delivery without races
      - Test that completing a future multiple times is either idempotent or raises an explicit error
