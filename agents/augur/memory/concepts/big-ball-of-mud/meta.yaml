schema: augur-concept-meta/v2
concept: big-ball-of-mud
kind: anti-pattern
summary: Big Ball of Mud anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: can-any-file-import-any-other-file-with-no-enforced-module-bound
    prompt: Can any file import any other file with no enforced module boundaries or layering rules?
    weight: 3
    signals:
    - any-to-any imports
    - no import restrictions
    - circular dependencies accepted
  - id: is-business-logic-embedded-directly-in-controllers-route-handler
    prompt: Is business logic embedded directly in controllers, route handlers, or the presentation layer rather than in dedicated domain modules?
    weight: 3
    signals:
    - logic in controllers
    - SQL in templates
    - business rules in handlers
  - id: is-there-no-discernible-directory-organization-by-feature-layer-
    prompt: Is there no discernible directory organization by feature, layer, or domain -- files placed arbitrarily?
    weight: 2
    signals:
    - no directory convention
    - flat file dump
    - generic utils/helpers/misc directories
  - id: does-changing-a-single-concern-e-g-a-database-schema-require-mod
    prompt: Does changing a single concern (e.g., a database schema) require modifications across many unrelated directories?
    weight: 2
    signals:
    - shotgun surgery
    - change ripples everywhere
    - no isolation of concerns
