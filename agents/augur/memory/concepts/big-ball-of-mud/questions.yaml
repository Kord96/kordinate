questions:
  - q: "Can any file import any other file with no enforced module boundaries or layering rules?"
    weight: 3
    signals: ["any-to-any imports", "no import restrictions", "circular dependencies accepted"]
  - q: "Is business logic embedded directly in controllers, route handlers, or the presentation layer rather than in dedicated domain modules?"
    weight: 3
    signals: ["logic in controllers", "SQL in templates", "business rules in handlers"]
  - q: "Is there no discernible directory organization by feature, layer, or domain -- files placed arbitrarily?"
    weight: 2
    signals: ["no directory convention", "flat file dump", "generic utils/helpers/misc directories"]
  - q: "Does changing a single concern (e.g., a database schema) require modifications across many unrelated directories?"
    weight: 2
    signals: ["shotgun surgery", "change ripples everywhere", "no isolation of concerns"]
threshold: 6
