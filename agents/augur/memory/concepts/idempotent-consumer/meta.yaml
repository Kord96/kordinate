schema: augur-concept-meta/v2
concept: idempotent-consumer
kind: pattern
summary: Idempotent Consumer architectural pattern
taxonomy:
  type: pattern
  categories:
  - data
  - resilience
  - messaging
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-message-handlers-check-a-deduplication-store-for-the-message-
    prompt: Do message handlers check a deduplication store for the message ID before processing?
    weight: 3
    signals:
    - processed_ids lookup
    - message_id check before process
    - dedup table query
  - id: is-there-an-inbox-or-processed-messages-table-with-a-uniqueness-
    prompt: Is there an inbox or processed_messages table with a uniqueness constraint on message_id?
    weight: 3
    signals:
    - inbox table
    - processed_messages table
    - UNIQUE constraint on message_id
  - id: are-the-deduplication-check-and-business-logic-executed-within-t
    prompt: Are the deduplication check and business logic executed within the same database transaction?
    weight: 2
    signals:
    - same transaction for dedup and logic
    - INSERT ON CONFLICT in transaction
    - atomic check-and-process
  - id: do-duplicate-messages-return-the-original-result-rather-than-rai
    prompt: Do duplicate messages return the original result rather than raising an error?
    weight: 1
    signals:
    - return cached result for duplicate
    - ON CONFLICT DO NOTHING
    - idempotent response
analysis:
  testing:
    summary: Verify that duplicate messages produce the same outcome and the deduplication store behaves correctly.
    unit:
    - Process a message, then send the same message ID again and assert no side effects are replayed
    - Verify that duplicate detection returns the original result, not an error
    - Assert that the dedup check and business logic execute within the same transaction (no partial state)
    integration:
    - Send the same message concurrently from multiple producers and verify exactly one processing occurs
    - Simulate broker redelivery (ack timeout) and confirm the consumer handles the redelivered message idempotently
    - 'Validate TTL expiry: insert a message ID, wait past TTL, and confirm the entry is cleaned up'
    failure_injection:
    - Kill the consumer mid-processing and verify the message is retried and processed exactly once after restart
    - Corrupt the idempotency store and verify the consumer fails visibly rather than silently reprocessing
  monitoring:
    summary: Track deduplication effectiveness and the growth of the processed-ID store.
    metrics:
    - name: messages_deduplicated_total
      kind: counter
      description: duplicate messages detected and skipped
    - name: idempotency_store_size
      kind: gauge
      description: number of entries in the processed-ID table or set
    - name: idempotency_check_duration_seconds
      kind: histogram
      description: latency of the dedup lookup
    - name: idempotency_store_cleanup_total
      kind: counter
      description: expired entries purged per cleanup cycle
    alerts:
    - Deduplication rate spike (upstream producing excessive retries)
    - Idempotency store size approaching capacity or TTL cleanup stalled
    - Dedup check latency increasing (index degradation or store overload)
    - Zero deduplications over an extended period when at-least-once delivery is expected (check broken)
  deployment:
    summary: Coordinate deployments with message redelivery behavior to avoid false duplicates or missed dedup.
    rollout_implications:
    - During rolling updates, old and new consumer versions may process the same message -- both must write to the same idempotency store
    - Schema changes to the idempotency store (inbox table) must be backward-compatible with the running version
    - If switching idempotency backends (e.g., in-memory to database), run both in parallel during transition to avoid gaps
    pre_deploy_checklist:
    - Verify the idempotency store migration has been applied before deploying the new consumer version
    - Confirm TTL cleanup jobs are scheduled and running in the target environment
    - Check that the processed-ID store is shared across all consumer replicas, not local to each pod
