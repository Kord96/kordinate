threshold: 3
questions:
- q: Is there a reverse proxy or API gateway routing to multiple backend services?
  w: 2
  signals:
  - nginx
  - kong
  - traefik
  - gateway
  - proxy_pass
  - upstream
- q: Does path-based routing send different URL prefixes to different services?
  w: 2
  signals:
  - /api/users
  - /api/orders
  - location /
  - pathPrefix
- q: Are cross-cutting concerns (auth, rate limiting, logging) applied at the gateway?
  w: 1
- q: Does docker-compose or k8s config show a gateway service with multiple backends?
  w: 1
  signals:
  - docker-compose
  - Service
  - Ingress
