schema: augur-concept-meta/v2
concept: config-management
kind: pattern
summary: Configuration Management architectural pattern
taxonomy:
  type: pattern
  categories:
  - infrastructure
  - lifecycle
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-configuration-externalized-from-code-and-loaded-from-environm
    prompt: Is configuration externalized from code and loaded from environment variables, config files, or a config server?
    weight: 3
    signals:
    - env var loading
    - config file parsing at startup
    - centralized config server
  - id: is-configuration-validated-at-startup-with-fail-fast-behavior-on
    prompt: Is configuration validated at startup with fail-fast behavior on missing or malformed values?
    weight: 2
    signals:
    - startup validation
    - fail-fast on bad config
    - schema-based config check
  - id: is-there-a-hierarchical-override-system-defaults-environment-ins
    prompt: Is there a hierarchical override system (defaults < environment < instance < explicit)?
    weight: 2
    signals:
    - config override precedence
    - layered config sources
    - environment-specific overrides
  - id: are-secrets-handled-separately-from-plain-configuration-not-co-l
    prompt: Are secrets handled separately from plain configuration (not co-located in the same config file)?
    weight: 1
    signals:
    - separate secret management
    - secrets not in config file
    - vault or secret store reference
  - id: is-there-a-feature-flag-system-with-a-defined-lifecycle-for-flag
    prompt: Is there a feature flag system with a defined lifecycle for flag creation, rollout, and cleanup?
    weight: 1
    signals:
    - feature toggle system
    - flag lifecycle management
    - feature flag with rollout plan
analysis:
  testing:
    summary: Verify configuration loading, validation, environment overrides, and hot-reload behavior.
    unit:
    - Load config from each supported source (file, env vars, defaults) and assert correct precedence
    - 'Test validation: missing required fields produce clear errors, invalid values are rejected'
    - 'Verify type coercion: string env vars are correctly parsed to integers, booleans, etc.'
    integration:
    - Boot the application with a full config file and verify all components receive their expected settings
    - 'Test hot-reload: change a config value at runtime and verify the application picks it up without restart'
    failure_injection:
    - Supply a config file with syntax errors and verify the application fails fast with a descriptive message
    - Remove a required config source and verify fallback or fail-fast behavior per policy
