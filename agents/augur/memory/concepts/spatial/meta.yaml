schema: augur-concept-meta/v2
concept: spatial
kind: domain-model
summary: Spatial data model for geographic and geometric computations
taxonomy:
  type: domain-model
  categories:
  - data
  - geospatial
  legacy:
    type: pattern
    category: domain-model
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-geometry-types-point-polygon-linestring-used-instead-of-raw-
    prompt: Are geometry types (Point, Polygon, LineString) used instead of raw coordinate floats?
    weight: 3
    signals:
    - geometry column type in database
    - Shapely or turf.js geometry objects
    - GeoJSON Feature structures
  - id: does-the-system-use-spatial-queries-distance-containment-interse
    prompt: Does the system use spatial queries (distance, containment, intersection) backed by a spatial index?
    weight: 3
    signals:
    - ST_Distance or ST_Contains calls
    - spatial index on geometry column
    - R-tree or GiST index creation
  - id: is-there-coordinate-reference-system-crs-awareness-for-correct-d
    prompt: Is there coordinate reference system (CRS) awareness for correct distance and projection calculations?
    weight: 2
    signals:
    - SRID or CRS specification
    - projection transformations
    - EPSG code references
  - id: are-geofencing-or-bounding-box-queries-used-for-region-based-fil
    prompt: Are geofencing or bounding box queries used for region-based filtering?
    weight: 1
    signals:
    - geofence boundary definitions
    - bounding_box or bbox computations
    - ST_Within for containment checks
