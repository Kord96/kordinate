schema: augur-concept-meta/v2
concept: dead-letter
kind: pattern
summary: Dead Letter Queue architectural pattern
taxonomy:
  type: pattern
  categories:
  - messaging
  - resilience
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-queues-or-topics-configured-with-a-dead-letter-destination-f
    prompt: Are queues or topics configured with a dead-letter destination for messages that exceed retry limits?
    weight: 3
    signals:
    - DLQ or DLX configuration on queue
    - RedrivePolicy or x-dead-letter-exchange settings
  - id: is-there-a-maximum-retry-count-after-which-messages-are-moved-to
    prompt: Is there a maximum retry count after which messages are moved to the dead-letter queue?
    weight: 2
    signals:
    - max_retries or maxReceiveCount configuration
    - retry_count tracked in message headers
  - id: do-dead-lettered-messages-retain-the-original-payload-and-failur
    prompt: Do dead-lettered messages retain the original payload and failure metadata?
    weight: 2
    signals:
    - failure reason and stack trace stored with DLQ message
    - x-death headers or error metadata preserved
  - id: does-a-replay-or-reprocessing-mechanism-exist-for-dead-letter-qu
    prompt: Does a replay or reprocessing mechanism exist for dead-letter queue messages?
    weight: 2
    signals:
    - DLQ consumer or replay endpoint
    - redrive or reprocess command for failed messages
analysis:
  testing:
    summary: Verify that messages land in the DLQ only after retry exhaustion and that replay mechanisms work correctly.
    unit:
    - Simulate a message that fails processing and assert it is routed to the DLQ after the configured retry count
    - Verify that transient errors trigger retries but do not immediately DLQ the message
    - Assert DLQ messages retain the original payload plus failure metadata (error reason, attempt count, timestamp)
    integration:
    - Publish a poison message, verify it arrives in the DLQ, replay it after fixing the consumer, and confirm successful processing
    - Test that DLQ replay preserves message ordering when order matters downstream
    - Verify DLQ depth metrics increment correctly as messages are enqueued
    failure_injection:
    - Inject a serialization error and confirm the message is dead-lettered rather than silently dropped
    - Simulate a full DLQ (capacity limit) and verify the system applies backpressure or alerts rather than losing messages
  monitoring:
    summary: Track DLQ depth and message age to catch processing failures before they accumulate silently.
    metrics:
    - name: dlq_depth
      kind: gauge
      description: number of messages currently in the dead letter queue
    - name: dlq_enqueue_total
      kind: counter
      description: messages moved to DLQ after exhausting retries
    - name: dlq_oldest_message_age_seconds
      kind: gauge
      description: age of the oldest unprocessed DLQ message
    - name: dlq_reprocessed_total
      kind: counter
      description: messages successfully replayed from the DLQ
    alerts:
    - DLQ depth exceeding threshold (messages accumulating faster than they are being triaged)
    - Oldest message age beyond SLA — stale messages indicate nobody is reviewing the DLQ
    - Sudden spike in DLQ enqueue rate (upstream processing regression)
  deployment:
    summary: Ensure DLQ infrastructure is provisioned before consumer changes and that message format compatibility is maintained.
    rollout_implications:
    - Deploy DLQ consumers and replay tooling before deploying producer changes that may alter message schemas
    - Rolling updates to consumers may temporarily increase DLQ volume if new code rejects messages the old code accepted
    - Verify DLQ retention policies are long enough to survive a rollout window plus investigation time
    - If changing message format, ensure the DLQ consumer can deserialize both old and new formats during transition
    pre_deploy_checklist:
    - Confirm DLQ topic/queue exists and has correct permissions in the target environment
    - Verify alerting is active on DLQ depth so new failures are caught immediately post-deploy
