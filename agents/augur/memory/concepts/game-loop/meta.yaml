schema: augur-concept-meta/v2
concept: game-loop
kind: pattern
summary: Game Loop architectural pattern
taxonomy:
  type: pattern
  categories:
  - lifecycle
  - realtime
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-there-a-main-loop-that-separates-input-processing-state-updat
    prompt: Is there a main loop that separates input processing, state update, and rendering into distinct phases?
    weight: 3
    signals:
    - while running
    - process_input
    - update
    - render
  - id: does-the-loop-calculate-delta-time-between-frames-for-frame-rate
    prompt: Does the loop calculate delta time between frames for frame-rate-independent updates?
    weight: 3
    signals:
    - delta_time
    - dt = current - last
    - elapsed
  - id: is-there-a-fixed-timestep-accumulator-separating-simulation-upda
    prompt: Is there a fixed timestep accumulator separating simulation updates from variable-rate rendering?
    weight: 2
    signals:
    - FIXED_DT
    - accumulator += dt
    - fixed_update
  - id: does-the-loop-include-interpolation-between-previous-and-current
    prompt: Does the loop include interpolation between previous and current state for smooth rendering?
    weight: 1
    signals:
    - interpolate
    - lerp
    - alpha = accumulator / FIXED_DT
analysis:
  testing:
    summary: Test update and render steps independently with controlled time inputs to verify deterministic behavior.
    unit:
    - Call the update step with a fixed delta time and assert game state changes match expected physics/logic
    - 'Verify fixed-timestep accumulation: passing a large delta should invoke multiple fixed steps, not one large step'
    - Test that the render step interpolates between previous and current state for smooth visual output
    - Assert that the loop handles zero delta time gracefully (no division by zero, no redundant updates)
    additional_sections:
    - title: Determinism Tests
      items:
      - Run the same input sequence with the same initial state and fixed timesteps, and assert identical final state (replay determinism)
      - Verify that variable frame rates produce the same game-logic outcome when using fixed-step update with accumulator
      - Test that serializing and restoring game state mid-loop produces identical subsequent behavior
    - title: Performance Tests
      items:
      - Measure frame time variance under load to detect update steps that exceed the target frame budget
      - Verify the loop gracefully handles a "spiral of death" — when updates cannot keep up, it should cap catch-up iterations
