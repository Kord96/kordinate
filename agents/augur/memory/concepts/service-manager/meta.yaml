schema: augur-concept-meta/v2
concept: service-manager
kind: pattern
summary: Service Manager architectural pattern
taxonomy:
  type: pattern
  categories:
  - lifecycle
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-signal-handlers-registered-for-graceful-shutdown-with-drain-
    prompt: Are signal handlers registered for graceful shutdown with drain logic for in-flight requests?
    weight: 3
    signals:
    - SIGTERM handler with drain
    - graceful shutdown flushing buffers
    - terminationGracePeriodSeconds configured
  - id: are-health-endpoints-exposed-at-healthz-and-readyz-with-correspo
    prompt: Are health endpoints exposed at /healthz and /readyz with corresponding K8s probes?
    weight: 3
    signals:
    - /healthz and /readyz endpoints
    - livenessProbe and readinessProbe in pod spec
    - health check reporting to orchestrator
  - id: does-startup-validate-config-and-dependencies-before-marking-the
    prompt: Does startup validate config and dependencies before marking the service as ready?
    weight: 2
    signals:
    - readiness delayed until dependencies connected
    - startup validation before serving traffic
    - ready signal only after initialization complete
  - id: are-liveness-and-readiness-probes-distinct-in-behavior-and-purpo
    prompt: Are liveness and readiness probes distinct in behavior and purpose?
    weight: 1
    signals:
    - liveness checks process alive
    - readiness checks dependencies available
    - separate probe logic for live vs ready
analysis:
  testing:
    summary: Validate startup ordering, graceful shutdown behavior, and health check accuracy under real conditions.
    unit:
    - 'Test startup sequencing: assert that dependency checks pass before the service signals readiness'
    - 'Verify health check accuracy: inject a degraded dependency and assert the readiness probe returns unhealthy'
    - 'Test graceful shutdown: send SIGTERM and assert in-flight requests complete before the process exits'
    - 'Assert startup failure behavior: misconfigure a required dependency and verify the service exits with a non-zero code and descriptive error'
    integration:
    - Deploy the service in a real orchestrator and verify it receives no traffic until readiness is signaled
    - 'Test shutdown drain: send requests during SIGTERM and verify all in-flight requests receive responses before the pod terminates'
    - 'Verify liveness vs readiness distinction: a temporarily unhealthy service should fail readiness but not liveness (no unnecessary restarts)'
    failure_injection:
    - Kill a critical dependency after startup and verify the readiness probe transitions to unhealthy, stopping new traffic
    - Send SIGTERM during a long-running request and verify the service waits up to terminationGracePeriodSeconds before force-killing
    - Simulate a health check endpoint that hangs and verify the orchestrator treats it as a timeout failure, not a success
  monitoring:
    summary: Track service lifecycle transitions and health check outcomes to detect unstable services before they impact availability.
    metrics:
    - name: service_state
      kind: gauge
      description: current lifecycle state per service (0=stopped, 1=starting, 2=ready, 3=draining)
    - name: service_restarts_total
      kind: counter
      description: restart count per service (including crash restarts)
    - name: health_check_duration_seconds
      kind: histogram
      description: health check execution time per service
    - name: health_check_failures_total
      kind: counter
      description: failed health checks per service and probe type (liveness/readiness)
    alerts:
    - Service restart count exceeding threshold in a rolling window (crash loop)
    - Health check failing consecutively beyond configured threshold
    - Service stuck in starting state beyond expected startup time
    - Readiness probe failing while liveness passes (service alive but not serving)
  deployment:
    summary: Graceful shutdown, health check timing, and startup dependencies determine whether rollouts cause traffic drops.
    rollout_implications:
    - New pods must pass readiness probes before old pods begin terminating — configure minReadySeconds to avoid premature traffic shifting
    - Startup dependencies (database, cache, message broker) must be reachable before readiness is signaled — use init containers or startup probes
    - SIGTERM handling must drain in-flight requests and flush buffers within terminationGracePeriodSeconds or data is lost
    - Health check timing mismatches between the orchestrator and the service can cause premature removal from load balancing
    pre_deploy_checklist:
    - Verify terminationGracePeriodSeconds exceeds the maximum expected request drain time
    - Confirm readiness and liveness probe intervals are tuned to avoid false positives during startup
    - Check that all startup dependencies are available in the target environment before beginning rollout
references:
- file: orchestrator.md
  kind: reference
  description: orchestrator library reference
