schema: augur-concept-meta/v2
concept: hardcoded-credentials
kind: anti-pattern
summary: Hardcoded Credentials anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: true
    file: semgrep.yaml
    detector_strength: 5
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: semgrep.yaml
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: false
diagnostic_questions:
  threshold: 7
  questions:
  - id: are-password-api-key-or-secret-token-values-assigned-as-string-l
    prompt: Are password, API key, or secret token values assigned as string literals in source files?
    weight: 3
    signals:
    - password = '...'
    - api_key = '...'
    - secret_key = '...'
  - id: do-connection-strings-embed-passwords-directly-in-the-url-rather
    prompt: Do connection strings embed passwords directly in the URL rather than referencing environment variables?
    weight: 3
    signals:
    - postgresql://user:pass@host
    - mongodb://user:pass@
    - embedded password in DSN
  - id: are-env-files-with-real-credential-values-tracked-in-git-instead
    prompt: Are .env files with real credential values tracked in git instead of listed in .gitignore?
    weight: 2
    signals:
    - .env committed to git
    - .env not in .gitignore
    - real values in .env.example
  - id: are-there-string-literals-with-recognizable-credential-prefixes-
    prompt: Are there string literals with recognizable credential prefixes like AKIA, sk-, or Bearer tokens in tracked code?
    weight: 2
    signals:
    - AKIA prefix
    - sk- prefix
    - 'Authorization: Bearer literal'
analysis:
  testing:
    summary: Verify that no secrets appear in source code, configuration, or version history.
    unit:
    - Assert that modules reading credentials pull from environment variables or a secrets manager, never from string literals
    - Inject mock credentials via environment and verify the application uses the injected values
    integration:
    - Deploy to a test environment with secrets injected via secrets manager and verify the application starts and authenticates successfully
    - Rotate a credential in the secrets store and confirm the application picks up the new value without a code change
    additional_sections:
    - title: Static Analysis
      items:
      - Run `trufflehog` or `git-secrets` against the repository and assert zero findings
      - Add a CI lint step that greps for high-entropy strings and known secret prefixes (`AKIA`, `sk-`, `ghp_`)
      - Validate that `.gitignore` includes `.env`, `*.pem`, and credential file patterns
