schema: augur-concept-meta/v2
concept: train-wreck
kind: anti-pattern
summary: Train Wreck anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-expressions-that-chain-through-3-or-more-different-obj
    prompt: Are there expressions that chain through 3 or more different objects' methods or properties to reach a value in a single statement?
    weight: 3
    signals:
    - a.getB().getC().getD()
    - multi-object dot chain
    - deep object graph navigation
  - id: does-changing-an-intermediate-type-in-the-chain-break-code-in-di
    prompt: Does changing an intermediate type in the chain break code in distant, seemingly unrelated modules?
    weight: 3
    signals:
    - change in intermediate type breaks distant code
    - fragile object graph traversal
    - ripple from nested type change
  - id: are-there-chained-null-checks-like-if-a-and-a-b-and-a-b-c-guardi
    prompt: Are there chained null checks like 'if a and a.b and a.b.c' guarding deep property access?
    weight: 2
    signals:
    - chained null checks
    - nested defensive access
    - guard chain before deep property
  - id: does-the-same-multi-object-chain-appear-duplicated-in-multiple-p
    prompt: Does the same multi-object chain appear duplicated in multiple places rather than being encapsulated in a delegate method?
    weight: 2
    signals:
    - duplicated chain expressions
    - same traversal in multiple files
    - no encapsulated accessor
