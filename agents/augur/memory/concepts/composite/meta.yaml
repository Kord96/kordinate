schema: augur-concept-meta/v2
concept: composite
kind: pattern
summary: Composite architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-leaf-objects-and-container-objects-implement-the-same-interfa
    prompt: Do leaf objects and container objects implement the same interface, allowing uniform treatment?
    weight: 3
    signals:
    - shared interface for leaf and composite
    - uniform type for nodes
    - polymorphic tree node
  - id: do-composite-nodes-hold-a-children-collection-and-delegate-opera
    prompt: Do composite nodes hold a children collection and delegate operations recursively to their children?
    weight: 3
    signals:
    - children list on composite
    - recursive operation delegation
    - iterate children and call same method
  - id: is-there-a-recursive-method-render-execute-calculate-that-traver
    prompt: Is there a recursive method (render, execute, calculate) that traverses the tree from root to leaves?
    weight: 2
    signals:
    - recursive traversal method
    - tree walk calling same operation
    - depth-first delegation
  - id: are-add-remove-child-operations-defined-only-on-composite-nodes-
    prompt: Are add/remove child operations defined only on composite nodes, not on leaves?
    weight: 1
    signals:
    - child management on composite only
    - leaf has no add/remove
    - safe no-op on leaf
analysis:
  testing:
    summary: Verify that leaf and composite nodes implement the same interface and tree operations work recursively.
    unit:
    - Call the operation on a leaf node and verify direct behavior
    - Call the operation on a composite and verify it delegates to all children recursively
    - Test add/remove child operations and verify the tree structure updates correctly
    integration:
    - Build a multi-level tree and verify the operation traverses all levels, aggregating results correctly
    - 'Test serialization: serialize the tree, deserialize, and verify the structure and behavior are preserved'
    failure_injection:
    - Add a cyclic reference and verify the traversal detects it rather than looping infinitely
