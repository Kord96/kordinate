schema: augur-concept-meta/v2
concept: event-driven
kind: pattern
summary: Event-Driven architectural pattern
taxonomy:
  type: pattern
  categories:
  - architectural
  - messaging
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-domain-events-defined-as-first-class-objects-with-type-times
    prompt: Are domain events defined as first-class objects with type, timestamp, and payload?
    weight: 3
    signals:
    - event classes like OrderCreated or UserRegistered
    - event metadata with ID, timestamp, correlation ID
  - id: do-components-communicate-through-an-event-bus-or-dispatcher-rat
    prompt: Do components communicate through an event bus or dispatcher rather than direct method calls?
    weight: 3
    signals:
    - emit_event() or publish_event() calls
    - event handler registration with subscribe or on_event
  - id: are-event-handlers-registered-to-react-to-typed-events-decoupled
    prompt: Are event handlers registered to react to typed events, decoupled from producers?
    weight: 2
    signals:
    - '@event_handler decorator or subscribe(EventType, handler)'
    - handler does not import or reference the producer
  - id: are-events-immutable-facts-rather-than-commands-directing-action
    prompt: Are events immutable facts rather than commands directing action?
    weight: 1
    signals:
    - events named in past tense (Created, Processed)
    - event payload describes what happened, not what to do
analysis:
  testing:
    summary: Verify that events are published, routed, and consumed correctly, with proper handling of ordering, failures, and idempotency.
    unit:
    - Assert that domain actions publish the expected event type with the correct payload
    - Verify consumers process events idempotently — duplicate delivery should not cause side effects
    - 'Test event deserialization: malformed events should be rejected with a clear error, not silently dropped'
    - Assert that event handlers do not perform synchronous blocking calls that would stall the consumer
    integration:
    - Publish an event and verify the consumer processes it end-to-end, including downstream side effects
    - 'Test event ordering: publish events with causal dependencies and verify consumers process them in the correct order'
    - Verify that multiple consumers on the same topic each receive and process events independently
    failure_injection:
    - Kill a consumer mid-processing and verify the event is redelivered and processed successfully on restart
    - Simulate broker unavailability and confirm producers either buffer events or fail with a retryable error
  monitoring:
    summary: Track event throughput, consumer lag, and processing errors to maintain visibility into asynchronous workflows.
    metrics:
    - name: events_published_total
      kind: counter
      description: events emitted by producers, by event type
    - name: events_consumed_total
      kind: counter
      description: events successfully processed by consumers
    - name: consumer_lag
      kind: gauge
      description: offset difference between latest published and last consumed event
    - name: event_processing_duration_seconds
      kind: histogram
      description: time from event receipt to processing completion
    alerts:
    - Consumer lag exceeding threshold (consumers falling behind producers)
    - Event processing error rate spike (poison messages or downstream failures)
    - Zero events published for an expected event type over a time window (producer may be down)
  deployment:
    summary: Coordinate producer and consumer deployments to avoid event loss or processing gaps during rollouts.
    rollout_implications:
    - Deploy consumers before producers when introducing new event types — consumers must be ready to handle events as soon as they appear
    - Rolling consumer updates may cause temporary rebalancing of partitions — expect brief processing pauses during rebalance
    - Verify that new consumers can handle events published by the old producer version and vice versa
    - If changing event routing (new topics, partition keys), deploy the infrastructure change before the code change
    pre_deploy_checklist:
    - Confirm message broker topics/queues exist and have correct partition counts in the target environment
    - Verify consumer group offsets are committed and current — stale offsets after deploy could trigger unwanted replay
