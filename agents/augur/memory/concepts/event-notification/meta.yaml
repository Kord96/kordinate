schema: augur-concept-meta/v2
concept: event-notification
kind: pattern
summary: Event Notification architectural pattern
taxonomy:
  type: pattern
  categories:
  - messaging
  - integration
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - deployment.md
traits:
  testable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-events-contain-only-identifiers-and-type-with-no-entity-paylo
    prompt: Do events contain only identifiers and type with no entity payload?
    weight: 3
    signals:
    - event payload has only id, type, timestamp
    - minimal event with no embedded entity data
  - id: must-consumers-call-back-to-the-source-service-to-fetch-full-ent
    prompt: Must consumers call back to the source service to fetch full entity data?
    weight: 3
    signals:
    - consumer makes API call to source after receiving notification
    - GET request triggered by thin event
  - id: does-the-source-service-expose-a-stable-api-for-consumers-to-fet
    prompt: Does the source service expose a stable API for consumers to fetch data on demand?
    weight: 2
    signals:
    - documented callback API for event consumers
    - GET endpoint returning entity by ID for post-event fetch
  - id: are-events-intentionally-minimal-as-a-design-choice-rather-than-
    prompt: Are events intentionally minimal as a design choice rather than accidentally incomplete?
    weight: 1
    signals:
    - thin event design documented or commented
    - event schema explicitly excludes entity fields
analysis:
  testing:
    summary: Verify that notifications trigger the correct consumer callbacks and that consumers fetch full state successfully.
    unit:
    - Assert that domain state changes emit a notification event with the correct entity ID and event type
    - Verify consumers receive the notification and call back to the source API to fetch full state
    - Test that consumers handle source API unavailability gracefully — retry with backoff, do not silently skip
    - Assert notification payloads are minimal (ID + type) and do not leak full entity state
    integration:
    - Trigger a state change, verify the notification is published, and confirm the consumer fetches and processes the updated state
    - Test that multiple consumers receiving the same notification each independently fetch state without interfering
    - Verify that notifications for deleted entities are handled — consumer should not fail when the callback returns 404
    additional_sections:
    - title: Ordering Tests
      items:
      - Publish rapid successive notifications for the same entity and verify the consumer converges to the latest state, not an intermediate one
  deployment:
    summary: Coordinate notification infrastructure so consumers can fetch full state from the source when notified.
    rollout_implications:
    - Deploy the source API changes before the notification schema changes — consumers call back to the source for full data, so the API must serve the new shape first
    - Thin events carry minimal payload, so schema changes are less risky than fat events, but routing and type identifiers must remain stable
    - Rolling consumer updates may cause brief windows where some consumers fetch old API versions — ensure the source API supports both
    - If changing the notification channel (topic rename, new routing key), deploy consumers listening on both old and new channels during transition
    pre_deploy_checklist:
    - Verify the source API is healthy and can handle the callback load that notifications will trigger
    - Confirm notification topic/exchange exists with correct routing in the target environment
