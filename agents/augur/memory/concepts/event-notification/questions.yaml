questions:
  - q: "Do events contain only identifiers and type with no entity payload?"
    weight: 3
    signals: ["event payload has only id, type, timestamp", "minimal event with no embedded entity data"]
  - q: "Must consumers call back to the source service to fetch full entity data?"
    weight: 3
    signals: ["consumer makes API call to source after receiving notification", "GET request triggered by thin event"]
  - q: "Does the source service expose a stable API for consumers to fetch data on demand?"
    weight: 2
    signals: ["documented callback API for event consumers", "GET endpoint returning entity by ID for post-event fetch"]
  - q: "Are events intentionally minimal as a design choice rather than accidentally incomplete?"
    weight: 1
    signals: ["thin event design documented or commented", "event schema explicitly excludes entity fields"]
threshold: 6
