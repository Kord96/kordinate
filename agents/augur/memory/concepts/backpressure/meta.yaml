schema: augur-concept-meta/v2
concept: backpressure
kind: pattern
summary: Backpressure architectural pattern
taxonomy:
  type: pattern
  categories:
  - resilience
  - concurrency
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-queues-or-channels-bounded-with-an-explicit-maximum-capacity
    prompt: Are queues or channels bounded with an explicit maximum capacity that prevents unbounded growth?
    weight: 3
    signals:
    - bounded queue
    - maxsize parameter
    - channel with buffer limit
  - id: when-a-queue-is-full-does-the-system-actively-reject-drop-or-slo
    prompt: When a queue is full, does the system actively reject, drop, or slow down the producer rather than buffering indefinitely?
    weight: 3
    signals:
    - rejection on full
    - drop policy
    - producer blocked until space available
  - id: is-there-a-pull-based-consumption-model-where-the-consumer-reque
    prompt: Is there a pull-based consumption model where the consumer requests items at its own pace?
    weight: 2
    signals:
    - pull-based consumption
    - consumer-driven flow
    - request(n) demand signaling
  - id: are-backpressure-operators-or-rate-limiting-mechanisms-applied-t
    prompt: Are backpressure operators or rate-limiting mechanisms applied to streaming or reactive pipelines?
    weight: 2
    signals:
    - onBackpressureDrop
    - limitRate operator
    - flow control in reactive stream
analysis:
  testing:
    summary: Verify that flow control activates under load, sheds excess traffic predictably, and recovers when pressure subsides.
    unit:
    - 'Test flow control activation: when the queue reaches the configured high-water mark, assert the producer is signaled to slow down or requests are rejected'
    - 'Verify shedding behavior: under sustained overload, assert messages are dropped or rejected according to the configured policy (oldest-first, random, priority-based)'
    - 'Test recovery: after the queue drains below the low-water mark, assert the producer is unblocked and normal throughput resumes'
    - 'Assert bounded queue semantics: submitting beyond queue capacity returns a rejection rather than blocking indefinitely'
    integration:
    - Run a producer faster than the consumer against real infrastructure and verify backpressure engages without OOM or data corruption
    - 'Test end-to-end recovery: apply load until backpressure activates, reduce load, and verify the system returns to normal throughput and latency'
    - Verify that backpressure metrics (queue depth, drop count, consumer lag) accurately reflect the system state under load
    failure_injection:
    - Kill the consumer entirely and verify the producer hits backpressure limits rather than filling memory unboundedly
    - Simulate a consumer that alternates between fast and stalled processing — verify backpressure engages and disengages correctly
    - Introduce network partition between producer and consumer and verify the bounded queue prevents resource exhaustion on the producer side
  monitoring:
    summary: Track producer-consumer imbalance and resource exhaustion signals.
    metrics:
    - name: queue_depth
      kind: gauge
      description: pending items between producer and consumer
    - name: consumer_lag
      kind: gauge
      description: how far behind the consumer is (Kafka offset lag)
    - name: memory_pressure_bytes
      kind: gauge
      description: buffer memory usage approaching limits
    - name: dropped_messages_total
      kind: counter
      description: messages shed under load
    alerts:
    - Queue depth growing monotonically (consumer not keeping up)
    - Consumer lag exceeding SLA threshold
    - Memory usage approaching configured buffer limits
    - Non-zero drop rate when drops are not expected
  deployment:
    summary: Buffer sizing and flow control threshold changes during rollout affect the producer-consumer balance.
    rollout_implications:
    - Reducing buffer sizes during rollout causes earlier backpressure signals — producers may throttle or drop messages unexpectedly
    - Scaling consumers down during rolling restart reduces throughput — producers must handle increased backpressure without data loss
    - Flow control threshold changes take effect per-pod, so mixed old/new thresholds during rollout create uneven load distribution
    - New pods starting with empty buffers temporarily absorb more load, potentially starving old pods that are draining
    pre_deploy_checklist:
    - Verify buffer size changes are within safe bounds — too small causes premature drops, too large risks OOM
    - Confirm consumer scaling strategy accounts for reduced capacity during rolling restart
    - Check that producers handle backpressure signals gracefully (throttle or queue, not crash)
