schema: augur-concept-meta/v2
concept: unbounded-growth
kind: anti-pattern
summary: Unbounded Growth anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  observable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-dicts-lists-or-caches-in-long-running-processes-that-g
    prompt: Are there dicts, lists, or caches in long-running processes that grow monotonically with no eviction policy, TTL, or max size?
    weight: 3
    signals:
    - cache dict with no eviction
    - append-only list without maxlen
    - lru_cache with maxsize=None
  - id: do-in-memory-collections-lack-any-size-limit-ttl-or-backpressure
    prompt: Do in-memory collections lack any size limit, TTL, or backpressure mechanism?
    weight: 3
    signals:
    - no maxsize or maxlen
    - no TTL on cache entries
    - no backpressure on queue
  - id: are-there-append-only-patterns-history-append-log-buffers-event-
    prompt: Are there append-only patterns (history.append, log buffers, event collectors) that accumulate indefinitely in memory?
    weight: 2
    signals:
    - history.append in long-running process
    - event collector without limit
    - log buffer without rotation
  - id: do-session-stores-connection-pools-or-registries-grow-without-a-
    prompt: Do session stores, connection pools, or registries grow without a corresponding shrink or cleanup mechanism?
    weight: 2
    signals:
    - session store grows unbounded
    - connection pool never shrinks
    - registry without cleanup
