schema: augur-concept-meta/v2
concept: proxy
kind: pattern
summary: Proxy architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-a-class-implement-the-same-interface-as-the-real-subject-an
    prompt: Does a class implement the same interface as the real subject and conditionally delegate calls to it?
    weight: 3
    signals:
    - proxy implements subject interface
    - delegates to real object
    - same API surface
  - id: does-the-proxy-add-a-single-transparent-behavior-such-as-lazy-lo
    prompt: Does the proxy add a single transparent behavior such as lazy loading, caching, access control, or remote access?
    weight: 3
    signals:
    - lazy initialization on first use
    - caching proxy returns stored result
    - permission check before delegate
  - id: is-client-code-unaware-whether-it-holds-a-proxy-or-the-real-obje
    prompt: Is client code unaware whether it holds a proxy or the real object?
    weight: 2
    signals:
    - client depends on interface only
    - no proxy-specific methods called
    - transparent substitution
  - id: for-caching-proxies-is-there-a-defined-invalidation-strategy-to-
    prompt: For caching proxies, is there a defined invalidation strategy to prevent stale data?
    weight: 2
    signals:
    - cache TTL on proxy
    - invalidation on write
    - cache eviction policy
analysis:
  testing:
    summary: Verify the proxy is transparent to callers, correctly delegates to the real subject, and enforces its specific concern (access control, caching, or lazy loading).
    unit:
    - Call every method on the proxy and verify it delegates to the real subject with identical arguments and return values
    - 'Test the proxy''s specific concern: lazy proxy defers creation until first use, caching proxy returns cached value on repeat calls, protection proxy rejects unauthorized access'
    - Verify the proxy implements the exact same interface as the real subject (no extra methods, no missing methods)
    - Test cache invalidation (caching proxy) or permission changes (protection proxy) take effect on subsequent calls
    additional_sections:
    - title: Substitutability Tests
      items:
      - Run the same test suite against both the proxy and the real subject and verify identical behavior for the common interface
      - Inject the proxy where the real subject is expected and verify client code functions without modification
      - Verify type checks and isinstance calls (if used) accept the proxy as a valid implementation
    - title: Concurrency Tests
      items:
      - 'For lazy proxies: initialize from multiple threads simultaneously and verify the real subject is created exactly once'
      - 'For caching proxies: verify thread-safe cache reads and writes under concurrent access'
