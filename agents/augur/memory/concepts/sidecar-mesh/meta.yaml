schema: augur-concept-meta/v2
concept: sidecar-mesh
kind: structure-shape
summary: Sidecar mesh structure — services with co-located helper processes for cross-cutting concerns
taxonomy:
  type: structure-shape
  categories:
  - infrastructure
  - deployment
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
diagnostic_questions:
  threshold: 3
  questions:
  - id: does-the-project-use-a-service-mesh-istio-linkerd-consul-connect
    prompt: Does the project use a service mesh (Istio, Linkerd, Consul Connect)?
    weight: 1
    signals:
    - istio
    - linkerd
    - consul
    - envoy
  - id: do-pod-specs-have-multiple-containers-main-app-sidecar
    prompt: Do pod specs have multiple containers (main app + sidecar)?
    weight: 1
    signals:
    - sidecar
    - istio-proxy
    - envoy
    - initContainers
  - id: is-mtls-between-services-handled-by-the-mesh-not-the-application
    prompt: Is mTLS between services handled by the mesh, not the application?
    weight: 1
    signals:
    - PeerAuthentication
    - DestinationRule
    - mtls
  - id: are-traffic-policies-retries-timeouts-circuit-breaking-configure
    prompt: Are traffic policies (retries, timeouts, circuit breaking) configured at mesh level?
    weight: 1
    signals:
    - VirtualService
    - DestinationRule
    - TrafficPolicy
