schema: augur-concept-meta/v2
concept: distributed-tracing
kind: pattern
summary: Distributed Tracing Instrumentation architectural pattern
taxonomy:
  type: pattern
  categories:
  - observability
  - integration
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-a-tracerprovider-configured-at-application-startup-with-an-ex
    prompt: Is a TracerProvider configured at application startup with an exporter?
    weight: 3
    signals:
    - TracerProvider initialization with OTLP or Jaeger exporter
    - opentelemetry SDK setup in app bootstrap
  - id: are-spans-created-with-parent-child-relationships-across-service
    prompt: Are spans created with parent-child relationships across service boundaries?
    weight: 3
    signals:
    - tracer.start_span() with parent context
    - context propagation via traceparent header
  - id: does-middleware-inject-and-extract-trace-context-on-inbound-and-
    prompt: Does middleware inject and extract trace context on inbound and outbound calls?
    weight: 2
    signals:
    - inject() on outbound HTTP/gRPC calls
    - extract() in request middleware for incoming traces
  - id: do-spans-include-meaningful-attributes-like-operation-name-statu
    prompt: Do spans include meaningful attributes like operation name, status code, and error flags?
    weight: 1
    signals:
    - span.set_attribute with business identifiers
    - error flag and status code recorded on spans
analysis:
  testing:
    summary: Verify that trace context propagates across service boundaries and that spans form a complete, connected tree.
    unit:
    - Assert that outgoing HTTP/gRPC calls include trace context headers (traceparent, b3, etc.)
    - Verify that incoming requests with trace headers create child spans rather than new root spans
    - Test that span attributes (service name, operation, status) are populated correctly
    - Assert that sensitive data is not recorded in span attributes or logs attached to traces
    integration:
    - Issue a request that crosses two or more services and verify the resulting trace contains spans from all services in a single tree
    - Test that async operations (message queues, background jobs) propagate trace context and appear in the same trace
    - Verify that error spans include the correct status code and error message without leaking stack traces
    additional_sections:
    - title: Pipeline Tests
      items:
      - Send traces to a test collector and verify they arrive with expected structure and latency
      - 'Test sampling configuration: head-based and tail-based sampling should include/exclude traces at the configured rates'
  monitoring:
    summary: Track trace pipeline health and sampling coverage to ensure traces are actually reaching the backend.
    metrics:
    - name: traces_exported_total
      kind: counter
      description: traces successfully sent to the collector
    - name: traces_dropped_total
      kind: counter
      description: traces dropped due to sampling, buffer overflow, or export failure
    - name: trace_export_latency_seconds
      kind: histogram
      description: time to flush trace batches to the collector
    - name: span_count_per_trace
      kind: histogram
      description: number of spans per trace to detect over-instrumentation or missing spans
    alerts:
    - Trace drop rate exceeding threshold (data loss in the observability pipeline)
    - Export latency spike (collector or network backpressure)
    - Services with zero trace output (instrumentation broken or sampling misconfigured)
  deployment:
    summary: Maintain trace continuity across service versions during rollouts so traces are not broken mid-flight.
    rollout_implications:
    - Old and new versions must propagate the same trace context headers — changing propagation format requires a two-phase rollout
    - Deploy collector/agent infrastructure updates before application changes that emit new span attributes
    - Rolling restarts may cause brief gaps in trace coverage — expected, but verify traces resume within one rollout cycle
    - If changing sampling rates, roll out the new rate gradually to avoid overwhelming the collector
    pre_deploy_checklist:
    - Verify the trace collector endpoint is reachable from the target environment
    - Confirm context propagation format (W3C, B3, Jaeger) matches across all communicating services
