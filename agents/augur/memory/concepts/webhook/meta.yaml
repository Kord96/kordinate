schema: augur-concept-meta/v2
concept: webhook
kind: pattern
summary: Webhook architectural pattern
taxonomy:
  type: pattern
  categories:
  - integration
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-the-system-register-callback-urls-and-deliver-http-post-req
    prompt: Does the system register callback URLs and deliver HTTP POST requests to them when events occur?
    weight: 3
    signals:
    - webhook_url or callback_url registration
    - HTTP POST on event
    - event-driven callback delivery
  - id: are-webhook-payloads-signed-with-hmac-and-verified-on-the-receiv
    prompt: Are webhook payloads signed with HMAC and verified on the receiving side?
    weight: 3
    signals:
    - X-Hub-Signature or X-Signature-256
    - hmac.compare_digest verification
    - shared secret payload signing
  - id: does-the-webhook-delivery-system-retry-failed-deliveries-with-ex
    prompt: Does the webhook delivery system retry failed deliveries with exponential backoff?
    weight: 2
    signals:
    - retry on 4xx/5xx
    - exponential backoff on failure
    - delivery retry logic
  - id: are-idempotency-keys-or-event-ids-included-in-payloads-so-receiv
    prompt: Are idempotency keys or event IDs included in payloads so receivers can deduplicate?
    weight: 1
    signals:
    - idempotency key in payload
    - event_id for deduplication
    - at-least-once with dedup support
analysis:
  testing:
    summary: '# Testing - Test payload signing: verify HMAC-SHA256 signature generation and receiver-side verification - Test retry behavior: simulate 4xx/5xx responses and verify exponential backoff and max retry limits - Verify idempotency: deliver the same event twice and confirm the receiver deduplicates correctly - Test dead-letter handling: exhaust retries and verify the event lands in the DLQ for manual review - Test webhook registration validation: reject invalid or unreachable callback URLs - Verify that webhook dispatch is asynchronous and does not block the event producer - Test payload size limits: payloads exceeding the bound are rejected or truncated - Integration test the full cycle: event occurs, webhook dispatched, receiver processes, acknowledgment returned'
  monitoring:
    summary: Track delivery reliability, retry behavior, and per-endpoint health for outbound webhook dispatch.
    metrics:
    - name: webhook_deliveries_total
      kind: counter
      description: delivery attempts partitioned by endpoint and result (success, client_error, server_error)
    - name: webhook_delivery_latency_seconds
      kind: histogram
      description: time from event generation to successful HTTP POST acknowledgment
    - name: webhook_retry_total
      kind: counter
      description: retry attempts per endpoint, indicates receiver reliability
    - name: webhook_dead_letter_queue_depth
      kind: gauge
      description: permanently failed deliveries awaiting manual review
    - name: webhook_dispatch_queue_depth
      kind: gauge
      description: pending events in the dispatch queue, detects backlog from slow consumers
    - name: webhook_signature_failures_total
      kind: counter
      description: payload signing or signature verification mismatches
    alerts:
    - Sustained retries for a specific endpoint (persistently failing receiver)
    - Dead-letter queue depth growing (permanently failed deliveries accumulating)
    - Dispatch queue backlog building beyond acceptable threshold
    - Delivery latency exceeding SLA for time-sensitive events
    - Signature verification mismatch (potential payload tampering or secret rotation issue)
  deployment:
    summary: Deploy payload and signing changes with backward compatibility, since consumers update on their own schedule and cannot be force-upgraded.
    rollout_implications:
    - Payload format changes must be additive (add fields, never rename or remove) — consumers parse the old format and will break silently on incompatible changes
    - Signing secret rotation requires a dual-validation window where both old and new secrets are accepted — deploying a new secret without the overlap immediately invalidates all existing consumer verification
    - Scaling down webhook dispatch workers during a deploy reduces delivery throughput — events queue up and may hit retry limits or dead-letter before workers recover
    - Deploying retry policy changes affects all in-flight deliveries, not just new ones — tightening retry limits may cause currently-retrying deliveries to be abandoned
    - Deprecating a webhook endpoint requires coordinating with external consumers who control their own deployment timeline — removing an endpoint without monitoring usage drops events silently
    pre_deploy_checklist:
    - Verify backward compatibility of payload format changes by testing against the previous schema
    - Confirm signing secret rotation includes a dual-validation window accepting both old and new secrets
    - Ensure dispatch queue workers have enough capacity to handle registered webhook volume after the deploy
    - Test delivery retry behavior in staging before deploying retry policy changes to production
    - Verify dead-letter handling is deployed and functional before increasing webhook volume or tightening retry limits
