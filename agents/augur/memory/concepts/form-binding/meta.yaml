schema: augur-concept-meta/v2
concept: form-binding
kind: pattern
summary: Form Binding — two-way or controlled data binding between form inputs and state
taxonomy:
  type: pattern
  categories:
  - frontend
  - data
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-form-inputs-connected-to-state-through-structured-binding-co
    prompt: Are form inputs connected to state through structured binding (controlled inputs, v-model, ngModel)?
    weight: 3
    signals:
    - value + onChange controlled inputs in React
    - v-model or bind:value on form elements
  - id: is-form-validation-defined-as-a-schema-separate-from-the-ui-rend
    prompt: Is form validation defined as a schema separate from the UI rendering logic?
    weight: 2
    signals:
    - Zod z.object() or Yup yup.object().shape() schema
    - zodResolver or yupResolver connecting schema to form library
  - id: are-field-level-errors-displayed-adjacent-to-their-corresponding
    prompt: Are field-level errors displayed adjacent to their corresponding inputs?
    weight: 2
    signals:
    - errors.fieldName rendered next to input
    - per-field error messages with touched state tracking
  - id: is-form-state-managed-by-a-form-library-rather-than-individual-u
    prompt: Is form state managed by a form library rather than individual useState calls per field?
    weight: 2
    signals:
    - useForm or useFormik managing all field state
    - FormGroup/FormBuilder for reactive form state
  - id: does-the-form-handle-dirty-state-tracking-and-submission-guards
    prompt: Does the form handle dirty-state tracking and submission guards?
    weight: 1
    signals:
    - isDirty or formState.dirty tracking
    - submit button disabled while validation errors exist
