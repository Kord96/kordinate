schema: augur-concept-meta/v2
concept: bridge
kind: pattern
summary: Bridge architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-there-an-abstraction-class-that-holds-a-reference-to-an-imple
    prompt: Is there an abstraction class that holds a reference to an implementation interface, with both hierarchies varying independently?
    weight: 3
    signals:
    - abstraction delegates to impl interface
    - two parallel hierarchies
    - composition over inheritance
  - id: can-new-implementations-be-added-without-modifying-existing-abst
    prompt: Can new implementations be added without modifying existing abstractions, and vice versa?
    weight: 3
    signals:
    - independent variation
    - new impl needs no abstraction change
    - open for extension on both axes
  - id: is-the-implementation-injected-into-the-abstraction-via-construc
    prompt: Is the implementation injected into the abstraction via constructor or setter rather than hardcoded?
    weight: 2
    signals:
    - implementation injected
    - constructor receives impl
    - swappable at runtime
  - id: are-there-distinct-class-hierarchies-for-what-something-does-abs
    prompt: Are there distinct class hierarchies for what something does (abstraction) versus how it does it (implementation)?
    weight: 2
    signals:
    - what vs how separation
    - Renderer vs RendererImpl
    - abstraction hierarchy plus implementation hierarchy
analysis:
  testing:
    summary: Verify that abstraction and implementation vary independently and all combinations work correctly.
    unit:
    - Test each implementation through the abstraction interface and verify correct delegation
    - Swap implementations at runtime and assert the abstraction behavior changes accordingly
    - Verify new implementations can be added without modifying the abstraction
    integration:
    - Test all abstraction-implementation combinations to ensure cross-product compatibility
    - Wire via DI and verify the correct implementation is selected per configuration
    failure_injection:
    - Inject a failing implementation and verify the abstraction surfaces errors cleanly to callers
