schema: augur-concept-meta/v2
concept: rest
kind: pattern
summary: REST API architectural pattern
taxonomy:
  type: pattern
  categories:
  - api
  - integration
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
traits:
  testable: true
  observable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-urls-structured-as-resource-nouns-with-http-methods-mapped-t
    prompt: Are URLs structured as resource nouns with HTTP methods mapped to CRUD operations?
    weight: 3
    signals:
    - GET /users for list, POST /users for create
    - resource-based URL paths like /users/123
    - PUT or PATCH for updates, DELETE for removal
  - id: are-http-status-codes-used-semantically-rather-than-returning-20
    prompt: Are HTTP status codes used semantically rather than returning 200 for everything?
    weight: 3
    signals:
    - 201 Created on POST success
    - 404 Not Found for missing resources
    - 422 or 400 for validation errors
  - id: is-there-an-openapi-or-swagger-specification-file-for-the-api
    prompt: Is there an OpenAPI or Swagger specification file for the API?
    weight: 2
    signals:
    - openapi.yaml or swagger.json in repo
    - API spec generated from annotations
    - schema-first API definition
  - id: are-list-endpoints-paginated-to-prevent-unbounded-result-sets
    prompt: Are list endpoints paginated to prevent unbounded result sets?
    weight: 1
    signals:
    - cursor-based pagination parameters
    - offset and limit query params
    - next page link in response
analysis:
  testing:
    summary: Verify correct HTTP semantics, resource-oriented design, and consistent error responses across all endpoints.
    unit:
    - Test each endpoint returns the correct HTTP status code (200, 201, 204, 400, 404, 409, 422)
    - Verify GET requests are safe and idempotent (no side effects, same result on repeated calls)
    - Verify PUT requests are idempotent (repeated PUTs with the same body produce the same state)
    - 'Test validation: send invalid payloads and verify 400/422 with a structured error response'
    integration:
    - Run the full CRUD lifecycle (POST, GET, PUT, DELETE) for each resource and verify state transitions
    - 'Test content negotiation: verify the API returns the correct content type based on the Accept header'
    - Verify error response format is consistent across all endpoints (same structure for 4xx and 5xx errors)
    additional_sections:
    - title: Contract Tests
      items:
      - Validate responses against the OpenAPI spec (schema compliance, required fields, correct types)
      - 'Test pagination on list endpoints: verify correct page metadata, ordering, and boundary behavior'
      - Verify HATEOAS links (if used) point to valid endpoints and contain correct resource URLs
      - 'Test API versioning: requests to deprecated versions return appropriate responses or redirects'
  monitoring:
    summary: Track request volume, latency distribution, and error rates by endpoint and HTTP method.
    metrics:
    - name: http_requests_total
      kind: counter
      description: '- request count by method, endpoint, and status code'
    - name: http_request_duration_seconds
      kind: histogram
      description: '- latency distribution by endpoint'
    - name: http_response_size_bytes
      kind: histogram
      description: '- response payload size by endpoint'
    - name: http_4xx_total
      kind: counter
      description: '- client errors by endpoint (400, 404, 422, 429)'
    - name: http_5xx_total
      kind: counter
      description: '- server errors by endpoint (500, 502, 503)'
    alerts:
    - 5xx error rate exceeds threshold for any endpoint (server-side failure)
    - P99 latency exceeds SLA for a sustained period (performance degradation)
    - 429 rate spike on authentication endpoints (possible brute-force or credential stuffing)
    - Sudden drop in request volume on a high-traffic endpoint (upstream failure or routing change)
