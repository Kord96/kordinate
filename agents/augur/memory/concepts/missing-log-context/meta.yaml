schema: augur-concept-meta/v2
concept: missing-log-context
kind: anti-pattern
summary: Missing Log Context anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  observable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-error-log-lines-contain-only-a-bare-message-string-with-no-st
    prompt: Do error log lines contain only a bare message string with no structured fields or request identifiers?
    weight: 3
    signals:
    - logger.error('failed')
    - log.Println(err.Error())
    - console.error(message)
  - id: is-there-no-middleware-or-decorator-that-binds-a-request-id-or-c
    prompt: Is there no middleware or decorator that binds a request ID or correlation ID to the logging context?
    weight: 3
    signals:
    - no structlog.bind at request entry
    - no MDC.put for request ID
    - no trace context propagation
  - id: can-a-single-request-be-traced-across-multiple-log-lines-without
    prompt: Can a single request be traced across multiple log lines without manual timestamp alignment?
    weight: 2
    signals:
    - no request_id in log fields
    - no correlation_id
    - log lines lack common identifier
  - id: do-log-statements-omit-the-operation-name-entity-id-or-input-tha
    prompt: Do log statements omit the operation name, entity ID, or input that caused the failure?
    weight: 2
    signals:
    - error logged without entity context
    - no operation name in log
    - which user? which request?
