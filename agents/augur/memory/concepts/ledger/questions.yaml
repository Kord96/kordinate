questions:
  - q: "Does every transaction produce paired debit and credit entries that must sum to zero?"
    weight: 3
    signals: ["JournalEntry with debit and credit fields", "transaction validation enforcing debit == credit", "double-entry constraint on insert"]
  - q: "Are ledger entries immutable and append-only, with corrections made via new reversing entries?"
    weight: 3
    signals: ["insert-only table with no UPDATE allowed", "reversing or correcting journal entries", "no DELETE on ledger rows"]
  - q: "Is there a balance invariant check that verifies total debits equal total credits?"
    weight: 2
    signals: ["SUM(debit) = SUM(credit) assertion", "reconciliation job or balance check", "invariant violation alerts"]
  - q: "Does the system support reconciliation between internal ledger and external sources?"
    weight: 1
    signals: ["reconciliation report or job", "bank feed matching", "external balance comparison"]
threshold: 6
