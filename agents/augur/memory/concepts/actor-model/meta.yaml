schema: augur-concept-meta/v2
concept: actor-model
kind: pattern
summary: Actor Model architectural pattern
taxonomy:
  type: pattern
  categories:
  - concurrency
  - architectural
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-isolated-entities-communicate-exclusively-through-asynchronou
    prompt: Do isolated entities communicate exclusively through asynchronous message passing rather than direct method calls?
    weight: 3
    signals:
    - message send to actor ref
    - mailbox dispatch
    - tell/ask instead of call
  - id: does-each-entity-maintain-its-own-private-state-with-no-shared-m
    prompt: Does each entity maintain its own private state with no shared mutable data between entities?
    weight: 3
    signals:
    - encapsulated actor state
    - no shared variables
    - state isolation per actor
  - id: is-there-a-message-handler-or-receive-method-that-dispatches-inc
    prompt: Is there a message handler or receive method that dispatches incoming messages by type?
    weight: 2
    signals:
    - receive() handler
    - on_message dispatch
    - pattern matching on message type
  - id: is-there-a-supervision-hierarchy-that-defines-how-failures-in-on
    prompt: Is there a supervision hierarchy that defines how failures in one entity are handled by a parent?
    weight: 2
    signals:
    - supervisor strategy
    - restart policy
    - parent watches child lifecycle
analysis:
  testing:
    summary: Test actor behavior in isolation by sending messages and asserting responses, then verify supervision and concurrency.
    unit:
    - Send a message to an actor and assert the correct response or state change
    - Verify that actors process messages sequentially — no concurrent state mutation
    - 'Test supervision strategy: a failing child actor is restarted with correct initial state'
    integration:
    - Wire multiple actors together and verify end-to-end message flow
    - 'Test actor persistence: kill an actor, restart it, and verify state recovery from journal'
    - Verify dead letter handling for messages sent to stopped actors
    failure_injection:
    - Inject exceptions in message handlers and verify the supervisor restarts the actor
    - Flood an actor mailbox and verify backpressure or bounded-mailbox rejection behavior
  monitoring:
    summary: Track actor mailbox depth, message throughput, and supervision events.
    metrics:
    - name: actor_mailbox_size
      kind: gauge
      description: pending messages per actor, signals backpressure
    - name: actor_messages_processed_total
      kind: counter
      description: throughput per actor type
    - name: actor_message_latency_seconds
      kind: histogram
      description: time from enqueue to processing
    - name: actor_restarts_total
      kind: counter
      description: supervisor-triggered restarts per actor
    alerts:
    - Mailbox depth exceeding threshold (actor falling behind)
    - Restart rate spike (actor crash loop)
    - Message processing latency exceeding SLA
  deployment:
    summary: Drain actor mailboxes before shutdown and ensure supervision trees restart cleanly on new instances.
    rollout_implications:
    - Drain in-flight messages before terminating pods — actors with non-empty mailboxes lose unprocessed work
    - Rolling restarts redistribute actors across nodes; verify cluster membership protocol handles rejoins
    - Persistent actors must recover state from journal/snapshot before accepting new messages
    pre_deploy_checklist:
    - Verify terminationGracePeriodSeconds allows full mailbox drain
    - Confirm actor serialization format is backward-compatible with in-flight messages
