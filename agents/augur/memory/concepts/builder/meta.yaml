schema: augur-concept-meta/v2
concept: builder
kind: pattern
summary: Builder architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-there-a-class-with-fluent-setter-methods-returning-self-this-
    prompt: Is there a class with fluent setter methods (returning self/this) and a terminal build/create method that produces a different object?
    weight: 3
    signals:
    - fluent methods returning self
    - terminal build() method
    - builder produces product
  - id: does-the-build-step-validate-that-all-required-fields-are-set-be
    prompt: Does the build step validate that all required fields are set before constructing the final object?
    weight: 2
    signals:
    - validation in build()
    - required field check
    - prevents incomplete objects
  - id: are-construction-steps-separated-from-the-product-s-internal-rep
    prompt: Are construction steps separated from the product's internal representation, allowing different representations from the same process?
    weight: 3
    signals:
    - construction separated from representation
    - builder independent of product internals
    - step-by-step assembly
  - id: can-the-builder-be-reused-to-create-multiple-instances-without-s
    prompt: Can the builder be reused to create multiple instances without state from previous builds leaking into new ones?
    weight: 2
    signals:
    - builder reuse
    - no state leakage between builds
    - reset after build
analysis:
  testing:
    summary: Verify that step-by-step construction produces correct objects and that invalid build sequences are rejected.
    unit:
    - Build an object with all required steps and assert all fields are set correctly
    - 'Test optional steps: omit optional configuration and verify sensible defaults'
    - Assert that calling build() without required steps raises a clear error
    integration:
    - Use the builder in its real context (e.g., constructing request objects, configs) and verify end-to-end
    - 'Test director sequences if present: verify the director orchestrates builder steps in the correct order'
    failure_injection:
    - Supply conflicting configuration steps and verify the builder detects and rejects the inconsistency
