schema: augur-concept-meta/v2
concept: gitops
kind: pattern
summary: GitOps architectural pattern
taxonomy:
  type: pattern
  categories:
  - deployment
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - deployment.md
traits:
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-argocd-application-or-flux-gitrepository-kustomization
    prompt: Are there ArgoCD Application or Flux GitRepository/Kustomization CRDs pointing to a git repo as the source of truth?
    weight: 3
    signals:
    - Application CRD with syncPolicy
    - GitRepository kind
    - Kustomization kind
  - id: does-the-infrastructure-use-kustomize-overlays-with-base-and-per
    prompt: Does the infrastructure use Kustomize overlays with base and per-environment directories?
    weight: 2
    signals:
    - base/
    - overlays/staging/
    - overlays/production/
  - id: is-there-a-reconciliation-loop-that-detects-and-corrects-drift-b
    prompt: Is there a reconciliation loop that detects and corrects drift between desired state in git and actual cluster state?
    weight: 3
    signals:
    - syncPolicy automated
    - self-heal
    - prune enabled
  - id: do-infrastructure-changes-flow-through-a-pr-based-workflow-befor
    prompt: Do infrastructure changes flow through a PR-based workflow before being applied to the cluster?
    weight: 1
    signals:
    - PR review for manifests
    - git commit triggers sync
    - merge to main deploys
analysis:
  deployment:
    summary: All deployments flow through git commits — the repository is the single source of truth for desired cluster state.
    rollout_implications:
    - 'Every deployment is a git commit: changes to manifests are reviewed via PR, merged, and automatically reconciled by the GitOps controller'
    - Rollback is a git revert — no imperative kubectl commands against the cluster
    - Drift detection should alert when cluster state diverges from the git-declared state (manual changes bypassing git)
    - Multi-environment promotion follows a branch or directory-per-environment strategy — changes propagate through environments via PR merges
    pre_deploy_checklist:
    - Verify the GitOps controller (Flux, ArgoCD) is healthy and syncing in the target cluster
    - Confirm the target branch/directory contains the correct manifests and no unmerged conflicts
    - Check that image tags or digests in the manifests point to images that exist in the registry
    - Ensure secrets referenced by manifests are present in the cluster (managed via sealed-secrets or external-secrets, not committed to git)
