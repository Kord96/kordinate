schema: augur-concept-meta/v2
concept: primitive-obsession
kind: anti-pattern
summary: Primitive Obsession anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-domain-concepts-like-email-money-or-user-id-represented-as-b
    prompt: Are domain concepts like email, money, or user ID represented as bare strings, floats, or ints without dedicated types?
    weight: 3
    signals:
    - email as plain str
    - price as float
    - user_id as int with no wrapper
  - id: is-the-same-validation-logic-for-a-primitive-regex-range-check-d
    prompt: Is the same validation logic for a primitive (regex, range check) duplicated across multiple locations?
    weight: 3
    signals:
    - email regex in 3+ files
    - same format check repeated
    - validation scattered across callers
  - id: do-function-signatures-accept-multiple-same-typed-parameters-whe
    prompt: Do function signatures accept multiple same-typed parameters where mix-ups would cause silent bugs?
    weight: 2
    signals:
    - fn(str, str, str) for name, email, phone
    - user_id and order_id both int
    - no type distinction
  - id: are-money-calculations-performed-with-float-arithmetic-and-ad-ho
    prompt: Are money calculations performed with float arithmetic and ad-hoc rounding scattered through business logic?
    weight: 2
    signals:
    - float for currency
    - round(price * 1.1, 2)
    - no Decimal or integer-cents
