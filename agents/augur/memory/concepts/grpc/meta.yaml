schema: augur-concept-meta/v2
concept: grpc
kind: pattern
summary: gRPC/RPC architectural pattern
taxonomy:
  type: pattern
  categories:
  - api
  - integration
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-proto-files-with-service-and-rpc-declarations-defining
    prompt: Are there .proto files with service and rpc declarations defining the API contract?
    weight: 3
    signals:
    - .proto files
    - service definition
    - rpc method declaration
  - id: are-generated-stub-files-present-for-client-and-server-code-from
    prompt: Are generated stub files present for client and server code from proto definitions?
    weight: 2
    signals:
    - _pb2.py
    - _grpc.pb.go
    - generated stub
  - id: do-rpc-calls-set-deadlines-or-timeouts-to-prevent-unbounded-wait
    prompt: Do RPC calls set deadlines or timeouts to prevent unbounded waits?
    weight: 2
    signals:
    - context.WithTimeout
    - deadline
    - grpc.timeout
  - id: are-grpc-status-codes-used-for-error-handling-rather-than-generi
    prompt: Are gRPC status codes used for error handling rather than generic error wrapping?
    weight: 2
    signals:
    - status.Errorf
    - codes.NotFound
    - grpc status code
analysis:
  testing:
    summary: Test RPC handlers, proto compatibility, and streaming behavior with both unit and integration approaches.
    unit:
    - Test each RPC handler with a request message and assert the response message matches expected values and status code
    - 'Verify input validation: malformed or missing required fields should return INVALID_ARGUMENT, not INTERNAL'
    - 'Test error mapping: domain errors should translate to appropriate gRPC status codes (NOT_FOUND, PERMISSION_DENIED, etc.)'
    - Assert that server-side interceptors (auth, logging, metrics) fire in the correct order
    integration:
    - Stand up a real gRPC server in-process, call it via a client stub, and verify end-to-end behavior
    - 'Test streaming RPCs: server-stream, client-stream, and bidirectional — verify message ordering and stream completion signals'
    - 'Verify deadline propagation: set a tight deadline on the client and assert the server receives and respects it'
    additional_sections:
    - title: Compatibility Tests
      items:
      - Generate client stubs from the previous proto version and call the new server to verify backward compatibility
      - Test that unknown fields in requests are ignored (not rejected) to support forward compatibility
  monitoring:
    summary: Track RPC latency, error codes, and connection health to maintain visibility into service-to-service communication.
    metrics:
    - name: grpc_server_handled_total
      kind: counter
      description: RPCs completed by the server, by service, method, and gRPC status code
    - name: grpc_server_handling_seconds
      kind: histogram
      description: server-side RPC duration, by service and method
    - name: grpc_client_handled_total
      kind: counter
      description: RPCs completed from the client perspective, by service, method, and status code
    - name: grpc_active_streams
      kind: gauge
      description: number of currently open streaming RPCs
    alerts:
    - Elevated rate of non-OK status codes for a specific method (backend regression or upstream issue)
    - Server handling latency p99 exceeding SLO for critical methods
    - Client-side deadline exceeded errors rising (server too slow or deadline too tight)
  deployment:
    summary: Manage proto schema compatibility and connection draining to avoid broken RPCs during rollouts.
    rollout_implications:
    - gRPC uses persistent HTTP/2 connections — clients may not discover new server pods until connections are recycled or load balancer drains them
    - Deploy backward-compatible proto changes first (additive fields only); breaking changes require a versioned service or two-phase rollout
    - Drain in-flight RPCs before terminating pods — configure preStop hooks and terminationGracePeriodSeconds to allow streams to complete
    - If using client-side load balancing, clients must re-resolve DNS or endpoints after server pods roll
    pre_deploy_checklist:
    - 'Verify proto compatibility: new server can handle requests from old clients and vice versa'
    - Confirm health check and reflection services are registered on the new build
    - Check that TLS certificates (if using mTLS) are valid and match the new pod identity
