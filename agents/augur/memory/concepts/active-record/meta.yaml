schema: augur-concept-meta/v2
concept: active-record
kind: pattern
summary: Active Record architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
  - data
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-model-instances-have-methods-that-persist-themselves-to-the-d
    prompt: Do model instances have methods that persist themselves to the database (save, delete, update) without a separate repository?
    weight: 3
    signals:
    - self.save()
    - instance.delete()
    - model owns persistence
  - id: does-the-model-class-provide-class-level-query-methods-that-retu
    prompt: Does the model class provide class-level query methods that return instances directly from the database?
    weight: 3
    signals:
    - Model.find()
    - Model.where()
    - objects.filter()
    - class-level query API
  - id: are-database-columns-mapped-directly-to-model-attributes-with-no
    prompt: Are database columns mapped directly to model attributes with no separate data-access layer?
    weight: 2
    signals:
    - column-to-attribute mapping
    - schema reflected in model fields
    - ORM column declarations
  - id: does-the-model-define-validation-rules-associations-or-callbacks
    prompt: Does the model define validation rules, associations, or callbacks that execute during persistence operations?
    weight: 2
    signals:
    - validates presence
    - before_save hooks
    - has_many/belongs_to
    - model callbacks
analysis:
  testing:
    summary: Test persistence behavior and domain logic independently, verifying that model instances correctly map to database rows.
    unit:
    - Test validation rules and domain methods without hitting the database using stubs
    - Verify attribute assignment, dirty tracking, and type coercion on model instances
    - Assert callbacks (before_save, after_create) fire in the correct order
    integration:
    - 'Test CRUD lifecycle against a real database: create, read, update, destroy'
    - Verify associations (has_many, belongs_to) load and persist correctly
    - Test query scopes return expected result sets
    failure_injection:
    - Simulate database connection failure during save and verify rollback behavior
