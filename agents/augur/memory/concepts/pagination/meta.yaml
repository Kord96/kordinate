schema: augur-concept-meta/v2
concept: pagination
kind: pattern
summary: Pagination architectural pattern
taxonomy:
  type: pattern
  categories:
  - data
  - api
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-api-endpoints-accept-pagination-parameters-such-as-limit-offs
    prompt: Do API endpoints accept pagination parameters such as limit/offset, page/per_page, or cursor/after?
    weight: 3
    signals:
    - limit and offset query params
    - page and per_page parameters
    - after cursor parameter
  - id: are-results-ordered-by-a-stable-unique-key-to-prevent-duplicates
    prompt: Are results ordered by a stable unique key to prevent duplicates and missed records across pages?
    weight: 3
    signals:
    - ORDER BY id
    - stable sort key
    - unique ordering column
  - id: does-the-response-include-pagination-metadata-such-as-has-more-n
    prompt: Does the response include pagination metadata such as has_more, next_cursor, or total count?
    weight: 2
    signals:
    - has_next_page in response
    - next_cursor returned
    - totalCount in payload
  - id: are-default-and-maximum-page-sizes-enforced-to-prevent-clients-f
    prompt: Are default and maximum page sizes enforced to prevent clients from requesting unbounded result sets?
    weight: 2
    signals:
    - max page_size enforced
    - default limit applied
    - cap on per_page
analysis:
  testing:
    summary: Verify correct page boundaries, stable ordering, and completeness when iterating through all pages.
    unit:
    - Request the first page and verify the correct number of items and valid next-page cursor or link
    - Iterate through all pages and verify every record appears exactly once with no duplicates or gaps
    - Request a page size of zero or negative and verify the API returns a validation error, not an unbounded result set
    - 'Test boundary: dataset size is an exact multiple of page size (last page is full, no phantom next page)'
    integration:
    - Verify database queries use indexed columns for the sort key (check query plan for seq scans on deep pages)
    - Test offset-based pagination at high offsets and confirm performance degrades predictably (document the limit)
    - Verify pagination metadata (total_count, has_next_page) is accurate after concurrent inserts and deletes
    additional_sections:
    - title: Cursor/Keyset Tests
      items:
      - Insert a new record mid-iteration and verify cursor-based pagination does not skip or duplicate existing records
      - Delete a record mid-iteration and verify the next page still returns correct results
      - Submit an invalid or tampered cursor and verify the API rejects it with a clear error
