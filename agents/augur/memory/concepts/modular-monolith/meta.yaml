schema: augur-concept-meta/v2
concept: modular-monolith
kind: pattern
summary: Modular Monolith architectural pattern
taxonomy:
  type: pattern
  categories:
  - architectural
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-the-application-deployed-as-a-single-unit-with-explicit-inter
    prompt: Is the application deployed as a single unit with explicit internal module boundaries and restricted cross-module imports?
    weight: 3
    signals:
    - single Dockerfile with modules/ directory
    - import restrictions between modules
    - explicit public API per module
  - id: are-module-boundaries-enforced-by-linting-architecture-tests-or-
    prompt: Are module boundaries enforced by linting, architecture tests, or build constraints at build time?
    weight: 3
    signals:
    - ArchUnit tests
    - eslint import boundaries
    - build constraint preventing cross-module access
  - id: do-modules-communicate-through-defined-contracts-events-or-media
    prompt: Do modules communicate through defined contracts, events, or mediator rather than direct internal class imports?
    weight: 2
    signals:
    - inter-module events
    - mediator for cross-module calls
    - public interface per module
  - id: are-database-tables-logically-partitioned-by-module-even-though-
    prompt: Are database tables logically partitioned by module even though they share a physical database?
    weight: 2
    signals:
    - schema per module
    - table prefix per domain
    - no cross-module table joins
