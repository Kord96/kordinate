schema: augur-concept-meta/v2
concept: feature-flag
kind: pattern
summary: Feature Flag/Toggle architectural pattern
taxonomy:
  type: pattern
  categories:
  - deployment
  - design
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
traits:
  testable: true
  observable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-code-paths-gated-by-feature-flag-evaluation-calls-that-check
    prompt: Are code paths gated by feature flag evaluation calls that check external toggle state?
    weight: 3
    signals:
    - if feature_enabled() or is_feature_on() conditionals
    - SDK flag evaluation gating code branches
  - id: is-feature-flag-configuration-managed-externally-from-applicatio
    prompt: Is feature flag configuration managed externally from application code?
    weight: 2
    signals:
    - flag management service or config file with flag definitions
    - LaunchDarkly/Unleash SDK initialization with remote config
  - id: do-flags-have-a-default-value-for-when-the-flag-service-is-unava
    prompt: Do flags have a default value for when the flag service is unavailable?
    weight: 2
    signals:
    - fallback or default parameter in flag evaluation
    - default behavior defined for flag service outage
  - id: is-there-a-process-for-tracking-and-removing-stale-feature-flags
    prompt: Is there a process for tracking and removing stale feature flags?
    weight: 1
    signals:
    - flag removal dates or ownership tracking
    - cleanup tickets for concluded flags
  - id: are-both-flag-on-and-flag-off-code-paths-tested-independently
    prompt: Are both flag-on and flag-off code paths tested independently?
    weight: 1
    signals:
    - tests for both enabled and disabled flag states
    - parameterized tests covering flag variants
analysis:
  testing:
    summary: Test both flag paths to ensure neither the enabled nor disabled code path rots or contains latent bugs.
    unit:
    - Test the code path with the flag enabled and assert the new behavior activates correctly
    - Test the code path with the flag disabled and assert the old behavior is preserved
    - Verify that flag evaluation with no configuration returns the expected safe default
    - 'Test percentage rollouts: for a deterministic user ID, assert the flag resolves to the expected variant'
    integration:
    - Toggle a flag in the test environment and verify the running application responds to the change within the expected polling interval
    - Test flag-dependent features end-to-end with both flag states to prevent regression in either path
    - Verify that flag overrides in test environments do not leak to production configuration
    additional_sections:
    - title: Lifecycle Tests
      items:
      - After removing a flag from code, assert that references to it no longer exist — catch stale flag evaluations at build time
      - Test that the system behaves correctly when the flag service is unreachable (graceful fallback to defaults)
  monitoring:
    summary: Track flag evaluation, stale flags, and variant distribution to maintain control over feature rollouts.
    metrics:
    - name: feature_flag_evaluation_total
      kind: counter
      description: flag evaluations by flag name and returned variant
    - name: feature_flag_active_count
      kind: gauge
      description: number of flags currently in an active (non-fully-rolled-out) state
    - name: feature_flag_stale_days
      kind: gauge
      description: days since a flag was last modified, per flag
    - name: feature_flag_error_total
      kind: counter
      description: evaluation errors (missing flag, SDK timeout, default fallback used)
    alerts:
    - Flag evaluation falling back to default at a high rate (SDK cannot reach the flag service)
    - Stale flags older than the configured cleanup threshold (technical debt accumulating)
    - Unexpected variant distribution skew for a percentage rollout (targeting rule misconfiguration)
