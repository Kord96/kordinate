schema: augur-concept-meta/v2
concept: strategy
kind: pattern
summary: Strategy architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-there-an-interface-with-one-core-method-implemented-by-multip
    prompt: Is there an interface with one core method implemented by multiple interchangeable concrete classes?
    weight: 3
    signals:
    - interface with execute or apply method
    - multiple implementations of same protocol
    - Strategy or Policy suffix on class names
  - id: is-strategy-selection-externalized-via-configuration-factory-or-
    prompt: Is strategy selection externalized via configuration, factory, or runtime parameter?
    weight: 3
    signals:
    - config-driven strategy selection
    - factory returning strategy by name
    - strategy chosen via environment variable
  - id: does-the-context-delegate-to-the-strategy-without-knowledge-of-w
    prompt: Does the context delegate to the strategy without knowledge of which concrete implementation is active?
    weight: 2
    signals:
    - context calls strategy interface method
    - no type check on strategy in caller
    - strategy injected, not instantiated by context
  - id: can-new-strategies-be-added-without-modifying-existing-strategie
    prompt: Can new strategies be added without modifying existing strategies or the context class?
    weight: 1
    signals:
    - open for extension, closed for modification
    - new strategy class with no other changes
    - strategy registered without touching context
analysis:
  testing:
    summary: '# Testing - Test each concrete strategy independently against the shared interface contract - Verify that strategy selection logic (config, factory, runtime parameter) picks the correct implementation - Test that the context class delegates correctly without knowing which strategy is active - Assert that adding a new strategy does not require modifying existing strategies or the context - Test strategy interchangeability: swap implementations and verify the context still works correctly - Verify that strategies are stateless or that their state is scoped to a single execution - Test edge cases for each strategy where behavior diverges from the others'
