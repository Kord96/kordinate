schema: augur-concept-meta/v2
concept: social-graph
kind: domain-model
summary: Social graph pattern for user relationships and activity feeds
taxonomy:
  type: domain-model
  categories:
  - data
  - social
  legacy:
    type: pattern
    category: domain-model
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-follow-or-connection-models-representing-directional-o
    prompt: Are there follow or connection models representing directional or bidirectional user relationships?
    weight: 3
    signals:
    - Follow model with follower_id and following_id
    - Connection model with status
    - friend request and acceptance flow
  - id: is-there-a-feed-or-timeline-generated-from-the-social-graph-of-f
    prompt: Is there a feed or timeline generated from the social graph of followed users?
    weight: 3
    signals:
    - activity feed or timeline model
    - fan-out on write to follower feeds
    - feed aggregation query
  - id: does-the-system-support-activity-stream-aggregation-likes-commen
    prompt: Does the system support activity stream aggregation (likes, comments, shares grouped by actor)?
    weight: 2
    signals:
    - activity_stream or Activity model
    - aggregated activity grouping
    - stream-io or activity-stream library
  - id: is-there-a-fan-out-strategy-on-write-or-on-read-for-distributing
    prompt: Is there a fan-out strategy (on write or on read) for distributing content to followers?
    weight: 1
    signals:
    - fan-out worker or job
    - pre-computed feed per user
    - feed assembly strategy documented
