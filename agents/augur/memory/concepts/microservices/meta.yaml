schema: augur-concept-meta/v2
concept: microservices
kind: pattern
summary: Microservices architectural pattern
taxonomy:
  type: pattern
  categories:
  - architectural
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-multiple-independently-deployable-services-each-with-i
    prompt: Are there multiple independently deployable services, each with its own build artifact or Dockerfile?
    weight: 3
    signals:
    - separate Dockerfile per service
    - independent deployment pipelines
    - service-per-directory layout
  - id: does-each-service-own-its-data-store-without-sharing-database-ta
    prompt: Does each service own its data store without sharing database tables with other services?
    weight: 3
    signals:
    - per-service database
    - no shared tables across services
    - schema ownership boundary
  - id: do-services-communicate-via-explicit-contracts-such-as-protobuf-
    prompt: Do services communicate via explicit contracts such as protobuf, OpenAPI specs, or async messaging?
    weight: 2
    signals:
    - gRPC proto definitions
    - OpenAPI spec per service
    - AsyncAPI schema
  - id: can-individual-services-be-scaled-deployed-and-rolled-back-witho
    prompt: Can individual services be scaled, deployed, and rolled back without coordinating releases of others?
    weight: 2
    signals:
    - independent rollback
    - per-service scaling config
    - no deployment coupling
