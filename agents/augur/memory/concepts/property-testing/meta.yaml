schema: augur-concept-meta/v2
concept: property-testing
kind: pattern
summary: Property-Based Testing architectural pattern
taxonomy:
  type: pattern
  categories:
  - testing
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-tests-use-strategy-based-input-generation-with-given-decorato
    prompt: Do tests use strategy-based input generation with @given decorators or equivalent property testing frameworks?
    weight: 3
    signals:
    - '@given(st.integers())'
    - fc.property(fc.string())
    - '@Property with jqwik'
  - id: do-test-assertions-express-universal-invariants-idempotency-roun
    prompt: Do test assertions express universal invariants (idempotency, round-trip, commutativity) rather than checking specific input/output pairs?
    weight: 3
    signals:
    - assert encode(decode(x)) == x
    - assert f(f(x)) == f(x)
    - invariant over all inputs
  - id: are-custom-strategies-composed-to-model-actual-domain-constraint
    prompt: Are custom strategies composed to model actual domain constraints rather than generating arbitrary data?
    weight: 2
    signals:
    - st.builds(User)
    - custom strategy for valid email
    - domain-specific generator
  - id: does-failure-output-show-minimized-counterexamples-from-shrinkin
    prompt: Does failure output show minimized counterexamples from shrinking?
    weight: 2
    signals:
    - shrunk counterexample
    - Falsifying example
    - minimal failing input
analysis:
  testing:
    summary: Validate that property tests express genuine invariants, strategies model the domain, and shrinking produces actionable counterexamples.
    unit:
    - Verify properties assert meaningful invariants (round-trip, idempotency, commutativity) not just "does not crash"
    - Test custom strategies generate values within the expected domain constraints (valid ranges, formats, non-empty)
    - Run a property that is known to fail and verify shrinking produces a minimal counterexample
    - Confirm the seed is logged on failure so the exact counterexample is reproducible
    additional_sections:
    - title: Strategy Validation
      items:
      - Generate a sample of values from each custom strategy and verify the distribution covers edge cases (boundaries, empty, max-length)
      - Compose strategies for complex domain objects and verify generated instances satisfy class invariants
      - Verify strategies do not silently filter out too many values (high rejection rate signals an over-constrained strategy)
    - title: CI Integration
      items:
      - Run property tests with a reduced example count in fast CI, with periodic full runs (higher count) on schedule
      - Verify that a failing property test in CI includes the shrunk counterexample and seed in the output
      - Test stateful properties (sequences of operations) where applicable to catch order-dependent bugs
