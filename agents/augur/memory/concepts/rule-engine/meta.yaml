schema: augur-concept-meta/v2
concept: rule-engine
kind: domain-model
summary: Rule engine pattern for declarative business logic evaluation
taxonomy:
  type: domain-model
  categories:
  - design
  - logic
  legacy:
    type: pattern
    category: domain-model
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-business-rules-defined-declaratively-and-evaluated-by-a-dedi
    prompt: Are business rules defined declaratively and evaluated by a dedicated engine rather than hardcoded in application logic?
    weight: 3
    signals:
    - Rule/Condition/Action class hierarchy
    - json-rules-engine or Drools usage
    - externalized rule definitions
  - id: is-there-a-defined-evaluation-order-or-priority-system-for-resol
    prompt: Is there a defined evaluation order or priority system for resolving rule conflicts?
    weight: 3
    signals:
    - priority or salience on rules
    - conflict resolution strategy
    - ordered rule evaluation pipeline
  - id: can-rules-be-modified-or-deployed-independently-of-application-c
    prompt: Can rules be modified or deployed independently of application code?
    weight: 2
    signals:
    - rules stored in database or config
    - hot-reload of rule definitions
    - admin UI for rule management
  - id: are-rules-composed-from-reusable-conditions-and-actions-that-can
    prompt: Are rules composed from reusable conditions and actions that can be tested in isolation?
    weight: 1
    signals:
    - composable predicates
    - unit tests per rule
    - condition reuse across multiple rules
