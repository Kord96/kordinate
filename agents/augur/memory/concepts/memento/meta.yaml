schema: augur-concept-meta/v2
concept: memento
kind: pattern
summary: Memento architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-objects-expose-save-restore-state-methods-that-capture-and-re
    prompt: Do objects expose save/restore state methods that capture and reinstate internal state?
    weight: 3
    signals:
    - save_state() / restore_state()
    - createMemento() / setMemento()
    - state snapshot and restore
  - id: is-there-a-caretaker-managing-a-stack-or-list-of-opaque-state-sn
    prompt: Is there a caretaker managing a stack or list of opaque state snapshots for undo/redo?
    weight: 3
    signals:
    - undo_stack
    - redo_stack
    - caretaker holding memento history
  - id: are-state-snapshots-opaque-to-the-caretaker-preventing-it-from-r
    prompt: Are state snapshots opaque to the caretaker, preventing it from reading or modifying internal state?
    weight: 2
    signals:
    - caretaker stores but does not inspect
    - opaque memento object
    - encapsulated state copy
  - id: is-memory-usage-bounded-by-limiting-history-depth-or-using-incre
    prompt: Is memory usage bounded by limiting history depth or using incremental snapshots?
    weight: 2
    signals:
    - max history size
    - incremental snapshot
    - compressed state delta
analysis:
  testing:
    summary: Verify that state snapshots are correct, opaque to the caretaker, and restore the originator faithfully.
    unit:
    - Create a memento, modify the originator, restore from the memento, and assert the originator returns to the saved state
    - Verify the caretaker cannot access or modify the memento's internal state (opaqueness)
    - 'Test undo/redo stack: perform multiple operations, undo each, and assert state reversal at each step'
    additional_sections:
    - title: Edge Cases
      items:
      - Restore from a memento when the originator has not changed and verify no-op behavior
      - 'Test memory bounding: exceed the history limit and verify the oldest memento is discarded'
      - Create a memento with large state and verify incremental or compressed snapshots control memory usage
    - title: Compatibility Tests
      items:
      - Save a memento, upgrade the originator's schema, and verify restoration handles version mismatch gracefully
