id: tick-method
language: Python
rule:
  pattern: |
    def tick(self, $$$ARGS):
        $$$BODY
---
id: tick-step-method
language: Python
rule:
  pattern: |
    def step(self, $$$ARGS):
        $$$BODY
---
id: tick-rate-constant
language: Python
rule:
  pattern: 'TICKS_PER_SECOND = $VALUE'
---
id: tick-method-ts
language: TypeScript
rule:
  pattern: |
    tick($$$ARGS) {
        $$$BODY
    }
---
id: tick-fixed-update-ts
language: TypeScript
rule:
  pattern: |
    fixedUpdate($$$ARGS) {
        $$$BODY
    }
---
id: tick-rate-constant-ts
language: TypeScript
rule:
  pattern: 'TICKS_PER_SECOND = $VALUE'
