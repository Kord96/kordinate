schema: augur-concept-meta/v2
concept: layered
kind: structure-shape
summary: Layered structure — horizontal layers with dependency flowing downward
taxonomy:
  type: structure-shape
  categories:
  - architectural
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
diagnostic_questions:
  threshold: 3
  questions:
  - id: is-the-code-organized-in-horizontal-layers-presentation-api-serv
    prompt: Is the code organized in horizontal layers (presentation/api → service/domain → repository/data)?
    weight: 1
    signals:
    - controllers/
    - services/
    - repositories/
    - models/
  - id: do-upper-layers-import-lower-layers-but-never-the-reverse
    prompt: Do upper layers import lower layers but never the reverse?
    weight: 1
  - id: is-there-a-controller-service-repository-class-pattern
    prompt: Is there a Controller → Service → Repository class pattern?
    weight: 1
    signals:
    - '@Controller'
    - '@Service'
    - '@Repository'
    - Controller
    - Service
  - id: are-there-architecture-tests-or-lint-rules-enforcing-layer-bound
    prompt: Are there architecture tests or lint rules enforcing layer boundaries?
    weight: 1
    signals:
    - ArchUnit
    - import-linter
    - eslint-plugin-import
