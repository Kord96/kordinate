traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-a-single-technology-used-for-three-or-more-fundamentally-diff
    prompt: Is a single technology used for three or more fundamentally different purposes with workarounds for its limitations?
    weight: 3
    signals:
    - same DB for OLTP and analytics
    - Celery for scheduling and orchestration
    - workaround code for tool limitation
  - id: do-architectural-decisions-consistently-favor-one-tool-regardles
    prompt: Do architectural decisions consistently favor one tool regardless of whether better-fit alternatives exist?
    weight: 2
    signals:
    - always use X pattern
    - no ADR evaluating alternatives
    - default to same framework
  - id: does-workaround-code-to-compensate-for-tool-limitations-exceed-t
    prompt: Does workaround code to compensate for tool limitations exceed the actual business logic it supports?
    weight: 3
    signals:
    - shims around tool gaps
    - custom wrappers for unsupported features
    - extensive compatibility layer
  - id: does-one-shared-infrastructure-component-create-cross-workload-p
    prompt: Does one shared infrastructure component create cross-workload performance interference?
    weight: 1
    signals:
    - analytics queries slow transactions
    - single database bottleneck
    - shared queue contention
