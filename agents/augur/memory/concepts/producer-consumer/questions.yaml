questions:
  - q: "Is there a shared queue or buffer between producer threads/processes and consumer threads/processes?"
    weight: 3
    signals: ["queue.Queue shared between threads", "channel between goroutines", "BlockingQueue put/take"]
  - q: "Is the queue bounded to prevent unbounded memory growth when consumers fall behind?"
    weight: 3
    signals: ["bounded buffer capacity", "maxsize on Queue", "buffered channel with cap"]
  - q: "Is there a clean shutdown mechanism such as a poison pill or cancellation signal for termination?"
    weight: 2
    signals: ["sentinel value for shutdown", "poison pill in queue", "context.Done() check"]
  - q: "Do consumers handle errors without silently dropping items from the queue?"
    weight: 2
    signals: ["error handling in consumer loop", "failed items logged or retried", "no bare except in dequeue"]
threshold: 6
