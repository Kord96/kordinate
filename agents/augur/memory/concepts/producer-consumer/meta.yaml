schema: augur-concept-meta/v2
concept: producer-consumer
kind: pattern
summary: Producer-Consumer architectural pattern
taxonomy:
  type: pattern
  categories:
  - concurrency
  - messaging
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
traits:
  testable: true
  observable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-there-a-shared-queue-or-buffer-between-producer-threads-proce
    prompt: Is there a shared queue or buffer between producer threads/processes and consumer threads/processes?
    weight: 3
    signals:
    - queue.Queue shared between threads
    - channel between goroutines
    - BlockingQueue put/take
  - id: is-the-queue-bounded-to-prevent-unbounded-memory-growth-when-con
    prompt: Is the queue bounded to prevent unbounded memory growth when consumers fall behind?
    weight: 3
    signals:
    - bounded buffer capacity
    - maxsize on Queue
    - buffered channel with cap
  - id: is-there-a-clean-shutdown-mechanism-such-as-a-poison-pill-or-can
    prompt: Is there a clean shutdown mechanism such as a poison pill or cancellation signal for termination?
    weight: 2
    signals:
    - sentinel value for shutdown
    - poison pill in queue
    - context.Done() check
  - id: do-consumers-handle-errors-without-silently-dropping-items-from-
    prompt: Do consumers handle errors without silently dropping items from the queue?
    weight: 2
    signals:
    - error handling in consumer loop
    - failed items logged or retried
    - no bare except in dequeue
analysis:
  testing:
    summary: Verify correct handoff between producers and consumers, bounded buffer behavior, and clean shutdown.
    unit:
    - Produce N items, consume N items, and verify all items are received in FIFO order
    - Fill the queue to capacity and verify the producer blocks or receives a queue-full signal
    - Consume from an empty queue and verify the consumer blocks or times out without error
    - Send a poison pill or shutdown signal and verify the consumer exits its processing loop cleanly
    integration:
    - Produce items faster than the consumer can process and verify backpressure engages (queue bounded, producer slows)
    - Simulate a consumer crash and restart, then verify remaining items in the queue are eventually processed
    - 'Verify error handling: a consumer that fails on one item continues processing subsequent items'
    additional_sections:
    - title: Concurrency Tests
      items:
      - Run multiple producers and multiple consumers simultaneously and verify no item is processed twice or lost
      - Verify no deadlock when producers and consumers contend on a full or empty queue
      - Interrupt a consumer thread mid-processing and verify the item is not silently dropped
  monitoring:
    summary: Track queue depth, throughput imbalance, and consumer health to detect backlog buildup early.
    metrics:
    - name: queue_depth
      kind: gauge
      description: '- current number of items in the shared buffer'
    - name: queue_capacity_utilization
      kind: gauge
      description: '- queue depth as a percentage of max capacity'
    - name: producer_enqueue_rate
      kind: counter
      description: '- items enqueued per second'
    - name: consumer_dequeue_rate
      kind: counter
      description: '- items dequeued and processed per second'
    - name: consumer_processing_errors_total
      kind: counter
      description: '- items that failed processing in the consumer'
    alerts:
    - Queue depth exceeds high-water mark (consumers falling behind producers)
    - Queue at capacity for more than a sustained period (producers blocking or dropping)
    - Consumer dequeue rate drops to zero while queue depth is nonzero (consumer stalled or dead)
    - Consumer error rate exceeds threshold (poison messages or downstream failure)
