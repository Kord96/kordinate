schema: augur-concept-meta/v2
concept: registry-model
kind: domain-model
summary: Registry domain model — entities with lifecycle states, metadata, and lookups
taxonomy:
  type: domain-model
  categories:
  - data
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
diagnostic_questions:
  threshold: 3
  questions:
  - id: are-there-entity-classes-with-status-state-fields-and-defined-li
    prompt: Are there entity classes with status/state fields and defined lifecycle transitions?
    weight: 1
    signals:
    - status
    - state
    - lifecycle
    - PENDING
    - ACTIVE
  - id: is-the-primary-api-surface-crud-operations-on-entities
    prompt: Is the primary API surface CRUD operations on entities?
    weight: 1
    signals:
    - create
    - update
    - delete
    - find
    - list
  - id: do-entities-have-unique-identifiers-uuid-slug-email-for-lookups
    prompt: Do entities have unique identifiers (UUID, slug, email) for lookups?
    weight: 1
    signals:
    - uuid
    - slug
    - unique
    - lookup
  - id: is-there-soft-delete-status-archived-deleted-rather-than-hard-de
    prompt: Is there soft delete (status=archived/deleted) rather than hard delete?
    weight: 1
    signals:
    - soft_delete
    - archived
    - deleted_at
    - is_active
  - id: are-there-audit-fields-created-at-updated-at-created-by
    prompt: Are there audit fields (created_at, updated_at, created_by)?
    weight: 1
    signals:
    - created_at
    - updated_at
    - created_by
    - modified_at
