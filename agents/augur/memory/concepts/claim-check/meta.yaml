schema: augur-concept-meta/v2
concept: claim-check
kind: pattern
summary: Claim Check architectural pattern
taxonomy:
  type: pattern
  categories:
  - integration
  - messaging
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - deployment.md
traits:
  testable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 5
  questions:
  - id: are-large-payloads-stored-in-external-storage-s3-gcs-azure-blob-
    prompt: Are large payloads stored in external storage (S3, GCS, Azure Blob) with only a reference or URL passed in the message?
    weight: 3
    signals:
    - payload offload to object storage
    - reference in message body
    - storage URL instead of inline data
  - id: is-there-a-size-threshold-that-triggers-offloading-the-payload-t
    prompt: Is there a size threshold that triggers offloading the payload to external storage?
    weight: 2
    signals:
    - size-check before send
    - payload threshold for offload
    - conditional storage upload
  - id: does-the-consumer-fetch-the-full-payload-from-storage-using-the-
    prompt: Does the consumer fetch the full payload from storage using the reference received in the message?
    weight: 2
    signals:
    - download-on-consume
    - fetch by reference
    - resolve claim token to payload
  - id: is-there-a-retention-or-cleanup-policy-for-offloaded-payloads-to
    prompt: Is there a retention or cleanup policy for offloaded payloads to prevent orphaned blobs?
    weight: 1
    signals:
    - blob expiration policy
    - storage cleanup lifecycle
    - TTL on offloaded payloads
analysis:
  testing:
    summary: Verify the store-reference-retrieve lifecycle and that large payloads never travel through the message channel.
    unit:
    - Store a payload, assert a claim reference is returned, and retrieve the payload using the reference
    - Verify the message sent through the channel contains only the claim reference, not the payload
    - 'Test expiration: attempt to retrieve an expired claim and verify a clear error is returned'
    integration:
    - 'Send a message with a large payload end-to-end: verify the producer stores, the message carries the reference, and the consumer retrieves'
    - Test with the actual blob/object store to verify serialization and access control
    failure_injection:
    - Simulate store unavailability at retrieval time and verify the consumer surfaces the error rather than processing an incomplete message
  deployment:
    summary: Ensure the external store is available before deploying services that read or write claim references.
    rollout_implications:
    - The blob/object store must be accessible from both old and new service versions during rollout
    - Claim reference format changes require coordination between producer and consumer deployments
    - Rolling restart may leave unretrieved claims in the store — ensure retention policy covers rollout duration
    pre_deploy_checklist:
    - Verify external store connectivity and permissions from the target deployment environment
    - Confirm claim TTL and cleanup policies will not expire payloads during extended rollouts
