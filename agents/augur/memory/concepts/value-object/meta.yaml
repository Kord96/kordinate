schema: augur-concept-meta/v2
concept: value-object
kind: pattern
summary: Value Object architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-the-codebase-contain-immutable-classes-frozen-dataclasses-r
    prompt: Does the codebase contain immutable classes (frozen dataclasses, records, or classes with no setters) where equality is based on field values rather than identity?
    weight: 3
    signals:
    - frozen=True dataclass or record
    - __eq__ based on fields not identity
    - no setter methods
  - id: do-transformations-on-these-objects-return-new-instances-rather-
    prompt: Do transformations on these objects return new instances rather than mutating in place?
    weight: 3
    signals:
    - factory method returns new instance
    - transformation creates copy
    - no in-place mutation
  - id: is-validation-enforced-at-construction-time-so-that-invalid-stat
    prompt: Is validation enforced at construction time so that invalid states are impossible to represent?
    weight: 2
    signals:
    - constructor validation
    - __post_init__ validation
    - invalid state rejected at creation
  - id: are-these-objects-used-without-an-identity-field-no-id-or-primar
    prompt: Are these objects used without an identity field (no id or primary key participating in equality)?
    weight: 1
    signals:
    - no id field
    - equality without identity
    - compared by value not reference
analysis:
  testing:
    summary: '# Testing - Test equality: two value objects with the same fields must be equal regardless of identity - Test immutability: attempting to modify a field after construction must raise an error or be impossible - Verify hash consistency: equal objects must produce the same hash (safe for use as dict keys / set members) - Test validation at construction: invalid field combinations must be rejected at creation time - Test transformation methods: they must return new instances, not modify the original - Assert that value objects do not have an `id` field participating in equality checks - Test serialization and deserialization roundtrips (JSON, pickle) to verify equality is preserved - Test edge cases: boundary values, empty strings, zero amounts, negative values'
