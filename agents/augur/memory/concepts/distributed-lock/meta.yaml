schema: augur-concept-meta/v2
concept: distributed-lock
kind: pattern
summary: Distributed Lock architectural pattern
taxonomy:
  type: pattern
  categories:
  - concurrency
  - resilience
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-locks-acquired-with-a-ttl-that-automatically-expires-if-the-
    prompt: Are locks acquired with a TTL that automatically expires if the holder crashes?
    weight: 3
    signals:
    - SET NX EX or SETNX with expiry
    - lock TTL configuration in acquire call
  - id: does-the-lock-implementation-use-a-shared-external-store-redis-e
    prompt: Does the lock implementation use a shared external store (Redis, etcd, database)?
    weight: 3
    signals:
    - Redis SETNX or etcd mutex for locking
    - pg_advisory_lock or GET_LOCK for database locking
  - id: does-the-lock-holder-verify-ownership-before-releasing
    prompt: Does the lock holder verify ownership before releasing?
    weight: 2
    signals:
    - compare lock token before DEL
    - conditional release checking holder identity
  - id: is-there-bounded-timeout-or-retry-logic-on-lock-acquisition-atte
    prompt: Is there bounded timeout or retry logic on lock acquisition attempts?
    weight: 1
    signals:
    - try-lock with timeout parameter
    - retry loop with max attempts on acquire
analysis:
  testing:
    summary: Verify mutual exclusion guarantees hold under concurrent access and that lock expiry prevents indefinite blocking.
    unit:
    - Acquire a lock and assert a second attempt on the same resource fails or blocks
    - Verify lock release allows the next waiter to acquire immediately
    - 'Test TTL expiry: hold a lock without releasing it and confirm it becomes available after the TTL elapses'
    - Assert that fencing tokens increment monotonically and stale tokens are rejected by the protected resource
    integration:
    - Run two processes competing for the same lock and verify only one enters the critical section at a time
    - Simulate a lock holder crash (kill the process) and verify the lock is eventually released via TTL
    - 'Test lock renewal/heartbeat: a long-running holder that renews should not lose its lock to expiry'
    additional_sections:
    - title: Partition Tests
      items:
      - Simulate a network partition between the lock holder and the lock backend — verify the holder stops assuming it holds the lock after failing to renew
      - 'Test split-brain scenarios: both sides of a partition believe they hold the lock — fencing tokens should prevent conflicting writes'
  monitoring:
    summary: Track lock acquisition, contention, and expiry to detect coordination failures across nodes.
    metrics:
    - name: distributed_lock_held_duration_seconds
      kind: histogram
      description: how long locks are held before release
    - name: distributed_lock_acquisition_total
      kind: counter
      description: successful lock acquisitions, by resource
    - name: distributed_lock_contention_total
      kind: counter
      description: failed acquisition attempts due to an existing holder
    - name: distributed_lock_expired_total
      kind: counter
      description: locks that expired before explicit release (potential split-brain)
    alerts:
    - Lock held longer than the expected TTL (holder may be stuck or partitioned)
    - Rising lock expiry rate (nodes are losing locks before completing work)
    - High contention ratio on a single resource (bottleneck or hot key)
  deployment:
    summary: Coordinate rollouts carefully since lock semantics depend on consistent behavior across all nodes.
    rollout_implications:
    - Rolling updates mean old and new code may compete for the same locks — ensure lock key naming and TTL semantics are unchanged or backward-compatible
    - If changing lock TTL, deploy the increase first; a decreased TTL on new nodes while old nodes hold longer locks can cause premature expiry assumptions
    - Verify the lock backend (Redis, ZooKeeper, etcd) is healthy before starting the rollout — degraded coordination makes lock behavior unpredictable
    - Drain work from nodes before termination to avoid locks being held by dying processes
    pre_deploy_checklist:
    - Confirm lock backend quorum is intact and latency is within normal bounds
    - Verify fencing tokens or lock versioning is in place to prevent stale lock holders from making writes
