schema: augur-concept-meta/v2
concept: workflow-engine
kind: pattern
summary: Workflow Engine architectural pattern
taxonomy:
  type: pattern
  categories:
  - lifecycle
  - integration
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-workflows-defined-as-dags-with-explicit-step-dependencies-an
    prompt: Are workflows defined as DAGs with explicit step dependencies and decorators like @task, @dag, @workflow, or @step?
    weight: 3
    signals:
    - DAG definition with dependencies
    - '@task or @workflow decorators'
    - step dependency graph
  - id: does-the-system-track-workflow-execution-state-pending-running-c
    prompt: Does the system track workflow execution state (pending, running, completed, failed) with a workflow_id or run_id?
    weight: 3
    signals:
    - workflow state tracking
    - workflow_id or run_id
    - step status persistence
  - id: are-retry-policies-and-timeouts-defined-per-step-rather-than-onl
    prompt: Are retry policies and timeouts defined per step rather than only at the global workflow level?
    weight: 2
    signals:
    - per-step retry policy
    - step-level timeout config
    - individual step failure handling
  - id: is-workflow-state-persisted-so-that-execution-can-resume-from-th
    prompt: Is workflow state persisted so that execution can resume from the point of failure after a crash?
    weight: 2
    signals:
    - persistent workflow state
    - resume from failure point
    - crash recovery for workflows
analysis:
  testing:
    summary: '# Testing - Test that each step is idempotent: executing a step twice with the same input produces the same result - Verify DAG validation: circular dependencies are detected and rejected at definition time - Test workflow state persistence: crash and restart the engine, then verify workflows resume from the last checkpoint - Test per-step retry and timeout policies independently from the workflow orchestration - Verify that failed workflows can be retried from the point of failure, not only from the beginning - Test conditional branching: workflows with if/else or switch steps follow the correct path - Integration test the full workflow end-to-end with realistic step implementations - Test composed sub-workflows to verify they integrate correctly into parent workflows'
  monitoring:
    summary: Track workflow progression, per-step reliability, and engine health to detect stuck or failing workflows.
    metrics:
    - name: workflow_step_duration_seconds
      kind: histogram
      description: execution time per workflow step, identifies bottlenecks
    - name: workflow_step_results_total
      kind: counter
      description: step completions partitioned by step name and result (success, failure, timeout)
    - name: workflow_active_count
      kind: gauge
      description: number of workflows currently in progress
    - name: workflow_stuck_count
      kind: gauge
      description: workflows in a non-terminal state beyond the expected time threshold
    - name: workflow_step_retries_total
      kind: counter
      description: retry attempts per step, sustained retries indicate non-transient failure
    - name: workflow_completion_duration_seconds
      kind: histogram
      description: end-to-end workflow duration from start to terminal state
    alerts:
    - Workflow stuck in a non-terminal state beyond the expected time threshold
    - Step retry rate sustained (non-transient failure requiring investigation)
    - Active workflow count growing unexpectedly (runaway workflow creation)
    - Workflow state persistence store unhealthy (risks losing progress on all active workflows)
    - Invalid DAG definition or circular dependency detected at definition time
  deployment:
    summary: Deploy workflow definition changes with version isolation so that in-flight workflows complete on the definition they started with.
    rollout_implications:
    - In-flight workflows must complete on the old definition — deploying a new workflow version that immediately applies to running executions can corrupt state or skip steps
    - Rolling deployments create a window where old and new workflow engine pods coexist — both must be able to process the same workflow versions without conflicting on step execution or state transitions
    - Workflow state must survive pod restarts — if state is held in memory, a rolling restart loses all progress for in-flight workflows, requiring full re-execution
    - Deploying step retry or timeout policy changes affects currently-executing workflows — tightening a timeout may cause a step that was within limits on the old policy to fail immediately
    - Adding a new external dependency to a workflow step requires that the dependency is provisioned and reachable before the workflow engine deploy — otherwise the step fails on first execution
    pre_deploy_checklist:
    - Verify workflow state persistence survives deployment restarts (no in-memory-only state)
    - Confirm new workflow versions can coexist with old versions and that in-flight executions are not interrupted
    - Deploy step retry and timeout policy changes independently from step logic changes to isolate impact
    - Ensure new external dependencies referenced by workflow steps are provisioned and reachable
    - Monitor in-flight workflow completion rates during deployment to detect regressions early
