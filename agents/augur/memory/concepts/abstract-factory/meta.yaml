schema: augur-concept-meta/v2
concept: abstract-factory
kind: pattern
summary: Abstract Factory architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-there-an-interface-or-base-class-with-multiple-create-make-me
    prompt: Is there an interface or base class with multiple create/make methods that each return a different but related type?
    weight: 3
    signals:
    - factory interface with multiple create methods
    - product family creation
    - createButton/createMenu/createDialog
  - id: are-there-multiple-concrete-implementations-of-the-same-factory-
    prompt: Are there multiple concrete implementations of the same factory interface, each producing a different family of objects?
    weight: 3
    signals:
    - WindowsFactory/MacFactory
    - LightThemeFactory/DarkThemeFactory
    - parallel factory implementations
  - id: is-the-factory-selection-centralized-at-configuration-or-startup
    prompt: Is the factory selection centralized at configuration or startup time, with the chosen factory used throughout?
    weight: 2
    signals:
    - factory resolved from config
    - factory injected at bootstrap
    - runtime factory selection
  - id: do-callers-interact-with-the-created-objects-through-abstract-in
    prompt: Do callers interact with the created objects through abstract interfaces rather than concrete product types?
    weight: 2
    signals:
    - product abstraction
    - client uses interface not concrete class
    - polymorphic product usage
analysis:
  testing:
    summary: Verify that factories produce correct product families and that products from different families are not mixed.
    unit:
    - Assert each concrete factory returns the correct product types for its family
    - Verify products created by the same factory are compatible with each other
    - Test that swapping the factory implementation changes all created products consistently
    integration:
    - Wire factories via DI container and verify the correct family is resolved per environment/configuration
    - Test factory selection logic end-to-end with real configuration sources
    failure_injection:
    - Supply an unknown family identifier and verify a clear error rather than a null product
