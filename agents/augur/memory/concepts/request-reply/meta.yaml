schema: augur-concept-meta/v2
concept: request-reply
kind: pattern
summary: Request-Reply architectural pattern
taxonomy:
  type: pattern
  categories:
  - messaging
  - integration
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-correlation-ids-used-to-link-request-messages-to-their-respo
    prompt: Are correlation IDs used to link request messages to their responses?
    weight: 3
    signals:
    - correlation_id in message headers
    - unique ID linking request to reply
    - correlation ID propagated through intermediate services
  - id: is-a-reply-to-destination-specified-in-message-headers-for-routi
    prompt: Is a reply-to destination specified in message headers for routing responses?
    weight: 3
    signals:
    - reply_to queue in AMQP properties
    - temporary response queue per requester
    - reply subject in NATS request
  - id: are-timeouts-enforced-on-the-requester-side-when-waiting-for-rep
    prompt: Are timeouts enforced on the requester side when waiting for replies?
    weight: 2
    signals:
    - timeout on request call
    - deadline for reply with error handling
    - timeout fires on missing response
  - id: are-temporary-reply-queues-cleaned-up-after-the-response-is-rece
    prompt: Are temporary reply queues cleaned up after the response is received or timeout fires?
    weight: 1
    signals:
    - reply queue deleted after response
    - exclusive queue auto-deleted
    - cleanup on timeout expiry
analysis:
  testing:
    summary: Verify correlation ID matching, timeout behavior, and reply queue cleanup across the full request-reply lifecycle.
    unit:
    - Send a request and return a reply with the matching correlation ID; verify the requester receives the correct response
    - Send a request and do not reply within the timeout; verify the requester receives a timeout error
    - Send a request with a reply-to queue and verify the responder sends the reply to the specified queue
    - 'Verify correlation ID uniqueness: generate many IDs and assert no collisions'
    integration:
    - Run the full flow over a real broker (RabbitMQ, NATS) and verify end-to-end request-reply with correct correlation
    - Verify temporary reply queues are deleted after the response is received or timeout fires
    - 'Test idempotent responder: send the same request twice (same correlation ID) and verify the response is consistent'
    - Simulate responder restart mid-request and verify the requester times out cleanly (no hang)
    failure_injection:
    - Kill the responder after it receives the request but before it sends the reply; verify the requester times out
    - Introduce network latency exceeding the timeout and verify the requester handles the timeout without resource leak
  monitoring:
    summary: Track correlation success rates, reply latencies, and timeout frequency to detect broken request-reply flows.
    metrics:
    - name: request_reply_sent_total
      kind: counter
      description: '- request messages sent, by destination'
    - name: request_reply_received_total
      kind: counter
      description: '- reply messages received with matching correlation ID'
    - name: request_reply_timeout_total
      kind: counter
      description: '- requests that timed out waiting for a reply'
    - name: request_reply_latency_seconds
      kind: histogram
      description: '- round-trip time from request send to reply receipt'
    - name: reply_queue_depth
      kind: gauge
      description: '- number of pending replies on temporary reply queues'
    alerts:
    - Timeout rate exceeds threshold (responder down, network issue, or reply queue misconfigured)
    - Reply latency exceeds SLA for a sustained period (responder degraded or overloaded)
    - Orphaned reply queues accumulating (queues not cleaned up after timeout or response)
    - Correlation ID mismatch rate nonzero (reply routing broken, possible message interleaving)
  deployment:
    summary: Coordinate requester and responder lifecycle to avoid lost replies during rollouts.
    rollout_implications:
    - Rolling restart of the requester may orphan reply queues on the broker -- ensure temporary queues have auto-delete or TTL
    - 'Deploying the responder first is safer: new responder can handle both old and new request formats'
    - If requester and responder are co-deployed, stagger restarts to avoid both sides being unavailable simultaneously
    - Timeout values must account for deployment-induced latency (briefly increased round-trip during pod replacement)
    pre_deploy_checklist:
    - Verify the broker is healthy and reply queues are being created and cleaned up correctly
    - Confirm correlation ID generation produces unique values (no collisions across requester instances)
    - Check that timeout values on the requester side are appropriate for the responder's expected processing time
    - Ensure temporary reply queues have TTL or auto-delete configured to prevent resource leaks on the broker
