schema: augur-concept-meta/v2
concept: template-method
kind: pattern
summary: Template Method architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-the-codebase-contain-abstract-base-classes-with-a-concrete-
    prompt: Does the codebase contain abstract base classes with a concrete method that calls multiple abstract or hook methods in a fixed sequence?
    weight: 3
    signals:
    - abstract class with final/concrete orchestrating method
    - hook methods called in sequence
    - subclasses override steps not algorithm
  - id: do-subclasses-override-specific-step-methods-while-the-overall-a
    prompt: Do subclasses override specific step methods while the overall algorithm structure remains in the base class?
    weight: 3
    signals:
    - _do_step or _on_before or _process overrides
    - base class algorithm unchanged
    - partial override of hooks
  - id: are-hook-methods-named-with-underscore-prefixed-conventions-like
    prompt: Are hook methods named with underscore-prefixed conventions like _validate, _process, _on_before, _on_after?
    weight: 1
    signals:
    - _hook naming convention
    - _do_step or _on_after methods
    - protected method naming
  - id: is-the-template-method-itself-protected-from-being-overridden-fi
    prompt: Is the template method itself protected from being overridden (final, non-virtual, or documented as do-not-override)?
    weight: 2
    signals:
    - final method annotation
    - non-overridable orchestrating method
    - algorithm skeleton is fixed
analysis:
  testing:
    summary: '# Testing - Test each subclass by invoking the template method and verifying that overridden hooks produce the expected outcome - Verify that the template method itself is not overridable (final/non-virtual) in subclasses - Test hook defaults: subclasses that do not override optional hooks should still produce correct behavior - Test the execution order of hooks by recording call sequences in test subclasses - Assert that subclasses override only the intended extension points, not other methods of the base class - Test with a minimal stub subclass that only implements required abstract methods to verify defaults - Verify that the number of hooks is manageable (3-5) and the base class documents required vs optional'
