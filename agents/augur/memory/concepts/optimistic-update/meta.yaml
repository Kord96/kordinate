schema: augur-concept-meta/v2
concept: optimistic-update
kind: pattern
summary: Optimistic Update — immediately reflecting expected state changes in the UI before server confirmation
taxonomy:
  type: pattern
  categories:
  - frontend
  - data
  - resilience
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-the-ui-immediately-reflect-a-state-change-before-the-server
    prompt: Does the UI immediately reflect a state change before the server confirms the mutation?
    weight: 3
    signals:
    - cache update in onMutate
    - optimisticResponse in mutation
    - store updated before API call
  - id: is-previous-state-captured-before-the-optimistic-update-so-it-ca
    prompt: Is previous state captured before the optimistic update so it can be rolled back on failure?
    weight: 3
    signals:
    - previousData saved in onMutate
    - snapshot before update
    - rollback state captured
  - id: does-the-error-handler-revert-the-ui-to-the-captured-previous-st
    prompt: Does the error handler revert the UI to the captured previous state and notify the user?
    weight: 2
    signals:
    - onError rolls back cache
    - revert to previousData
    - toast on rollback
  - id: does-the-success-handler-reconcile-the-optimistic-state-with-the
    prompt: Does the success handler reconcile the optimistic state with the actual server response?
    weight: 2
    signals:
    - onSettled invalidates cache
    - server response replaces optimistic
    - reconcile on success
