schema: augur-concept-meta/v2
concept: audit-logging
kind: pattern
summary: Audit Logging architectural pattern
taxonomy:
  type: pattern
  categories:
  - security
  - observability
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
traits:
  testable: true
  observable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-there-a-dedicated-store-table-collection-or-log-that-records-
    prompt: Is there a dedicated store (table, collection, or log) that records who performed what action on which target and when?
    weight: 3
    signals:
    - audit table with actor/action/target/timestamp
    - who-did-what-when records
    - structured audit trail
  - id: are-audit-records-append-only-with-no-mechanism-to-update-or-del
    prompt: Are audit records append-only with no mechanism to update or delete existing entries?
    weight: 3
    signals:
    - append-only writes
    - no UPDATE/DELETE on audit table
    - immutable audit log
  - id: is-audit-capture-applied-systematically-via-middleware-decorator
    prompt: Is audit capture applied systematically via middleware, decorators, or interceptors rather than ad-hoc log statements?
    weight: 2
    signals:
    - audit middleware
    - '@audited decorator'
    - interceptor-based capture
  - id: are-audit-writes-decoupled-from-the-primary-operation-so-they-do
    prompt: Are audit writes decoupled from the primary operation so they do not add latency to the user-facing request?
    weight: 2
    signals:
    - async audit write
    - fire-and-forget with delivery guarantee
    - audit does not block request
analysis:
  testing:
    summary: Verify every auditable action produces a complete, tamper-evident log entry with correct metadata.
    unit:
    - Assert each auditable operation emits a log entry with actor, action, resource, timestamp, and outcome
    - Verify sensitive fields are masked or excluded from audit entries
    - Test that audit entries are immutable — no update or delete path exists
    integration:
    - Perform CRUD operations and query the audit log to verify entries are persisted and queryable
    - Test audit log search and filtering by actor, time range, and resource type
    - Verify audit entries survive application restart (durable storage)
    failure_injection:
    - Simulate audit store unavailability and verify the application fails closed (rejects the operation, not silently drops the log)
  monitoring:
    summary: Track audit log ingestion rates, gaps, and storage health.
    metrics:
    - name: audit_events_total
      kind: counter
      description: events written by action type and outcome
    - name: audit_write_latency_seconds
      kind: histogram
      description: time to persist each audit entry
    - name: audit_lag_seconds
      kind: gauge
      description: delay between event occurrence and log persistence
    - name: audit_storage_bytes
      kind: gauge
      description: audit log storage consumption
    alerts:
    - Audit write failures (compliance risk if events are lost)
    - Ingestion lag exceeding acceptable window
    - Gap in expected periodic events (missing heartbeat entries)
