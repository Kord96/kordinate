schema: augur-concept-meta/v2
concept: key-value-model
kind: domain-model
summary: Key-value domain model — simple key→value lookups with optional expiry
taxonomy:
  type: domain-model
  categories:
  - data
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
diagnostic_questions:
  threshold: 3
  questions:
  - id: is-redis-memcached-dynamodb-etcd-or-consul-used-as-a-primary-or-
    prompt: Is Redis, Memcached, DynamoDB, etcd, or Consul used as a primary or major data store?
    weight: 1
    signals:
    - redis
    - memcached
    - dynamodb
    - etcd
    - consul
  - id: is-data-accessed-primarily-by-key-lookup-no-complex-queries-or-j
    prompt: Is data accessed primarily by key lookup (no complex queries or joins)?
    weight: 1
  - id: are-there-ttl-expiry-settings-on-stored-entries
    prompt: Are there TTL/expiry settings on stored entries?
    weight: 1
    signals:
    - TTL
    - expire
    - SETEX
    - ttl
  - id: are-there-atomic-operations-increment-compare-and-swap-setnx
    prompt: Are there atomic operations (increment, compare-and-swap, SETNX)?
    weight: 1
    signals:
    - INCR
    - SETNX
    - compare_and_swap
    - atomic
