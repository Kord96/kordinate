schema: augur-concept-meta/v2
concept: feature-envy
kind: anti-pattern
summary: Feature Envy anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-methods-access-more-fields-from-another-class-than-from-their
    prompt: Do methods access more fields from another class than from their own class?
    weight: 3
    signals:
    - method reads 4+ fields of another object, 0-1 of its own
    - heavy use of other_obj.field1, other_obj.field2 throughout
  - id: are-there-getter-chains-traversing-object-graphs-to-extract-data
    prompt: Are there getter chains traversing object graphs to extract data for local computation?
    weight: 3
    signals:
    - order.customer.address.city style chains
    - deep property access across 3+ object boundaries
  - id: do-static-methods-or-utility-functions-operate-entirely-on-anoth
    prompt: Do static methods or utility functions operate entirely on another class's data?
    weight: 2
    signals:
    - static method taking an object and using only its attributes
    - free function that should be a method on the data class
  - id: are-there-long-parameter-lists-where-all-parameters-come-from-a-
    prompt: Are there long parameter lists where all parameters come from a single other object?
    weight: 1
    signals:
    - function(obj.a, obj.b, obj.c, obj.d) unpacking one object
    - destructuring another object into method parameters
analysis:
  testing:
    summary: Use tests to detect and prevent feature envy by verifying methods operate primarily on their own class's data.
    unit:
    - Test that methods on a class use its own fields rather than reaching into collaborators for data
    - After refactoring to move envious logic to the correct class, verify behavior is preserved with the same test inputs
    - Assert that the refactored method requires fewer parameters from external objects (reduced coupling)
    - Test the data-owning class's new method independently to confirm it encapsulates the logic correctly
    additional_sections:
    - title: Code Review Heuristics
      items:
      - If a test requires mocking more than two methods on a single collaborator, the method under test likely has feature envy
      - Tests that break when an unrelated class's internal structure changes are a signal of misplaced behavior
      - After extracting the envious logic, the original class's tests should simplify — fewer mocks, fewer setup steps
    - title: Refactoring Verification
      items:
      - Run the full test suite after moving methods to ensure no behavioral regression
      - Verify that the moved method's new home has higher cohesion — it should access mostly local state
