diagnostic_questions:
  threshold: 6
  questions:
  - id: are-blocking-i-o-calls-like-requests-get-or-time-sleep-used-insi
    prompt: Are blocking I/O calls like requests.get() or time.sleep() used inside async def functions?
    weight: 3
    signals:
    - requests.get() inside async def
    - time.sleep() in coroutine
    - urllib.request.urlopen() in async handler
  - id: are-synchronous-database-drivers-or-file-i-o-used-in-async-handl
    prompt: Are synchronous database drivers or file I/O used in async handlers without run_in_executor?
    weight: 3
    signals:
    - psycopg2 in async handler instead of asyncpg
    - open() without aiofiles in async code
    - synchronous ORM in async view
  - id: does-the-async-server-handle-requests-sequentially-despite-using
    prompt: Does the async server handle requests sequentially despite using an async framework?
    weight: 2
    signals:
    - throughput unchanged with concurrent requests
    - event loop blocked on I/O wait
    - sequential request handling in async app
  - id: are-there-asyncio-warnings-about-long-running-synchronous-operat
    prompt: Are there asyncio warnings about long-running synchronous operations blocking the event loop?
    weight: 1
    signals:
    - asyncio slow callback warning
    - Executing took X seconds log message
    - event loop lag detected
analysis:
  testing:
    summary: '# Testing - Lint for blocking calls inside `async def` functions: `requests.*`, `time.sleep()`, `open()`, `subprocess.run()` - Test that async handlers do not block the event loop by running concurrent requests and measuring throughput - Verify that async HTTP clients (`httpx.AsyncClient`, `aiohttp`) are used instead of synchronous `requests` - Test event loop warnings: enable asyncio debug mode and assert no "took X seconds" slow callback warnings - Assert that all database drivers in async code are async-native (`asyncpg`, `motor`, not `psycopg2`) - Test that unavoidable blocking calls are wrapped in `asyncio.to_thread()` or `run_in_executor()` - Benchmark async endpoint throughput under concurrent load to verify it scales as expected'
