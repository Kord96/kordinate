schema: augur-concept-meta/v2
concept: subscription
kind: domain-model
summary: Subscription and recurring billing pattern for SaaS monetization
taxonomy:
  type: domain-model
  categories:
  - data
  - financial
  legacy:
    type: pattern
    category: domain-model
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-subscription-and-plan-models-with-lifecycle-states-tri
    prompt: Are there subscription and plan models with lifecycle states (trial, active, past_due, canceled)?
    weight: 3
    signals:
    - Subscription model with status field
    - Plan model with pricing tiers
    - subscription state transitions
  - id: is-there-integration-with-a-payment-provider-for-recurring-charg
    prompt: Is there integration with a payment provider for recurring charge processing?
    weight: 3
    signals:
    - Stripe or Paddle SDK usage
    - payment intent creation
    - recurring payment scheduling
  - id: does-the-system-handle-billing-events-via-webhooks-with-idempote
    prompt: Does the system handle billing events via webhooks with idempotent processing?
    weight: 2
    signals:
    - webhook endpoint for payment events
    - idempotent event handling
    - webhook signature verification
  - id: is-usage-tracking-or-metered-billing-implemented-for-consumption
    prompt: Is usage tracking or metered billing implemented for consumption-based pricing?
    weight: 1
    signals:
    - usage_meter or metered_billing
    - consumption aggregation per billing period
    - overage charge calculation
