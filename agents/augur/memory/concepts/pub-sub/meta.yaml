schema: augur-concept-meta/v2
concept: pub-sub
kind: pattern
summary: Publish-Subscribe architectural pattern
taxonomy:
  type: pattern
  categories:
  - messaging
  - integration
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-messages-published-to-named-topics-where-all-subscribers-rec
    prompt: Are messages published to named topics where all subscribers receive every message (fan-out delivery)?
    weight: 3
    signals:
    - publish(topic, message)
    - fan-out to all subscribers
    - topic-based messaging
  - id: are-producers-and-consumers-decoupled-so-neither-knows-the-ident
    prompt: Are producers and consumers decoupled so neither knows the identity of the other?
    weight: 3
    signals:
    - publisher unaware of subscribers
    - subscribe by topic not by sender
    - decoupled via broker
  - id: are-subscribers-idempotent-so-duplicate-delivery-is-handled-grac
    prompt: Are subscribers idempotent so duplicate delivery is handled gracefully?
    weight: 2
    signals:
    - idempotent subscriber
    - deduplication on receive
    - at-least-once safe
  - id: is-there-monitoring-for-subscriber-lag-or-dropped-messages
    prompt: Is there monitoring for subscriber lag or dropped messages?
    weight: 2
    signals:
    - consumer lag metric
    - subscription health check
    - dropped message alert
analysis:
  testing:
    summary: Verify fan-out delivery, subscriber isolation, and correct behavior under failure and duplicate delivery.
    unit:
    - Publish a message and verify all registered subscribers receive it with the correct payload
    - Subscribe and unsubscribe a handler, then publish and verify the unsubscribed handler is not called
    - Verify subscriber failure does not block delivery to other subscribers on the same topic
    - 'Test message filtering: subscribers with topic filters receive only matching messages'
    integration:
    - Publish through the real broker (Kafka, Redis, NATS) and verify end-to-end delivery to a test subscriber
    - 'Test at-least-once delivery: acknowledge a message, then verify it is not redelivered; nack a message and verify redelivery'
    - Verify ordering guarantees per partition or subject (where the broker guarantees ordering)
    - Publish during a subscriber restart and verify no messages are lost (retained or replayed from offset)
    additional_sections:
    - title: Idempotency Tests
      items:
      - Deliver the same message twice and verify the subscriber produces the correct outcome (no duplicate side effects)
      - Simulate broker redelivery after ack timeout and verify the subscriber handles it gracefully
  monitoring:
    summary: Track message delivery health, subscriber lag, and topic throughput to detect delivery failures and slow consumers.
    metrics:
    - name: pubsub_messages_published_total
      kind: counter
      description: '- messages published per topic'
    - name: pubsub_messages_delivered_total
      kind: counter
      description: '- messages delivered per subscriber per topic'
    - name: pubsub_subscriber_lag
      kind: gauge
      description: '- number of undelivered messages per subscriber (backlog depth)'
    - name: pubsub_delivery_latency_seconds
      kind: histogram
      description: '- time from publish to subscriber acknowledgment'
    - name: pubsub_dead_letter_total
      kind: counter
      description: '- messages moved to dead-letter after max delivery attempts'
    alerts:
    - Subscriber lag exceeds threshold (consumer falling behind or stalled)
    - Delivery latency exceeds SLA for a sustained period
    - Dead-letter queue depth growing (messages consistently failing processing)
    - Zero publish rate on a topic that should have steady traffic (publisher down or misconfigured)
  deployment:
    summary: Coordinate topic configuration and subscriber compatibility during rollouts.
    rollout_implications:
    - New message schemas must be backward-compatible -- existing subscribers must handle both old and new formats during rolling deployment
    - Adding a new subscriber requires the topic and subscription to exist before the subscriber pod starts consuming
    - Removing a subscriber requires draining its pending messages first to avoid silent message loss
    - Scaling subscribers horizontally is safe if the broker supports consumer groups; otherwise duplicate delivery occurs
    pre_deploy_checklist:
    - Verify topic exists and has the correct partitioning and retention settings for the target environment
    - Confirm all subscribers can deserialize the new message format (deploy consumers before producers when adding fields)
    - Check subscriber acknowledgment timeout is appropriate for the new processing logic (longer processing needs longer ack deadline)
    - Ensure dead-letter topic is configured for all subscriptions to catch processing failures
