questions:
  - q: "Are messages published to named topics where all subscribers receive every message (fan-out delivery)?"
    weight: 3
    signals: ["publish(topic, message)", "fan-out to all subscribers", "topic-based messaging"]
  - q: "Are producers and consumers decoupled so neither knows the identity of the other?"
    weight: 3
    signals: ["publisher unaware of subscribers", "subscribe by topic not by sender", "decoupled via broker"]
  - q: "Are subscribers idempotent so duplicate delivery is handled gracefully?"
    weight: 2
    signals: ["idempotent subscriber", "deduplication on receive", "at-least-once safe"]
  - q: "Is there monitoring for subscriber lag or dropped messages?"
    weight: 2
    signals: ["consumer lag metric", "subscription health check", "dropped message alert"]
threshold: 6
