schema: augur-concept-meta/v2
concept: read-through
kind: pattern
summary: Read-Through Cache architectural pattern
taxonomy:
  type: pattern
  categories:
  - data
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
traits:
  testable: true
  observable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-the-cache-automatically-load-from-the-backing-source-on-a-m
    prompt: Does the cache automatically load from the backing source on a miss without caller intervention?
    weight: 3
    signals:
    - CacheLoader or LoadingCache with loader function
    - '@Cacheable with implicit load-on-miss'
    - cache configured as sole data access layer
  - id: do-callers-interact-only-with-the-cache-never-directly-with-the-
    prompt: Do callers interact only with the cache, never directly with the backing store?
    weight: 3
    signals:
    - caller reads only from cache
    - backing store hidden behind cache interface
    - no direct database query alongside cache check
  - id: does-the-loader-handle-source-failures-gracefully-without-cachin
    prompt: Does the loader handle source failures gracefully without caching error responses?
    weight: 2
    signals:
    - error not cached on loader failure
    - fallback on source unavailability
    - negative caching handled explicitly
  - id: is-there-a-cache-warming-strategy-for-cold-starts
    prompt: Is there a cache warming strategy for cold starts?
    weight: 1
    signals:
    - pre-population on startup
    - bulk loading for initial cache fill
    - warm-up job before serving traffic
analysis:
  testing:
    summary: Verify transparent load-on-miss behavior, correct TTL eviction, and graceful handling of loader failures.
    unit:
    - Request a key not in cache, verify the loader is called, and the value is returned and cached
    - Request the same key again and verify the loader is not called (cache hit)
    - Wait for TTL expiry, request the key, and verify the loader is called again (stale eviction)
    - Verify the loader is called with the correct key and parameters
    additional_sections:
    - title: Failure Handling Tests
      items:
      - Simulate a loader failure and verify the cache does not cache the error (no negative caching of exceptions)
      - Verify a failed load for one key does not affect cached values for other keys
      - 'Test bulk loading: request multiple keys in a batch and verify the loader is called once for all missing keys'
    - title: Concurrency Tests
      items:
      - Request the same uncached key from multiple threads simultaneously and verify the loader is called only once (stampede protection)
      - Verify concurrent reads of cached keys do not block each other
      - 'Test cache warming on startup: verify pre-populated keys are served from cache without loader calls'
  monitoring:
    summary: Track cache hit rates, loader performance, and miss storms to ensure the cache is providing value.
    metrics:
    - name: cache_hit_rate
      kind: gauge
      description: '- ratio of cache hits to total lookups (target: >90% for hot data)'
    - name: cache_miss_total
      kind: counter
      description: '- cache misses triggering a loader call, by cache name'
    - name: cache_load_latency_seconds
      kind: histogram
      description: '- time to load a value from the backing source on miss'
    - name: cache_evictions_total
      kind: counter
      description: '- entries evicted by TTL or capacity pressure'
    - name: cache_error_total
      kind: counter
      description: '- loader failures (backing source errors, timeouts)'
    alerts:
    - Cache hit rate drops below baseline (data pattern change, cache sized too small, or TTL too short)
    - Cache load latency exceeds threshold (backing source degraded, impacting miss penalty)
    - Spike in cache misses across many keys simultaneously (thundering herd on cold start or mass eviction)
    - Loader error rate exceeds threshold (backing source unavailable, risk of serving stale data or errors)
