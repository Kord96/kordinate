schema: augur-concept-meta/v2
concept: result-type
kind: pattern
summary: Result/Either Type architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
  - error-handling
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-result-either-or-similar-types-used-to-encode-success-and-fa
    prompt: Are Result, Either, or similar types used to encode success and failure paths in return values?
    weight: 3
    signals:
    - Result<T, E> with Ok and Err
    - Either<L, R> with Left and Right
    - custom Result class with is_ok and is_err
  - id: are-errors-handled-via-match-or-fold-on-result-types-rather-than
    prompt: Are errors handled via match or fold on result types rather than try-catch for expected failures?
    weight: 3
    signals:
    - match on Ok/Err branches
    - fold over success and failure
    - no exceptions thrown for domain errors
  - id: are-result-types-composed-via-map-flatmap-or-and-then-chains-ins
    prompt: Are result types composed via map, flatMap, or and_then chains instead of nested conditionals?
    weight: 2
    signals:
    - chained .map().flatMap() on results
    - railway-oriented .and_then() pipeline
    - composable error transformation
  - id: are-low-level-errors-mapped-to-domain-appropriate-errors-at-boun
    prompt: Are low-level errors mapped to domain-appropriate errors at boundary crossings?
    weight: 1
    signals:
    - error mapping at module boundary
    - transform IO error to domain error
    - typed error variants per layer
analysis:
  testing:
    summary: Verify both success and error paths are exercised, error variants are typed, and result composition chains work correctly.
    unit:
    - Test the happy path returns `Ok`/`Right` with the expected value
    - Test each known failure mode returns the correct typed error variant in `Err`/`Left`
    - Verify `match`/`fold` at the call site handles all error variants exhaustively (no unhandled cases)
    - 'Test `.map()` and `.flatMap()` / `.and_then()` chains: verify the chain short-circuits on the first error'
    additional_sections:
    - title: Composition Tests
      items:
      - Chain multiple result-returning functions and verify the final result propagates the first error encountered
      - 'Test error mapping at module boundaries: low-level errors are transformed into domain-appropriate errors'
      - Verify `.unwrap()` or `.get()` is not used in production code paths (only in tests where failure means test failure)
    - title: Design Verification
      items:
      - Verify domain errors are represented as typed variants, not generic strings or unstructured exceptions
      - Confirm exceptions are reserved for truly unexpected errors (panics, programming bugs), not domain-level failures
      - Test that result types are propagated through the call chain without premature unwrapping at intermediate layers
