schema: augur-concept-meta/v2
concept: cache-aside
kind: pattern
summary: Cache-Aside architectural pattern
taxonomy:
  type: pattern
  categories:
  - data
  - resilience
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
traits:
  testable: true
  observable: true
  graphable: true
diagnostic_questions:
  threshold: 5
  questions:
  - id: does-a-read-path-check-a-cache-first-then-fall-back-to-a-primary
    prompt: Does a read path check a cache first, then fall back to a primary data source on miss, and populate the cache before returning?
    weight: 3
    signals:
    - cache get before db query
    - set cache after fetch
    - check-then-load-then-store flow
  - id: are-ttl-or-expiration-values-configured-on-cached-entries
    prompt: Are TTL or expiration values configured on cached entries?
    weight: 2
    signals:
    - TTL configuration
    - cache expiry setting
    - time-to-live parameter
  - id: is-there-explicit-cache-invalidation-on-write-paths-that-modify-
    prompt: Is there explicit cache invalidation on write paths that modify the underlying data?
    weight: 2
    signals:
    - cache delete on update
    - invalidate after write
    - cache eviction on mutation
  - id: are-cache-keys-constructed-with-namespacing-or-versioning-to-pre
    prompt: Are cache keys constructed with namespacing or versioning to prevent collisions?
    weight: 1
    signals:
    - namespaced cache key
    - key template function
    - versioned cache prefix
analysis:
  testing:
    summary: 'Verify the read-through and invalidation lifecycle: miss populates, hit returns cached, write invalidates.'
    unit:
    - First read for a key misses cache, fetches from origin, and populates cache
    - Second read for the same key returns cached data without hitting origin
    - After a write/update, verify the cache entry is invalidated and the next read fetches fresh data
    integration:
    - Wire against real cache (Redis/Memcached) and origin database, verify full read-write-invalidate cycle
    - 'Test TTL expiration: verify stale entries are evicted and subsequent reads re-fetch from origin'
    failure_injection:
    - Simulate cache unavailability and verify the application falls through to the origin database gracefully
  monitoring:
    summary: Track cache hit rates, latency impact, and staleness indicators.
    metrics:
    - name: cache_hits_total
      kind: counter
      description: cache hit count by key prefix or resource type
    - name: cache_misses_total
      kind: counter
      description: misses that trigger a database read and cache fill
    - name: cache_fill_latency_seconds
      kind: histogram
      description: time to fetch from origin and populate cache
    - name: cache_evictions_total
      kind: counter
      description: entries evicted by TTL or capacity pressure
    alerts:
    - Cache hit rate dropping below baseline (possible misconfiguration or key-space change)
    - Cache fill latency spike (origin database degradation)
    - Eviction rate spike indicating undersized cache
