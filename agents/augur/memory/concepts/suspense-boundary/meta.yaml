schema: augur-concept-meta/v2
concept: suspense-boundary
kind: pattern
summary: Suspense Boundary — declarative loading state management for async component trees
taxonomy:
  type: pattern
  categories:
  - frontend
  - lifecycle
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-declarative-suspense-boundaries-wrapping-async-component-sub
    prompt: Are declarative Suspense boundaries wrapping async component subtrees with fallback UI?
    weight: 3
    signals:
    - <Suspense fallback={skeleton}> wrapping children
    - '<Suspense> with #fallback template slot'
    - '@defer blocks for lazy loading'
  - id: are-multiple-granular-suspense-boundaries-used-rather-than-one-t
    prompt: Are multiple granular suspense boundaries used rather than one top-level boundary?
    weight: 3
    signals:
    - nested Suspense per data-loading zone
    - separate boundaries for independent sections
    - not one giant Suspense wrapping entire app
  - id: are-error-boundaries-paired-with-suspense-boundaries-for-failed-
    prompt: Are error boundaries paired with suspense boundaries for failed async loads?
    weight: 2
    signals:
    - ErrorBoundary alongside Suspense
    - error fallback for failed data fetch
    - catch boundary for suspended component errors
  - id: is-streaming-ssr-enabled-when-using-server-side-suspense-for-pro
    prompt: Is streaming SSR enabled when using server-side suspense for progressive hydration?
    weight: 1
    signals:
    - streaming SSR with progressive rendering
    - server-side Suspense with chunked response
    - progressive hydration of suspended content
