schema: augur-concept-meta/v2
concept: lazy-loading
kind: pattern
summary: Lazy Loading — deferring component or module loading until needed to reduce initial bundle size
taxonomy:
  type: pattern
  categories:
  - frontend
  - deployment
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-components-loaded-via-react-lazy-defineasynccomponent-or-dyn
    prompt: Are components loaded via React.lazy, defineAsyncComponent, or dynamic import() in route definitions?
    weight: 3
    signals:
    - React.lazy(() => import(
    - defineAsyncComponent
    - 'loadChildren: () => import('
  - id: are-lazy-loaded-components-wrapped-with-suspense-or-equivalent-l
    prompt: Are lazy-loaded components wrapped with Suspense or equivalent loading boundary with fallback UI?
    weight: 3
    signals:
    - Suspense fallback=
    - loading boundary
    - skeleton during load
  - id: does-the-build-output-show-code-splitting-with-separate-chunks-f
    prompt: Does the build output show code splitting with separate chunks for lazily loaded modules?
    weight: 2
    signals:
    - webpackChunkName
    - separate chunk files
    - route-based splitting
  - id: are-error-boundaries-in-place-to-catch-failed-chunk-loads-from-n
    prompt: Are error boundaries in place to catch failed chunk loads from network errors or stale deployments?
    weight: 1
    signals:
    - ErrorBoundary around lazy
    - chunk load error handling
    - retry on failed import
