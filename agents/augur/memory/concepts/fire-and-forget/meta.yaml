schema: augur-concept-meta/v2
concept: fire-and-forget
kind: anti-pattern
summary: Fire and Forget anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  observable: true
  distributed: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-messages-published-without-awaiting-acknowledgment-or-checki
    prompt: Are messages published without awaiting acknowledgment or checking the returned future?
    weight: 3
    signals:
    - producer.send() with no await or callback
    - fire-and-forget send with no result handling
  - id: is-there-no-error-handling-or-retry-logic-on-message-publish-fai
    prompt: Is there no error handling or retry logic on message publish failures?
    weight: 3
    signals:
    - 'try: send() except: pass pattern'
    - ignore_errors=True on message send
  - id: are-async-tasks-dispatched-with-no-result-tracking-or-error-call
    prompt: Are async tasks dispatched with no result tracking or error callback?
    weight: 2
    signals:
    - celery.delay() with no result backend
    - Task.Run() with no error callback or monitoring
  - id: is-there-no-dead-letter-queue-or-failure-destination-for-undeliv
    prompt: Is there no dead-letter queue or failure destination for undeliverable messages?
    weight: 1
    signals:
    - no DLQ configured for the topic/queue
    - no failure handling for undeliverable messages
