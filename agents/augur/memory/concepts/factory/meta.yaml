schema: augur-concept-meta/v2
concept: factory
kind: pattern
summary: Factory Method architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-factory-methods-return-interface-or-abstract-types-rather-tha
    prompt: Do factory methods return interface or abstract types rather than concrete classes?
    weight: 3
    signals:
    - create() returns interface or protocol type
    - factory method signature uses abstract base class
  - id: is-object-creation-centralized-in-factory-classes-rather-than-sc
    prompt: Is object creation centralized in factory classes rather than scattered across callers?
    weight: 2
    signals:
    - '*Factory class with create/build methods'
    - callers use factory instead of direct constructor calls
  - id: does-a-type-discriminator-or-configuration-drive-which-concrete-
    prompt: Does a type discriminator or configuration drive which concrete class is instantiated?
    weight: 2
    signals:
    - switch/match on type string to select implementation
    - config-driven class selection in factory
  - id: can-new-product-types-be-added-without-modifying-existing-factor
    prompt: Can new product types be added without modifying existing factory code?
    weight: 2
    signals:
    - factory uses registration or plugin mechanism
    - new types added via config not code changes
analysis:
  testing:
    summary: Verify that the factory produces correctly configured instances and that all registered types are constructable.
    unit:
    - Call the factory with each supported type identifier and assert the returned object is the correct concrete type
    - Test that factory-created objects are fully initialized — no nil fields or missing dependencies
    - Verify that requesting an unknown type produces a clear error, not a nil return or panic
    - 'Test parameterized factories: different configuration inputs should produce objects with correspondingly different behavior'
    additional_sections:
    - title: Registration Tests
      items:
      - Assert that all expected types are registered with the factory at startup — catch missing registrations early
      - If the factory supports runtime registration, verify that newly registered types are immediately available
      - Test that duplicate registration is handled explicitly (error or override, not silent last-wins)
    - title: Isolation Tests
      items:
      - Verify factory-created objects are independent instances — mutating one does not affect another created by the same factory
