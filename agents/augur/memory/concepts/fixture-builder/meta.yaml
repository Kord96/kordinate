schema: augur-concept-meta/v2
concept: fixture-builder
kind: pattern
summary: Test Fixture / Data Builder architectural pattern
taxonomy:
  type: pattern
  categories:
  - testing
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-test-directories-contain-factory-or-builder-classes-that-cons
    prompt: Do test directories contain factory or builder classes that construct test objects with sensible defaults?
    weight: 3
    signals:
    - UserFactory or OrderBuilder in test utils
    - factory_boy Factory subclass or FactoryBot.define
  - id: do-builders-allow-selective-field-overrides-so-tests-specify-onl
    prompt: Do builders allow selective field overrides so tests specify only scenario-relevant data?
    weight: 3
    signals:
    - create(name=override) with defaults for other fields
    - .with_status().build() method chaining
  - id: are-factory-definitions-shared-in-a-common-test-utilities-module
    prompt: Are factory definitions shared in a common test utilities module rather than duplicated per test file?
    weight: 2
    signals:
    - factories/ or test_utils/ directory with shared builders
    - single factory definition imported across test files
  - id: do-factories-support-composing-nested-object-graphs-via-sub-fact
    prompt: Do factories support composing nested object graphs via sub-factories?
    weight: 1
    signals:
    - SubFactory or nested builder for related objects
    - factory composes child objects automatically
analysis:
  testing:
    summary: Verify that builders produce valid, consistent test data and that fixture defaults remain sensible as the domain evolves.
    unit:
    - Assert that the default builder produces a valid domain object that passes all invariant checks
    - 'Test each builder override: setting a single field should change only that field, leaving all others at defaults'
    - Verify that builders for related entities maintain referential integrity (e.g., an order builder references a valid customer)
    - Test that builders fail fast when given invalid combinations rather than producing subtly broken objects
    additional_sections:
    - title: Maintenance Tests
      items:
      - When adding a required field to a domain object, assert that the builder is updated with a sensible default — compilation alone may not catch runtime validation failures
      - Verify that randomized builders (faker-based) still produce valid objects — run the builder in a loop and validate each output
    - title: Anti-pattern Detection
      items:
      - Assert that tests use builders rather than raw constructors with magic values — builders make test intent explicit
      - 'Verify fixture data does not leak between tests: each test should get a fresh builder instance'
