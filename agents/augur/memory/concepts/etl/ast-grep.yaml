id: etl-airflow-dag-py
language: Python
rule:
  pattern: '$NAME = DAG($$$ARGS)'
---
id: etl-airflow-dag-context-py
language: Python
rule:
  pattern: |
    with DAG($$$ARGS) as $DAG:
        $$$BODY
