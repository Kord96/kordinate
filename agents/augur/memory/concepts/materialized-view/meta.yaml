schema: augur-concept-meta/v2
concept: materialized-view
kind: pattern
summary: Materialized View architectural pattern
taxonomy:
  type: pattern
  categories:
  - data
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
traits:
  testable: true
  observable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-pre-computed-query-results-stored-as-denormalized-tables-or-
    prompt: Are pre-computed query results stored as denormalized tables or cache entries separate from the source data?
    weight: 3
    signals:
    - CREATE MATERIALIZED VIEW
    - denormalized projection table
    - pre-computed read model
  - id: is-there-a-defined-refresh-mechanism-that-rebuilds-the-materiali
    prompt: Is there a defined refresh mechanism that rebuilds the materialized data on a schedule or in response to events?
    weight: 3
    signals:
    - REFRESH MATERIALIZED VIEW
    - cron rebuild job
    - event-driven projection update
  - id: do-read-queries-target-the-materialized-view-while-writes-go-to-
    prompt: Do read queries target the materialized view while writes go to the normalized source of truth?
    weight: 2
    signals:
    - reads from view, writes to source
    - CQRS read model
    - flat lookup cache
  - id: is-staleness-of-the-materialized-data-monitored-or-bounded-by-a-
    prompt: Is staleness of the materialized data monitored or bounded by a defined tolerance?
    weight: 2
    signals:
    - refresh duration tracked
    - staleness age metric
    - CONCURRENTLY refresh
analysis:
  testing:
    summary: Verify that the materialized view reflects source data accurately and handles refresh failures gracefully.
    unit:
    - Insert known data into the source tables, trigger a refresh, and assert the view contents match expected output
    - Modify source data, refresh, and verify the view reflects the changes
    - Verify that concurrent refresh (`CONCURRENTLY`) does not block read queries
    integration:
    - Simulate a refresh failure and verify the fallback behavior (serve stale data, query source directly, or return error)
    - Test the full refresh cycle under realistic data volumes and assert it completes within the staleness SLA
    - Validate that indexes on the materialized view are maintained after refresh
    additional_sections:
    - title: Edge Cases
      items:
      - Refresh with no source data changes and verify the view remains valid and unchanged
      - Drop and recreate the view from source data to verify the rebuild path works end-to-end
  monitoring:
    summary: Track view freshness, refresh performance, and query patterns to detect stale or degraded read models.
    metrics:
    - name: view_staleness_seconds
      kind: gauge
      description: time since the last successful refresh
    - name: view_refresh_duration_seconds
      kind: histogram
      description: how long each refresh cycle takes
    - name: view_refresh_failures_total
      kind: counter
      description: failed refresh attempts
    - name: view_query_total
      kind: counter
      description: queries served from the materialized view
    alerts:
    - View staleness exceeding the defined freshness SLA
    - Refresh duration growing over time (source data volume increasing or query plan degradation)
    - Consecutive refresh failures (view becoming progressively stale)
    - View query rate dropping to zero (consumers may have switched away or view is broken)
