schema: augur-concept-meta/v2
concept: feature-store
kind: pattern
summary: Feature Store architectural pattern
taxonomy:
  type: pattern
  categories:
  - data
  - ml
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-dual-serving-paths-for-features-low-latency-online-and
    prompt: 'Are there dual serving paths for features: low-latency online and batch offline?'
    weight: 3
    signals:
    - get_online_features() and get_historical_features() methods
    - separate online and offline storage backends
  - id: are-feature-definitions-centralized-in-a-registry-shared-between
    prompt: Are feature definitions centralized in a registry shared between training and serving?
    weight: 3
    signals:
    - feature view or feature table definitions in a registry
    - shared feature definitions used by both ML training and inference
  - id: do-offline-feature-joins-support-point-in-time-correctness-to-pr
    prompt: Do offline feature joins support point-in-time correctness to prevent data leakage?
    weight: 2
    signals:
    - point-in-time join for training data
    - temporal join preventing future data in features
  - id: are-feature-transformations-defined-once-and-materialized-to-bot
    prompt: Are feature transformations defined once and materialized to both online and offline stores?
    weight: 1
    signals:
    - single transformation definition with dual materialization
    - feature pipeline writes to both online cache and offline store
analysis:
  testing:
    summary: Verify feature pipelines produce correct values and that online/offline serving returns consistent results.
    unit:
    - Test each feature transformation function with known inputs and assert exact expected outputs
    - 'Verify null handling: missing source data should produce documented default values, not propagate nulls silently'
    - Assert that feature types match the declared schema (float, int, string, embedding) after transformation
    - 'Test time-window aggregations with edge cases: empty windows, single-element windows, windows spanning DST changes'
    integration:
    - Run the full feature pipeline on a sample dataset and compare output against a golden reference
    - Fetch the same entity's features from both the online and offline store and verify consistency within the expected staleness window
    - 'Test point-in-time correctness: features retrieved for a historical timestamp should reflect only data available at that time'
    additional_sections:
    - title: Online/Offline Parity
      items:
      - Compare model predictions using online-served features vs offline-computed features for the same input set — divergence indicates a training-serving skew
  monitoring:
    summary: Track feature freshness, serving latency, and pipeline health to ensure models receive correct, timely features.
    metrics:
    - name: feature_freshness_seconds
      kind: gauge
      description: time since the last update for each feature group
    - name: feature_serving_latency_seconds
      kind: histogram
      description: latency of online feature retrieval requests
    - name: feature_pipeline_runs_total
      kind: counter
      description: successful and failed feature computation pipeline runs
    - name: feature_null_rate
      kind: gauge
      description: percentage of null/missing values per feature, by entity
    alerts:
    - Feature freshness exceeding SLA (stale features being served to models)
    - Serving latency above p99 threshold (online inference impacted)
    - Feature null rate spike (upstream data source issue or broken transformation pipeline)
  deployment:
    summary: Coordinate feature pipeline, store, and serving layer deployments to avoid serving stale or incompatible features.
    rollout_implications:
    - Deploy feature transformation pipeline updates before model updates that depend on new features — the store must contain the features before the model requests them
    - Backfill new features before switching models to use them — missing feature values cause null defaults or inference errors
    - Rolling updates to the serving layer may briefly increase latency during cache warming — monitor serving latency during rollout
    - If changing feature schemas (new columns, type changes), update offline and online stores in lockstep
    pre_deploy_checklist:
    - Verify feature freshness is within SLA for all feature groups the target model depends on
    - Confirm online store connectivity and latency from the model serving environment
