schema: augur-concept-meta/v2
concept: over-under-fetching
kind: anti-pattern
summary: Over/Under-Fetching anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-api-endpoints-return-full-database-models-with-many-fields-wh
    prompt: Do API endpoints return full database models with many fields when consumers only use a small subset?
    weight: 3
    signals:
    - SELECT * returned to client
    - 20+ fields in response, 3 rendered
    - full object graph serialized
  - id: does-a-single-page-or-view-require-multiple-sequential-api-calls
    prompt: Does a single page or view require multiple sequential API calls to assemble its data?
    weight: 3
    signals:
    - waterfall of fetch calls
    - 5+ API calls for one view
    - N+1 API pattern
  - id: do-clients-filter-or-reshape-api-responses-because-the-server-re
    prompt: Do clients filter or reshape API responses because the server returns the wrong shape or too much data?
    weight: 2
    signals:
    - client-side data filtering
    - response.map to extract fields
    - unused fields in payload
  - id: are-there-select-queries-where-only-a-few-columns-are-actually-u
    prompt: Are there SELECT * queries where only a few columns are actually used by the caller?
    weight: 2
    signals:
    - SELECT * in ORM
    - no column projection
    - all columns fetched for 2 used
