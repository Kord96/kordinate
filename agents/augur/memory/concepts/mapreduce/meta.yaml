schema: augur-concept-meta/v2
concept: mapreduce
kind: pattern
summary: MapReduce architectural pattern
taxonomy:
  type: pattern
  categories:
  - data
  - concurrency
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-data-partitioned-across-workers-with-a-parallel-map-phase-fol
    prompt: Is data partitioned across workers with a parallel map phase followed by a reduce/aggregate phase?
    weight: 3
    signals:
    - Mapper and Reducer classes
    - groupByKey followed by reduceByKey
    - parallel map then aggregate
  - id: are-map-functions-stateless-and-pure-producing-the-same-output-f
    prompt: Are map functions stateless and pure, producing the same output for the same input?
    weight: 2
    signals:
    - no cross-record accumulation in map
    - deterministic key-value emission
  - id: is-there-a-shuffle-or-sort-phase-between-the-map-and-reduce-stag
    prompt: Is there a shuffle or sort phase between the map and reduce stages?
    weight: 3
    signals:
    - shuffle phase
    - intermediate key-value pairs sorted
    - partitioner distributing keys
  - id: does-the-reduce-function-operate-associatively-so-partial-combin
    prompt: Does the reduce function operate associatively so partial combines produce correct results?
    weight: 2
    signals:
    - combiner before reducer
    - associative aggregation
    - reduceByKey with commutative op
analysis:
  testing:
    summary: Verify map and reduce function correctness independently, then test the full job on representative data.
    unit:
    - Test the map function with known inputs and assert the exact set of intermediate key-value pairs
    - Test the reduce function with grouped intermediate values and assert the correct aggregated output
    - 'Verify the reduce function is associative: `reduce(a, reduce(b, c)) == reduce(reduce(a, b), c)`'
    integration:
    - Run the full job on a small, representative dataset and compare output against a golden reference
    - Test with skewed data (one key having disproportionately many values) and verify correctness and completion
    - Re-run the job on the same input and assert identical output (idempotency)
    failure_injection:
    - Kill a mapper or reducer mid-task and verify the framework retries and completes the job correctly
    - Introduce a poison record in the input and verify the job handles it gracefully (skip or dead-letter)
  monitoring:
    summary: Track job progress, task failures, and data skew to detect stalled or inefficient computations.
    metrics:
    - name: '`map_tasks_completed` / `reduce_tasks_completed` (counters) — progress through the job'
      kind: other
      description: ''
    - name: task_failures_total
      kind: counter
      description: map or reduce task failures requiring retry
    - name: shuffle_bytes_total
      kind: counter
      description: intermediate data volume between map and reduce phases
    - name: partition_skew_ratio
      kind: gauge
      description: ratio of largest to smallest partition size
    alerts:
    - Job runtime exceeding expected duration (straggler tasks or data skew)
    - Task failure rate above threshold (bad input data or resource exhaustion)
    - Shuffle volume disproportionately large relative to input (inefficient map output or missing combiner)
    - Single reducer receiving significantly more data than others (hot key skew)
  deployment:
    summary: Ensure cluster resources, data partitioning, and job configuration are correct before launching jobs.
    rollout_implications:
    - New job versions should be tested on a subset of data before full-scale runs
    - Resource allocation (mapper/reducer count, memory) must match the data volume of the target environment
    - Updating the map or reduce logic requires reprocessing -- partial results from the old version are not compatible
    - Intermediate data storage (shuffle space) must be sized for the expected shuffle volume
    pre_deploy_checklist:
    - Verify input data paths exist and partitioning strategy is configured for the target cluster
    - Confirm combiner is enabled where the reduce function is associative (reduces shuffle volume)
    - 'Test that the job is idempotent: re-running produces identical output'
    - Validate resource limits (memory, CPU) prevent individual tasks from starving the cluster
