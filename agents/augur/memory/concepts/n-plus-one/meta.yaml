schema: augur-concept-meta/v2
concept: n-plus-one
kind: anti-pattern
summary: N+1 Queries anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: true
    file: semgrep.yaml
    detector_strength: 5
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: semgrep.yaml
migration:
  replaces:
  - questions.yaml
traits:
  observable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-database-queries-executed-inside-a-loop-that-iterates-over-a
    prompt: Are database queries executed inside a loop that iterates over a collection of parent records?
    weight: 3
    signals:
    - 'for item in items: item.related.load()'
    - query inside for loop
    - SELECT per iteration
  - id: are-orm-relationships-accessed-without-prefetch-related-includes
    prompt: Are ORM relationships accessed without prefetch_related, includes, or a JOIN on the parent query?
    weight: 3
    signals:
    - missing prefetch_related
    - no includes() on association
    - lazy loading triggered in loop
  - id: do-sql-logs-show-n-identical-select-statements-differing-only-by
    prompt: Do SQL logs show N identical SELECT statements differing only by a foreign key value within one request?
    weight: 2
    signals:
    - repeated SELECT by FK
    - N queries for N children
    - query count scales with result set
  - id: does-request-latency-scale-linearly-with-the-number-of-records-r
    prompt: Does request latency scale linearly with the number of records returned?
    weight: 2
    signals:
    - slow with large datasets
    - fast in dev slow in prod
    - linear query growth
