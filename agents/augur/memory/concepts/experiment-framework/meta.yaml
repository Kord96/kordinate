schema: augur-concept-meta/v2
concept: experiment-framework
kind: pattern
summary: A/B Experiment Framework architectural pattern
taxonomy:
  type: pattern
  categories:
  - deployment
  - ml
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
traits:
  testable: true
  observable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-the-system-assign-users-to-experiment-variants-using-determ
    prompt: Does the system assign users to experiment variants using deterministic bucketing?
    weight: 3
    signals:
    - assign_variant() or get_variant() with hash-based bucketing
    - consistent variant assignment per user across sessions
  - id: are-per-variant-metrics-tracked-separately-for-statistical-compa
    prompt: Are per-variant metrics tracked separately for statistical comparison?
    weight: 3
    signals:
    - track_metric() calls partitioned by variant
    - metric collection per control and treatment groups
  - id: is-experiment-configuration-variants-traffic-allocation-targetin
    prompt: Is experiment configuration (variants, traffic allocation, targeting) defined separately from application code?
    weight: 2
    signals:
    - experiment config in external service or config file
    - traffic percentage and variant definitions outside code
  - id: do-experiments-have-planned-start-end-criteria-and-a-cleanup-pro
    prompt: Do experiments have planned start/end criteria and a cleanup process?
    weight: 1
    signals:
    - experiment end date or significance threshold defined
    - cleanup task to remove concluded experiment code
analysis:
  testing:
    summary: Verify deterministic assignment, correct metric attribution, and guardrail enforcement.
    unit:
    - Assert that the same user ID always maps to the same variant (deterministic hashing)
    - 'Verify mutual exclusion: a user in one experiment layer cannot be assigned to conflicting experiments'
    - Test that exposure logging fires only when the user actually sees the treatment, not just on assignment
    - Assert guardrail checks evaluate correctly and return a shutdown signal when thresholds are breached
    integration:
    - 'Run an experiment end-to-end: assign users, expose them to variants, collect metrics, and verify the results pipeline produces correct aggregates'
    - 'Test experiment lifecycle: create, activate, pause, resume, and conclude — each state transition should behave as documented'
    - Verify that feature flags tied to experiments respect the experiment assignment rather than their standalone rollout percentage
    additional_sections:
    - title: Statistical Tests
      items:
      - Run the assignment algorithm over a large synthetic population and verify variant splits match the configured ratio within expected variance
      - Test that metric collection correctly attributes conversions to the variant the user was exposed to at the time of the action
  monitoring:
    summary: Track experiment assignment, exposure, and metric collection to ensure statistical validity and catch guardrail violations.
    metrics:
    - name: experiment_assignments_total
      kind: counter
      description: users assigned to each variant, by experiment
    - name: experiment_exposures_total
      kind: counter
      description: users actually exposed to the treatment (may differ from assignment)
    - name: experiment_guardrail_violations_total
      kind: counter
      description: guardrail metric breaches that should trigger auto-shutdown
    - name: experiment_metric_samples
      kind: gauge
      description: sample size per variant to track statistical power accumulation
    alerts:
    - 'Sample ratio mismatch: assignment counts diverge from expected split (indicates a bug in randomization)'
    - Guardrail metric degradation beyond the pre-set threshold (experiment is causing harm)
    - Experiment running past its planned end date without a decision (resource leak)
