schema: augur-concept-meta/v2
concept: prop-drilling
kind: anti-pattern
summary: Prop Drilling anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-the-same-prop-passed-through-5-component-layers-where-interme
    prompt: Is the same prop passed through 5+ component layers where intermediate components only forward it without using it?
    weight: 3
    signals:
    - prop threaded through 5 levels
    - intermediate component forwards without reading
    - pass-through prop chain
  - id: do-intermediate-components-have-props-in-their-interface-that-th
    prompt: Do intermediate components have props in their interface that they never reference in their own render logic?
    weight: 3
    signals:
    - prop in signature but not in JSX
    - spread forwarding unused props
    - bloated prop interface
  - id: does-adding-a-new-prop-to-a-leaf-component-require-modifying-eve
    prompt: Does adding a new prop to a leaf component require modifying every ancestor in the chain?
    weight: 2
    signals:
    - new prop requires 5 file changes
    - ancestor chain updated for leaf change
    - cascading prop additions
  - id: are-there-no-context-provide-inject-or-state-management-solution
    prompt: Are there no Context, provide/inject, or state management solutions for data needed by deeply nested components?
    weight: 2
    signals:
    - no React.createContext
    - no provide/inject
    - no global store for shared data
