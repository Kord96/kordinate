schema: augur-concept-meta/v2
concept: aggregate
kind: pattern
summary: Aggregate Root architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
  - data
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-there-a-root-entity-that-controls-all-mutations-to-its-child-
    prompt: Is there a root entity that controls all mutations to its child entities, with children never modified directly by outside code?
    weight: 3
    signals:
    - root guards child mutations
    - children have no public setters
    - all changes go through root
  - id: does-the-repository-load-and-persist-the-entire-entity-cluster-a
    prompt: Does the repository load and persist the entire entity cluster as a single unit rather than individual children?
    weight: 3
    signals:
    - repository returns root only
    - save/load entire aggregate
    - transactional consistency boundary
  - id: are-references-between-entity-clusters-expressed-as-ids-rather-t
    prompt: Are references between entity clusters expressed as IDs rather than direct object pointers?
    weight: 2
    signals:
    - ID reference between aggregates
    - no cross-aggregate object refs
    - foreign key not object pointer
  - id: does-the-root-entity-enforce-business-invariants-with-guard-clau
    prompt: Does the root entity enforce business invariants with guard clauses before allowing state changes?
    weight: 2
    signals:
    - invariant checks in root methods
    - guard clause before mutation
    - domain rule enforcement at boundary
analysis:
  testing:
    summary: Test invariant enforcement at the aggregate boundary and verify that all mutations go through the root.
    unit:
    - 'Assert business invariants are enforced: invalid state transitions raise domain errors'
    - Verify the root coordinates child entity mutations — direct child modification is not possible
    - Test that domain events are emitted for each state change on the aggregate
    integration:
    - Persist and reload an aggregate, verifying all child entities and value objects round-trip correctly
    - 'Test optimistic concurrency: concurrent modifications to the same aggregate produce a conflict error'
    - Verify repository loads the full aggregate in a single consistency boundary
    failure_injection:
    - Attempt to violate invariants under concurrent load and verify no inconsistent state is persisted
