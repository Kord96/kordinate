schema: augur-concept-meta/v2
concept: outbox
kind: pattern
summary: Outbox architectural pattern
taxonomy:
  type: pattern
  categories:
  - messaging
  - data
  - resilience
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-events-written-to-an-outbox-table-in-the-same-database-trans
    prompt: Are events written to an outbox table in the same database transaction as the business state change?
    weight: 3
    signals:
    - outbox insert in same transaction
    - atomic write of state + event
    - transactional outbox
  - id: does-a-separate-process-poll-or-stream-from-the-outbox-table-to-
    prompt: Does a separate process poll or stream from the outbox table to publish events to a message broker?
    weight: 3
    signals:
    - outbox publisher process
    - Debezium CDC on outbox
    - polling outbox for unpublished
  - id: are-published-events-marked-or-deleted-to-prevent-re-publishing-
    prompt: Are published events marked or deleted to prevent re-publishing on the next poll cycle?
    weight: 2
    signals:
    - published_at timestamp set
    - processed flag updated
    - delete after publish
  - id: is-there-monitoring-for-stale-unpublished-events-that-may-indica
    prompt: Is there monitoring for stale unpublished events that may indicate a publisher failure?
    weight: 2
    signals:
    - alert on unpublished age
    - outbox lag metric
    - stale event monitoring
analysis:
  testing:
    summary: Verify atomicity of the outbox write, publisher delivery guarantees, and correct cleanup behavior.
    unit:
    - Insert a business entity and outbox event in one transaction, then verify both are committed or both rolled back on failure
    - Verify the publisher marks events as published after successful broker delivery
    - 'Test idempotent re-publishing: re-running the publisher on already-published events does not produce duplicates on the broker'
    - Assert unpublished events are fetched in insertion order (FIFO guarantee)
    integration:
    - Write an event, run the publisher, and verify the message appears on the broker topic with correct payload and headers
    - 'Simulate broker unavailability: verify events remain in the outbox unpublished and are retried on recovery'
    - 'Test the cleanup job: published events older than the retention window are deleted without affecting unpublished events'
    - Verify CDC-based publishing (if used) picks up new outbox rows within the expected latency window
    failure_injection:
    - Kill the publisher mid-batch and verify no events are lost (at-least-once delivery) and the next run resumes correctly
    - Simulate a database connection failure during publish and verify the publisher retries without marking events as published
  monitoring:
    summary: Track outbox table health and publisher lag to detect delivery stalls before they impact downstream consumers.
    metrics:
    - name: outbox_unpublished_count
      kind: gauge
      description: '- number of rows pending publication (should stay near zero)'
    - name: outbox_publish_latency_seconds
      kind: histogram
      description: '- time from insert to successful broker delivery'
    - name: outbox_publish_errors_total
      kind: counter
      description: '- failed publish attempts by error type (broker unavailable, serialization error)'
    - name: outbox_table_size_rows
      kind: gauge
      description: '- total row count including published rows awaiting cleanup'
    alerts:
    - Unpublished event count exceeds threshold (publisher stalled or broker unreachable)
    - Oldest unpublished event age exceeds SLA (events stuck in outbox beyond acceptable latency)
    - Outbox table row count growing unboundedly (cleanup job not running or failing)
    - Publisher error rate spike (broker connectivity issue or schema incompatibility)
  deployment:
    summary: Coordinate database schema changes and publisher process lifecycle during rollouts.
    rollout_implications:
    - Schema migrations adding columns to the outbox table must be backward-compatible (new columns nullable or with defaults)
    - The publisher process must be running during and after deployment -- ensure it is not accidentally terminated during rollout
    - If using CDC (Debezium), connector configuration must be updated before schema changes that alter the outbox table structure
    - Rolling deployments may produce outbox events in both old and new formats -- consumers must handle both during transition
    pre_deploy_checklist:
    - Verify the outbox publisher is healthy and the unpublished count is near zero before starting rollout
    - Confirm database migration does not lock the outbox table for extended periods (use online DDL where possible)
    - Ensure the message broker topic exists and has appropriate retention for the new event types
    - Test that new outbox event formats are deserializable by all downstream consumers before deploying the producer
