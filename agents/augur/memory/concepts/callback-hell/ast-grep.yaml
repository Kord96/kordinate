id: callback-hell-nested-callbacks-ts
language: TypeScript
rule:
  pattern: |
    $FN1($$$ARGS1, ($$$PARAMS1) => {
        $$$BEFORE1
        $FN2($$$ARGS2, ($$$PARAMS2) => {
            $$$BEFORE2
            $FN3($$$ARGS3, ($$$PARAMS3) => {
                $$$BODY
            })
        })
    })
