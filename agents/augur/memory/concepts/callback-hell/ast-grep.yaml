id: callback-hell-nested-callbacks-py
language: Python
rule:
  pattern: |
    def $FN1($$$ARGS1):
        $$$BEFORE1
        def $FN2($$$ARGS2):
            $$$BEFORE2
            def $FN3($$$ARGS3):
                $$$BODY
            $$$AFTER2
        $$$AFTER1
