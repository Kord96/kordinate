id: callback-hell-nested-function-callbacks-ts
language: TypeScript
rule:
  pattern: |
    $FN1($$$ARGS1, function($$$PARAMS1) {
        $$$BEFORE1
        $FN2($$$ARGS2, function($$$PARAMS2) {
            $$$BEFORE2
            $FN3($$$ARGS3, function($$$PARAMS3) {
                $$$BODY
            })
        })
    })
