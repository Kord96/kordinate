schema: augur-concept-meta/v2
concept: callback-hell
kind: anti-pattern
summary: Callback Hell anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-4-or-more-levels-of-nested-callback-or-anonymous-funct
    prompt: Are there 4 or more levels of nested callback or anonymous function indentation in async code?
    weight: 3
    signals:
    - deeply nested callbacks
    - pyramid-shaped async code
    - 4+ indentation levels
  - id: is-error-handling-duplicated-at-each-nesting-level-instead-of-be
    prompt: Is error handling duplicated at each nesting level instead of being centralized?
    weight: 2
    signals:
    - repeated error handlers
    - catch at every level
    - duplicated error logic per callback
  - id: are-then-chains-longer-than-5-steps-without-intermediate-named-f
    prompt: Are .then() chains longer than 5 steps without intermediate named functions?
    weight: 2
    signals:
    - long promise chain
    - unbounded .then() sequence
    - inline anonymous handlers
  - id: does-the-code-use-nested-callbacks-in-a-language-or-runtime-that
    prompt: Does the code use nested callbacks in a language or runtime that supports async/await?
    weight: 2
    signals:
    - callbacks despite async/await support
    - no await usage
    - pre-async style in modern runtime
