schema: augur-concept-meta/v2
concept: workflow-state-machine
kind: domain-model
summary: Workflow/state machine domain model — entities with defined states, transitions, and guards
taxonomy:
  type: domain-model
  categories:
  - data
  - lifecycle
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
diagnostic_questions:
  threshold: 3
  questions:
  - id: are-there-state-enums-or-constants-pending-approved-rejected-com
    prompt: Are there state enums or constants (PENDING, APPROVED, REJECTED, COMPLETED)?
    weight: 1
    signals:
    - PENDING
    - APPROVED
    - REJECTED
    - COMPLETED
    - CANCELLED
  - id: is-there-transition-validation-logic-check-current-state-before-
    prompt: Is there transition validation logic (check current state before allowing change)?
    weight: 1
  - id: does-the-project-use-a-state-machine-or-workflow-library-xstate-
    prompt: Does the project use a state machine or workflow library (XState, transitions, Temporal)?
    weight: 1
    signals:
    - xstate
    - transitions
    - temporal
    - StateMachine
    - Workflow
  - id: are-there-guard-conditions-on-state-transitions
    prompt: Are there guard conditions on state transitions?
    weight: 1
    signals:
    - guard
    - can_transition
    - allowed_transitions
  - id: is-state-transition-history-recorded
    prompt: Is state transition history recorded?
    weight: 1
    signals:
    - history
    - transition_log
    - state_change
    - audit
