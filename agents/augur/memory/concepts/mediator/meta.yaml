schema: augur-concept-meta/v2
concept: mediator
kind: pattern
summary: Mediator architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
  - integration
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-components-communicate-exclusively-through-a-central-coordina
    prompt: Do components communicate exclusively through a central coordinator rather than referencing each other directly?
    weight: 3
    signals:
    - components hold mediator reference only
    - no direct component-to-component calls
    - all messages routed through hub
  - id: is-there-a-central-object-with-send-dispatch-publish-methods-tha
    prompt: Is there a central object with send/dispatch/publish methods that routes messages between registered participants?
    weight: 3
    signals:
    - mediator.send()
    - dispatcher.dispatch()
    - hub.publish()
  - id: does-the-mediator-restrict-itself-to-coordination-logic-without-
    prompt: Does the mediator restrict itself to coordination logic without accumulating business rules?
    weight: 2
    signals:
    - thin mediator routing only
    - handler contains logic not mediator
    - mediator delegates to handlers
  - id: are-message-types-or-commands-well-defined-with-typed-contracts-
    prompt: Are message types or commands well-defined with typed contracts for handler registration?
    weight: 2
    signals:
    - typed command classes
    - handler registry by message type
    - IRequest/IRequestHandler
analysis:
  testing:
    summary: Verify that components communicate exclusively through the mediator and handlers are isolated.
    unit:
    - Send a message through the mediator and assert the correct handler is invoked with the expected payload
    - Verify that components have no direct references to other components (only to the mediator)
    - Assert that an error in one handler does not prevent the mediator from dispatching to other handlers
    integration:
    - Register multiple handlers for different message types and verify each receives only its messages
    - Test that unregistered message types produce a clear error or are silently ignored (per design intent)
    - 'Verify message ordering: if ordering matters, assert handlers are invoked in registration order'
    additional_sections:
    - title: Edge Cases
      items:
      - Send a message with no registered handlers and verify the mediator does not crash
      - Register the same handler twice and verify it is invoked once (or twice, per design), not silently dropped
