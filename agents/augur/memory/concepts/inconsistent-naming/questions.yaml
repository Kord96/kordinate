questions:
  - q: "Does the same file or module mix camelCase and snake_case for non-FFI identifiers?"
    weight: 3
    signals: ["camelCase and snake_case in same file", "mixed casing convention", "inconsistent variable style"]
  - q: "Is the same domain concept referred to by different names across the codebase?"
    weight: 3
    signals: ["user vs usr vs u", "config vs conf vs cfg", "order vs purchase for same entity"]
  - q: "Are abbreviations used inconsistently, with full names in some modules and shortened forms in others?"
    weight: 2
    signals: ["repo in one file repository in another", "msg vs message", "inconsistent abbreviation"]
  - q: "Do similar functions follow inconsistent verb or tense conventions in their names?"
    weight: 1
    signals: ["get_users vs fetch_item", "userCreated vs deleteUser", "mixed verb patterns"]
threshold: 6
