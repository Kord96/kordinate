schema: augur-concept-meta/v2
concept: cargo-cult
kind: anti-pattern
summary: Cargo Cult Programming anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 5
  questions:
  - id: are-there-design-patterns-applied-where-the-problem-they-solve-d
    prompt: Are there design patterns applied where the problem they solve does not exist (e.g., a Factory that only creates one type, an interface with exactly one implementation and no test doubles)?
    weight: 3
    signals:
    - single-product factory
    - interface with sole implementor
    - pattern without purpose
  - id: is-there-copy-pasted-boilerplate-across-files-that-has-not-been-
    prompt: Is there copy-pasted boilerplate across files that has not been adapted to its local context?
    weight: 2
    signals:
    - identical boilerplate blocks
    - unmodified tutorial code
    - template without customization
  - id: does-adding-a-simple-feature-require-modifying-boilerplate-in-5-
    prompt: Does adding a simple feature require modifying boilerplate in 5 or more files?
    weight: 2
    signals:
    - multi-file ceremony for small changes
    - excessive indirection layers
    - more structural code than logic
  - id: are-configuration-values-present-that-match-popular-tutorial-def
    prompt: Are configuration values present that match popular tutorial defaults with no evidence they were chosen for this system?
    weight: 1
    signals:
    - tutorial-default config
    - unexplained settings
    - cargo-culted parameters
