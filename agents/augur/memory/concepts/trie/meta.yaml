schema: augur-concept-meta/v2
concept: trie
kind: pattern
summary: Trie (Prefix Tree) architectural pattern
taxonomy:
  type: pattern
  categories:
  - data
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-the-code-define-a-node-per-character-tree-structure-with-ch
    prompt: Does the code define a node-per-character tree structure with children stored in a dict or array, plus an is_end or is_terminal flag?
    weight: 3
    signals:
    - TrieNode with children mapping
    - is_end or is_terminal flag
    - character-keyed child nodes
  - id: are-insert-search-and-starts-with-or-has-prefix-operations-imple
    prompt: Are insert, search, and starts_with (or has_prefix) operations implemented on the tree structure?
    weight: 3
    signals:
    - insert method
    - search method
    - starts_with or has_prefix method
  - id: is-the-structure-used-for-prefix-based-operations-like-autocompl
    prompt: Is the structure used for prefix-based operations like autocomplete, typeahead, or longest-prefix matching?
    weight: 2
    signals:
    - autocomplete implementation
    - prefix matching logic
    - typeahead search
  - id: does-deletion-handle-non-leaf-nodes-correctly-by-distinguishing-
    prompt: Does deletion handle non-leaf nodes correctly by distinguishing prefixes that are themselves valid keys?
    weight: 1
    signals:
    - deletion preserves prefix nodes
    - terminal marker management on delete
    - prune orphaned branches
analysis:
  testing:
    summary: '# Testing - Test insert, search, and `starts_with` for exact matches, prefix matches, and missing keys - Verify terminal markers: `search("app")` must return false when only `"apple"` was inserted - Test deletion: removing a key that is a prefix of other keys must not affect the longer keys - Test with empty strings, single-character keys, and very long keys - Verify that shared prefixes are stored efficiently (not duplicated at every node) - Test concurrent access if the trie is shared across threads (read/write safety) - Benchmark against a hash set for the target workload to confirm the trie provides a real benefit - Test compressed variants (radix, Patricia) with keys that share long prefixes'
