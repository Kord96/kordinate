schema: augur-concept-meta/v2
concept: conversation-thread
kind: domain-model
summary: Conversation threading pattern for messaging and real-time communication
taxonomy:
  type: domain-model
  categories:
  - data
  - communication
  legacy:
    type: pattern
    category: domain-model
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-messages-organized-into-threads-or-conversations-with-reply-
    prompt: Are messages organized into threads or conversations with reply_to or parent references?
    weight: 3
    signals:
    - Thread or Conversation model
    - reply_to or parent_message_id FK
    - threaded message hierarchy
  - id: is-there-real-time-message-delivery-via-websocket-sse-or-similar
    prompt: Is there real-time message delivery via WebSocket, SSE, or similar push mechanism?
    weight: 3
    signals:
    - WebSocket connection for messages
    - real-time message broadcast
    - socket.io or stream-chat usage
  - id: is-read-state-tracked-per-user-read-receipts-last-read-at-unread
    prompt: Is read state tracked per user (read receipts, last_read_at, unread counts)?
    weight: 2
    signals:
    - ReadReceipt model
    - last_read_at timestamp per user per conversation
    - unread count computation
  - id: are-reactions-or-emoji-responses-supported-on-individual-message
    prompt: Are reactions or emoji responses supported on individual messages?
    weight: 1
    signals:
    - Reaction model linked to message
    - emoji reaction endpoints
    - reaction aggregation counts
