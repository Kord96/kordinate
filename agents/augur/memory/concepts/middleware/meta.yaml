schema: augur-concept-meta/v2
concept: middleware
kind: pattern
summary: Middleware — request/response pipeline interceptors for cross-cutting concerns
taxonomy:
  type: pattern
  categories:
  - integration
  - lifecycle
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-functions-in-a-composable-pipeline-that-process-reques
    prompt: Are there functions in a composable pipeline that process requests and call next() to forward to the next handler?
    weight: 3
    signals:
    - app.use(fn)
    - (req, res, next) signature
    - async (ctx, next) pattern
  - id: does-each-middleware-handle-a-single-cross-cutting-concern-such-
    prompt: Does each middleware handle a single cross-cutting concern such as auth, logging, or rate limiting?
    weight: 2
    signals:
    - auth middleware separate from logging
    - single responsibility per middleware
    - error handler at end
  - id: is-middleware-execution-order-intentional-with-documentation-or-
    prompt: Is middleware execution order intentional, with documentation or tests for ordering dependencies?
    weight: 2
    signals:
    - middleware registered in sequence
    - auth before route handlers
    - error handling last
  - id: do-middleware-functions-either-call-next-or-explicitly-terminate
    prompt: Do middleware functions either call next() or explicitly terminate the response, never silently dropping?
    weight: 3
    signals:
    - next() always called
    - response terminated on auth failure
    - no silent drops
