schema: augur-concept-meta/v2
concept: server-prefetch
kind: pattern
summary: Server Prefetch — fetching data on the server before client rendering
taxonomy:
  type: pattern
  categories:
  - frontend
  - data
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-data-fetching-functions-executed-on-the-server-during-the-re
    prompt: Are data-fetching functions executed on the server during the request lifecycle before client rendering?
    weight: 3
    signals:
    - loader with prefetchQuery and dehydrate
    - getServerSideProps returning props
    - load function in +page.server.ts
  - id: is-server-fetched-data-serialized-and-rehydrated-on-the-client-t
    prompt: Is server-fetched data serialized and rehydrated on the client to avoid redundant fetches?
    weight: 3
    signals:
    - HydrationBoundary passing dehydrated state
    - DehydratedState props on client component
    - __NEXT_DATA__ with serialized server state
  - id: are-cache-keys-consistent-between-server-prefetch-and-client-sid
    prompt: Are cache keys consistent between server prefetch and client-side queries?
    weight: 2
    signals:
    - same query key used in loader and useQuery
    - consistent cache key across SSR and CSR
    - no mismatched keys causing hydration miss
  - id: is-sensitive-data-excluded-from-serialized-state-in-the-html-res
    prompt: Is sensitive data excluded from serialized state in the HTML response?
    weight: 1
    signals:
    - no tokens in dehydrated state
    - internal IDs filtered before serialization
    - sensitive fields stripped from server data
