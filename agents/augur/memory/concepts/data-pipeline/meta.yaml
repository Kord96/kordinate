schema: augur-concept-meta/v2
concept: data-pipeline
kind: flow-shape
summary: Data pipeline flow — linear transformation stages from source to sink
taxonomy:
  type: flow-shape
  categories:
  - data
  - integration
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
diagnostic_questions:
  threshold: 3
  questions:
  - id: does-the-project-have-sequential-data-transformation-stages-extr
    prompt: Does the project have sequential data transformation stages (extract → transform → load)?
    weight: 1
  - id: is-there-a-pipeline-framework-airflow-dbt-spark-prefect-dagster-
    prompt: Is there a pipeline framework (Airflow, dbt, Spark, Prefect, Dagster, Luigi)?
    weight: 1
    signals:
    - airflow
    - dbt
    - spark
    - prefect
    - dagster
    - luigi
  - id: are-there-batch-scheduled-jobs-that-read-from-one-data-source-tr
    prompt: Are there batch/scheduled jobs that read from one data source, transform, and write to another?
    weight: 1
    signals:
    - CronJob
    - cron
    - schedule
    - batch
  - id: do-transformations-form-a-dag-with-explicit-dependencies
    prompt: Do transformations form a DAG with explicit dependencies?
    weight: 1
    signals:
    - dag
    - depends_on
    - ref(
    - upstream
