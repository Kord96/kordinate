schema: augur-concept-meta/v2
concept: log-spam
kind: anti-pattern
summary: Log Spam anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  observable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-log-statements-placed-inside-loop-bodies-that-iterate-over-u
    prompt: Are log statements placed inside loop bodies that iterate over unbounded or large input?
    weight: 3
    signals:
    - logger.info inside for loop
    - log in while loop body
    - per-iteration logging
  - id: is-the-log-level-set-to-debug-or-trace-in-production-configurati
    prompt: Is the log level set to DEBUG or TRACE in production configuration files?
    weight: 3
    signals:
    - DEBUG level in production
    - TRACE enabled in prod config
    - verbose logging in production
  - id: are-full-request-or-response-bodies-logged-at-info-level-on-ever
    prompt: Are full request or response bodies logged at INFO level on every request?
    weight: 2
    signals:
    - log request body at INFO
    - log full response
    - verbose request logging
  - id: is-there-no-rate-limiting-sampling-or-conditional-guard-on-high-
    prompt: Is there no rate limiting, sampling, or conditional guard on high-frequency log emissions?
    weight: 1
    signals:
    - unconditional log.warning
    - no sampling on log
    - no rate limit on log emit
