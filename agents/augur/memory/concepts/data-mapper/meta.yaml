schema: augur-concept-meta/v2
concept: data-mapper
kind: pattern
summary: Data Mapper architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
  - data
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-domain-model-classes-free-of-orm-base-classes-and-persistenc
    prompt: Are domain model classes free of ORM base classes and persistence imports?
    weight: 3
    signals:
    - plain class or dataclass with no ORM base
    - no import of sqlalchemy/typeorm/hibernate in domain layer
  - id: do-dedicated-mapper-classes-or-functions-translate-between-domai
    prompt: Do dedicated mapper classes or functions translate between domain objects and database rows?
    weight: 3
    signals:
    - to_entity() or from_row() methods
    - mapper/ directory or mapper classes
  - id: are-domain-models-free-of-save-query-or-other-persistence-method
    prompt: Are domain models free of save(), query(), or other persistence methods?
    weight: 2
    signals:
    - no save() or persist() on domain objects
    - persistence operations only in repository or mapper layer
  - id: does-the-mapper-handle-bidirectional-translation-between-domain-
    prompt: Does the mapper handle bidirectional translation between domain and persistence representations?
    weight: 1
    signals:
    - to_row() and to_entity() in same mapper
    - separate serialization and deserialization paths
analysis:
  testing:
    summary: Verify that mapping logic correctly translates between domain objects and persistence representations without leaking either concern.
    unit:
    - Map a domain entity to a persistence row and assert all fields are correctly translated, including type conversions
    - Map a persistence row back to a domain entity and verify no data loss or silent truncation
    - Test null/missing field handling — mapper should apply defaults or raise explicit errors, never silently drop data
    - 'Verify that domain invariants hold after a round-trip: entity -> row -> entity produces an equivalent object'
    integration:
    - Insert via mapper, read back via mapper, and compare with the original domain object
    - Test mapping of associated/nested entities to verify join or embedded document handling
    - Verify that schema changes (added/removed columns) are caught by mapper tests rather than surfacing as runtime errors
