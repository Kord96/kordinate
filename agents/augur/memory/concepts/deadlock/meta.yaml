schema: augur-concept-meta/v2
concept: deadlock
kind: anti-pattern
summary: Deadlock anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
traits:
  testable: true
  observable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-multiple-locks-acquired-in-different-orders-across-different
    prompt: Are multiple locks acquired in different orders across different code paths?
    weight: 3
    signals:
    - lock A then lock B in one function, lock B then lock A in another
    - inconsistent nested synchronized or mutex.Lock ordering
  - id: do-nested-lock-acquisitions-exist-where-inner-locks-vary-by-call
    prompt: Do nested lock acquisitions exist where inner locks vary by call site?
    weight: 3
    signals:
    - nested synchronized blocks or with lock statements
    - inner lock target depends on runtime arguments
  - id: do-database-transactions-lock-rows-in-varying-orders-depending-o
    prompt: Do database transactions lock rows in varying orders depending on the operation?
    weight: 2
    signals:
    - SELECT FOR UPDATE on different tables in different order per query
    - concurrent transactions updating overlapping row sets
  - id: is-there-an-absence-of-a-documented-or-enforced-global-lock-orde
    prompt: Is there an absence of a documented or enforced global lock ordering?
    weight: 1
    signals:
    - no lock ordering comments or conventions
    - locks acquired ad-hoc without hierarchy
analysis:
  testing:
    summary: Reproduce lock-ordering violations under controlled concurrency to verify prevention and detection mechanisms.
    unit:
    - Verify that lock acquisition follows a consistent global ordering — assert that acquiring locks out of order raises an error or is prevented
    - 'Test lock timeout behavior: a thread unable to acquire a lock within the timeout should receive an explicit error, not hang'
    - Assert that lock-free or optimistic alternatives correctly detect conflicts and retry
    additional_sections:
    - title: Concurrency Tests
      items:
      - Spawn two threads that acquire the same two locks in opposite order and verify the deadlock detector triggers or the ordering constraint prevents it
      - Stress-test critical sections with high concurrency to surface contention hotspots
      - Verify that database-level deadlock detection returns a retryable error and the application retries successfully
    - title: Static Analysis
      items:
      - Use lock-order analysis tools or thread-safety annotations to catch potential deadlocks at build time rather than runtime
  monitoring:
    summary: Detect lock contention and deadlock occurrences before they cascade into widespread request failures.
    metrics:
    - name: lock_wait_duration_seconds
      kind: histogram
      description: time threads spend waiting to acquire locks
    - name: deadlock_detected_total
      kind: counter
      description: deadlocks detected by the database or application runtime
    - name: lock_timeout_total
      kind: counter
      description: lock acquisition attempts that exceeded the timeout threshold
    - name: active_locks
      kind: gauge
      description: number of currently held locks, broken down by resource
    alerts:
    - Any deadlock detection event (every occurrence warrants investigation)
    - Lock wait duration exceeding p99 baseline (emerging contention before deadlock)
    - Rising lock timeout rate (callers giving up, likely degraded throughput)
