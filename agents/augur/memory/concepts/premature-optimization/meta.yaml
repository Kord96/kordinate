schema: augur-concept-meta/v2
concept: premature-optimization
kind: anti-pattern
summary: Premature Optimization anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-caching-layers-denormalized-tables-or-complex-data-structure
    prompt: Are caching layers, denormalized tables, or complex data structures present without accompanying benchmarks or load test results?
    weight: 3
    signals:
    - cache layer with no profiling data
    - bloom filter for small dataset
    - denormalized table with no scale evidence
  - id: does-the-optimized-code-path-account-for-a-negligible-portion-of
    prompt: Does the optimized code path account for a negligible portion of total latency based on profiling?
    weight: 3
    signals:
    - optimized path is <5% of latency
    - micro-benchmark without production profile
    - cache for sub-millisecond query
  - id: are-comments-referencing-performance-or-efficiency-found-on-code
    prompt: Are comments referencing performance or efficiency found on code handling low-traffic paths or small datasets?
    weight: 2
    signals:
    - '''for performance'' on cold path'
    - custom serializer for admin endpoint
    - hand-rolled protocol for internal tool
  - id: do-optimization-constraints-make-the-codebase-harder-to-change-w
    prompt: Do optimization constraints make the codebase harder to change without proven necessity?
    weight: 2
    signals:
    - feature blocked by cache coherency
    - custom data structure obscures intent
    - optimization locked in early design
