schema: augur-concept-meta/v2
concept: long-polling
kind: pattern
summary: Long Polling architectural pattern
taxonomy:
  type: pattern
  categories:
  - integration
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
traits:
  testable: true
  observable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-the-server-hold-http-requests-open-until-new-data-is-availa
    prompt: Does the server hold HTTP requests open until new data is available or a timeout expires?
    weight: 3
    signals:
    - hold request until data
    - server-side timeout on response
    - wait for event then respond
  - id: does-the-client-immediately-re-request-after-receiving-a-respons
    prompt: Does the client immediately re-request after receiving a response or timeout from the server?
    weight: 3
    signals:
    - immediate re-request
    - reconnect on timeout
    - polling loop with instant retry
  - id: is-there-error-handling-with-backoff-to-prevent-flooding-the-ser
    prompt: Is there error handling with backoff to prevent flooding the server during outages?
    weight: 2
    signals:
    - backoff on error
    - exponential retry delay
    - error backoff in poll loop
  - id: does-the-response-include-a-version-token-or-cursor-so-the-clien
    prompt: Does the response include a version token or cursor so the client requests only new data?
    weight: 1
    signals:
    - ETag header
    - cursor in response
    - version token for next poll
analysis:
  testing:
    summary: Verify correct hold-and-release behavior, timeout handling, and reconnection logic.
    unit:
    - Assert that the server holds the request open until data is available, then responds immediately
    - Verify that requests time out and return a proper response (not an error) when no data arrives within the timeout window
    - Test that the client re-requests immediately after receiving a response or timeout
    integration:
    - Push data to the server while a long-poll request is held and verify the client receives it promptly
    - Simulate server unavailability and verify the client backs off on errors instead of flooding with retries
    - Test concurrent long-poll connections from multiple clients and confirm each receives its own data
    additional_sections:
    - title: Edge Cases
      items:
      - Disconnect the client mid-hold and verify the server cleans up the abandoned connection
      - Send data just as the timeout fires and verify no race condition causes data loss or duplicate delivery
  monitoring:
    summary: Track connection lifecycle, timeout behavior, and server resource consumption from held requests.
    metrics:
    - name: long_poll_active_connections
      kind: gauge
      description: number of currently held long-poll requests
    - name: long_poll_timeout_total
      kind: counter
      description: requests that returned due to timeout with no new data
    - name: long_poll_data_returned_total
      kind: counter
      description: requests that returned with data before timeout
    - name: long_poll_hold_duration_seconds
      kind: histogram
      description: how long requests are held before responding
    alerts:
    - Active connection count approaching server connection limit
    - Timeout rate exceeding a threshold (clients waiting but no data arriving)
    - Hold duration consistently hitting the maximum timeout (potential data delivery issue)
    - Spike in reconnection rate (clients repeatedly failing and retrying)
