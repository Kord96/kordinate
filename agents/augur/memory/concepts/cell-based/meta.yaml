schema: augur-concept-meta/v2
concept: cell-based
kind: structure-shape
summary: Cell-based structure — independent cells that can scale, deploy, and fail independently
taxonomy:
  type: structure-shape
  categories:
  - architectural
  - deployment
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
diagnostic_questions:
  threshold: 3
  questions:
  - id: are-there-multiple-identical-deployments-serving-different-custo
    prompt: Are there multiple identical deployments serving different customer segments or regions?
    weight: 1
  - id: does-each-cell-have-its-own-database-cache-queue-shared-nothing
    prompt: Does each cell have its own database/cache/queue (shared-nothing)?
    weight: 1
    signals:
    - cell_id
    - shard_id
    - region
    - tenant
  - id: is-there-routing-logic-that-directs-requests-to-the-correct-cell
    prompt: Is there routing logic that directs requests to the correct cell?
    weight: 1
    signals:
    - cell_router
    - shard_key
    - region_router
  - id: can-cells-be-deployed-updated-independently
    prompt: Can cells be deployed/updated independently?
    weight: 1
