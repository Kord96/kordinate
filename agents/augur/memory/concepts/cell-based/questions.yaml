threshold: 3
questions:
- q: Are there multiple identical deployments serving different customer segments
    or regions?
  w: 2
- q: Does each cell have its own database/cache/queue (shared-nothing)?
  w: 2
  signals:
  - cell_id
  - shard_id
  - region
  - tenant
- q: Is there routing logic that directs requests to the correct cell?
  w: 1
  signals:
  - cell_router
  - shard_key
  - region_router
- q: Can cells be deployed/updated independently?
  w: 1
