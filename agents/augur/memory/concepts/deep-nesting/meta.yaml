schema: augur-concept-meta/v2
concept: deep-nesting
kind: anti-pattern
summary: Deep Nesting anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-functions-contain-5-or-more-levels-of-if-for-try-indentation
    prompt: Do functions contain 5 or more levels of if/for/try indentation?
    weight: 3
    signals:
    - 5+ indent levels in a single function
    - arrow-shaped code with peak indentation
  - id: are-there-long-functions-40-lines-where-nested-conditionals-span
    prompt: Are there long functions (40+ lines) where nested conditionals span most of the body?
    weight: 2
    signals:
    - function body dominated by nested if/else chains
    - 50+ line function with 3+ nesting levels
  - id: could-nested-conditions-be-replaced-by-guard-clauses-with-early-
    prompt: Could nested conditions be replaced by guard clauses with early returns?
    weight: 2
    signals:
    - if condition that wraps entire function body
    - no early return before deeply nested logic
  - id: are-there-nested-ternary-expressions-or-deeply-nested-callback-c
    prompt: Are there nested ternary expressions or deeply nested callback chains?
    weight: 2
    signals:
    - 'a ? b ? c : d : e ternary chains'
    - callback inside callback inside callback
