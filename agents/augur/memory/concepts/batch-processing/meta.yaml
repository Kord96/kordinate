schema: augur-concept-meta/v2
concept: batch-processing
kind: flow-shape
summary: Batch processing flow — data processed in discrete chunks on a schedule
taxonomy:
  type: flow-shape
  categories:
  - data
  - lifecycle
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
diagnostic_questions:
  threshold: 3
  questions:
  - id: does-the-code-process-data-in-configurable-chunk-sizes-batch-siz
    prompt: Does the code process data in configurable chunk sizes (BATCH_SIZE, page_size)?
    weight: 1
    signals:
    - batch_size
    - BATCH_SIZE
    - page_size
    - chunk_size
  - id: are-there-scheduled-jobs-that-process-accumulated-data
    prompt: Are there scheduled jobs that process accumulated data?
    weight: 1
    signals:
    - cron
    - schedule
    - nightly
    - hourly
  - id: is-there-pagination-through-large-datasets-limit-offset-cursor
    prompt: Is there pagination through large datasets (LIMIT/OFFSET, cursor)?
    weight: 1
    signals:
    - LIMIT
    - OFFSET
    - cursor
    - paginate
  - id: does-the-code-flush-commit-after-processing-each-batch
    prompt: Does the code flush/commit after processing each batch?
    weight: 1
    signals:
    - flush
    - commit
    - bulk_create
    - executemany
