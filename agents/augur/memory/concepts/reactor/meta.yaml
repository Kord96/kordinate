schema: augur-concept-meta/v2
concept: reactor
kind: pattern
summary: Reactor/Event Loop architectural pattern
taxonomy:
  type: pattern
  categories:
  - concurrency
  - architectural
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
traits:
  testable: true
  observable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-there-a-single-threaded-event-loop-dispatching-i-o-events-to-
    prompt: Is there a single-threaded event loop dispatching I/O events to registered handlers?
    weight: 3
    signals:
    - asyncio.run() or loop.run_forever()
    - epoll or kqueue multiplexing
    - libuv-based event loop
  - id: are-i-o-operations-non-blocking-with-callbacks-promises-or-async
    prompt: Are I/O operations non-blocking with callbacks, promises, or async/await?
    weight: 3
    signals:
    - async def with await on I/O
    - non-blocking socket operations
    - callback-based event handlers
  - id: are-blocking-operations-offloaded-to-a-thread-pool-to-avoid-stal
    prompt: Are blocking operations offloaded to a thread pool to avoid stalling the event loop?
    weight: 2
    signals:
    - run_in_executor for blocking calls
    - thread pool for CPU-heavy work
    - offloading file I/O to workers
  - id: does-the-system-handle-backpressure-when-write-buffers-fill-up
    prompt: Does the system handle backpressure when write buffers fill up?
    weight: 1
    signals:
    - pause reading on buffer full
    - drain event before resuming writes
    - flow control on streams
analysis:
  testing:
    summary: Verify non-blocking behavior, correct handler dispatch, and graceful shutdown under concurrent connections.
    unit:
    - Register a handler for an I/O event, trigger the event, and verify the handler is called with the correct payload
    - Verify error in one handler does not prevent subsequent handlers from executing
    - 'Test timeout handling: register a handler with a deadline and verify it fires or is cleaned up on expiry'
    - Assert no blocking calls exist on the event loop path (use loop debug mode or slow-callback detection)
    integration:
    - Run the reactor under load with real I/O (sockets, file descriptors) and verify no event starvation or deadlock
    - Offload a CPU-bound task to the thread pool and verify the event loop remains responsive during computation
    - Simulate a slow consumer and verify the loop applies backpressure rather than buffering unboundedly
    additional_sections:
    - title: Concurrency Tests
      items:
      - Open many concurrent connections and verify the event loop multiplexes them without spawning a thread per connection
      - 'Verify backpressure: when a write buffer fills, the loop pauses reads from the producer until the buffer drains'
      - 'Test graceful shutdown: signal the loop to stop and verify all in-flight events are drained before exit'
  monitoring:
    summary: Track event loop health, callback latency, and blocking call detection to prevent throughput degradation.
    metrics:
    - name: event_loop_lag_seconds
      kind: gauge
      description: '- delay between scheduled callback time and actual execution time'
    - name: event_loop_tasks_total
      kind: counter
      description: '- callbacks/handlers dispatched per second'
    - name: event_loop_blocked_duration_seconds
      kind: histogram
      description: '- time spent in blocking calls detected on the event loop'
    - name: active_connections
      kind: gauge
      description: '- number of concurrent connections multiplexed on the loop'
    alerts:
    - Event loop lag exceeds threshold (blocking call on the loop or CPU-bound work not offloaded)
    - Active connection count approaching system file descriptor limit
    - Task dispatch rate drops to zero while connections are active (event loop stalled)
    - Blocked duration detected on the event loop (synchronous I/O or heavy computation inline)
