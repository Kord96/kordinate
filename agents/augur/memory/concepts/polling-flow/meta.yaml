schema: augur-concept-meta/v2
concept: polling-flow
kind: flow-shape
summary: Polling flow — periodic check for state changes or new work
taxonomy:
  type: flow-shape
  categories:
  - integration
  - lifecycle
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
diagnostic_questions:
  threshold: 3
  questions:
  - id: does-the-code-have-setinterval-settimeout-or-sleep-in-a-loop-pat
    prompt: Does the code have setInterval/setTimeout or sleep-in-a-loop patterns?
    weight: 1
    signals:
    - setInterval
    - setTimeout
    - sleep
    - time.sleep
  - id: are-there-database-queries-polling-for-pending-new-records
    prompt: Are there database queries polling for pending/new records?
    weight: 1
    signals:
    - status = 'pending'
    - WHERE processed = false
    - LIMIT
  - id: is-there-a-cronjob-or-scheduled-task-that-runs-periodically
    prompt: Is there a CronJob or scheduled task that runs periodically?
    weight: 1
    signals:
    - CronJob
    - cron
    - '@Scheduled'
    - schedule.every
  - id: does-the-code-track-polling-position-via-cursors-or-timestamps
    prompt: Does the code track polling position via cursors or timestamps?
    weight: 1
    signals:
    - last_checked
    - cursor
    - offset
    - since
