schema: augur-concept-meta/v2
concept: flyweight
kind: pattern
summary: Flyweight architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-a-factory-return-cached-immutable-instances-keyed-by-intrin
    prompt: Does a factory return cached immutable instances keyed by intrinsic state?
    weight: 3
    signals:
    - factory method returning existing instance from cache
    - pool or registry keyed by intrinsic properties
  - id: is-intrinsic-shared-state-separated-from-extrinsic-caller-provid
    prompt: Is intrinsic (shared) state separated from extrinsic (caller-provided) state?
    weight: 3
    signals:
    - shared object holds only immutable intrinsic data
    - extrinsic state passed as parameter at usage time
  - id: are-flyweight-objects-truly-immutable-with-no-mutable-fields
    prompt: Are flyweight objects truly immutable with no mutable fields?
    weight: 2
    signals:
    - frozen dataclass or readonly fields on shared instances
    - no setter methods on pooled objects
  - id: does-the-pool-have-an-eviction-policy-or-weak-references-to-prev
    prompt: Does the pool have an eviction policy or weak references to prevent unbounded growth?
    weight: 1
    signals:
    - WeakValueDictionary or WeakHashMap for pool
    - LRU eviction or size limit on instance cache
analysis:
  testing:
    summary: Verify that shared intrinsic state is reused across instances and that extrinsic state is correctly separated.
    unit:
    - Request the same flyweight key twice and assert both references point to the same object (identity equality)
    - Request different flyweight keys and assert distinct objects are returned
    - Verify intrinsic (shared) state is immutable — attempts to modify it should fail or have no effect on other consumers
    - Test that extrinsic state passed at call time does not contaminate the shared flyweight instance
    additional_sections:
    - title: Memory Tests
      items:
      - Create a large number of flyweight instances with the same key and verify memory usage remains constant (not linear)
      - Compare memory footprint with and without flyweight sharing to confirm the pattern provides measurable savings
    - title: Thread Safety Tests
      items:
      - Access the flyweight factory from multiple threads concurrently and verify no duplicate instances are created for the same key
      - Assert that concurrent reads of shared intrinsic state produce consistent results without synchronization from the caller
