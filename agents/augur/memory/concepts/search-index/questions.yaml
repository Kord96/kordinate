questions:
  - q: "Is there a dedicated search engine or inverted index powering full-text queries?"
    weight: 3
    signals: ["Elasticsearch or Solr client", "Meilisearch or Typesense index", "tantivy or whoosh index creation"]
  - q: "Are index mappings or schemas defined with analyzers and tokenizers?"
    weight: 3
    signals: ["field mappings with text analyzers", "custom tokenizer configuration", "index schema with field types"]
  - q: "Does the system support faceted filtering or relevance-scored results?"
    weight: 2
    signals: ["aggregation queries for facets", "boost or score parameters", "facet counts in search response"]
  - q: "Is there a sync mechanism keeping the search index consistent with the primary data store?"
    weight: 1
    signals: ["indexing job or CDC pipeline", "reindex command or task", "index lag monitoring"]
threshold: 6
