schema: augur-concept-meta/v2
concept: bloom-filter
kind: pattern
summary: Bloom Filter architectural pattern
taxonomy:
  type: pattern
  categories:
  - data
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-there-a-data-structure-that-supports-add-and-membership-test-
    prompt: Is there a data structure that supports add and membership-test operations but can return false positives while guaranteeing no false negatives?
    weight: 3
    signals:
    - probabilistic membership test
    - might_contain()
    - false positives acceptable
  - id: does-the-implementation-use-multiple-independent-hash-functions-
    prompt: Does the implementation use multiple independent hash functions applied to the same element against a fixed-size bit array?
    weight: 3
    signals:
    - multiple hash functions
    - bit array
    - k hashes into m bits
  - id: is-a-positive-membership-result-followed-by-a-definitive-seconda
    prompt: Is a positive membership result followed by a definitive secondary lookup (database, cache) to confirm?
    weight: 2
    signals:
    - secondary verification after positive
    - bloom check then DB lookup
    - two-stage membership
  - id: is-there-a-configurable-false-positive-rate-parameter-that-deter
    prompt: Is there a configurable false positive rate parameter that determines the filter's size and hash count?
    weight: 2
    signals:
    - error_rate parameter
    - configurable false positive rate
    - sizing based on expected elements
analysis:
  testing:
    summary: Verify zero false negatives, acceptable false positive rates, and correct sizing behavior.
    unit:
    - Insert known elements and assert membership queries return true for all (no false negatives)
    - Query elements never inserted and verify the false positive rate stays within configured bounds
    - 'Test filter capacity: after inserting the expected number of elements, assert error rate matches design'
    integration:
    - 'Use the bloom filter as a cache guard: verify cache lookups are skipped for definitely-absent keys'
    - Test serialization and deserialization of the filter for persistence or transfer
    failure_injection:
    - Overfill the filter beyond designed capacity and measure false positive rate degradation
