schema: augur-concept-meta/v2
concept: metrics-instrumentation
kind: pattern
summary: Metrics Instrumentation architectural pattern
taxonomy:
  type: pattern
  categories:
  - observability
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
traits:
  testable: true
  observable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-metrics-defined-using-typed-metric-classes-counter-gauge-his
    prompt: Are metrics defined using typed metric classes (Counter, Gauge, Histogram) and registered at startup?
    weight: 3
    signals:
    - Counter('http_requests_total')
    - Histogram.new_float64()
    - MustRegister()
  - id: is-a-metrics-endpoint-exposed-for-prometheus-scraping
    prompt: Is a /metrics endpoint exposed for Prometheus scraping?
    weight: 3
    signals:
    - /metrics HTTP endpoint
    - prometheus exposition format
    - metrics_handler route
  - id: do-metric-names-follow-a-structured-naming-convention-with-names
    prompt: Do metric names follow a structured naming convention with namespace, subsystem, and unit?
    weight: 2
    signals:
    - http_requests_total
    - request_duration_seconds
    - namespace_subsystem_name_unit
  - id: are-histogram-buckets-explicitly-configured-to-match-the-expecte
    prompt: Are histogram buckets explicitly configured to match the expected distribution rather than using defaults?
    weight: 2
    signals:
    - buckets=[.01, .05, .1, .5, 1, 5]
    - custom bucket boundaries
    - tuned histogram
analysis:
  testing:
    summary: Verify that metrics are emitted correctly, labels are bounded, and the scrape endpoint returns valid output.
    unit:
    - Trigger an operation and assert the corresponding counter increments by exactly one
    - Record a known duration and verify the histogram observation falls in the expected bucket
    - 'Verify metric names follow the naming convention: `<namespace>_<subsystem>_<name>_<unit>`'
    integration:
    - Scrape the `/metrics` endpoint and parse the output as valid Prometheus exposition format
    - Exercise all instrumented code paths and verify every declared metric appears in the scrape output
    - 'Assert that label cardinality is bounded: no user IDs, request IDs, or unbounded strings as label values'
    additional_sections:
    - title: Regression Tests
      items:
      - Add a test that fails if a new metric is added without documentation or if naming conventions are violated
      - Verify that no metrics are created inside request handlers (all should be registered at startup)
  monitoring:
    summary: Monitor the metrics pipeline itself to ensure instrumentation is healthy and scrape targets are reachable.
    metrics:
    - name: scrape_duration_seconds
      kind: histogram
      description: time Prometheus takes to scrape each target
    - name: scrape_samples_scraped
      kind: gauge
      description: number of metric samples returned per scrape
    - name: up
      kind: gauge
      description: whether the scrape target is reachable (1=up, 0=down)
    - name: prometheus_target_interval_length_seconds
      kind: summary
      description: actual scrape interval vs configured
    alerts:
    - Scrape target down (`up == 0`) for longer than two scrape intervals
    - Scrape duration approaching the scrape interval (risk of overlap or timeout)
    - Sudden drop in scraped sample count (metrics may have been deregistered or endpoint broken)
    - High-cardinality label detected (metric sample count growing unboundedly)
