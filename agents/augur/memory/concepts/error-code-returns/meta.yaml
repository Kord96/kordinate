  - id: do-functions-return-1-0-null-or-magic-sentinel-values-to-indicat
    prompt: Do functions return -1, 0, null, or magic sentinel values to indicate errors in a language with exceptions?
    weight: 3
    signals:
    - return -1 or return None for error in Python/Java
    - magic sentinel like return -999 for missing data
  - id: do-callers-check-return-values-with-comparisons-if-result-1-inst
    prompt: Do callers check return values with comparisons (if result == -1) instead of try/catch?
    weight: 3
    signals:
    - if result == -1 or if result is None checks after calls
    - error checking via comparison rather than exception handling
  - id: is-null-none-returned-for-both-not-found-and-error-occurred-with
    prompt: Is null/None returned for both not-found and error-occurred with no way to distinguish?
    weight: 2
    signals:
    - return None for missing and for failure
    - caller cannot distinguish not-found from error
  - id: are-error-code-checks-inconsistent-with-some-callers-checking-an
    prompt: Are error code checks inconsistent, with some callers checking and others ignoring?
    weight: 1
    signals:
    - some call sites check return, others proceed unchecked
    - inconsistent error handling across callers
