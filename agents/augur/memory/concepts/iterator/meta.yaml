schema: augur-concept-meta/v2
concept: iterator
kind: pattern
summary: Iterator architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-classes-implement-the-iterator-protocol-with-iter-next-iterat
    prompt: Do classes implement the iterator protocol with __iter__/__next__, Iterator trait, or Symbol.iterator?
    weight: 3
    signals:
    - __iter__ and __next__
    - impl Iterator
    - Symbol.iterator
  - id: are-elements-produced-lazily-on-demand-rather-than-pre-computed-
    prompt: Are elements produced lazily on demand rather than pre-computed into a full collection?
    weight: 3
    signals:
    - yield in generator
    - next() returns one element
    - lazy evaluation
  - id: are-iterator-combinators-like-map-filter-and-chain-used-to-compo
    prompt: Are iterator combinators like map, filter, and chain used to compose traversals without materializing intermediate collections?
    weight: 2
    signals:
    - map/filter chain
    - itertools.chain
    - Stream.of().filter().map()
  - id: is-resource-cleanup-handled-on-early-termination-of-iteration
    prompt: Is resource cleanup handled on early termination of iteration?
    weight: 1
    signals:
    - finally in generator
    - cleanup on StopIteration
    - context manager for iterator
analysis:
  testing:
    summary: Verify lazy evaluation, correct termination, and composability of iterator implementations.
    unit:
    - Assert that the iterator produces elements on demand without materializing the entire collection
    - 'Verify correct termination: `StopIteration` is raised (or `None` returned) when elements are exhausted'
    - 'Test early termination: break out of iteration partway and confirm no resource leaks (generators with `finally` cleanup)'
    additional_sections:
    - title: Composition Tests
      items:
      - Chain `map`, `filter`, and `take` on the iterator and verify only the expected elements are produced
      - Assert that intermediate collections are not materialized during chained operations
    - title: Edge Cases
      items:
      - Test iteration over an empty collection (immediate termination, no errors)
      - Test iteration over a single-element collection
      - Verify that iterating the same iterator twice produces no elements on the second pass (single-use semantics)
