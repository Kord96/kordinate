schema: augur-concept-meta/v2
concept: failure-cascade
kind: flow-shape
summary: Failure cascade flow — propagation of failure through dependent components
taxonomy:
  type: flow-shape
  categories:
  - resilience
  - integration
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
diagnostic_questions:
  threshold: 2
  questions:
  - id: does-a-component-depend-synchronously-on-another-that-depends-on
    prompt: Does a component depend synchronously on another that depends on a third (A→B→C chain)?
    weight: 1
  - id: are-there-external-dependency-calls-without-circuit-breakers-or-
    prompt: Are there external dependency calls without circuit breakers or timeouts?
    weight: 1
  - id: could-a-slow-downstream-service-block-callers-and-exhaust-thread
    prompt: Could a slow downstream service block callers and exhaust thread/connection pools?
    weight: 1
  - id: do-health-checks-report-unhealthy-when-a-dependency-is-down-casc
    prompt: Do health checks report unhealthy when a dependency is down (cascading health failure)?
    weight: 1
