schema: augur-concept-meta/v2
concept: select-star
kind: anti-pattern
summary: Select Star anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
traits:
  testable: true
  observable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-select-appear-in-production-query-paths-rather-than-explici
    prompt: Does SELECT * appear in production query paths rather than explicit column lists?
    weight: 3
    signals:
    - SELECT * in raw SQL strings
    - Model.objects.all() without .only() or .values()
    - findAll without projection parameter
  - id: are-orm-queries-loading-full-objects-when-only-one-or-two-fields
    prompt: Are ORM queries loading full objects when only one or two fields are needed by the caller?
    weight: 3
    signals:
    - full model loaded but only name accessed
    - no .defer() or .only() on queryset
    - repository returns entire entity for summary endpoint
  - id: is-query-response-payload-significantly-larger-than-what-the-con
    prompt: Is query response payload significantly larger than what the consuming code actually uses?
    weight: 2
    signals:
    - wide row fetched but few columns used
    - serializer outputs subset of loaded fields
    - unnecessary columns transferred over wire
  - id: are-index-only-scans-prevented-because-queries-request-all-colum
    prompt: Are index-only scans prevented because queries request all columns?
    weight: 1
    signals:
    - query plan shows full table scan
    - covering index not used due to SELECT *
    - database I/O higher than expected
analysis:
  testing:
    summary: '# Testing - Lint all raw SQL strings for `SELECT *` and flag any occurrence outside of ad-hoc/debug contexts - Test that ORM queries use `.only()`, `.values()`, or `.defer()` by asserting the generated SQL - Write integration tests comparing query plans with and without column projection to verify index usage - Test repository methods to confirm they return DTOs or projections, not full entity objects for list endpoints - Verify that adding a column to a table does not silently inflate existing query payloads - Assert that NoSQL queries include projection parameters (`{field: 1}`) rather than returning full documents - Run performance benchmarks comparing `SELECT *` vs explicit column queries on representative data volumes'
  monitoring:
    summary: Track query payload sizes and column usage to detect unnecessary data transfer from SELECT * patterns.
    metrics:
    - name: query_response_bytes
      kind: histogram
      description: payload size per query path, surfaces oversized result sets
    - name: query_columns_fetched
      kind: gauge
      description: number of columns returned per query versus columns actually consumed
    - name: query_slow_log_select_star_total
      kind: counter
      description: SELECT * queries appearing in slow query logs
    - name: query_index_only_scan_bypass_total
      kind: counter
      description: queries that miss index-only scans due to requesting all columns
    - name: db_network_io_bytes_total
      kind: counter
      description: bytes transferred between application and database
    alerts:
    - Query response payload significantly larger than the caller's actual column usage
    - SELECT * pattern detected in production slow query logs
    - Database network I/O elevated beyond expected baseline under normal load
    - Memory usage spikes correlated with large result set materialization
