schema: augur-concept-meta/v2
concept: environment-parity-gap
kind: anti-pattern
summary: Environment Parity Gap anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-the-project-use-a-different-database-engine-in-development-
    prompt: Does the project use a different database engine in development than in production?
    weight: 3
    signals:
    - SQLite in dev config, PostgreSQL in prod config
    - different DB driver imports per environment
  - id: are-there-environment-conditional-code-paths-that-change-busines
    prompt: Are there environment-conditional code paths that change business logic, not just configuration?
    weight: 3
    signals:
    - if env == development blocks with different behavior
    - ENV-gated code that skips validation or auth in dev
  - id: are-critical-infrastructure-dependencies-replaced-with-in-memory
    prompt: Are critical infrastructure dependencies replaced with in-memory fakes in development?
    weight: 2
    signals:
    - in-memory queue instead of Kafka in dev
    - local filesystem instead of S3 in development
  - id: do-tests-pass-locally-but-fail-in-ci-due-to-environment-differen
    prompt: Do tests pass locally but fail in CI due to environment differences?
    weight: 1
    signals:
    - CI-only test failures not reproducible locally
    - works on my machine incidents in postmortems
