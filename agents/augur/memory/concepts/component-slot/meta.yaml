schema: augur-concept-meta/v2
concept: component-slot
kind: pattern
summary: Component Slot — parent-controlled content injection into child components
taxonomy:
  type: pattern
  categories:
  - frontend
  - design
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-a-component-define-named-insertion-points-where-parent-prov
    prompt: Does a component define named insertion points where parent-provided content is rendered?
    weight: 3
    signals:
    - named slot
    - content projection point
    - v-slot or ng-content or slot element
  - id: does-a-child-component-pass-data-back-to-the-parent-through-scop
    prompt: Does a child component pass data back to the parent through scoped slots or render props?
    weight: 3
    signals:
    - scoped slot data
    - render prop function
    - slot props passed to parent
  - id: are-there-compound-components-where-sub-components-share-context
    prompt: Are there compound components where sub-components share context and compose within a root?
    weight: 2
    signals:
    - compound component pattern
    - Root/Trigger/Content composition
    - shared context between sub-components
  - id: does-the-component-provide-default-content-for-optional-slots-as
    prompt: Does the component provide default content for optional slots as a fallback?
    weight: 1
    signals:
    - default slot content
    - fallback rendering
    - optional slot with default
