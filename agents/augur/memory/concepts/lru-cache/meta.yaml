schema: augur-concept-meta/v2
concept: lru-cache
kind: pattern
summary: LRU Cache architectural pattern
taxonomy:
  type: pattern
  categories:
  - data
  - infrastructure
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
traits:
  testable: true
  observable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-there-a-bounded-cache-with-explicit-maxsize-or-capacity-limit
    prompt: Is there a bounded cache with explicit maxsize or capacity limiting the number of entries?
    weight: 3
    signals:
    - maxsize parameter
    - capacity limit
    - LRUCache with bound
  - id: does-the-cache-evict-the-least-recently-used-entry-when-it-reach
    prompt: Does the cache evict the least-recently-used entry when it reaches capacity?
    weight: 3
    signals:
    - LRU eviction
    - evict oldest accessed
    - linked list + hash map
  - id: are-cache-hit-miss-rates-tracked-via-metrics-or-cache-info
    prompt: Are cache hit/miss rates tracked via metrics or cache_info()?
    weight: 2
    signals:
    - cache_info()
    - hit rate metric
    - cache miss counter
  - id: is-there-a-cache-invalidation-strategy-such-as-ttl-explicit-inva
    prompt: Is there a cache invalidation strategy such as TTL, explicit invalidation, or versioned keys?
    weight: 1
    signals:
    - TTL on cache entries
    - explicit invalidation
    - versioned cache key
analysis:
  testing:
    summary: Verify eviction order, cache correctness, and behavior under capacity and concurrency.
    unit:
    - Fill the cache to capacity, add one more entry, and assert the least-recently-used entry was evicted
    - Access an entry to make it recently used, then fill the cache, and verify it survives eviction
    - 'Verify cache keys are deterministic: equivalent inputs produce cache hits, not duplicate entries'
    additional_sections:
    - title: Concurrency Tests
      items:
      - Access the cache from multiple threads simultaneously and verify no corrupted entries or lost updates
      - Verify that concurrent reads and writes do not deadlock
    - title: Edge Cases
      items:
      - Test cache with `maxsize=1` and verify correct single-entry behavior
      - Cache a mutable object, modify it externally, and verify the cache returns the original (defensive copy check)
      - 'Verify TTL-based invalidation: entries expire after the configured duration'
  monitoring:
    summary: Track hit rates, eviction frequency, and cache size to detect misconfigured capacity or degraded workloads.
    metrics:
    - name: '`cache_hit_total` / `cache_miss_total` (counters) — hit rate is the primary effectiveness signal'
      kind: other
      description: ''
    - name: cache_evictions_total
      kind: counter
      description: evictions due to capacity limit
    - name: cache_size
      kind: gauge
      description: current number of entries in the cache
    - name: cache_lookup_duration_seconds
      kind: histogram
      description: latency of cache get operations
    alerts:
    - Hit rate dropping below an acceptable threshold (cache is not effective for the workload)
    - Eviction rate spiking (cache too small for the working set)
    - Cache size stuck at maximum with high eviction rate (capacity increase needed)
    - Lookup latency increasing (potential lock contention or hash collision issues)
