questions:
  - q: "Are connections to external resources (database, cache, HTTP) managed through a pool with configured size limits?"
    weight: 3
    signals: ["pool_size configuration", "max_connections setting", "connection pool instantiation"]
  - q: "Are pooled connections validated or health-checked before being handed to callers?"
    weight: 2
    signals: ["test-on-borrow", "connection health check", "validation query before checkout"]
  - q: "Is there defined behavior for pool exhaustion (block with timeout, reject, or overflow)?"
    weight: 2
    signals: ["pool timeout on exhaustion", "overflow strategy", "connection wait queue"]
  - q: "Are connections always returned to the pool in both success and error paths?"
    weight: 2
    signals: ["connection return in finally", "pool checkin on error", "no leaked connections"]
threshold: 6
