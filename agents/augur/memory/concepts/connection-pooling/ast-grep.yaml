id: connection-pooling-sqlalchemy-py
language: Python
rule:
  pattern: create_engine($$$ARGS, pool_size=$SIZE, $$$REST)
---
id: connection-pooling-sqlalchemy-pool-py
language: Python
rule:
  pattern: create_engine($$$ARGS)
  has:
    pattern: pool_size=$SIZE
---
id: connection-pooling-redis-py
language: Python
rule:
  pattern: redis.ConnectionPool($$$ARGS)
---
id: connection-pooling-redis-blocking-py
language: Python
rule:
  pattern: redis.BlockingConnectionPool($$$ARGS)
---
id: connection-pooling-agent-ts
language: TypeScript
rule:
  pattern: new $AGENT({ keepAlive: true, $$$OPTS })
---
id: connection-pooling-pool-config-ts
language: TypeScript
rule:
  pattern: new Pool($$$CONFIG)
---
id: connection-pooling-new-per-request-py
language: Python
rule:
  inside:
    pattern: |
      def $FN($$$ARGS):
          $$$BODY
  pattern: $MODULE.connect($$$ARGS)
  constraints:
    MODULE:
      regex: '(psycopg2|pymysql|mysql|sqlite3|pymongo)'
