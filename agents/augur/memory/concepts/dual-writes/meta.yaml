schema: augur-concept-meta/v2
concept: dual-writes
kind: anti-pattern
summary: Dual Writes anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  observable: true
  distributed: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-a-single-method-write-to-a-database-and-publish-to-a-messag
    prompt: Does a single method write to a database and publish to a message broker without a transactional outbox?
    weight: 3
    signals:
    - db.save() followed by producer.send() in same function
    - commit() then notify() with separate error handling
  - id: can-either-the-database-write-or-the-message-publish-fail-indepe
    prompt: Can either the database write or the message publish fail independently, leaving inconsistent state?
    weight: 3
    signals:
    - separate try/catch for db write and event publish
    - no atomicity guarantee between the two writes
  - id: are-two-different-data-stores-written-in-sequence-within-the-sam
    prompt: Are two different data stores written in sequence within the same operation?
    weight: 2
    signals:
    - write to cache and database in same function
    - REST call to another service after local db write
  - id: is-there-an-absence-of-outbox-table-change-data-capture-or-trans
    prompt: Is there an absence of outbox table, change data capture, or transactional event publish?
    weight: 1
    signals:
    - no outbox table in schema
    - no Debezium or CDC pipeline configured
