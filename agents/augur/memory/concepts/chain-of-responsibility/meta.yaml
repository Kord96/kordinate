schema: augur-concept-meta/v2
concept: chain-of-responsibility
kind: pattern
summary: Chain of Responsibility architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-there-an-ordered-list-of-handler-objects-where-each-handler-c
    prompt: Is there an ordered list of handler objects where each handler can process a request or pass it to the next handler?
    weight: 3
    signals:
    - handler chain with next
    - ordered processor list
    - successor reference on handler
  - id: do-handlers-call-a-next-function-or-delegate-to-a-successor-to-c
    prompt: Do handlers call a next() function or delegate to a successor to continue the chain?
    weight: 3
    signals:
    - next() callback
    - call successor
    - pass to next handler
  - id: can-the-chain-be-reconfigured-handlers-added-or-removed-without-
    prompt: Can the chain be reconfigured (handlers added or removed) without modifying individual handler implementations?
    weight: 2
    signals:
    - dynamic chain construction
    - pipeline.add handler
    - middleware registration
  - id: is-there-a-fallback-or-default-handler-at-the-end-of-the-chain-f
    prompt: Is there a fallback or default handler at the end of the chain for unhandled requests?
    weight: 1
    signals:
    - terminal handler
    - default fallback at chain end
    - catch-all processor
analysis:
  testing:
    summary: Verify handler ordering, correct delegation through the chain, and that unhandled requests reach a terminal handler.
    unit:
    - Send a request matching the first handler and assert it is processed without reaching subsequent handlers
    - Send a request matching a middle handler and verify it passes through earlier handlers untouched
    - Send a request matching no handler and verify it reaches the default/terminal handler
    integration:
    - Assemble the full chain via configuration and verify end-to-end request routing for each handler type
    - 'Test dynamic chain modification: add or remove a handler at runtime and verify updated routing'
    failure_injection:
    - Inject an exception in a mid-chain handler and verify the chain either short-circuits with an error or skips to the next handler per policy
