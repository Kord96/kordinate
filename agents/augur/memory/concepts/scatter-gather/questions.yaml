threshold: 3
questions:
- q: Does the code send the same request to multiple services and aggregate responses?
  w: 2
- q: Is there parallel dispatch with timeout handling for slow responders?
  w: 2
  signals:
  - Promise.all
  - asyncio.gather
  - timeout
  - race
- q: Does an API endpoint call multiple backends to compose a single response?
  w: 1
- q: Is there partial result support (return what's available if some services are
    slow)?
  w: 1
  signals:
  - partial
  - allSettled
  - timeout
