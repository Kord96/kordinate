schema: augur-concept-meta/v2
concept: magic-numbers
kind: anti-pattern
summary: Magic Numbers/Strings anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-conditionals-or-function-arguments-contain-unexplained-numeri
    prompt: Do conditionals or function arguments contain unexplained numeric literals with no named constant?
    weight: 3
    signals:
    - if count > 42
    - sleep(3.5)
    - retry_limit = 5 inline
  - id: are-the-same-hardcoded-values-duplicated-across-multiple-files-w
    prompt: Are the same hardcoded values duplicated across multiple files without a shared constant definition?
    weight: 3
    signals:
    - same number in two conditionals
    - duplicated threshold across modules
  - id: do-array-indices-encode-business-meaning-without-a-named-accesso
    prompt: Do array indices encode business meaning without a named accessor or constant?
    weight: 2
    signals:
    - data[7]
    - row[3] used as address field
  - id: are-string-literals-used-as-identifiers-or-config-keys-in-multip
    prompt: Are string literals used as identifiers or config keys in multiple locations without a shared definition?
    weight: 2
    signals:
    - repeated string key across files
    - status == 'active' in multiple places
