schema: augur-concept-meta/v2
concept: correlation-id
kind: pattern
summary: Correlation ID architectural pattern
taxonomy:
  type: pattern
  categories:
  - observability
  - integration
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-middleware-generate-or-extract-a-unique-correlation-id-on-i
    prompt: Does middleware generate or extract a unique correlation ID on incoming requests and bind it to the request context?
    weight: 3
    signals:
    - request ID middleware
    - correlation ID extraction
    - generate ID if not present
  - id: is-the-correlation-id-propagated-in-headers-to-all-downstream-se
    prompt: Is the correlation ID propagated in headers to all downstream service calls?
    weight: 3
    signals:
    - X-Request-ID propagation
    - correlation header forwarding
    - ID in outbound request headers
  - id: are-all-log-entries-for-a-request-lifecycle-enriched-with-the-co
    prompt: Are all log entries for a request lifecycle enriched with the correlation ID?
    weight: 2
    signals:
    - structured log with request ID
    - MDC correlation binding
    - log context injection
  - id: is-the-correlation-id-propagated-across-async-boundaries-message
    prompt: Is the correlation ID propagated across async boundaries (message queues, background jobs)?
    weight: 1
    signals:
    - ID in message metadata
    - correlation across queue boundary
    - async context propagation
analysis:
  testing:
    summary: Verify end-to-end ID propagation, generation at the edge, and presence in logs and responses.
    unit:
    - Send a request without a correlation ID and verify the edge service generates one
    - Send a request with an existing correlation ID and verify it is preserved, not replaced
    - Assert the correlation ID appears in all log entries for the request
    integration:
    - Trace a request across multiple services and verify the same correlation ID appears in every service's logs
    - Verify the correlation ID is included in the response headers for client-side tracing
    - 'Test async flows: verify the correlation ID propagates through message queues and background jobs'
    failure_injection:
    - Remove the correlation ID middleware from one service and verify monitoring detects the propagation gap
  monitoring:
    summary: Track correlation ID propagation completeness and use them to trace request flows.
    metrics:
    - name: requests_without_correlation_id_total
      kind: counter
      description: requests missing a correlation ID (propagation gap)
    - name: correlation_hop_count
      kind: histogram
      description: number of services a correlation ID traverses
    - name: trace_completeness_ratio
      kind: gauge
      description: percentage of requests with full end-to-end correlation
    alerts:
    - Correlation ID missing rate exceeding threshold (broken propagation in a service)
    - Orphaned correlation IDs (started but no terminal service recorded completion)
    - Duplicate correlation IDs generated (collision in ID generation)
  deployment:
    summary: Ensure all services propagate correlation IDs consistently, especially during mixed-version rollouts.
    rollout_implications:
    - New services must propagate existing correlation IDs from incoming requests, not generate new ones
    - During rolling updates, both old and new versions must handle the correlation header identically
    - Log format changes must preserve the correlation ID field to maintain traceability across versions
    pre_deploy_checklist:
    - Verify the correlation ID header name is consistent across all services in the call chain
    - Confirm logging configuration includes the correlation ID in structured log fields
