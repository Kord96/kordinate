schema: augur-concept-meta/v2
concept: long-transactions
kind: anti-pattern
summary: Long Transactions anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  observable: true
  graphable: false
diagnostic_questions:
  threshold: 7
  questions:
  - id: do-database-transaction-blocks-contain-http-requests-external-ap
    prompt: Do database transaction blocks contain HTTP requests, external API calls, or other non-database I/O?
    weight: 3
    signals:
    - HTTP call inside transaction
    - external API in @Transactional
    - network request in BEGIN/COMMIT
  - id: do-transaction-boundaries-span-entire-request-handlers-rather-th
    prompt: Do transaction boundaries span entire request handlers rather than being scoped to specific database operations?
    weight: 3
    signals:
    - '@transaction.atomic on handler'
    - BEGIN at request start COMMIT at end
    - whole-request transaction
  - id: are-there-lock-wait-timeouts-or-idle-in-transaction-connections-
    prompt: Are there lock wait timeouts or idle-in-transaction connections visible in database metrics or logs?
    weight: 2
    signals:
    - lock wait timeout
    - idle in transaction
    - connection pool exhaustion
  - id: does-the-transaction-scope-include-operations-like-file-i-o-mess
    prompt: Does the transaction scope include operations like file I/O, message publishing, or email sending?
    weight: 2
    signals:
    - file write in transaction
    - publish message in transaction
    - email send in atomic block
