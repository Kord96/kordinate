schema: augur-concept-meta/v2
concept: bff
kind: pattern
summary: Backend for Frontend architectural pattern
taxonomy:
  type: pattern
  categories:
  - api
  - architectural
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-separate-api-layers-services-or-route-groups-dedicated
    prompt: Are there separate API layers, services, or route groups dedicated to specific frontend types (mobile, web, admin)?
    weight: 3
    signals:
    - /api/mobile/
    - /api/web/
    - mobile-bff service
    - frontend-specific routes
  - id: does-the-api-layer-aggregate-calls-to-multiple-backend-microserv
    prompt: Does the API layer aggregate calls to multiple backend microservices into a single response shaped for a specific frontend?
    weight: 3
    signals:
    - response aggregation
    - multiple backend calls merged
    - frontend-optimized payload
  - id: do-different-frontends-receive-differently-shaped-responses-from
    prompt: Do different frontends receive differently shaped responses from their dedicated API (e.g., compact for mobile, rich for web)?
    weight: 2
    signals:
    - response shaping per client
    - mobile gets compact payload
    - web gets richer data
  - id: is-the-frontend-specific-api-layer-free-of-business-logic-contai
    prompt: Is the frontend-specific API layer free of business logic, containing only aggregation and response formatting?
    weight: 2
    signals:
    - no business rules in BFF
    - aggregation only
    - shared logic stays in backend services
analysis:
  testing:
    summary: Test response aggregation, client-specific shaping, and graceful degradation when upstream services fail.
    unit:
    - Verify response shape matches the contract expected by the target client (web, mobile, etc.)
    - 'Test aggregation logic: multiple upstream responses are merged into the correct BFF response'
    - Assert that unnecessary fields are stripped and client-specific transformations are applied
    integration:
    - Wire the BFF against stubbed upstream services and verify end-to-end response assembly
    - Test with multiple BFF variants (web, mobile) against the same upstreams to verify different output shapes
    failure_injection:
    - Take down one upstream and verify the BFF returns a partial response with degradation markers rather than a full failure
  monitoring:
    summary: Track per-client BFF response times, upstream aggregation latency, and error rates.
    metrics:
    - name: bff_request_duration_seconds
      kind: histogram
      description: end-to-end latency per BFF endpoint and client type
    - name: bff_upstream_calls_total
      kind: counter
      description: calls to backend services per BFF request
    - name: bff_upstream_latency_seconds
      kind: histogram
      description: latency of individual upstream calls
    - name: bff_errors_total
      kind: counter
      description: errors by type (upstream failure, transformation error)
    alerts:
    - BFF latency exceeding client-specific SLA
    - Upstream service failure rate causing degraded BFF responses
    - Disproportionate error rate on one client-specific BFF versus others
  deployment:
    summary: Each BFF can be deployed independently, but coordinate with client release schedules.
    rollout_implications:
    - BFF changes may need to align with mobile app releases — old clients may call deprecated BFF endpoints
    - Deploy BFF updates before or alongside the client that depends on new response shapes
    - Multiple BFF instances can coexist — version endpoints to support gradual client migration
    pre_deploy_checklist:
    - Verify backward compatibility with the oldest supported client version
    - Confirm upstream service dependencies are available in the target environment
