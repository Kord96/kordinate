schema: augur-concept-meta/v2
concept: null-object
kind: pattern
summary: Null Object architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-no-op-implementations-of-interfaces-nulllogger-noopcac
    prompt: Are there no-op implementations of interfaces (NullLogger, NoOpCache) used as defaults instead of null checks?
    weight: 3
    signals:
    - NullLogger class
    - NoOpCache implements Cache
    - DevNull writer
  - id: do-call-sites-depend-on-the-interface-without-checking-whether-t
    prompt: Do call sites depend on the interface without checking whether they received a real or null implementation?
    weight: 3
    signals:
    - no if x is None guard
    - polymorphic dispatch
    - same interface real or null
  - id: are-null-objects-stateless-and-safe-to-share-as-singletons
    prompt: Are null objects stateless and safe to share as singletons?
    weight: 2
    signals:
    - singleton null object
    - stateless no-op
    - shared default instance
  - id: do-null-objects-implement-the-full-interface-contract-not-just-a
    prompt: Do null objects implement the full interface contract, not just a subset of methods?
    weight: 2
    signals:
    - all interface methods implemented
    - no NotImplementedError
    - complete contract
analysis:
  testing:
    summary: Verify that null objects satisfy the full interface contract and behave identically to real implementations from the caller's perspective.
    unit:
    - Assert every interface method is implemented and returns the expected neutral value (empty list, zero, no-op)
    - 'Verify null objects are stateless: calling methods multiple times produces the same result with no side effects'
    - Confirm call sites work identically whether injected with the real implementation or the null object
    - Test that null objects do not throw on any valid input, including edge cases like empty strings or None arguments
    integration:
    - Wire null objects into the DI container and verify the application starts and runs without null-pointer errors
    - Substitute null loggers/metrics in integration tests to confirm no code path depends on logging side effects
    - Validate that partial null implementations (if any exist) are caught by interface conformance tests
    additional_sections:
    - title: Design Verification
      items:
      - Ensure no code path inspects the concrete type to distinguish null objects from real ones (breaks polymorphism)
      - Confirm null objects used in production defaults do not silently hide failures that should surface
