schema: augur-concept-meta/v2
concept: bulkhead
kind: pattern
summary: Bulkhead architectural pattern
taxonomy:
  type: pattern
  categories:
  - resilience
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-each-external-dependency-have-its-own-isolated-resource-poo
    prompt: Does each external dependency have its own isolated resource pool (thread pool, connection pool, semaphore) with a bounded size?
    weight: 3
    signals:
    - per-dependency pool
    - separate thread pool per service
    - isolated connection pools
  - id: when-a-resource-pool-is-exhausted-does-the-system-reject-request
    prompt: When a resource pool is exhausted, does the system reject requests immediately (fast fail) rather than queuing unboundedly?
    weight: 3
    signals:
    - rejection on pool exhaustion
    - fast fail policy
    - bounded queue with rejection
  - id: are-pool-sizes-configured-independently-per-dependency-based-on-
    prompt: Are pool sizes configured independently per dependency based on expected load and criticality?
    weight: 2
    signals:
    - per-dependency pool sizing
    - independent capacity config
    - critical services get larger pools
  - id: are-metrics-exposed-per-pool-showing-active-idle-waiting-and-rej
    prompt: Are metrics exposed per pool showing active, idle, waiting, and rejected counts?
    weight: 2
    signals:
    - per-pool metrics
    - rejected count monitoring
    - pool utilization observability
analysis:
  testing:
    summary: Confirm that resource pools are truly isolated and that exhaustion of one pool does not affect others.
    unit:
    - 'Test pool isolation: exhaust one dependency''s pool and assert that requests to other dependencies still succeed'
    - 'Verify rejection behavior: when a pool reaches its limit, assert new requests receive a fast-fail rejection, not queue indefinitely'
    - 'Test pool sizing: configure a pool with N slots, submit N+1 concurrent requests, and assert exactly one is rejected'
    - 'Assert per-pool metrics: active count, idle count, and rejected count are accurate after a burst of requests'
    integration:
    - Run concurrent load against multiple real dependencies with separate bulkhead pools and verify no cross-contamination
    - Test that a slow dependency saturates only its own pool while other dependency calls maintain normal latency
    - Verify dynamic pool resizing if supported — change pool size at runtime and confirm new limits take effect
    failure_injection:
    - Simulate a dependency that never responds and verify its pool fills to capacity while other pools remain healthy
    - Inject a burst of requests exceeding all pool capacities simultaneously and confirm each pool rejects independently
    - Kill a dependency mid-request for all in-flight pool slots and verify pool resources are reclaimed after timeout
  monitoring:
    summary: Track per-pool utilization and rejection rates to detect resource exhaustion before it cascades.
    metrics:
    - name: bulkhead_pool_active
      kind: gauge
      description: currently active slots per pool
    - name: bulkhead_pool_available
      kind: gauge
      description: remaining capacity per pool
    - name: bulkhead_rejections_total
      kind: counter
      description: requests rejected due to pool exhaustion
    - name: bulkhead_wait_duration_seconds
      kind: histogram
      description: time spent waiting for a pool slot
    alerts:
    - Pool utilization consistently above 80% (approaching exhaustion)
    - Rejection rate exceeding threshold for any single pool
    - Wait duration p99 exceeding acceptable latency (pool undersized)
    - Multiple pools exhausting simultaneously (systemic resource pressure)
  deployment:
    summary: Pool size changes and connection draining must be coordinated to avoid resource exhaustion during rollout.
    rollout_implications:
    - Reducing pool sizes during rollout can cause immediate rejection spikes if in-flight requests exceed the new limit
    - New pods starting with fresh pools must warm up connections — expect higher latency during the initial requests
    - Rolling restart temporarily reduces total pool capacity across the fleet — size pools to handle full load with one fewer pod
    - Connection draining must complete before pod termination — active connections in a pool that are forcibly closed cause client errors
    pre_deploy_checklist:
    - Verify pool size changes are gradual (not halving capacity in one step) to avoid rejection spikes
    - Confirm terminationGracePeriodSeconds allows full connection draining per pool
    - Check that monitoring is in place for per-pool rejection rates during the rollout window
