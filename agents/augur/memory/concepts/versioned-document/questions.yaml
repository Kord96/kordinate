questions:
  - q: "Are document revisions stored as immutable snapshots or diffs with a traversable history?"
    weight: 3
    signals: ["revisions table with full snapshots", "diff-based change storage", "version history array on document"]
  - q: "Is there a mechanism for resolving conflicts when concurrent edits occur?"
    weight: 3
    signals: ["CRDT or OT library for merge", "three-way merge logic", "conflict resolution strategy defined"]
  - q: "Can the system restore or roll back to any previous version of a document?"
    weight: 2
    signals: ["restore() or rollback() method", "snapshot materialization from revision chain", "version pinning or checkout"]
  - q: "Are diffs or patches computed between versions for efficient storage and display?"
    weight: 1
    signals: ["diff_match_patch or deepdiff usage", "patch application for version reconstruction", "change highlighting in UI"]
threshold: 6
