schema: augur-concept-meta/v2
concept: rbac
kind: pattern
summary: Role-Based Access Control architectural pattern
taxonomy:
  type: pattern
  categories:
  - security
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-there-a-role-permission-mapping-that-associates-roles-with-sp
    prompt: Is there a role-permission mapping that associates roles with specific permissions?
    weight: 3
    signals:
    - role-permission table
    - permission set per role
    - ClusterRole with rules defining verbs and resources
  - id: are-permission-checks-enforced-at-the-middleware-or-guard-layer-
    prompt: Are permission checks enforced at the middleware or guard layer rather than scattered in business logic?
    weight: 3
    signals:
    - '@requires_role decorator'
    - authorize middleware on routes
    - CanActivate guard checking roles
  - id: are-roles-assigned-to-users-or-groups-through-an-explicit-assign
    prompt: Are roles assigned to users or groups through an explicit assignment mechanism?
    weight: 2
    signals:
    - user-role assignment table
    - RoleBinding binding role to subject
    - role granted via admin interface
  - id: does-the-system-enforce-least-privilege-defaults-for-new-users-o
    prompt: Does the system enforce least-privilege defaults for new users or service accounts?
    weight: 1
    signals:
    - default role is viewer or readonly
    - namespace-scoped Role preferred over ClusterRole
    - minimal permissions on creation
analysis:
  testing:
    summary: Verify permission enforcement at every access point, role hierarchy correctness, and least-privilege defaults.
    unit:
    - For each role, verify access to permitted endpoints succeeds and access to forbidden endpoints returns 403
    - 'Test role hierarchy: admin inherits editor permissions, editor inherits viewer permissions'
    - Verify the default role for new users is the most restrictive (viewer or equivalent)
    - Test permission changes take effect immediately (no stale role cache serving outdated access)
    integration:
    - Assign a role via the admin API, then verify the user can immediately access the newly permitted endpoints
    - Revoke a role and verify the user is immediately denied access on the next request
    - Test that API-level enforcement matches UI-level enforcement (no cosmetic-only access control)
    additional_sections:
    - title: Authorization Tests
      items:
      - Attempt to access a protected resource with no authentication and verify 401
      - Attempt to access a resource with valid authentication but insufficient role and verify 403
      - 'Test role escalation: verify a user cannot assign themselves a higher role without proper authorization'
      - 'Verify Kubernetes RBAC: namespace-scoped Roles restrict access to only the intended namespace'
