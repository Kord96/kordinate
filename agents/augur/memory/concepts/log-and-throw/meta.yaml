diagnostic_questions:
  threshold: 7
  questions:
  - id: do-catch-blocks-both-log-the-exception-at-error-level-and-rethro
    prompt: Do catch blocks both log the exception at error level and rethrow it in the same block?
    weight: 3
    signals:
    - logger.error(e); raise e
    - log(e); throw e
    - catch log and rethrow
  - id: is-the-same-exception-logged-at-multiple-layers-as-it-propagates
    prompt: Is the same exception logged at multiple layers as it propagates up the call stack?
    weight: 3
    signals:
    - duplicate error entries
    - same exception logged at each layer
    - multiple stack depths
  - id: do-error-count-dashboards-show-inflated-numbers-that-are-multipl
    prompt: Do error count dashboards show inflated numbers that are multiples of actual failure occurrences?
    weight: 2
    signals:
    - error rate inflation
    - 3x actual failures
    - duplicate error metrics
  - id: do-catch-blocks-log-the-full-stack-trace-and-then-rethrow-the-sa
    prompt: Do catch blocks log the full stack trace and then rethrow the same exception unchanged?
    weight: 2
    signals:
    - log stack trace then throw
    - catch rethrow unchanged
    - no wrapping on rethrow
