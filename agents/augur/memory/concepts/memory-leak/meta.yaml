schema: augur-concept-meta/v2
concept: memory-leak
kind: anti-pattern
summary: Memory Leak anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  observable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-event-listeners-or-subscriptions-registered-without-correspo
    prompt: Are event listeners or subscriptions registered without corresponding removal in teardown or cleanup?
    weight: 3
    signals:
    - addEventListener without removeEventListener
    - on() without off()
    - setInterval never cleared
  - id: do-in-memory-collections-dicts-lists-caches-grow-without-bounds-
    prompt: Do in-memory collections (dicts, lists, caches) grow without bounds or eviction in long-running processes?
    weight: 3
    signals:
    - unbounded dict.append in loop
    - global cache with no max size
    - no TTL on cache entries
  - id: are-resources-file-handles-connections-sockets-opened-without-co
    prompt: Are resources (file handles, connections, sockets) opened without context managers or try-finally cleanup?
    weight: 2
    signals:
    - open() without with
    - missing close()
    - no using block
  - id: do-circular-references-exist-that-could-prevent-garbage-collecti
    prompt: Do circular references exist that could prevent garbage collection in reference-counted runtimes?
    weight: 2
    signals:
    - object A references B references A
    - parent-child circular ref
    - no weakref for back-references
