  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-servers-configured-manually-via-ssh-with-no-infrastructure-a
    prompt: Are servers configured manually via SSH with no Infrastructure as Code backing them?
    weight: 3
    signals:
    - ssh prod-server in deploy scripts
    - manual systemctl commands on server
    - no Terraform or Ansible in repository
  - id: are-config-files-edited-directly-on-the-server-rather-than-manag
    prompt: Are config files edited directly on the server rather than managed through version-controlled IaC?
    weight: 3
    signals:
    - vim or sed edits on production server
    - config changes applied via ad-hoc SSH
    - undocumented manual server tweaks
  - id: is-server-setup-knowledge-held-by-specific-individuals-rather-th
    prompt: Is server setup knowledge held by specific individuals rather than codified?
    weight: 2
    signals:
    - ask Dave for server config
    - setup instructions not documented
    - tribal knowledge for server provisioning
  - id: has-configuration-drifted-between-nominally-identical-servers
    prompt: Has configuration drifted between nominally identical servers?
    weight: 1
    signals:
    - servers behave differently despite same role
    - security patches applied inconsistently
    - state divergence between instances
