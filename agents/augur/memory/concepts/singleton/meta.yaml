schema: augur-concept-meta/v2
concept: singleton
kind: pattern
summary: Singleton architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-there-a-class-with-a-private-constructor-and-a-static-getinst
    prompt: Is there a class with a private constructor and a static getInstance method for lazy initialization?
    weight: 3
    signals:
    - private constructor with static getInstance
    - _instance class variable caching single instance
    - sync.Once with package-level var instance
  - id: is-instance-creation-thread-safe-to-prevent-duplicate-instantiat
    prompt: Is instance creation thread-safe to prevent duplicate instantiation?
    weight: 2
    signals:
    - double-checked locking on creation
    - sync.Once for safe initialization
    - module-level import guaranteeing single creation
  - id: can-the-singleton-instance-be-replaced-or-reset-for-testing
    prompt: Can the singleton instance be replaced or reset for testing?
    weight: 2
    signals:
    - reset method for test teardown
    - injectable singleton via DI container
    - test hook to override instance
  - id: is-the-singleton-justified-over-dependency-injection-for-the-use
    prompt: Is the singleton justified over dependency injection for the use case?
    weight: 1
    signals:
    - clear rationale for single instance
    - genuinely process-wide resource
    - not used as global grab-bag
  - id: is-the-singleton-scoped-to-a-single-responsibility-rather-than-a
    prompt: Is the singleton scoped to a single responsibility rather than accumulating unrelated concerns?
    weight: 1
    signals:
    - singleton manages one resource
    - not mixing config, logger, and cache
    - focused singleton purpose
analysis:
  testing:
    summary: '# Testing - Test that the singleton can be reset or replaced in tests — no global state leaking between test cases - Verify thread-safe initialization by accessing the singleton from multiple threads concurrently - Test lifecycle management: creation on first access, optional teardown for cleanup - Assert that subclassing is either properly supported or explicitly prevented - Use dependency injection in tests to swap the singleton with a test double - Verify that the singleton does not accumulate mutable state that makes tests order-dependent - Test that singleton initialization handles failure gracefully (no partially initialized instance cached)'
