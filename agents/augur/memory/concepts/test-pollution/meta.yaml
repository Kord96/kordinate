schema: augur-concept-meta/v2
concept: test-pollution
kind: anti-pattern
summary: Test Pollution anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-tests-modify-global-state-module-level-variables-singletons-o
    prompt: Do tests modify global state, module-level variables, singletons, or environment variables without restoring them in teardown?
    weight: 3
    signals:
    - global state mutation in tests
    - missing tearDown or tearDownClass
    - env vars set without restoration
  - id: are-there-shared-fixtures-or-class-level-state-that-is-mutated-a
    prompt: Are there shared fixtures or class-level state that is mutated across test methods without cleanup?
    weight: 3
    signals:
    - shared fixture mutation
    - setUpClass without tearDownClass
    - list append in shared fixture
  - id: do-tests-pass-individually-but-fail-when-run-together-or-in-a-di
    prompt: Do tests pass individually but fail when run together or in a different order?
    weight: 2
    signals:
    - order-dependent test failures
    - pass alone fail in suite
    - flaky depending on execution order
  - id: is-database-state-or-cache-state-carried-over-between-test-cases
    prompt: Is database state or cache state carried over between test cases without reset or rollback?
    weight: 2
    signals:
    - database not reset between tests
    - cache not cleared
    - previous test data affecting next test
analysis:
  testing:
    summary: '# Testing - Run tests in random order (`pytest-randomly`, `--randomize-order`) to detect order-dependent failures - Verify that every `setUp`/`setUpClass` has a matching `tearDown`/`tearDownClass` restoring state - Test each test case in isolation and as part of the full suite to detect pollution - Use function-scoped fixtures by default — class or module scope only when explicitly justified - Assert that global state (singletons, registries, environment variables) is restored after each test - Use `unittest.mock.patch` or `monkeypatch` which auto-restore on test exit instead of manual patching - Reset database state between tests via transaction rollback or truncation, not shared data - Monitor CI for flaky tests and investigate as potential pollution before dismissing as intermittent'
