schema: augur-concept-meta/v2
concept: anemic-domain-model
kind: anti-pattern
summary: Anemic Domain Model anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-entity-or-model-classes-contain-only-getters-setters-and-fiel
    prompt: Do entity or model classes contain only getters, setters, and field declarations with no business logic methods?
    weight: 3
    signals:
    - data-only classes
    - no behavior on domain objects
    - getters/setters without logic
  - id: does-all-domain-logic-live-in-separate-service-or-manager-classe
    prompt: Does all domain logic live in separate service or manager classes that accept passive data objects as parameters?
    weight: 3
    signals:
    - service operates on entity
    - logic external to model
    - service class does validation/rules
  - id: is-the-same-validation-or-invariant-logic-duplicated-across-mult
    prompt: Is the same validation or invariant logic duplicated across multiple service classes that handle the same entity type?
    weight: 2
    signals:
    - duplicated validation
    - same check in multiple services
    - scattered business rules
  - id: can-entity-objects-be-put-into-invalid-states-because-state-tran
    prompt: Can entity objects be put into invalid states because state transition rules are enforced by callers, not by the object itself?
    weight: 2
    signals:
    - invalid state reachable
    - no constructor validation
    - setStatus without guard
