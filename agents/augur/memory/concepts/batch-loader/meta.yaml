schema: augur-concept-meta/v2
concept: batch-loader
kind: pattern
summary: Batch Loader (N+1 Prevention) architectural pattern
taxonomy:
  type: pattern
  categories:
  - data
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-individual-data-lookups-collected-into-batches-and-resolved-
    prompt: Are individual data lookups collected into batches and resolved with a single bulk query (e.g., WHERE id IN (...))?
    weight: 3
    signals:
    - batched key collection
    - WHERE id IN query
    - deferred resolution then bulk fetch
  - id: is-there-a-dataloader-or-equivalent-mechanism-that-accumulates-k
    prompt: Is there a DataLoader or equivalent mechanism that accumulates keys within a request and flushes them in one operation?
    weight: 3
    signals:
    - DataLoader instance
    - batch function
    - key accumulation with deferred flush
  - id: are-orm-eager-loading-directives-used-to-prefetch-associations-a
    prompt: Are ORM eager-loading directives used to prefetch associations and prevent per-item queries on related data?
    weight: 2
    signals:
    - prefetch_related
    - includes/eager_load
    - association preloading
  - id: is-the-batch-cache-scoped-to-a-single-request-to-avoid-serving-s
    prompt: Is the batch cache scoped to a single request to avoid serving stale data across different users?
    weight: 2
    signals:
    - per-request cache scope
    - loader created per request
    - no cross-request caching
analysis:
  testing:
    summary: Verify that individual loads are batched into a single query and results are correctly dispatched.
    unit:
    - Schedule multiple loads within the same tick and assert they consolidate into one batch call
    - Verify each caller receives the correct result for its key from the batched response
    - 'Test cache behavior: repeated loads for the same key return cached results without re-batching'
    integration:
    - Wire the batch loader against a real data source and assert query count equals 1 for N requested keys
    - Test across nested resolvers (e.g., GraphQL) and verify N+1 queries are eliminated
    failure_injection:
    - Return a partial batch response (some keys missing) and verify callers for missing keys receive clear errors
