schema: augur-concept-meta/v2
concept: optimistic-locking
kind: pattern
summary: Optimistic Locking architectural pattern
taxonomy:
  type: pattern
  categories:
  - data
  - concurrency
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-mutable-entities-have-a-version-column-that-is-atomically-inc
    prompt: Do mutable entities have a version column that is atomically incremented on every update?
    weight: 3
    signals:
    - version column on entity
    - '@Version annotation'
    - lock_version field
  - id: do-write-operations-use-conditional-updates-that-fail-if-the-ver
    prompt: Do write operations use conditional updates that fail if the version has changed since the read?
    weight: 3
    signals:
    - UPDATE WHERE version = ?
    - ConditionalCheckFailedException
    - StaleObjectError handling
  - id: is-conflict-handling-explicit-with-retry-merge-or-user-facing-co
    prompt: Is conflict handling explicit with retry, merge, or user-facing conflict resolution?
    weight: 2
    signals:
    - retry with fresh data on conflict
    - OptimisticLockException caught
    - conflict surfaced to user
  - id: are-etag-if-match-headers-used-at-the-api-layer-so-clients-parti
    prompt: Are ETag/If-Match headers used at the API layer so clients participate in conflict detection?
    weight: 2
    signals:
    - ETag response header
    - If-Match conditional request
    - 412 Precondition Failed
analysis:
  testing:
    summary: Test conflict detection, version increment correctness, and retry/resolution behavior on concurrent writes.
    unit:
    - Read an entity, modify it, save with the correct version, and verify the version increments
    - Read an entity, simulate a concurrent update (increment version in DB), then attempt save and assert conflict error
    - 'Verify ETag/If-Match round-trip: response ETag matches the version, conditional PUT with stale ETag returns 409'
    - 'Test retry logic: on conflict, verify the code re-reads fresh data and retries with the new version'
    integration:
    - Verify the version column is atomically incremented in the database WHERE clause, not in application code
    - 'Test across API boundaries: two clients read the same resource, both PUT with the original ETag, only the first succeeds'
    - Confirm conflict errors include enough information (current version, conflicting fields) for client-side resolution
    additional_sections:
    - title: Concurrency Tests
      items:
      - Launch parallel updates to the same entity and verify exactly one succeeds per version, others receive conflict errors
      - Simulate high-contention updates and verify retry with backoff eventually converges without infinite loops
      - Test that the retry count is bounded and a final failure is surfaced after max retries
