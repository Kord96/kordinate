schema: augur-concept-meta/v2
concept: micro-frontend
kind: pattern
summary: Micro-Frontend architectural pattern
taxonomy:
  type: pattern
  categories:
  - architectural
  - frontend
  - deployment
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - deployment.md
traits:
  testable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-independently-deployable-frontend-modules-loaded-at-runtime-
    prompt: Are independently deployable frontend modules loaded at runtime by a shell or host application?
    weight: 3
    signals:
    - ModuleFederationPlugin with remotes
    - single-spa registerApplication
    - remote entry URL
  - id: do-frontend-modules-have-separate-build-pipelines-and-can-be-dep
    prompt: Do frontend modules have separate build pipelines and can be deployed without coordinating other modules?
    weight: 3
    signals:
    - independent Dockerfile per frontend
    - separate CI pipeline per module
    - versioned remote entry
  - id: are-shared-dependencies-react-angular-loaded-once-and-shared-acr
    prompt: Are shared dependencies (React, Angular) loaded once and shared across micro-frontends to avoid duplication?
    weight: 2
    signals:
    - 'shared: { react: { singleton: true } }'
    - import map for shared deps
    - externals configuration
  - id: are-styling-and-state-boundaries-enforced-between-modules-to-pre
    prompt: Are styling and state boundaries enforced between modules to prevent cross-module leakage?
    weight: 2
    signals:
    - CSS modules per micro-frontend
    - shadow DOM isolation
    - scoped styles per module
analysis:
  testing:
    summary: Test each micro-frontend in isolation and verify correct composition within the shell application.
    unit:
    - Test each micro-frontend's components in isolation with its own test suite
    - Verify that no direct imports exist between micro-frontends (module boundary enforcement)
    - Assert that shared state contracts (events, shared store) match the expected schema
    integration:
    - Load the micro-frontend within the shell and verify routing, rendering, and inter-module communication
    - Test that failure in one micro-frontend does not crash the shell or other micro-frontends (error boundary)
    - Validate that shared dependencies are loaded once, not duplicated per micro-frontend
    additional_sections:
    - title: Visual Regression Tests
      items:
      - Capture screenshots of each micro-frontend in isolation and composed in the shell
      - Assert that CSS from one micro-frontend does not leak into another (scoping validation)
  deployment:
    summary: Deploy micro-frontends independently while ensuring shared dependencies and the shell remain compatible.
    rollout_implications:
    - Each micro-frontend should be independently deployable without requiring a full application redeploy
    - Shared dependency versions (React, Angular) must be compatible across all deployed micro-frontends
    - The shell application must handle missing or failed micro-frontend loads gracefully (error boundaries)
    - Version the contract between shell and micro-frontends to detect breaking changes before deployment
    pre_deploy_checklist:
    - Verify shared dependency versions are aligned across all micro-frontends and the shell
    - Test the new micro-frontend version in isolation and composed within the shell before production
    - Confirm import map or Module Federation remote URLs point to the correct deployment target
    - Validate that CSS scoping prevents style leaks between the new version and existing micro-frontends
