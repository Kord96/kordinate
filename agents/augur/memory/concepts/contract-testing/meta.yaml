schema: augur-concept-meta/v2
concept: contract-testing
kind: pattern
summary: Contract Testing architectural pattern
taxonomy:
  type: pattern
  categories:
  - testing
  - integration
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - deployment.md
traits:
  testable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-consumer-driven-contract-files-that-define-expected-in
    prompt: Are there consumer-driven contract files that define expected interactions between services?
    weight: 3
    signals:
    - Pact contract files
    - consumer-driven contract definition
    - interaction expectations
  - id: do-provider-verification-tests-replay-contracts-against-a-runnin
    prompt: Do provider verification tests replay contracts against a running service to validate compatibility?
    weight: 3
    signals:
    - provider verification suite
    - contract replay tests
    - verify against consumer contracts
  - id: are-contracts-published-to-a-broker-and-used-as-a-deployment-gat
    prompt: Are contracts published to a broker and used as a deployment gate (can-i-deploy checks)?
    weight: 2
    signals:
    - contract broker
    - can-i-deploy gate in CI
    - contract publication step
  - id: do-contracts-cover-error-responses-and-edge-cases-not-just-happy
    prompt: Do contracts cover error responses and edge cases, not just happy-path interactions?
    weight: 1
    signals:
    - error contract scenarios
    - edge case interactions
    - failure mode contracts
analysis:
  testing:
    summary: Verify consumer expectations match provider capabilities using shared contract artifacts.
    unit:
    - 'Consumer side: generate a contract (pact) from consumer tests that define expected request/response pairs'
    - 'Provider side: replay the consumer contract against the real provider and verify all interactions pass'
    - 'Test contract evolution: add a new field on the provider and verify existing consumer contracts still pass'
    integration:
    - Publish contracts to a broker and run provider verification in CI against all registered consumer contracts
    - 'Test can-i-deploy: verify the broker correctly reports deployment safety based on verification results'
    failure_injection:
    - Introduce a breaking change on the provider and verify the contract test fails before deployment
  deployment:
    summary: Run contract tests as a deploy gate to prevent breaking consumer-provider agreements.
    rollout_implications:
    - Provider deploys must pass all consumer contract verifications before promotion
    - New consumer contracts should be published before deploying the consumer that depends on them
    - 'Breaking contract changes require coordinated deployment: update consumers first, then provider'
    pre_deploy_checklist:
    - Verify the contract broker has the latest pacts/contracts from all consumers
    - Run provider verification against the pending contracts in CI before deploy
    - Confirm no can-i-deploy failures for the target environment
