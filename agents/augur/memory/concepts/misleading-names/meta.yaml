schema: augur-concept-meta/v2
concept: misleading-names
kind: anti-pattern
summary: Misleading Names anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-methods-named-get-perform-mutations-such-as-database-writes-h
    prompt: Do methods named get* perform mutations such as database writes, HTTP calls, or cache invalidation?
    weight: 3
    signals:
    - getUser contains INSERT
    - get method with side effects
    - getter that writes to DB
  - id: do-is-has-functions-return-non-boolean-values-like-strings-integ
    prompt: Do is*/has* functions return non-boolean values like strings, integers, or objects?
    weight: 2
    signals:
    - isValid returns string
    - hasPermission returns int
    - boolean-named fn returns object
  - id: do-methods-named-for-a-single-action-validate-check-find-silentl
    prompt: Do methods named for a single action (validate, check, find) silently perform additional unrelated actions?
    weight: 3
    signals:
    - validate() also saves
    - check() silently fixes
    - find() creates when missing
  - id: are-method-names-vague-verbs-like-handle-process-or-do-that-reve
    prompt: Are method names vague verbs like handle, process, or do that reveal nothing about what the function actually does?
    weight: 2
    signals:
    - handleData()
    - processRequest()
    - doStuff()
