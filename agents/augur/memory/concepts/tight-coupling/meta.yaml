schema: augur-concept-meta/v2
concept: tight-coupling
kind: anti-pattern
summary: Tight Coupling anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-classes-instantiate-their-own-infrastructure-dependencies-int
    prompt: Do classes instantiate their own infrastructure dependencies internally rather than receiving them through constructor injection?
    weight: 3
    signals:
    - self.db = Database() inside constructor
    - new HttpClient() in business logic
    - internal dependency creation
  - id: are-concrete-class-types-used-directly-in-method-signatures-and-
    prompt: Are concrete class types used directly in method signatures and references with no interfaces or protocols between components?
    weight: 3
    signals:
    - concrete class references everywhere
    - no interface or protocol abstraction
    - direct type dependencies
  - id: does-changing-one-class-signature-or-interface-break-compilation
    prompt: Does changing one class signature or interface break compilation or tests across 5 or more other files?
    weight: 2
    signals:
    - change cascades across files
    - ripple effect from interface change
    - widespread breakage from single edit
  - id: are-direct-database-calls-or-http-requests-embedded-inside-busin
    prompt: Are direct database calls or HTTP requests embedded inside business logic methods rather than behind adapter interfaces?
    weight: 2
    signals:
    - SQL queries in business logic
    - HTTP calls in domain methods
    - infrastructure mixed with business rules
