schema: augur-concept-meta/v2
concept: distributed-monolith
kind: anti-pattern
summary: Distributed Monolith anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  distributed: true
  graphable: false
diagnostic_questions:
  threshold: 7
  questions:
  - id: do-multiple-services-share-the-same-database-or-schema
    prompt: Do multiple services share the same database or schema?
    weight: 3
    signals:
    - multiple services with connection strings to same DB
    - shared tables accessed by different service codebases
  - id: must-services-be-deployed-together-or-in-a-specific-coordinated-
    prompt: Must services be deployed together or in a specific coordinated order?
    weight: 3
    signals:
    - deployment scripts that deploy multiple services in sequence
    - deploy service A breaks service B if not co-deployed
  - id: do-synchronous-call-chains-span-5-or-more-services-to-complete-a
    prompt: Do synchronous call chains span 5 or more services to complete a single request?
    weight: 2
    signals:
    - request traces showing 5+ synchronous hops
    - service A calls B calls C calls D in chain
  - id: do-shared-libraries-contain-business-logic-imported-by-multiple-
    prompt: Do shared libraries contain business logic imported by multiple services?
    weight: 2
    signals:
    - shared-lib or common package with domain logic
    - business rules in library used by 3+ services
  - id: is-there-a-single-ci-pipeline-that-builds-and-deploys-all-servic
    prompt: Is there a single CI pipeline that builds and deploys all services together?
    weight: 1
    signals:
    - monorepo CI that builds all services in one pipeline
    - single deployment artifact for multiple services
