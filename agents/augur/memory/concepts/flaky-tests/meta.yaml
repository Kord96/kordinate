schema: augur-concept-meta/v2
concept: flaky-tests
kind: anti-pattern
summary: Flaky Tests anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
traits:
  testable: true
  observable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: do-test-files-contain-sleep-or-time-sleep-calls-to-wait-for-cond
    prompt: Do test files contain sleep() or time.sleep() calls to wait for conditions?
    weight: 3
    signals:
    - sleep() or time.sleep() in test code
    - fixed delay waiting for async condition
  - id: do-tests-depend-on-shared-mutable-state-or-execution-order
    prompt: Do tests depend on shared mutable state or execution order?
    weight: 3
    signals:
    - class-level variable modified across test methods
    - test passes in sequence but fails in isolation
  - id: do-unit-tests-make-real-network-calls-to-external-services-witho
    prompt: Do unit tests make real network calls to external services without mocking?
    weight: 2
    signals:
    - HTTP requests to external URLs in unit tests
    - no mock for external service dependency in test
  - id: are-there-retry-decorators-on-test-methods-or-tests-marked-skip-
    prompt: Are there @retry decorators on test methods or tests marked @skip/@xfail for flakiness?
    weight: 1
    signals:
    - '@retry or @flaky decorator on test function'
    - growing list of @skip or @xfail tests
analysis:
  testing:
    summary: Identify, isolate, and eliminate flakiness through deterministic test design and root cause analysis.
    additional_sections:
    - title: Detection
      items:
      - Run suspect tests in a loop (50-100 iterations) in isolation to confirm flakiness without other test interference
      - 'Check for time-dependent logic: tests that pass or fail near midnight, DST boundaries, or CI timezone differences'
      - 'Look for shared mutable state: tests that fail only when run after a specific other test indicate leaking state'
      - Identify network or filesystem dependencies that introduce nondeterminism
    - title: Remediation
      items:
      - Replace sleeps and timeouts with explicit wait conditions or polling with bounded retries
      - Inject clocks and random seeds to make time-dependent and random-dependent tests deterministic
      - Isolate database state per test using transactions that roll back, not shared fixtures
      - Mock external services rather than relying on their availability in CI
    - title: Prevention
      items:
      - Quarantine flaky tests immediately — run them in a separate suite that does not block the main pipeline
      - Require flaky tests to be fixed or deleted within a bounded time window (e.g., two sprints)
      - 'Add flake detection to CI: automatically flag tests whose pass/fail status changes without a code diff'
  monitoring:
    summary: Track test flakiness rates to quantify CI reliability and prioritize stabilization efforts.
    metrics:
    - name: test_flake_rate
      kind: gauge
      description: percentage of test runs that flip between pass and fail without code changes, per test
    - name: ci_retry_total
      kind: counter
      description: number of CI job retries triggered by flaky failures
    - name: flaky_test_count
      kind: gauge
      description: total number of tests currently flagged as flaky
    - name: ci_wall_time_wasted_seconds
      kind: counter
      description: cumulative CI time spent on retries caused by flaky tests
    alerts:
    - Flaky test count exceeding team threshold (flakiness is eroding CI trust)
    - A previously stable test becoming flaky (regression in test isolation or environment)
    - CI retry rate trending upward over a rolling window (systemic flakiness problem)
