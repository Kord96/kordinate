schema: augur-concept-meta/v2
concept: config-sprawl
kind: anti-pattern
summary: Configuration Sprawl anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-the-same-logical-configuration-setting-defined-in-3-or-more-d
    prompt: Is the same logical configuration setting defined in 3 or more distinct sources with no clear precedence order?
    weight: 3
    signals:
    - duplicate config across sources
    - same key in env and file and code
    - no single source of truth
  - id: does-startup-code-pull-configuration-from-multiple-unrelated-sou
    prompt: Does startup code pull configuration from multiple unrelated sources with ad-hoc precedence logic?
    weight: 2
    signals:
    - scattered config loading
    - multiple config sources without unified loader
    - ad-hoc override logic
  - id: can-a-configuration-key-be-mistyped-and-silently-fall-back-to-a-
    prompt: Can a configuration key be mistyped and silently fall back to a default instead of failing?
    weight: 2
    signals:
    - no config schema validation
    - silent fallback on typo
    - unvalidated config keys
  - id: does-changing-a-config-value-in-one-place-have-no-effect-because
    prompt: Does changing a config value in one place have no effect because another source overrides it?
    weight: 2
    signals:
    - shadowed config setting
    - ineffective config change
    - override from unknown source
