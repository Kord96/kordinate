schema: augur-concept-meta/v2
concept: repository
kind: pattern
summary: Repository architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
  - data
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-classes-named-repository-or-repo-with-crud-methods-tha
    prompt: Are there classes named *Repository or *Repo with CRUD methods that accept and return domain objects?
    weight: 3
    signals:
    - UserRepository with find and save methods
    - '@Repository annotation on data access class'
    - repositories/ directory with CRUD interfaces
  - id: is-data-access-abstracted-behind-an-interface-independent-of-the
    prompt: Is data access abstracted behind an interface independent of the storage implementation?
    weight: 3
    signals:
    - repository interface defining data contract
    - storage mechanism hidden from domain objects
    - repository injected as dependency not instantiated inline
  - id: does-query-logic-live-inside-the-repository-rather-than-leaking-
    prompt: Does query logic live inside the repository rather than leaking into services or controllers?
    weight: 2
    signals:
    - SQL or ORM queries inside repository methods
    - no raw queries in service layer
    - controllers call repository not database directly
  - id: do-repositories-return-domain-objects-rather-than-raw-database-r
    prompt: Do repositories return domain objects rather than raw database rows or ORM models?
    weight: 1
    signals:
    - repository maps to domain model
    - no ORM entity returned to caller
    - data transformation inside repository
analysis:
  testing:
    summary: Verify the repository returns domain objects, encapsulates all query logic, and is substitutable with in-memory implementations for unit tests.
    unit:
    - Use an in-memory repository implementation for service-layer unit tests (no database dependency)
    - 'Verify CRUD operations: save returns the persisted entity with an assigned ID, find_by_id returns the correct entity, delete removes it'
    - Test query methods with multiple matching and non-matching records to verify filtering correctness
    - Verify the repository returns domain objects, not ORM models or raw database rows
    integration:
    - Run repository methods against a real database (test container or test schema) and verify data persistence
    - 'Test pagination: verify repositories return the correct page of results with proper ordering'
    - Verify bulk operations (save_all, delete_all) handle large datasets without timeouts or memory issues
    - 'Test transaction behavior: verify rollback leaves no partial state in the database'
    additional_sections:
    - title: Interface Compliance
      items:
      - Verify every repository implementation (SQL, in-memory, mock) satisfies the same interface contract
      - Swap the repository implementation in integration tests and confirm service-layer behavior is identical
      - Assert that no query logic leaks outside the repository (services and controllers do not construct SQL or ORM queries)
