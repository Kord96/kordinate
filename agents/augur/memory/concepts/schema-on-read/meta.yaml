schema: augur-concept-meta/v2
concept: schema-on-read
kind: anti-pattern
summary: Schema-on-Read anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-json-blobs-or-jsonb-columns-accessed-via-string-keys-without
    prompt: Are JSON blobs or JSONB columns accessed via string keys without a validation model?
    weight: 3
    signals:
    - data['field'] access with no Pydantic model
    - JSONB column queried with string keys in 10+ locations
    - raw dict consumed without schema validation
  - id: are-different-parts-of-the-codebase-assuming-different-shapes-fo
    prompt: Are different parts of the codebase assuming different shapes for the same JSON data?
    weight: 3
    signals:
    - inconsistent key access patterns for same data
    - schema drift between producer and consumer
    - no single type definition for stored JSON
  - id: are-keyerror-or-typeerror-exceptions-occurring-in-production-fro
    prompt: Are KeyError or TypeError exceptions occurring in production from missing JSON fields?
    weight: 2
    signals:
    - KeyError on data access in logs
    - TypeError from unexpected None in JSON field
    - missing field causes runtime exception
  - id: are-new-fields-added-to-json-blobs-without-versioning-or-migrati
    prompt: Are new fields added to JSON blobs without versioning or migration?
    weight: 1
    signals:
    - migration-free schema changes
    - new field added without consumer update
    - no JSON schema versioning
analysis:
  testing:
    summary: '# Testing - Test deserialization of JSON data against Pydantic/dataclass models with missing, extra, and malformed fields - Fuzz test JSON consumers with randomized payloads to catch KeyError and TypeError at boundaries - Assert that schema validation rejects unknown fields or provides safe defaults for missing ones - Test schema evolution by loading data written in a previous schema version into the current model - Verify that every code path accessing JSON fields goes through a validated model, not raw dict access - Write contract tests between JSON producers and consumers to detect shape drift early - Test migration scripts that transform old JSON shapes to the new schema across representative data samples'
