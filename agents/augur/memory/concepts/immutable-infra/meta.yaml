schema: augur-concept-meta/v2
concept: immutable-infra
kind: pattern
summary: Immutable Infrastructure architectural pattern
taxonomy:
  type: pattern
  categories:
  - deployment
  - infrastructure
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - deployment.md
traits:
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-application-images-built-with-all-dependencies-baked-in-and-
    prompt: Are application images built with all dependencies baked in and tagged with specific versions or commit SHAs?
    weight: 3
    signals:
    - image tag = commit SHA
    - pinned version tag
    - no latest tag
  - id: does-the-deployment-strategy-replace-instances-with-new-images-r
    prompt: Does the deployment strategy replace instances with new images rather than patching running ones?
    weight: 3
    signals:
    - rolling replacement
    - terminate old launch new
    - no in-place update
  - id: is-there-no-ssh-access-or-remote-exec-capability-for-modifying-p
    prompt: Is there no SSH access or remote exec capability for modifying production instances after creation?
    weight: 2
    signals:
    - no SSH to production
    - no kubectl exec in prod
    - no remote shell access
  - id: is-configuration-injected-at-startup-via-environment-variables-r
    prompt: Is configuration injected at startup via environment variables rather than baked into the image?
    weight: 1
    signals:
    - env vars at startup
    - mounted config
    - config not in image
analysis:
  deployment:
    summary: Enforce replace-not-patch semantics and ensure images are versioned artifacts, never mutated in place.
    rollout_implications:
    - Every deployment creates new instances from a versioned image -- never patch running instances
    - Rollback means deploying the previous known-good image version, not reverting changes on live hosts
    - Blue-green or canary strategies work naturally since each version is a distinct, immutable artifact
    - Configuration is injected at startup (environment variables, mounted secrets), not baked into images
    pre_deploy_checklist:
    - Verify image tags use commit SHA or semantic version, never `latest`
    - Confirm no SSH access or remote exec is available in the production environment
    - Validate that the image build is reproducible (pinned base images, locked dependency versions)
    - Ensure rollback procedure references a specific previous image tag, not a manual revert process
