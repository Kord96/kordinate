schema: augur-concept-meta/v2
concept: stream-to-store
kind: pattern
summary: Stream To Store architectural pattern
taxonomy:
  type: pattern
  categories:
  - data
  - integration
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  testable: true
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-offsets-committed-only-after-the-store-write-succeeds-not-be
    prompt: Are offsets committed only after the store write succeeds, not before?
    weight: 3
    signals:
    - commit after flush success
    - enable.auto.commit=false
    - offset management after store write confirmation
  - id: are-records-buffered-before-flushing-to-the-store-with-size-and-
    prompt: Are records buffered before flushing to the store with size and time-based triggers?
    weight: 3
    signals:
    - buffered writes with flush threshold
    - flush on buffer size or time interval
    - batch accumulation before store write
  - id: are-store-writes-idempotent-to-handle-safe-replay-on-reprocessin
    prompt: Are store writes idempotent to handle safe replay on reprocessing?
    weight: 2
    signals:
    - idempotent upsert on store write
    - deduplication key on records
    - safe to replay same batch
  - id: is-consumer-group-rebalancing-handled-without-data-loss-or-dupli
    prompt: Is consumer group rebalancing handled without data loss or duplication?
    weight: 1
    signals:
    - rebalance listener draining buffer
    - partition revocation flushes pending
    - no data loss on consumer group rebalance
analysis:
  testing:
    summary: Validate offset commit ordering, buffer flush boundaries, and data integrity under reprocessing scenarios.
    unit:
    - Test buffer flush triggers — verify flush fires at both size threshold and time interval, whichever comes first
    - Assert that offset commit only occurs after a successful store write, never before
    - Test message deserialization failures — confirm bad records route to dead-letter, not block the pipeline
    - Verify buffer correctly batches messages and respects max batch size boundaries
    integration:
    - Produce messages to a real broker, consume and flush to a real store, then verify all records landed with no duplicates
    - Trigger a consumer group rebalance mid-flush and verify no data is lost or double-written
    - Test end-to-end reprocessing by resetting offsets and replaying — assert store state is identical (idempotent writes)
    failure_injection:
    - Kill the store mid-flush and verify the consumer retries the batch without advancing offsets
    - Simulate broker unavailability during offset commit and verify the consumer re-fetches and re-processes the unflushed batch
    - Introduce artificial latency in the store to trigger time-based flush while size-based flush is pending — verify no duplicate flush
  monitoring:
    summary: Track consumer lag, buffer health, and store write performance to catch pipeline stalls early.
    metrics:
    - name: consumer_lag_records
      kind: gauge
      description: records behind head per partition (Kafka consumer lag)
    - name: buffer_utilization_ratio
      kind: gauge
      description: current buffer fill level as fraction of max capacity
    - name: flush_duration_seconds
      kind: histogram
      description: time to flush buffer contents to the store
    - name: store_write_errors_total
      kind: counter
      description: failed store write attempts
    - name: dead_letter_records_total
      kind: counter
      description: messages sent to dead-letter queue
    alerts:
    - Consumer lag exceeding threshold for a sustained period (pipeline falling behind)
    - Buffer utilization above 80% (approaching memory exhaustion)
    - Store write error rate spiking (downstream store degraded)
    - Dead-letter queue depth growing without resolution
  deployment:
    summary: Consumer rebalancing and offset management during rollout can cause duplicates or data loss if not handled correctly.
    rollout_implications:
    - Rolling restart triggers consumer group rebalancing — ensure cooperative rebalancing is configured to minimize partition reassignment storms
    - In-flight buffers must be flushed and offsets committed before a pod terminates, or data in the buffer is lost
    - PVC-backed buffers require volume binding to complete before the consumer starts — account for this in readiness probes
    - Scaling consumer replicas changes partition assignments — verify no partition is left unassigned during the transition
    - New consumer instances starting with `latest` offset after a rebalance will skip unprocessed messages — always resume from committed offsets
    pre_deploy_checklist:
    - Verify terminationGracePeriodSeconds is long enough to flush buffers and commit offsets
    - Confirm PVCs are pre-provisioned or dynamic provisioning is fast enough to avoid readiness timeouts
    - Check that consumer group rebalancing strategy is set to cooperative (incremental), not eager
references:
- file: stoik.md
  kind: reference
  description: stoik library reference
