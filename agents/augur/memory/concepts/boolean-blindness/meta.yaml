schema: augur-concept-meta/v2
concept: boolean-blindness
kind: anti-pattern
summary: Boolean Blindness anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-function-calls-that-pass-multiple-boolean-literals-wit
    prompt: Are there function calls that pass multiple boolean literals with no keyword names, making intent unreadable at the call site?
    weight: 3
    signals:
    - process(true, false, true)
    - unnamed boolean args
    - meaning invisible at call site
  - id: do-function-signatures-accept-two-or-more-boolean-parameters-tha
    prompt: Do function signatures accept two or more boolean parameters that could be accidentally swapped without type error?
    weight: 3
    signals:
    - multiple bool params
    - swappable booleans
    - compiler cannot catch arg swap
  - id: have-boolean-parameters-accumulated-over-time-as-quick-additions
    prompt: Have boolean parameters accumulated over time as quick additions rather than being replaced with enums or config objects?
    weight: 2
    signals:
    - boolean parameter creep
    - flag accumulation
    - new bool added instead of refactoring
  - id: must-developers-jump-to-the-function-definition-to-understand-wh
    prompt: Must developers jump to the function definition to understand what each boolean argument means at every call site?
    weight: 2
    signals:
    - requires cross-reference to understand
    - boolean meaning not self-documenting
    - context-dependent interpretation
