schema: augur-concept-meta/v2
concept: sidecar
kind: pattern
summary: Sidecar architectural pattern
taxonomy:
  type: pattern
  categories:
  - lifecycle
  - infrastructure
  - deployment
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
  - monitoring.md
  - deployment.md
traits:
  observable: true
  distributed: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-multi-container-pods-defined-with-a-sidecar-handling-cross-c
    prompt: Are multi-container pods defined with a sidecar handling cross-cutting concerns alongside the main application?
    weight: 3
    signals:
    - two containers in same pod spec
    - istio-proxy or envoy sidecar container
    - fluentd log collector alongside app
  - id: does-the-sidecar-communicate-with-the-main-container-via-localho
    prompt: Does the sidecar communicate with the main container via localhost or shared volumes?
    weight: 3
    signals:
    - emptyDir shared volume between containers
    - localhost communication between sidecar and app
    - no network hop between co-located containers
  - id: is-the-sidecar-limited-to-infrastructure-concerns-with-no-busine
    prompt: Is the sidecar limited to infrastructure concerns with no business logic?
    weight: 2
    signals:
    - sidecar handles only proxy or logging
    - no domain logic in sidecar container
    - infrastructure-only sidecar responsibility
  - id: is-the-sidecar-lifecycle-tied-to-the-main-container-starting-bef
    prompt: Is the sidecar lifecycle tied to the main container, starting before and stopping after?
    weight: 1
    signals:
    - sidecar starts before app container
    - sidecar shutdown after main process exits
    - lifecycle ordering between containers
analysis:
  testing:
    summary: Verify inter-container communication, lifecycle ordering, and main container resilience when the sidecar degrades.
    unit:
    - 'Test sidecar interface contract: assert the main container can communicate with the sidecar over localhost or shared volume as expected'
    - 'Verify sidecar configuration parsing: inject invalid config and assert the sidecar fails with a descriptive error, not silent misconfiguration'
    - 'Test main container degraded mode: disable the sidecar interface and assert the main container continues operating with reduced functionality'
    - 'Assert sidecar resource isolation: verify the sidecar respects its own CPU and memory limits independent of the main container'
    integration:
    - Deploy the full pod (main + sidecar) and verify end-to-end request flow through the sidecar proxy to the main container
    - 'Test lifecycle ordering: verify the sidecar starts and is ready before the main container begins accepting traffic'
    - Verify that sidecar upgrades (new image version) can be rolled out independently without restarting the main container if supported
    failure_injection:
    - Crash the sidecar process and verify the main container detects the failure and operates in degraded mode
    - Introduce latency in the sidecar proxy and verify the main container's timeout handling prevents cascading slowdowns
    - Simulate sidecar OOM kill and verify the pod's restart policy recovers the sidecar while the main container remains running
  monitoring:
    summary: Track sidecar health and resource consumption to ensure sidecars do not degrade the main container.
    metrics:
    - name: sidecar_health
      kind: gauge
      description: health status per sidecar (1=healthy, 0=degraded)
    - name: sidecar_cpu_usage_ratio
      kind: gauge
      description: sidecar CPU usage as fraction of pod CPU limit
    - name: sidecar_memory_usage_bytes
      kind: gauge
      description: sidecar memory consumption
    - name: sidecar_request_duration_seconds
      kind: histogram
      description: latency of requests proxied through the sidecar
    - name: sidecar_errors_total
      kind: counter
      description: errors in sidecar-to-main or sidecar-to-external communication
    alerts:
    - Sidecar consuming more than expected share of pod resources (resource budget breach)
    - Sidecar health check failing while main container is healthy (lifecycle mismatch)
    - Sidecar proxy latency adding unacceptable overhead to main container requests
    - Sidecar restart count exceeding threshold (unstable sidecar affecting pod stability)
  deployment:
    summary: Sidecar and main container version coordination is critical — mismatched versions can break shared interfaces.
    rollout_implications:
    - Sidecar and main container images are updated together in a pod spec — ensure both versions are tested as a pair before rollout
    - Sidecar must be ready before the main container starts serving if the main container depends on it (e.g., Envoy proxy) — use container startup ordering
    - Shared volume mounts between sidecar and main container must have compatible file formats across versions
    - Updating the sidecar image across the fleet (e.g., Istio proxy upgrade) restarts every pod — plan for fleet-wide rolling restart impact
    pre_deploy_checklist:
    - Verify sidecar and main container version compatibility is tested together in staging
    - Confirm shared volume mount paths and file format expectations match between sidecar and main container versions
    - Check that pod disruption budgets account for fleet-wide restarts when upgrading a sidecar used across many services
