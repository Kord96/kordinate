schema: augur-concept-meta/v2
concept: shotgun-surgery
kind: anti-pattern
summary: Shotgun Surgery anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: does-a-single-logical-change-require-editing-files-across-many-u
    prompt: Does a single logical change require editing files across many unrelated directories or packages?
    weight: 3
    signals:
    - one feature touching 10+ files in 5+ directories
    - bug fix spanning many packages
    - git commits modifying unrelated modules for one change
  - id: are-cross-cutting-concerns-duplicated-in-every-module-rather-tha
    prompt: Are cross-cutting concerns duplicated in every module rather than centralized?
    weight: 3
    signals:
    - auth check copied into each handler
    - logging format repeated across modules
    - validation logic duplicated per endpoint
  - id: is-the-same-conditional-logic-scattered-across-multiple-modules
    prompt: Is the same conditional logic scattered across multiple modules?
    weight: 2
    signals:
    - if feature_x check in many files
    - same branching condition in unrelated packages
    - feature flag checked in 10+ locations
  - id: do-simple-feature-requests-take-disproportionately-long-due-to-c
    prompt: Do simple feature requests take disproportionately long due to coordinated multi-file edits?
    weight: 1
    signals:
    - small feature requires large PR
    - developers fear missing a location
    - high regression rate despite thorough changes
analysis:
  testing:
    summary: '# Testing - Measure change coupling: track which files are modified together across git history to identify scattered concerns - Write regression tests for each location where the scattered concern appears before consolidating - After remediation, test that the consolidated module covers all previous behavior with a single test suite - Use architectural linting (ArchUnit, import-linter) to enforce that the concern does not re-scatter - Test cross-cutting concerns (auth, logging, validation) in isolation once centralized - Verify that removing duplicated logic from satellite files does not break callers via integration tests - Run mutation testing on the consolidated module to confirm test coverage at the new single location'
