schema: augur-concept-meta/v2
concept: spaghetti-code
kind: anti-pattern
summary: Spaghetti Code anti-pattern
taxonomy:
  type: anti-pattern
  categories: []
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
traits:
  graphable: false
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-functions-exceeding-200-500-lines-with-5-levels-of-nes
    prompt: Are there functions exceeding 200-500 lines with 5+ levels of nesting?
    weight: 3
    signals:
    - function body over 500 lines
    - if/else nested 5+ levels deep
    - deeply nested try/catch within conditionals
  - id: do-functions-accept-10-parameters-or-have-variables-reused-for-u
    prompt: Do functions accept 10+ parameters or have variables reused for unrelated purposes?
    weight: 3
    signals:
    - function signature with 10+ parameters
    - variable reassigned to different meaning mid-function
    - single function handling multiple concerns
  - id: is-logic-inlined-rather-than-extracted-into-named-functions-at-c
    prompt: Is logic inlined rather than extracted into named functions at consistent abstraction levels?
    weight: 2
    signals:
    - no function extraction for repeated blocks
    - mixed abstraction levels in one function
    - inline code that should be a named helper
  - id: is-control-flow-hard-to-follow-due-to-scattered-returns-breaks-a
    prompt: Is control flow hard to follow due to scattered returns, breaks, and exception-driven branching?
    weight: 1
    signals:
    - early returns at unpredictable points
    - exception used for normal flow control
    - goto-like breaks and continues
