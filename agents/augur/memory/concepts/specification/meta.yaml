schema: augur-concept-meta/v2
concept: specification
kind: pattern
summary: Specification Pattern architectural pattern
taxonomy:
  type: pattern
  categories:
  - design
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: are-there-business-rule-objects-with-an-is-satisfied-by-method-t
    prompt: Are there business rule objects with an is_satisfied_by method that evaluates a candidate?
    weight: 3
    signals:
    - is_satisfied_by(candidate) method
    - Specification or Spec class
    - predicate object passed to filtering method
  - id: are-specifications-composable-via-and-or-and-not-combinators
    prompt: Are specifications composable via and, or, and not combinators?
    weight: 3
    signals:
    - and_spec() or or_spec() combinators
    - composed specification from smaller rules
    - specification chaining with boolean operators
  - id: does-each-specification-encapsulate-a-single-business-rule-named
    prompt: Does each specification encapsulate a single business rule named in domain language?
    weight: 2
    signals:
    - IsEligibleForDiscount specification
    - one rule per specification class
    - domain-named predicate object
  - id: are-the-same-specifications-used-for-both-in-memory-filtering-an
    prompt: Are the same specifications used for both in-memory filtering and query generation?
    weight: 1
    signals:
    - dual-purpose spec for validation and query
    - specification translated to SQL predicate
    - same rule for collection filter and database query
analysis:
  testing:
    summary: '# Testing - Unit test each specification independently with `is_satisfied_by()` against positive and negative cases - Test composed specifications (`and`, `or`, `not`) to verify correct boolean logic - Verify that specifications are side-effect free — calling `is_satisfied_by()` does not modify state - Test that the same specification works for both in-memory filtering and query generation (dual-purpose) - Assert that complex business rules expressed as named compositions produce expected results - Test edge cases: null candidates, empty collections, boundary values for numeric specifications - Verify that adding a new specification does not require modifying existing ones (open-closed principle)'
