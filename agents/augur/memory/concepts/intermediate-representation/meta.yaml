schema: augur-concept-meta/v2
concept: intermediate-representation
kind: pattern
summary: Intermediate Representation (IR) architectural pattern
taxonomy:
  type: pattern
  categories:
  - data
  - compiler
detectors:
  ast_grep:
    enabled: true
    file: ast-grep.yaml
    detector_strength: 4
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: ast-grep.yaml
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-there-a-structured-intermediate-form-sitting-between-the-ast-
    prompt: Is there a structured intermediate form sitting between the AST and final output with typed instructions in basic blocks?
    weight: 3
    signals:
    - IR instruction type
    - basic block with instructions
    - SSA form variables
  - id: are-there-optimization-or-transformation-passes-that-operate-on-
    prompt: Are there optimization or transformation passes that operate on the IR before code generation?
    weight: 3
    signals:
    - optimization pass
    - IR transform
    - pass manager
  - id: does-an-irbuilder-or-emit-api-construct-ir-instructions-from-hig
    prompt: Does an IRBuilder or emit() API construct IR instructions from higher-level AST nodes?
    weight: 2
    signals:
    - IRBuilder
    - emit() method
    - lower AST to IR
  - id: is-the-lowering-from-ast-to-ir-a-separate-testable-phase-rather-
    prompt: Is the lowering from AST to IR a separate, testable phase rather than interleaved with parsing?
    weight: 1
    signals:
    - separate lowering phase
    - AST to IR pass
    - distinct parse and lower stages
analysis:
  testing:
    summary: Verify that IR construction, optimization passes, and lowering produce correct and well-typed output.
    unit:
    - Assert that AST-to-IR lowering produces the expected IR instructions for known input programs
    - 'Test each optimization pass in isolation: feed a known IR, run the pass, and assert the transformed output'
    - 'Verify IR is well-typed: every instruction''s operand types match the expected types'
    additional_sections:
    - title: Round-trip Tests
      items:
      - Serialize IR to text or binary, deserialize, and assert structural equality with the original
      - Lower source to IR, then to output, and verify the output matches a golden reference for each test case
    - title: Regression Tests
      items:
      - Maintain a corpus of input programs with expected IR output to catch regressions in lowering or optimization
      - Add a new test case for every bug found in IR construction or pass ordering
      - Verify that debug info (source locations) survives all transformation passes
