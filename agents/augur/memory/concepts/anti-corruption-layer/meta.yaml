schema: augur-concept-meta/v2
concept: anti-corruption-layer
kind: pattern
summary: Anti-Corruption Layer architectural pattern
taxonomy:
  type: pattern
  categories:
  - integration
  - design
detectors:
  ast_grep:
    enabled: false
    file: null
    detector_strength: 2
  semgrep:
    enabled: false
    file: null
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
    - noisy_rule_match
    - conflicting_evidence
    - broad_match
    - low_rule_confidence
    - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
artifacts:
  support_rules:
    ast_grep: null
    semgrep: null
migration:
  replaces:
  - questions.yaml
  - testing.md
traits:
  testable: true
  graphable: true
diagnostic_questions:
  threshold: 6
  questions:
  - id: is-there-a-dedicated-translation-layer-with-separate-model-class
    prompt: Is there a dedicated translation layer with separate model classes for external systems distinct from the internal domain model?
    weight: 3
    signals:
    - external DTO vs domain model
    - separate representations
    - mapper between external and internal
  - id: does-the-domain-code-never-import-or-reference-types-from-the-ex
    prompt: Does the domain code never import or reference types from the external system directly?
    weight: 3
    signals:
    - no external imports in domain
    - isolation boundary
    - domain depends on ACL interface only
  - id: are-mapping-and-translation-functions-centralized-in-dedicated-m
    prompt: Are mapping and translation functions centralized in dedicated mapper or translator classes rather than scattered across services?
    weight: 2
    signals:
    - centralized mapping
    - translator class
    - single place for conversion logic
  - id: do-changes-to-the-external-api-require-updates-only-in-the-trans
    prompt: Do changes to the external API require updates only in the translation layer without touching domain logic?
    weight: 2
    signals:
    - external change isolation
    - domain unaffected by API change
    - translation absorbs external drift
analysis:
  testing:
    summary: Verify the ACL translates between bounded contexts without leaking foreign domain concepts.
    unit:
    - 'Assert inbound translation: external model maps to the correct internal domain model'
    - 'Assert outbound translation: internal model maps to the correct external representation'
    - Verify that unknown or malformed external fields are rejected or safely defaulted
    integration:
    - Wire the ACL against a stubbed external system and verify end-to-end translation fidelity
    - 'Test schema evolution: introduce a new field in the external model and verify the ACL handles it gracefully'
    failure_injection:
    - Send payloads with missing required fields and verify the ACL returns structured errors, not leaky exceptions
