domain: config
positive:
  strong:
    - environment variable reads
    - yaml/toml/json config files
    - service URLs and ports in config
  medium:
    - secret references and env.example files
  weak:
    - hardcoded defaults and feature toggles
negative:
  - incidental literal strings with no config role
notes:
  - Config facts should support dependency discovery and configuration-sprawl detection.
