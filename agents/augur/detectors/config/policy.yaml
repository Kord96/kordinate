domain: config
emits:
  - config-source
frameworks:
  include:
    - python
    - javascript
    - typescript
    - go
    - rust
    - java
    - kotlin
    - csharp
    - ruby
    - php
    - elixir
  exclude: []
detectors:
  ast_grep:
    enabled: true
    detector_strength: 3
  semgrep:
    enabled: true
    detector_strength: 3
  signatures:
    enabled: true
    detector_strength: 5
  manifest:
    enabled: true
    detector_strength: 5
policy:
  emit_threshold: 2
  fallback_order:
    - manifest
    - ast_grep
    - signatures
    - semgrep
  negative_rule_result_means: neutral
  requires_framework_context: false
normalization:
  fact_kind: config-source
  required_fields:
    - source
    - key
  optional_fields:
    - value
    - kind
    - secret
