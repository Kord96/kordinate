id: models-pydantic-py
language: Python
rule:
  pattern: |
    class $MODEL(BaseModel):
        $$$BODY
---
id: models-sqlmodel-py
language: Python
rule:
  pattern: |
    class $MODEL(SQLModel, $$$REST):
        $$$BODY
---
id: models-django-model-py
language: Python
rule:
  pattern: |
    class $MODEL(models.Model):
        $$$BODY
---
id: models-sqlalchemy-declarative-py
language: Python
rule:
  pattern: |
    class $MODEL($BASE):
        $$$BODY
  constraints:
    BASE:
      regex: .*Base|.*DeclarativeBase
---
id: models-sequelize-ts
language: TypeScript
rule:
  pattern: |
    class $MODEL extends Model {
      $$$BODY
    }
---
id: models-mongoose-schema-ts
language: TypeScript
rule:
  any:
    - pattern: new Schema({$$$FIELDS})
    - pattern: mongoose.Schema({$$$FIELDS})
