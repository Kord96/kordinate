id: adapter-class-naming-py
language: Python
rule:
  pattern: |
    class $NAME($$$BASES):
        $$$BODY
  constraints:
    NAME:
      regex: '.*Adapter$'
---
id: adapter-class-naming-ts
language: TypeScript
rule:
  pattern: |
    class $NAME implements $IFACE {
        $$$BODY
    }
  constraints:
    NAME:
      regex: '.*Adapter$'
---
