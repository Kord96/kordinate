concept: structured-logging
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 4
    ask_when:
      - broad_match
      - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 4
    min_match_confidence: 4
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 4
  entries:
    - id: structured-logging-kv
      prompt: Do log calls carry structured key-value fields or JSON formatting rather than plain text interpolation?
      weight: 2
      signals:
        - logger.bind
        - WithFields
        - pino
    - id: structured-logging-context
      prompt: Is request or correlation context propagated through log calls?
      weight: 2
      signals:
        - request_id
        - correlation_id
monitoring:
  applies_to:
    - component
    - system
  health_signals:
    - name: structured_log.error.rate
      description: Error log rate with structured context preserved for aggregation.
    - name: missing_log_context.rate
      description: Frequency of logs missing expected request, trace, or correlation identifiers.
  business_metrics: []
  gaps:
    - If structured context is inconsistent, downstream monitoring and incident triage quality degrades quickly.
