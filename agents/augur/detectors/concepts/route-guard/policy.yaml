concept: route-guard
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
      - broad_match
      - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 5
  entries:
    - id: route-guard-pre-render
      prompt: Does the guard block navigation before protected content renders?
      weight: 3
      signals:
        - redirect(
        - CanActivate
        - middleware.ts
    - id: route-guard-auth-check
      prompt: Does the guard evaluate auth or permissions rather than only client-side state toggles?
      weight: 2
      signals:
        - isAuthenticated
        - hasRole
        - permission
