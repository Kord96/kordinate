id: route-guard-redirect-ts
language: TypeScript
rule:
  pattern: 'redirect($$$ARGS)'
---
id: route-guard-nextResponse-redirect-ts
language: TypeScript
rule:
  pattern: 'NextResponse.redirect($$$ARGS)'
---
id: route-guard-canActivate-ts
language: TypeScript
rule:
  pattern: |
    canActivate($$$ARGS) {
        $$$BODY
    }
---
id: route-guard-beforeEach-ts
language: TypeScript
rule:
  pattern: '$ROUTER.beforeEach($$$ARGS)'
---
id: route-guard-login-required-py
language: Python
rule:
  pattern: |
    @login_required
    def $NAME($$$ARGS):
        $$$BODY
---
id: route-guard-permission-py
language: Python
rule:
  pattern: |
    @permission_required($$$PERMS)
    def $NAME($$$ARGS):
        $$$BODY
