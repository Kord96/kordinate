id: bridge-impl-injection-py
language: Python
rule:
  pattern: |
    def __init__(self, $$$BEFORE, impl: $IMPL_TYPE, $$$AFTER):
        $$$BODY
  has:
    pattern: self.impl = $VALUE
---
id: bridge-impl-reference-py
language: Python
rule:
  pattern: |
    class $ABSTRACTION:
        $$$BEFORE
        def __init__(self, impl):
            self.impl = impl
        $$$AFTER
---
id: bridge-impl-delegation-py
language: Python
rule:
  pattern: self.impl.$METHOD($$$ARGS)
---
id: bridge-impl-interface-ts
language: TypeScript
rule:
  pattern: |
    class $ABSTRACTION {
        $$$BODY
    }
  has:
    pattern: |
      constructor($$$BEFORE, private impl: $IMPL_TYPE, $$$AFTER) {
          $$$BODY
      }
---
id: bridge-impl-delegation-ts
language: TypeScript
rule:
  pattern: this.impl.$METHOD($$$ARGS)
