id: tenant-routing-subdomain-py
language: Python
rule:
  pattern: '$TENANT = $HOST.split(".")[0]'
---
id: tenant-routing-connection-pool-py
language: Python
rule:
  pattern: |
    def get_connection(self, $TENANT_ID):
        $$$BODY
---
id: tenant-routing-shard-route-py
language: Python
rule:
  pattern: '$SHARD = $ROUTER.route($TENANT_ID)'
---
id: tenant-routing-subdomain-ts
language: TypeScript
rule:
  pattern: 'const $TENANT = $HOST.split(".")[0]'
---
id: tenant-routing-connection-pool-ts
language: TypeScript
rule:
  pattern: |
    getConnection($TENANT_ID) {
        $$$BODY
    }
---
id: tenant-routing-db-for-tenant-ts
language: TypeScript
rule:
  pattern: '$DB = $ROUTER.dbForTenant($TENANT_ID)'
