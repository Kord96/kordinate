# Score 3: Misleading names require understanding INTENT vs IMPLEMENTATION, which
# is semantic. However, we CAN match the most egregious structural smell:
# methods named get_* that contain write operations (INSERT, UPDATE, save, etc).
# This is a naming+structure combo that ast-grep can handle.

id: misleading-names-getter-with-save-py
language: Python
rule:
  pattern: |
    def $FN(self, $$$ARGS):
        $$$BODY
  constraints:
    FN:
      regex: '^get_'
  has:
    pattern: $OBJ.save($$$ARGS)
---
id: misleading-names-getter-with-create-py
language: Python
rule:
  pattern: |
    def $FN(self, $$$ARGS):
        $$$BODY
  constraints:
    FN:
      regex: '^get_'
  has:
    pattern: $OBJ.create($$$ARGS)
---
id: misleading-names-getter-with-http-py
language: Python
rule:
  pattern: |
    def $FN(self, $$$ARGS):
        $$$BODY
  constraints:
    FN:
      regex: '^get_'
  has:
    pattern: requests.$METHOD($$$ARGS)
    constraints:
      METHOD:
        regex: '(post|put|patch|delete)'
---
id: misleading-names-getter-with-mutation-ts
language: TypeScript
rule:
  pattern: |
    $ACCESS get$NAME($$$ARGS) {
        $$$BODY
    }
  has:
    pattern: await $OBJ.save($$$ARGS)
---
id: misleading-names-is-returns-nonbool-ts
language: TypeScript
rule:
  pattern: |
    function $FN($$$ARGS): $RET {
        $$$BODY
    }
  constraints:
    FN:
      regex: '^is[A-Z]'
    RET:
      regex: '^(?!boolean$).*'
