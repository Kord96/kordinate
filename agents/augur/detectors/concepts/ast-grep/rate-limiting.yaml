id: rate-limiting-express-middleware-ts
language: TypeScript
rule:
  pattern: |
    rateLimit({
        windowMs: $WINDOW,
        max: $MAX,
        $$$OPTS
    })
---
id: rate-limiting-app-use-ts
language: TypeScript
rule:
  pattern: $APP.use(rateLimit($$$ARGS))
---
id: rate-limiting-redis-incr-py
language: Python
rule:
  pattern: $REDIS.incr($KEY)
---
id: rate-limiting-slowapi-py
language: Python
rule:
  pattern: $LIMITER = Limiter(key_func=$$$ARGS)
---
id: rate-limiting-decorator-py
language: Python
rule:
  pattern: |
    @$LIMITER.limit($RATE)
    def $FUNC($$$ARGS):
        $$$BODY
