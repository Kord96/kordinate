id: scheduler-apscheduler-cron-py
language: Python
rule:
  pattern: '$SCHED.add_job($FUNC, $$$ARGS)'
---
id: scheduler-celery-periodic-py
language: Python
rule:
  pattern: |
    @periodic_task($$$ARGS)
    def $NAME($$$PARAMS):
        $$$BODY
---
id: scheduler-celery-beat-py
language: Python
rule:
  pattern: |
    app.conf.beat_schedule = {
        $$$ENTRIES
    }
---
id: scheduler-node-cron-ts
language: TypeScript
rule:
  pattern: 'cron.schedule($EXPR, $$$ARGS)'
---
id: scheduler-setinterval-ts
language: TypeScript
rule:
  pattern: 'setInterval($FUNC, $INTERVAL)'
