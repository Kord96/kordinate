# Score 3: Cardinality explosion requires knowing that a label value is unbounded,
# which is semantic. But we CAN match the structural smell: metric labels using
# known high-cardinality field names like user_id, request_id, email, url.

id: metric-cardinality-user-id-label-py
language: Python
rule:
  pattern: $METRIC.labels($$$BEFORE, user_id=$VALUE, $$$AFTER)
---
id: metric-cardinality-request-id-label-py
language: Python
rule:
  pattern: $METRIC.labels($$$BEFORE, request_id=$VALUE, $$$AFTER)
---
id: metric-cardinality-dynamic-name-py
language: Python
rule:
  pattern: $METRIC_TYPE(f"$$$NAME", $$$ARGS)
  constraints:
    METRIC_TYPE:
      regex: '(Counter|Histogram|Gauge|Summary)'
---
id: metric-cardinality-high-card-labels-py
language: Python
rule:
  pattern: $METRIC_TYPE($NAME, $DESC, $$$BEFORE, labelnames=[$$$LABELS], $$$AFTER)
  constraints:
    LABELS:
      regex: '.*(user_id|request_id|session_id|email|url|path).*'
---
id: metric-cardinality-high-card-label-ts
language: TypeScript
rule:
  pattern: $METRIC.labels({ $$$FIELDS })
  has:
    pattern: '$KEY: $VALUE'
    constraints:
      KEY:
        regex: '(userId|requestId|sessionId|email|url|path)'
