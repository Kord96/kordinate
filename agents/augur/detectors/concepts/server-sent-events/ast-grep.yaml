id: sse-streaming-response-py
language: Python
rule:
  pattern: StreamingResponse($$$ARGS, media_type="text/event-stream")
---
id: sse-event-source-ts
language: TypeScript
rule:
  pattern: new EventSource($$$ARGS)
---
id: sse-onmessage-ts
language: TypeScript
rule:
  pattern: $SOURCE.onmessage = $HANDLER
---
id: sse-content-type-header-py
language: Python
rule:
  pattern: "'Content-Type': 'text/event-stream'"
