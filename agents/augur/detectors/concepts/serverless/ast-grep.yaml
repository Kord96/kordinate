id: serverless-lambda-handler-py
language: Python
rule:
  pattern: |
    def $HANDLER(event, context):
        $$$BODY
---
id: serverless-functions-framework-py
language: Python
rule:
  pattern: |
    @functions_framework.http
    def $NAME($$$ARGS):
        $$$BODY
---
id: serverless-lambda-handler-ts
language: TypeScript
rule:
  pattern: |
    export const $HANDLER = async ($EVENT, $CONTEXT) => {
        $$$BODY
    }
---
id: serverless-handler-export-ts
language: TypeScript
rule:
  pattern: 'exports.handler = $$$FUNC'
