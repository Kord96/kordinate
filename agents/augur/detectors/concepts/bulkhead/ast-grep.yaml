id: bulkhead-semaphore-py
language: Python
rule:
  pattern: '$NAME = asyncio.Semaphore($LIMIT)'
---
id: bulkhead-thread-semaphore-py
language: Python
rule:
  pattern: '$NAME = threading.Semaphore($LIMIT)'
---
id: bulkhead-bounded-semaphore-py
language: Python
rule:
  pattern: '$NAME = threading.BoundedSemaphore($LIMIT)'
---
id: bulkhead-semaphore-ts
language: TypeScript
rule:
  pattern: 'new Semaphore($LIMIT)'
---
id: bulkhead-separate-pool-py
language: Python
rule:
  pattern: 'ThreadPoolExecutor(max_workers=$SIZE)'
