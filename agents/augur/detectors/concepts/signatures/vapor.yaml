framework: vapor
manifest_packages:
  package_swift:
  - vapor/vapor
source_extensions:
- .swift
path_patterns:
  strong: []
  medium: []
  weak: []
source_patterns:
  strong:
  - app\.(get|post|put|delete|patch)\s*\(
  medium:
  - app\.grouped\s*\(
  - import\s+Vapor
  weak: []
negative_path_patterns: []
negative_source_patterns: []
