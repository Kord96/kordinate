framework: nestjs
manifest_packages:
  package_json:
  - nestjs
  - '@nestjs/common'
  - '@nestjs/core'
source_extensions:
- .ts
- .tsx
- .js
path_patterns:
  strong: []
  medium: []
  weak: []
source_patterns:
  strong:
  - '@Controller\b'
  - '@Get\s*\('
  - '@Post\s*\('
  - '@Put\s*\('
  - '@Delete\s*\('
  - '@Patch\s*\('
  medium:
  - '@Injectable\b'
  - '@Module\b'
  weak: []
negative_path_patterns: []
negative_source_patterns:
- require\(['"]express['"]\)
