framework: rails
manifest_packages:
  gemfile:
  - rails
source_extensions:
- .rb
path_patterns:
  strong: []
  medium: []
  weak: []
source_patterns:
  strong:
  - Rails\.application\.routes\.draw\b
  - ^\s*resources\s+:\w+
  medium:
  - ^\s*namespace\s+:\w+
  - ^\s*scope\s+[\'"]/
  weak: []
negative_path_patterns: []
negative_source_patterns: []
