framework: nextjs
manifest_packages:
  package_json:
  - next
source_extensions:
- .js
- .jsx
- .ts
- .tsx
path_patterns:
  strong:
  - (^|/)(app|pages)/api/
  medium: []
  weak: []
source_patterns:
  strong:
  - export\s+(async\s+)?function\s+(GET|POST|PUT|DELETE|PATCH)\b
  - export\s+\{\s*(GET|POST|PUT|DELETE|PATCH)\s*\}
  medium: []
  weak: []
negative_path_patterns: []
negative_source_patterns: []
