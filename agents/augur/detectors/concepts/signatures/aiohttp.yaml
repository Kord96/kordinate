framework: aiohttp
manifest_packages:
  pyproject:
  - aiohttp
  requirements:
  - aiohttp
source_extensions:
- .py
path_patterns:
  strong: []
  medium: []
  weak: []
source_patterns:
  strong:
  - from\s+aiohttp\s+import\s+web
  - web\.Application\s*\(
  medium:
  - router\.add_(get|post|put|delete|route)\s*\(
  weak: []
negative_path_patterns: []
negative_source_patterns: []
