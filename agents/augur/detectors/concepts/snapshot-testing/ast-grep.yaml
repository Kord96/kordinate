id: snapshot-toMatchSnapshot-ts
language: TypeScript
rule:
  pattern: '$RESULT.toMatchSnapshot()'
---
id: snapshot-toMatchInlineSnapshot-ts
language: TypeScript
rule:
  pattern: '$RESULT.toMatchInlineSnapshot($$$ARGS)'
---
id: snapshot-syrupy-assert-py
language: Python
rule:
  pattern: 'assert $RESULT == snapshot'
---
id: snapshot-syrupy-snapshot-use-py
language: Python
rule:
  pattern: 'snapshot.use_extension($$$ARGS)'
