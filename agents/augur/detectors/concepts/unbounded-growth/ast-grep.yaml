# Score 3: Unbounded growth is about collections that grow without eviction.
# We can match the structural indicators: lru_cache(maxsize=None), dicts/lists
# appended in loops with no size check, and deque without maxlen.

id: unbounded-growth-lru-cache-none-py
language: Python
rule:
  pattern: '@lru_cache(maxsize=None)'
---
id: unbounded-growth-cache-dict-py
language: Python
rule:
  pattern: |
    $CACHE = {}
  constraints:
    CACHE:
      regex: '(cache|memo|seen|visited|registry|store)'
---
id: unbounded-growth-append-in-loop-py
language: Python
rule:
  inside:
    pattern: |
      while True:
          $$$BODY
  pattern: $LIST.append($ITEM)
---
id: unbounded-growth-deque-no-maxlen-py
language: Python
rule:
  pattern: deque()
---
id: unbounded-growth-dict-set-in-loop-py
language: Python
rule:
  inside:
    pattern: |
      while True:
          $$$BODY
  pattern: $DICT[$KEY] = $VALUE
---
id: unbounded-growth-map-set-in-loop-ts
language: TypeScript
rule:
  inside:
    pattern: |
      while (true) {
          $$$BODY
      }
  pattern: $MAP.set($KEY, $VALUE)
---
id: unbounded-growth-push-in-loop-ts
language: TypeScript
rule:
  inside:
    pattern: |
      while (true) {
          $$$BODY
      }
  pattern: $ARR.push($ITEM)
