concept: repository
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 5
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
      - broad_match
      - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 6
  entries:
    - id: repository-domain-facing-interface
      prompt: Does the repository expose a stable data-access contract to the domain or service layer?
      weight: 3
      signals:
        - "Repository"
        - "JpaRepository"
        - "@Repository"
    - id: repository-storage-separation
      prompt: Is storage logic encapsulated here rather than leaking direct queries into services or controllers?
      weight: 3
      signals:
        - session.query
        - prisma
        - SELECT
