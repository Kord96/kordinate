id: mq-celery-task-py
language: Python
rule:
  pattern: |
    @app.task($$$ARGS)
    def $NAME($$$PARAMS):
        $$$BODY
---
id: mq-celery-shared-task-py
language: Python
rule:
  pattern: |
    @shared_task($$$ARGS)
    def $NAME($$$PARAMS):
        $$$BODY
---
id: mq-pika-publish-py
language: Python
rule:
  pattern: '$CHANNEL.basic_publish($$$ARGS)'
---
id: mq-pika-consume-py
language: Python
rule:
  pattern: '$CHANNEL.basic_consume($$$ARGS)'
---
id: mq-bullmq-queue-ts
language: TypeScript
rule:
  pattern: 'new Queue($NAME, $$$OPTS)'
---
id: mq-bullmq-worker-ts
language: TypeScript
rule:
  pattern: 'new Worker($NAME, $PROCESSOR, $$$OPTS)'
---
id: mq-amqplib-consume-ts
language: TypeScript
rule:
  pattern: '$CHANNEL.consume($QUEUE, $$$ARGS)'
