id: workerpool-threadpool-py
language: Python
rule:
  pattern: |
    with ThreadPoolExecutor($$$ARGS) as $POOL:
        $$$BODY
---
id: workerpool-processpool-py
language: Python
rule:
  pattern: |
    with ProcessPoolExecutor($$$ARGS) as $POOL:
        $$$BODY
---
id: workerpool-submit-py
language: Python
rule:
  pattern: '$POOL.submit($FUNC, $$$ARGS)'
---
id: workerpool-map-py
language: Python
rule:
  pattern: '$POOL.map($FUNC, $$$ARGS)'
---
id: workerpool-worker-threads-ts
language: TypeScript
rule:
  pattern: 'new Worker($SCRIPT, $$$OPTS)'
---
id: workerpool-piscina-ts
language: TypeScript
rule:
  pattern: 'new Piscina($$$OPTS)'
