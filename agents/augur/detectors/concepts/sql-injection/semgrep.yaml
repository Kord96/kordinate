rules:
  - id: sql-injection-fstring
    pattern: |
      cursor.execute(f"...{$INPUT}...")
    message: "SQL injection via f-string interpolation in query"
    severity: ERROR
    languages: [python]
  - id: sql-injection-format
    pattern: |
      cursor.execute("..." % $INPUT)
    message: "SQL injection via % string formatting in query"
    severity: ERROR
    languages: [python]
  - id: sql-injection-concat
    pattern: |
      cursor.execute("..." + $INPUT)
    message: "SQL injection via string concatenation in query"
    severity: ERROR
    languages: [python]
