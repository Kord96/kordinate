# Score 2: Anemic Domain Model requires understanding whether a class's methods contain
# business logic or just getters/setters -- a semantic distinction ast-grep cannot make.
#
# The defining characteristic is: entity/model classes have NO behavior methods, only
# data access, while all business rules live in separate *Service classes. Detecting this
# requires:
#   - Classifying methods as "behavior" vs "accessor" (semantic)
#   - Correlating model classes with their corresponding service classes (cross-file)
#   - Understanding what constitutes "business logic" vs infrastructure (domain knowledge)
#
# The heuristic below catches Python dataclasses with no additional methods defined
# beyond what @dataclass generates. This is very low-confidence because dataclasses
# are a legitimate and idiomatic Python pattern -- not every dataclass is anemic.

# Low-confidence heuristic: @dataclass with only field definitions and no methods
id: anemic-domain-model-python-dataclass
language: Python
rule:
  pattern: |
    @dataclass
    class $NAME:
      $$$FIELDS
  not:
    has:
      kind: function_definition
