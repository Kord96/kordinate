rules:
  - id: bare-except-pass
    pattern: |
      try:
          ...
      except:
          pass
    message: "Bare except with pass — exceptions silently swallowed"
    severity: WARNING
    languages: [python]
  - id: exception-pass
    pattern: |
      try:
          ...
      except Exception:
          pass
    message: "Exception caught and silently swallowed"
    severity: WARNING
    languages: [python]
