# Score 3: Fire-and-forget is about ABSENCE of error handling after an async call.
# We can match the positive smell shapes: send() without await, celery .delay()
# not assigned, and try/except/pass around sends.

id: fire-and-forget-send-no-await-py
language: Python
rule:
  pattern: $PRODUCER.send($$$ARGS)
  not:
    inside:
      pattern: await $$$EXPR
---
id: fire-and-forget-celery-delay-py
language: Python
rule:
  pattern: $TASK.delay($$$ARGS)
---
id: fire-and-forget-celery-apply-async-py
language: Python
rule:
  pattern: $TASK.apply_async($$$ARGS)
---
id: fire-and-forget-swallowed-send-py
language: Python
rule:
  pattern: |
    try:
        $$$BEFORE
        $PRODUCER.send($$$ARGS)
        $$$AFTER
    except $$$EXC:
        pass
---
id: fire-and-forget-void-promise-ts
language: TypeScript
rule:
  pattern: $EXPR.then($$$HANDLERS)
  not:
    inside:
      pattern: await $$$A
  not:
    has:
      pattern: .catch($$$HANDLER)
---
id: fire-and-forget-no-await-ts
language: TypeScript
rule:
  pattern: $FN($$$ARGS)
  constraints:
    FN:
      regex: '(send|publish|dispatch|emit|enqueue)'
  not:
    inside:
      pattern: await $$$EXPR
