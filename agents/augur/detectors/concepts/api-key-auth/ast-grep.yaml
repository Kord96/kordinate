id: api-key-auth-header-extract-py
language: Python
rule:
  pattern: $KEY = $REQUEST.headers.get("X-API-Key")
---
id: api-key-auth-fastapi-security-py
language: Python
rule:
  pattern: $NAME = APIKeyHeader(name=$$$ARGS)
---
id: api-key-auth-hash-compare-py
language: Python
rule:
  pattern: hmac.compare_digest($$$ARGS)
---
id: api-key-auth-header-extract-ts
language: TypeScript
rule:
  pattern: $KEY = $REQ.headers['x-api-key']
---
id: api-key-auth-get-header-ts
language: TypeScript
rule:
  pattern: $KEY = $REQ.get('x-api-key')
