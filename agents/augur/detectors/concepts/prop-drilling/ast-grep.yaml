# Score 3: Prop drilling requires tracing the same prop through multiple component
# layers across files, which ast-grep cannot do cross-file. However, we can match
# the SMELL shape: a component that receives props and immediately spreads them
# to a child without using them, and deeply nested prop forwarding.

id: prop-drilling-spread-forward-ts
language: TypeScript
rule:
  pattern: <$CHILD {...$PROPS} />
---
id: prop-drilling-explicit-forward-ts
language: TypeScript
rule:
  pattern: |
    <$CHILD
        $PROP1={$PROPS.$PROP1}
        $PROP2={$PROPS.$PROP2}
        $PROP3={$PROPS.$PROP3}
        $PROP4={$PROPS.$PROP4}
        $$$REST
    />
---
id: prop-drilling-destructure-forward-ts
language: TypeScript
rule:
  pattern: |
    function $COMPONENT({ $$$PROPS }: $TYPE) {
        return <$CHILD $$$FORWARDED />;
    }
