id: pokemon-bare-except-py
language: Python
rule:
  pattern: |
    except:
        $$$BODY
---
id: pokemon-except-exception-py
language: Python
rule:
  pattern: |
    except Exception:
        $$$BODY
---
id: pokemon-except-exception-as-py
language: Python
rule:
  pattern: |
    except Exception as $E:
        $$$BODY
---
id: pokemon-catch-any-ts
language: TypeScript
rule:
  pattern: |
    catch ($E) {
        $$$BODY
    }
