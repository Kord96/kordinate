concept: hexagonal
detectors:
  ast_grep:
    enabled: false
    detector_strength: 2
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
      - noisy_rule_match
      - conflicting_evidence
      - broad_match
      - low_rule_confidence
      - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 6
  entries:
    - id: hexagonal-ports-adapters-structure
      prompt: Is there a ports/ and adapters/ directory structure with Port-suffixed interfaces and Adapter-suffixed implementations?
      weight: 3
      signals:
        - ports/ directory
        - adapters/ directory
        - RepositoryPort interface
        - PostgresAdapter class
    - id: hexagonal-domain-free-of-infra
      prompt: Is the domain layer free of infrastructure imports like HTTP libraries, database drivers, or cloud SDKs?
      weight: 3
      signals:
        - no requests import in domain
        - no boto3 in domain
        - no DB driver in domain
    - id: hexagonal-di-wiring
      prompt: Are adapters wired to ports via dependency injection at application startup?
      weight: 2
      signals:
        - inject adapter at startup
        - bind port to adapter
        - DI container wiring
    - id: hexagonal-test-adapters
      prompt: Do tests use in-memory adapter implementations rather than mocking concrete infrastructure classes?
      weight: 1
      signals:
        - InMemoryRepository in tests
        - fake adapter for testing
        - test adapter implements port
