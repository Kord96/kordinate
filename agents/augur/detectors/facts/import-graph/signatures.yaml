domain: import-graph
positive:
  strong:
    - module import statements
    - dependency declarations
    - entrypoint fan-in clusters
    - circular dependency evidence
  medium:
    - frequently imported modules
    - cross-package references
  weak:
    - shared utility imports from many files
negative:
  - isolated files with no import relationships
notes:
  - Import graph facts should support component grouping, hub detection, hot files, and blast radius.
