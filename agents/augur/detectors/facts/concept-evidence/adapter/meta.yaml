concept: adapter
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 4
    ask_when:
      - broad_match
      - noisy_rule_match
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 4
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 5
  entries:
    - id: adapter-interface-translation
      prompt: Does this code translate one interface into another expected by callers rather than simply wrapping a helper?
      weight: 3
      signals:
        - Adapter
        - Gateway
        - Wrapper
    - id: adapter-hides-vendor-shape
      prompt: Does the adapter isolate third-party or legacy API details from the rest of the codebase?
      weight: 2
      signals:
        - client
        - sdk
        - translate
monitoring:
  applies_to:
    - component
    - dependency
  health_signals:
    - name: adapter.error.rate
      description: Failures at the adapter boundary translating to or from an external interface.
  business_metrics: []
  gaps:
    - Missing adapter-level visibility makes external integration regressions look like core-domain failures.
