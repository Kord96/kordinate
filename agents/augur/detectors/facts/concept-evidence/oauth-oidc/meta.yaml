concept: oauth-oidc
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
      - broad_match
      - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 4
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 5
  entries:
    - id: oauth-oidc-delegated-flow
      prompt: Does the code implement or consume an OAuth or OIDC authorization flow with client credentials, redirect URIs, or discovery metadata?
      weight: 3
      signals:
        - create_authorization_url
        - fetch_token
        - openid-configuration
    - id: oauth-oidc-token-validation
      prompt: Are access or ID tokens validated as part of a delegated identity flow rather than just generic JWT auth?
      weight: 2
      signals:
        - id_token
        - client_id
        - NextAuth
monitoring:
  applies_to:
    - component
    - dependency
    - flow
  health_signals:
    - name: oauth.login.error.rate
      description: Failures during authorization or callback handling.
    - name: oauth.token.refresh.error.rate
      description: Failures refreshing or rotating delegated tokens.
  business_metrics: []
  gaps:
    - Missing callback and token-refresh visibility hides identity-provider integration issues.
