concept: rbac
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 4
    ask_when:
      - broad_match
      - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 4
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 5
  entries:
    - id: rbac-role-permission-model
      prompt: Does the authorization model map users or groups to roles and roles to permissions?
      weight: 3
      signals:
        - requires_role
        - has_permission
        - RoleBinding
    - id: rbac-enforcement-layer
      prompt: Are role checks enforced at route, API, or service boundaries rather than only in the UI?
      weight: 2
      signals:
        - authorize
        - Roles(
        - canActivate
monitoring:
  applies_to:
    - component
    - flow
  health_signals:
    - name: authorization.denied.rate
      description: Requests or actions denied by RBAC enforcement.
  business_metrics: []
  gaps:
    - Missing authorization-denial visibility hides policy drift and rollout errors.
