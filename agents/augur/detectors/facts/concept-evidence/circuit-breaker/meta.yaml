concept: circuit-breaker
detectors:
  ast_grep:
    enabled: true
    detector_strength: 5
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
      - broad_match
      - noisy_rule_match
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 4
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 6
  entries:
    - id: circuit-breaker-state
      prompt: Is there explicit open or half-open state behavior rather than only retries?
      weight: 3
      signals:
        - CircuitBreaker
        - half-open
        - outlierDetection
    - id: circuit-breaker-fallback
      prompt: Is fallback or degraded behavior defined when the circuit opens?
      weight: 2
      signals:
        - fallback
        - degrade
    - id: circuit-breaker-thresholds
      prompt: Are failure thresholds and recovery timing explicitly configured?
      weight: 1
      signals:
        - failure threshold
        - recovery timeout
monitoring:
  applies_to:
    - component
    - dependency
  health_signals:
    - name: circuit.open.rate
      description: Rate of circuit transitions to open state.
    - name: fallback.activation.rate
      description: Frequency of fallback or degraded-mode activation when the circuit opens.
    - name: dependency.error.rate
      description: Downstream failure rate that should correlate with circuit activation.
  business_metrics: []
  gaps:
    - Missing circuit state visibility makes degraded behavior hard to distinguish from total outage.
