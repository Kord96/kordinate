concept: api-key-auth
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
      - broad_match
      - low_rule_confidence
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 4
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 5
  entries:
    - id: api-key-auth-header-validation
      prompt: Are API keys extracted from request headers and validated against a managed store rather than compared as hardcoded secrets?
      weight: 3
      signals:
        - X-API-Key
        - APIKeyHeader
        - compare_digest
    - id: api-key-auth-lifecycle-controls
      prompt: Does the system treat keys as first-class credentials with revocation, tenant mapping, or quota controls?
      weight: 2
      signals:
        - revoke
        - quota
        - tenant
monitoring:
  applies_to:
    - component
    - dependency
    - flow
  health_signals:
    - name: api_key_auth.failure.rate
      description: Failed API key validation rate for protected endpoints.
    - name: api_key_auth.revocation.hit.rate
      description: Requests rejected because the key is revoked or inactive.
  business_metrics: []
  gaps:
    - Missing auth-failure and revocation visibility hides abuse and misconfigured clients.
