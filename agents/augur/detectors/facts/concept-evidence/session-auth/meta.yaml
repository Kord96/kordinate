concept: session-auth
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 4
    ask_when:
      - broad_match
      - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 4
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 5
  entries:
    - id: session-auth-server-state
      prompt: Does the system keep authenticated session state on the server side and reference it via cookies or session IDs?
      weight: 3
      signals:
        - req.session
        - request.session
        - express-session
    - id: session-auth-cookie-controls
      prompt: Are secure cookie and session-lifecycle controls part of the auth design?
      weight: 2
      signals:
        - Set-Cookie
        - HttpOnly
        - SameSite
monitoring:
  applies_to:
    - component
    - flow
  health_signals:
    - name: session_auth.lookup.error.rate
      description: Failures loading or persisting authenticated session state.
    - name: session_auth.expired.rate
      description: Requests rejected because the session expired or was destroyed.
  business_metrics: []
  gaps:
    - Missing session-store and expiry visibility hides auth state drift and logout bugs.
