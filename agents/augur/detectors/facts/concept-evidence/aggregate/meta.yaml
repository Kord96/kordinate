concept: aggregate
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
      - broad_match
      - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 6
  entries:
    - id: aggregate-root-controls-mutation
      prompt: Does one root entity control mutations to its children or internal state boundary?
      weight: 3
      signals:
        - AggregateRoot
        - addDomainEvent
        - _raise_event
    - id: aggregate-repository-boundary
      prompt: Is persistence organized around loading and saving the whole aggregate root rather than child entities independently?
      weight: 3
      signals:
        - repository
        - aggregate
        - invariant
monitoring:
  applies_to:
    - component
    - state
  health_signals: []
  business_metrics: []
  gaps:
    - Aggregate boundaries are semantic consistency boundaries; they rarely have direct runtime health signals.
