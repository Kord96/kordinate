concept: router
detectors:
  ast_grep:
    enabled: true
    detector_strength: 5
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 4
    ask_when:
      - broad_match
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 4
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 4
  entries:
    - id: router-declarative-map
      prompt: Is there a declarative mapping from paths to views, components, or handlers?
      weight: 2
      signals:
        - BrowserRouter
        - Route
        - path(
    - id: router-navigation-and-params
      prompt: Are navigation helpers or route parameters used as part of the routing system?
      weight: 2
      signals:
        - useNavigate
        - useParams
        - router.push
monitoring:
  applies_to:
    - flow
    - component
  health_signals:
    - name: route.dispatch.latency
      description: End-to-end dispatch latency across the routing layer.
    - name: route.not_found.rate
      description: Frequency of unmatched requests returning 404 or equivalent dispatch misses.
  business_metrics: []
  gaps:
    - Missing route-level latency and not-found metrics hides contract drift and traffic shape changes.
