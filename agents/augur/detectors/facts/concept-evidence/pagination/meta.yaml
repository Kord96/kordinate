concept: pagination
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 4
    ask_when:
      - broad_match
      - low_rule_confidence
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 4
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 5
  entries:
    - id: pagination-client-contract
      prompt: Does the API expose a stable paging contract such as cursor, page, or limit plus metadata?
      weight: 3
      signals:
        - limit
        - offset
        - cursor
    - id: pagination-stable-ordering
      prompt: Is pagination grounded in a stable ordering or cursor strategy rather than ad-hoc slicing?
      weight: 2
      signals:
        - take
        - skip
        - pageInfo
monitoring:
  applies_to:
    - flow
  health_signals:
    - name: pagination.deep_page.latency
      description: Latency for requests that traverse many pages or use deep offsets.
  business_metrics: []
  gaps:
    - Missing deep-page latency visibility hides offset-pagination scalability problems.
