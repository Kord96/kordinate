concept: cache-aside
detectors:
  ast_grep:
    enabled: true
    detector_strength: 5
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 4
    ask_when:
      - broad_match
      - noisy_rule_match
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 4
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 5
  entries:
    - id: cache-aside-miss-fill
      prompt: Does the read path check cache first, then load from the source of truth, then repopulate the cache?
      weight: 3
      signals:
        - .get(
        - setex
        - cached(ttl=
    - id: cache-aside-write-invalidation
      prompt: Do writes invalidate or refresh the same cache keys rather than leaving stale entries behind?
      weight: 2
      signals:
        - del(
        - invalidate
        - ttl
monitoring:
  applies_to:
    - component
    - dependency
    - flow
  health_signals:
    - name: cache.hit.rate
      description: Fraction of reads served from cache without going to the source of truth.
    - name: cache.miss.latency
      description: End-to-end latency for cache-miss paths that refill from the source.
    - name: cache.invalidation.error.rate
      description: Failures invalidating or refreshing keys after writes.
  business_metrics: []
  gaps:
    - Without hit-rate and invalidation visibility, cache correctness and value are hard to judge.
