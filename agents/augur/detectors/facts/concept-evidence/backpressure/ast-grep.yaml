id: backpressure-bounded-queue-py
language: Python
rule:
  pattern: asyncio.Queue(maxsize=$SIZE)
---
id: backpressure-queue-full-py
language: Python
rule:
  pattern: raise asyncio.QueueFull
---
id: backpressure-semaphore-acquire-py
language: Python
rule:
  pattern: |
    await $SEMAPHORE.acquire()
    $$$BODY
---
id: backpressure-bounded-channel-ts
language: TypeScript
rule:
  pattern: new BoundedChannel($SIZE)
---
id: backpressure-max-concurrent-ts
language: TypeScript
rule:
  pattern: |
    if ($QUEUE.length >= $MAX) {
        $$$BODY
    }
