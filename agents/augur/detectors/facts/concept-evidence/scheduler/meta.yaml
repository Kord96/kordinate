concept: scheduler
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: false
    detector_strength: 1
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
      - broad_match
      - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 5
  entries:
    - id: scheduler-cadence-owned-runtime
      prompt: Does a named subsystem own recurring execution on a defined cadence rather than just calling sleep or setInterval ad hoc?
      weight: 3
      signals:
        - cron
        - schedule
        - periodic
    - id: scheduler-missed-run-visibility
      prompt: Is there visible handling for missed, delayed, or overlapping scheduled runs?
      weight: 2
      signals:
        - missed
        - overlap
        - next run
monitoring:
  applies_to:
    - component
    - flow
  health_signals:
    - name: scheduler.missed_run.rate
      description: Frequency of scheduled executions that do not start within the expected interval.
    - name: scheduler.run.delay
      description: Delay between the expected schedule time and the actual start time.
    - name: scheduler.overlap.rate
      description: Rate of concurrent overlapping runs for jobs that are expected to serialize.
  business_metrics:
    - name: scheduler.jobs_completed_per_interval
      description: Number of scheduled jobs that complete within each expected execution window.
    - name: scheduler.backlog_cleared_per_run
      description: Amount of queued or pending work cleared by each scheduled execution cycle.
  gaps:
    - Without missed-run and delay visibility, periodic work can silently stop meeting its intended cadence.
