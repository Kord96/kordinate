concept: timeout
detectors:
  ast_grep:
    enabled: true
    detector_strength: 5
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 4
    ask_when:
      - broad_match
      - low_rule_confidence
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 4
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 5
  entries:
    - id: timeout-explicit-on-external-calls
      prompt: Are timeouts explicitly configured on real external calls rather than only in generic config?
      weight: 3
      signals:
        - timeout=
        - wait_for(
        - AbortController
    - id: timeout-distinct-handling
      prompt: Are timeout failures handled distinctly from generic errors?
      weight: 2
      signals:
        - TimeoutError
        - DeadlineExceeded
monitoring:
  applies_to:
    - component
    - dependency
    - flow
  health_signals:
    - name: timeout.rate
      description: Rate of requests, jobs, or downstream calls that terminate due to timeout.
    - name: timeout.cancellation.rate
      description: Frequency of successful cancellation or cleanup when a timeout occurs.
    - name: downstream.timeout.rate
      description: Timeout rate for specific external calls or slow internal boundaries.
  business_metrics: []
  gaps:
    - Timeout handling without timeout metrics hides latency collapse until users experience hard failures.
