concept: active-record
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 4
    ask_when:
      - broad_match
      - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 4
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 5
  entries:
    - id: active-record-persistence-on-model
      prompt: Do model instances or model classes directly own persistence methods such as save, update, create, or query?
      weight: 3
      signals:
        - models.Model
        - ActiveRecord::Base
        - .save(
    - id: active-record-domain-and-storage-mixed
      prompt: Are domain rules and persistence behavior intentionally combined in the same model object rather than split behind repositories or mappers?
      weight: 2
      signals:
        - objects.filter
        - belongs_to
        - has_many
monitoring:
  applies_to:
    - component
    - state
  health_signals: []
  business_metrics: []
  gaps:
    - Active Record is primarily a code-structure concept; monitor the persistence operations rather than the concept itself.
