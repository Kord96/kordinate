concept: ddd
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
      - broad_match
      - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 6
  entries:
    - id: ddd-bounded-contexts
      prompt: Are there explicit bounded contexts or domain boundaries with their own language and model ownership?
      weight: 3
      signals:
        - domain
        - bounded context
        - anti-corruption
    - id: ddd-aggregate-and-repository
      prompt: Do aggregates, repositories, and domain events shape the core model rather than appearing only as naming conventions?
      weight: 3
      signals:
        - AggregateRoot
        - DomainEvent
        - Repository
monitoring:
  applies_to:
    - component
    - state
  health_signals: []
  business_metrics: []
  gaps:
    - DDD is semantic architecture guidance; the runtime signals belong to the bounded contexts and flows it produces.
