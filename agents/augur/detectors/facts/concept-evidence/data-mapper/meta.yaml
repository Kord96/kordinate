concept: data-mapper
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
      - broad_match
      - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 6
  entries:
    - id: data-mapper-separate-mapping-layer
      prompt: Is persistence translation handled in explicit mapper classes or functions separate from the domain model?
      weight: 3
      signals:
        - Mapper
        - toEntity
        - toPersistence
    - id: data-mapper-domain-decoupled
      prompt: Are domain entities free of ORM base classes and persistence APIs?
      weight: 3
      signals:
        - from_row
        - mapper
        - repository
monitoring:
  applies_to:
    - component
    - state
  health_signals: []
  business_metrics: []
  gaps:
    - Data Mapper is structural; monitor the persistence boundary it supports, not the concept directly.
