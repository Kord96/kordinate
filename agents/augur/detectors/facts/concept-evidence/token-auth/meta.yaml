concept: token-auth
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 4
    ask_when:
      - broad_match
      - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 4
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 5
  entries:
    - id: token-auth-bearer-verification
      prompt: Does the system authenticate requests with bearer tokens that are parsed and cryptographically verified?
      weight: 3
      signals:
        - Authorization
        - jwt.verify
        - jwt.decode
    - id: token-auth-lifecycle
      prompt: Are token expiry, refresh, or revocation part of the design rather than ad-hoc token parsing?
      weight: 2
      signals:
        - exp
        - refresh
        - jwks
monitoring:
  applies_to:
    - component
    - flow
  health_signals:
    - name: token_auth.validation.error.rate
      description: Failed token verification or claim-validation rate.
    - name: token_auth.expired.rate
      description: Requests rejected because the token expired or was revoked.
  business_metrics: []
  gaps:
    - Missing verification and expiry visibility hides auth failures and rotation bugs.
