concept: repository
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 5
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
      - broad_match
      - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 6
  entries:
    - id: repository-domain-facing-interface
      prompt: Does the repository expose a stable data-access contract to the domain or service layer?
      weight: 3
      signals:
        - "Repository"
        - "JpaRepository"
        - "@Repository"
    - id: repository-storage-separation
      prompt: Is storage logic encapsulated here rather than leaking direct queries into services or controllers?
      weight: 3
      signals:
        - session.query
        - prisma
        - SELECT
monitoring:
  applies_to:
    - component
    - dependency
  health_signals:
    - name: repository.error.rate
      description: Failure rate of repository operations, grouped by repository or aggregate boundary.
    - name: repository.latency
      description: Latency distribution for repository operations that cross a persistence boundary.
    - name: repository.slow_query.rate
      description: Rate of repository calls crossing slow-query or saturation thresholds.
  business_metrics:
    - name: repository.write.success.rate
      description: Fraction of repository-backed writes that complete successfully on the primary persistence path.
    - name: repository.read.freshness
      description: Freshness or staleness of reads when repository calls depend on caches, replicas, or asynchronous projections.
  gaps:
    - If repository calls are not visible separately from application logic, persistence regressions are hard to isolate.
