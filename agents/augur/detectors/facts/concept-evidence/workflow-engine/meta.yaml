concept: workflow-engine
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: false
    detector_strength: 1
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
      - broad_match
      - architecture_level_concept
      - conflicting_evidence
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 6
  entries:
    - id: workflow-engine-explicit-orchestration
      prompt: Does the code orchestrate multi-step execution with explicit step or stage boundaries rather than one flat handler path?
      weight: 3
      signals:
        - workflow
        - stage
        - step
        - execute
    - id: workflow-engine-retries-or-timeouts
      prompt: Are retries, timeouts, or resumable execution part of the workflow runtime rather than generic helper logic?
      weight: 2
      signals:
        - retry
        - timeout
        - resume
    - id: workflow-engine-observable-progress
      prompt: Is workflow progress visible through run ids, stage status, queue depth, or step-level reporting?
      weight: 2
      signals:
        - run_id
        - status
        - queue
monitoring:
  applies_to:
    - component
    - flow
  health_signals:
    - name: workflow.active.count
      description: Number of in-flight workflow runs or orchestration instances.
    - name: workflow.step.timeout.rate
      description: Rate of workflow stages or steps timing out before completion.
    - name: workflow.retry.rate
      description: Frequency of workflow retries or re-dispatch for failed stages.
  business_metrics:
    - name: workflow.completion.rate
      description: Fraction of workflow runs that reach successful completion over time.
    - name: workflow.time_to_completion
      description: End-to-end duration from workflow start to successful completion.
    - name: workflow.failure.by_stage
      description: Distribution of failed workflow runs grouped by the stage or step where they stop.
  gaps:
    - Without completion and stage-failure visibility, workflow health can look normal while real work stalls or degrades.
