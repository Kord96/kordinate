concept: cqrs
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
      - broad_match
      - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 6
  entries:
    - id: cqrs-command-query-separation
      prompt: Are command and query paths intentionally separated in handlers, models, or stores?
      weight: 3
      signals:
        - CommandHandler
        - QueryHandler
        - command
    - id: cqrs-read-model-sync
      prompt: Is there an explicit read-model projection or sync mechanism rather than just naming conventions?
      weight: 3
      signals:
        - projection
        - read model
        - materialized
monitoring:
  applies_to:
    - component
    - flow
    - state
  health_signals:
    - name: cqrs.projection.lag
      description: Delay between write-side mutations and read-model visibility.
    - name: cqrs.projection.error.rate
      description: Failures updating or rebuilding read models.
  business_metrics: []
  gaps:
    - Missing projection lag visibility hides eventual-consistency regressions.
