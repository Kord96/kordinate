rules:
  - id: requests-in-async
    pattern: |
      async def $FUNC(...):
          ...
          requests.get(...)
    message: "Blocking requests.get() inside async function — use aiohttp or httpx"
    severity: WARNING
    languages: [python]
  - id: time-sleep-in-async
    pattern: |
      async def $FUNC(...):
          ...
          time.sleep(...)
    message: "Blocking time.sleep() inside async function — use await asyncio.sleep()"
    severity: WARNING
    languages: [python]
  - id: open-in-async
    pattern: |
      async def $FUNC(...):
          ...
          open($FILE, ...)
    message: "Blocking open() inside async function — use aiofiles"
    severity: INFO
    languages: [python]
