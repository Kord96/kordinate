concept: event-sourcing
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 5
    ask_when:
      - noisy_rule_match
      - conflicting_evidence
      - broad_match
      - low_rule_confidence
      - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 5
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 6
  entries:
    - id: event-sourcing-replay-derived-state
      prompt: Is aggregate state derived solely by replaying an append-only sequence of events?
      weight: 3
      signals:
        - apply methods on aggregates that mutate state from events
        - load_events and replay to reconstruct state
    - id: event-sourcing-append-only-store
      prompt: Are events stored in an append-only event store or stream?
      weight: 3
      signals:
        - EventStore or EventStream with append_events
        - EventStoreDB client or append-only table
    - id: event-sourcing-past-tense-events
      prompt: Are events named as immutable past-tense facts?
      weight: 2
      signals:
        - OrderPlaced
        - PaymentReceived
    - id: event-sourcing-snapshots
      prompt: Do snapshots exist for aggregates with long event histories?
      weight: 1
      signals:
        - Snapshot class
        - snapshot repository
        - snapshot interval configuration
monitoring:
  applies_to:
    - component
    - flow
  health_signals:
    - name: event_store.append.latency
      description: Latency for appending new events to the store or stream.
    - name: projection.lag
      description: Delay between event append and read-model projection completion.
    - name: replay.duration
      description: Time required to rebuild aggregate state from historical events.
  business_metrics: []
  gaps:
    - Missing projection lag or replay duration metrics hides read-side staleness and recovery cost.
