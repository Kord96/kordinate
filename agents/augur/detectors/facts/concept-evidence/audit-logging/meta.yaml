concept: audit-logging
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 4
    ask_when:
      - broad_match
      - noisy_rule_match
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 4
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 5
  entries:
    - id: audit-log-structured-append-only
      prompt: Is there a dedicated structured audit trail with actor, action, target, and timestamp rather than generic application logs?
      weight: 3
      signals:
        - AuditLog
        - AuditTrail
        - audited
    - id: audit-log-security-purpose
      prompt: Is the log intended for accountability or compliance rather than ordinary debugging?
      weight: 2
      signals:
        - actor
        - before
        - after
monitoring:
  applies_to:
    - component
    - flow
  health_signals:
    - name: audit_log.write.failure.rate
      description: Failures writing mandatory audit records.
    - name: audit_log.queue.lag
      description: Delay between the primary action and durable audit-record persistence.
  business_metrics: []
  gaps:
    - Missing audit-write visibility undermines accountability and compliance guarantees.
