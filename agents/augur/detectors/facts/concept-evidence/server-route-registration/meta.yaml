concept: server-route-registration
detectors:
  ast_grep:
    enabled: true
    detector_strength: 5
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 4
    ask_when:
      - broad_match
      - architecture_level_concept
policy:
  auto_confirm:
    allowed: true
    min_detector_strength: 5
    min_match_confidence: 4
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 5
  entries:
    - id: server-route-registration-public-surface
      prompt: Does the code visibly declare the externally reachable server surface through route or service registration APIs?
      weight: 3
      signals:
        - app.get
        - router.post
        - path(
    - id: server-route-registration-policy-near-route
      prompt: Are route-level concerns such as auth, validation, or serialization attached at or near registration time?
      weight: 2
      signals:
        - Depends
        - middleware
        - guard
monitoring:
  applies_to:
    - component
    - flow
  health_signals:
    - name: route.registration.coverage
      description: Coverage of declared routes in generated route manifests or endpoint inventories.
    - name: route.auth_misconfig.rate
      description: Rate of public-route misconfigurations detected by runtime checks or policy tests.
  business_metrics: []
  gaps:
    - Missing route-manifest visibility makes the public server surface harder to audit and secure.
