concept: feature-flag
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 4
    ask_when:
      - broad_match
      - noisy_rule_match
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 4
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 5
  entries:
    - id: feature-flag-runtime-toggle
      prompt: Are code paths gated by named runtime toggles rather than hardcoded environment forks?
      weight: 3
      signals:
        - feature_enabled
        - variation
        - FEATURE_
    - id: feature-flag-lifecycle
      prompt: Does the flag system appear managed as a rollout mechanism rather than permanent configuration?
      weight: 2
      signals:
        - LaunchDarkly
        - Unleash
        - flag
monitoring:
  applies_to:
    - component
    - flow
  health_signals:
    - name: feature_flag.evaluation.error.rate
      description: Failures resolving flag values from the flag service or local evaluator.
    - name: feature_flag.default_fallback.rate
      description: Frequency of default-value fallbacks because flag state is unavailable.
  business_metrics: []
  gaps:
    - Missing flag-evaluation visibility makes rollout and fallback behavior hard to trust.
