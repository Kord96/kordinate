id: feature-flag-check-py
language: Python
rule:
  pattern: feature_enabled($$$ARGS)
---
id: feature-flag-is-on-py
language: Python
rule:
  pattern: is_feature_on($$$ARGS)
---
id: feature-flag-has-feature-py
language: Python
rule:
  pattern: has_feature($$$ARGS)
---
id: feature-flag-ldclient-variation-py
language: Python
rule:
  pattern: $CLIENT.variation($$$ARGS)
---
id: feature-flag-env-var-py
language: Python
rule:
  pattern: os.environ.get("FEATURE_$NAME", $$$DEFAULT)
---
id: feature-flag-check-ts
language: TypeScript
rule:
  pattern: isFeatureEnabled($$$ARGS)
---
id: feature-flag-has-feature-ts
language: TypeScript
rule:
  pattern: hasFeature($$$ARGS)
---
id: feature-flag-ld-variation-ts
language: TypeScript
rule:
  pattern: $CLIENT.variation($$$ARGS)
