concept: rate-limiting
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: false
    detector_strength: 2
  signatures:
    enabled: true
    detector_strength: 4
  questions:
    enabled: true
    detector_strength: 4
    ask_when:
      - broad_match
      - architecture_level_concept
policy:
  auto_confirm:
    allowed: false
    min_detector_strength: 5
    min_match_confidence: 4
    requires_no_contradiction: true
  unresolved_state: candidate
  negative_rule_result_means: neutral
  broad_match_requires_questions: true
questions:
  threshold: 5
  entries:
    - id: rate-limiting-enforced-thresholds
      prompt: Does the system enforce explicit request thresholds with a client-facing denial behavior such as HTTP 429?
      weight: 3
      signals:
        - rateLimit
        - Limiter
        - 429
    - id: rate-limiting-shared-state
      prompt: In distributed deployments, is rate-limit state shared rather than isolated per instance?
      weight: 2
      signals:
        - Redis
        - INCR
        - windowMs
monitoring:
  applies_to:
    - component
    - flow
  health_signals:
    - name: rate_limit.rejection.rate
      description: Rate of requests denied by throttling policy.
    - name: rate_limit.backend.error.rate
      description: Failures in the shared counter or limiter backend.
  business_metrics: []
  gaps:
    - Missing reject-rate and backend-health signals makes throttling effectiveness hard to trust.
