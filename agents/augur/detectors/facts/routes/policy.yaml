domain: routes
emits:
  - route
  - graphql-operation
  - grpc-service
  - websocket-channel
frameworks:
  include:
    - fastapi
    - flask
    - django
    - starlette
    - aiohttp
    - express
    - koa
    - fastify
    - hono
    - elysia
    - nestjs
    - nextjs
    - sveltekit
    - gin
    - chi
    - echo
    - fiber
    - phoenix
    - rails
    - spring
    - ktor
    - aspnet
    - laravel
    - symfony
    - slim
    - actix-web
    - axum
    - vapor
  exclude: []
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: true
    detector_strength: 3
  signatures:
    enabled: true
    detector_strength: 5
  manifest:
    enabled: true
    detector_strength: 4
policy:
  emit_threshold: 3
  fallback_order:
    - ast_grep
    - semgrep
    - signatures
    - manifest
  negative_rule_result_means: neutral
  requires_framework_context: true
normalization:
  fact_kind: route
  required_fields:
    - style
    - method
    - path
    - handler
  optional_fields:
    - router
    - auth
    - validation
