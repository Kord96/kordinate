domain: external-clients
positive:
  strong:
    - outbound HTTP client initialization
    - SDK or API client construction
    - database driver or cache client creation
    - queue publisher or broker client setup
  medium:
    - request wrappers with timeout or retry settings
    - connection strings and service targets
  weak:
    - import of a well-known client library without callsite evidence
negative:
  - local-only helpers with no remote call target
notes:
  - External client facts should be specific enough to support resilience and failure-mode analysis.
