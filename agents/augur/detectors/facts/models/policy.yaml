domain: models
emits:
  - model
  - state-store
frameworks:
  include:
    - fastapi
    - django
    - flask
    - express
    - nestjs
    - spring
    - rails
    - laravel
    - sqlalchemy
    - prisma
    - typeorm
    - mongoose
    - hibernate
    - sequelize
    - peewee
    - drizzle
  exclude: []
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: true
    detector_strength: 4
  signatures:
    enabled: true
    detector_strength: 5
  manifest:
    enabled: true
    detector_strength: 4
policy:
  emit_threshold: 3
  fallback_order:
    - ast_grep
    - semgrep
    - signatures
    - manifest
  negative_rule_result_means: neutral
  requires_framework_context: true
normalization:
  fact_kind: model
  required_fields:
    - technology
    - entity
  optional_fields:
    - fields
    - relations
    - migration_path
    - store_purpose
