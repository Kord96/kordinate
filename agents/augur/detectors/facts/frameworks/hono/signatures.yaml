framework: hono
manifest_packages:
  package_json:
    - hono
source_extensions:
  - .js
  - .jsx
  - .ts
  - .tsx
path_patterns:
  strong: []
  medium: []
  weak: []
source_patterns:
  strong:
    - import\s+\{\s*Hono\s*\}
    - \bnew\s+Hono\s*\(
  medium:
    - \bapp\.(get|post|put|delete|patch|route)\s*\(
  weak: []
negative_path_patterns: []
negative_source_patterns: []
