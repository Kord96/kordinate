framework: ktor
manifest_packages:
  pom:
    - io.ktor
source_extensions:
  - .kt
  - .kts
  - .gradle
  - .xml
path_patterns:
  strong: []
  medium: []
  weak: []
source_patterns:
  strong:
    - embeddedServer\s*\(
    - routing\s*\{\s*get\(
  medium:
    - io\.ktor
    - route\s*\(\s*"/
  weak: []
negative_path_patterns: []
negative_source_patterns: []
