id: middleware-fastapi-add-py
language: Python
rule:
  pattern: $APP.add_middleware($MIDDLEWARE, $$$ARGS)
---
id: middleware-fastapi-http-py
language: Python
rule:
  pattern: |
    @$APP.middleware("http")
    async def $HANDLER($$$PARAMS):
        $$$BODY
---
id: middleware-express-use-ts
language: TypeScript
rule:
  any:
    - pattern: $APP.use($$$ARGS)
    - pattern: $ROUTER.use($$$ARGS)
---
id: middleware-nest-useguards-ts
language: TypeScript
rule:
  pattern: '@UseGuards($$$ARGS)'
