domain: data-touches
emits:
  - data-touch
frameworks:
  include: []
  exclude: []
detectors:
  cpg:
    enabled: true
    detector_strength: 5
  ast_grep:
    enabled: false
    detector_strength: 0
  semgrep:
    enabled: false
    detector_strength: 0
  signatures:
    enabled: false
    detector_strength: 0
  manifest:
    enabled: false
    detector_strength: 0
policy:
  emit_threshold: 1
  fallback_order:
    - cpg
  negative_rule_result_means: neutral
  requires_framework_context: false
normalization:
  fact_kind: data-touch
  required_fields:
    - owner_full_name
    - owner_file
    - touch_kind
  optional_fields:
    - owner_name
    - owner_line
    - target_name
    - target_full_name
    - target_code
    - line_number
    - column_number
