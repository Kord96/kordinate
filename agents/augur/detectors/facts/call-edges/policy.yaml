domain: call-edges
emits:
  - call-edge
frameworks:
  include: []
  exclude: []
detectors:
  cpg:
    enabled: true
    detector_strength: 5
  ast_grep:
    enabled: false
    detector_strength: 0
  semgrep:
    enabled: false
    detector_strength: 0
  signatures:
    enabled: false
    detector_strength: 0
  manifest:
    enabled: false
    detector_strength: 0
policy:
  emit_threshold: 1
  fallback_order:
    - cpg
  negative_rule_result_means: neutral
  requires_framework_context: false
normalization:
  fact_kind: call-edge
  required_fields:
    - caller_full_name
    - callee_full_name
    - source_file
  optional_fields:
    - caller_name
    - caller_signature
    - caller_file
    - caller_line
    - callee_name
    - callee_signature
    - call_code
    - dispatch_type
    - line_number
    - column_number
