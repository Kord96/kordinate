id: auth-depends-security-py
language: Python
rule:
  any:
    - pattern: Depends($AUTH)
    - pattern: Security($AUTH, $$$ARGS)
---
id: auth-jwt-decode-py
language: Python
rule:
  pattern: jwt.decode($TOKEN, $$$ARGS)
---
id: auth-fastapi-bearer-py
language: Python
rule:
  any:
    - pattern: OAuth2PasswordBearer($$$ARGS)
    - pattern: HTTPBearer($$$ARGS)
---
id: auth-nest-guards-ts
language: TypeScript
rule:
  pattern: '@UseGuards($$$ARGS)'
---
id: auth-next-middleware-ts
language: TypeScript
rule:
  any:
    - pattern: NextResponse.redirect($$$ARGS)
    - pattern: NextResponse.rewrite($$$ARGS)
