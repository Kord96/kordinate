domain: external-clients
emits:
  - external-client
frameworks:
  include:
    - fastapi
    - flask
    - django
    - express
    - koa
    - fastify
    - nestjs
    - spring
    - rails
    - laravel
    - go
    - rust
    - dotnet
    - python
    - javascript
    - typescript
  exclude: []
detectors:
  ast_grep:
    enabled: true
    detector_strength: 4
  semgrep:
    enabled: true
    detector_strength: 4
  signatures:
    enabled: true
    detector_strength: 5
  manifest:
    enabled: true
    detector_strength: 3
policy:
  emit_threshold: 3
  fallback_order:
    - ast_grep
    - semgrep
    - signatures
    - manifest
  negative_rule_result_means: neutral
  requires_framework_context: true
normalization:
  fact_kind: external-client
  required_fields:
    - technology
    - target
    - callsite
  optional_fields:
    - timeout
    - retry
    - circuit_breaker
    - fallback
