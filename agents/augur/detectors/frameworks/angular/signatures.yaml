framework: angular
manifest_packages:
  package_json:
    - "@angular/core"
    - "@angular/common"
    - "@angular/router"
source_extensions:
  - .ts
  - .js
path_patterns:
  strong:
    - (^|/)src/app/
  medium: []
  weak: []
source_patterns:
  strong:
    - "@Component\\s*\\("
    - "@NgModule\\s*\\("
    - "\\bbootstrapApplication\\s*\\("
    - "\\bplatformBrowserDynamic\\s*\\("
  medium:
    - "@Injectable\\s*\\("
    - "\\bRouterModule\\.forRoot\\s*\\("
    - "\\b(FormBuilder|FormGroup|FormControl|ngModel)\\b"
  weak: []
negative_path_patterns: []
negative_source_patterns: []
