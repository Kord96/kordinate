framework: aspnet-minimal
manifest_packages:
  csproj:
    - Microsoft.AspNetCore
source_extensions:
  - .cs
  - .csproj
path_patterns:
  strong: []
  medium: []
  weak: []
source_patterns:
  strong:
    - WebApplication\.CreateBuilder\s*\(
    - app\.Map(Get|Post|Put|Delete|Patch)\s*\(
  medium:
    - builder\.Services\.
  weak: []
negative_path_patterns: []
negative_source_patterns:
  - \[ApiController\]
  - ControllerBase
