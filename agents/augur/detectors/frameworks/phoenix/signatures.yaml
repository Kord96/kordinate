framework: phoenix
manifest_packages:
  mix_exs:
    - phoenix
source_extensions:
  - .ex
  - .exs
path_patterns:
  strong: []
  medium: []
  weak: []
source_patterns:
  strong:
    - "use\\s+\\w+Web,\\s*:router"
    - "pipe_through\\s+:"
  medium:
    - "resources\\s+\"/"
    - "scope\\s+\"/"
  weak: []
negative_path_patterns: []
negative_source_patterns: []
