domain: routes
positive:
  strong:
    - route decorators
    - route registration calls
    - file-based API handlers
    - RPC service definitions
  medium:
    - handler functions with HTTP method and path literals
    - router objects with route methods
  weak:
    - endpoint-like string literals near request handlers
negative:
  - unrelated path or url strings without handler binding
notes:
  - Route facts should be precise enough to feed API surface and blast-radius generation without concept inference.
