id: producer-consumer-queue-init-py
language: Python
rule:
  pattern: '$NAME = queue.Queue($$$ARGS)'
---
id: producer-consumer-put-py
language: Python
rule:
  pattern: '$QUEUE.put($ITEM)'
  inside:
    kind: while_statement
---
id: producer-consumer-get-py
language: Python
rule:
  pattern: '$QUEUE.get()'
  inside:
    kind: while_statement
---
id: producer-consumer-dequeue-ts
language: TypeScript
rule:
  pattern: '$QUEUE.dequeue($$$ARGS)'
