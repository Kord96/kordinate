id: slot-children-prop-ts
language: TypeScript
rule:
  pattern: '$PROPS.children'
---
id: slot-render-prop-ts
language: TypeScript
rule:
  pattern: '$PROPS.render($$$ARGS)'
  inside:
    any:
      - kind: jsx_expression
      - kind: return_statement
        inside:
          kind: function_declaration
          has:
            any:
              - kind: jsx_element
              - kind: jsx_self_closing_element
---
id: slot-clone-element-ts
language: TypeScript
rule:
  pattern: 'React.cloneElement($$$ARGS)'
---
id: slot-children-map-ts
language: TypeScript
rule:
  pattern: 'React.Children.map($$$ARGS)'
