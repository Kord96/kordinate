id: content-negotiation-accept-header-py
language: Python
rule:
  pattern: $ACCEPT = $REQUEST.headers.get("Accept")
---
id: content-negotiation-produces-decorator-py
language: Python
rule:
  pattern: |
    @$APP.get($PATH, response_class=$RESPONSE_CLASS)
    async def $FUNC($$$ARGS):
        $$$BODY
---
id: content-negotiation-accepts-ts
language: TypeScript
rule:
  pattern: $REQ.accepts($$$TYPES)
---
id: content-negotiation-content-type-switch-ts
language: TypeScript
rule:
  pattern: |
    switch ($REQ.accepts($$$TYPES)) {
        $$$CASES
    }
