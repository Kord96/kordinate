# Score 2: Lava Flow (dead code) requires reachability analysis -- determining that a
# function has zero callers or a branch is unreachable -- which ast-grep cannot perform.
#
# The structural hints are:
#   - Functions with zero callers (requires call graph)
#   - Unreachable code after return statements (some linters catch this)
#   - Unused imports (linters handle this natively)
#   - Commented-out code blocks (text analysis, not AST)
#
# ast-grep can match specific unreachable-code patterns, but these are already handled
# better by language-specific linters (pylint unreachable, eslint no-unreachable).
# The one pattern below is a trivial example that real linters already catch.

# Low-confidence heuristic: code after a return statement in the same block.
# Note: this is already caught by every major Python linter. Included only for
# completeness -- in practice, use pylint W0101 (unreachable).
id: lava-flow-python-unreachable-after-return
language: Python
rule:
  kind: function_definition
  has:
    pattern: |
      return $$$RET
    follows:
      stopBy: end
      kind: expression_statement
