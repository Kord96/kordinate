id: webhook-hmac-verify-py
language: Python
rule:
  pattern: 'hmac.compare_digest($$$ARGS)'
---
id: webhook-hmac-new-py
language: Python
rule:
  pattern: 'hmac.new($$$ARGS)'
---
id: webhook-fastapi-handler-py
language: Python
rule:
  pattern: |
    @$APP.post($PATH)
    async def $HANDLER($$$PARAMS):
        $$$BODY
---
id: webhook-express-post-ts
language: TypeScript
rule:
  pattern: '$APP.post($PATH, $$$HANDLERS)'
---
id: webhook-createHmac-ts
language: TypeScript
rule:
  pattern: 'crypto.createHmac($ALG, $SECRET)'
---
id: webhook-verify-signature-ts
language: TypeScript
rule:
  pattern: 'crypto.timingSafeEqual($$$ARGS)'
