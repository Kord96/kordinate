# Score 2: Big Ball of Mud is a codebase-level organizational anti-pattern with no
# single-file structural signature.
#
# Detection requires analyzing properties that span the entire project:
#   - Directory structure conventions (or lack thereof)
#   - Import graph topology (any-to-any vs layered)
#   - Presence/absence of module boundaries
#   - Business logic placement relative to framework layers
#
# None of these are observable from the AST of any individual file. A file that imports
# from many unrelated packages could be a legitimate orchestrator or a symptom of no
# architecture -- ast-grep cannot distinguish the two without project-wide context.
#
# This anti-pattern is best detected by:
#   - Import-linter (Python) or ArchUnit (Java) for layering violations
#   - Dependency graph analysis tools (madge, pydeps, deptry)
#   - Manual architectural review
