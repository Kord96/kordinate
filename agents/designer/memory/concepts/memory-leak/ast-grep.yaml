# Score 3: Memory leaks are fundamentally about the ABSENCE of cleanup.
# ast-grep can match the incomplete patterns: addEventListener without remove,
# setInterval without clear, and open() without context manager.

# addEventListener is only a leak when cleanup is missing, but ast-grep
# cannot verify the absence of removeEventListener across scopes.
# Narrowed: only flag anonymous handlers (which can't be removed).
id: memory-leak-addeventlistener-anon-ts
language: TypeScript
rule:
  pattern: '$TARGET.addEventListener($EVENT, ($$$PARAMS) => { $$$BODY })'
---
id: memory-leak-setinterval-no-clear-ts
language: TypeScript
rule:
  pattern: setInterval($$$ARGS)
  not:
    inside:
      any:
        - pattern: $VAR = setInterval($$$ARGS)
        - pattern: 'const $VAR = setInterval($$$ARGS)'
        - pattern: 'let $VAR = setInterval($$$ARGS)'
---
id: memory-leak-global-append-py
language: Python
rule:
  pattern: $COLLECTION.append($ITEM)
  inside:
    pattern: |
      while $COND:
          $$$BODY
---
id: memory-leak-open-no-with-py
language: Python
rule:
  pattern: $VAR = open($$$ARGS)
---
id: memory-leak-dict-grow-in-loop-py
language: Python
rule:
  pattern: $DICT[$KEY] = $VALUE
  inside:
    pattern: |
      while $COND:
          $$$BODY
