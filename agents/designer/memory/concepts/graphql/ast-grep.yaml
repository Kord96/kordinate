id: graphql-schema-py-graphene
language: Python
rule:
  pattern: |
    class $NAME(graphene.ObjectType):
        $$$BODY
---
id: graphql-schema-py-strawberry
language: Python
rule:
  pattern: |
    @strawberry.type
    class $NAME:
        $$$BODY
---
id: graphql-resolver-py-strawberry
language: Python
rule:
  pattern: |
    @strawberry.mutation
    def $NAME($$$ARGS):
        $$$BODY
---
id: graphql-apollo-server-ts
language: TypeScript
rule:
  pattern: 'new ApolloServer($$$ARGS)'
---
id: graphql-resolver-ts
language: TypeScript
rule:
  pattern: |
    @Resolver($$$ARGS)
    class $NAME {
        $$$BODY
    }
---
id: graphql-dataloader-ts
language: TypeScript
rule:
  pattern: 'new DataLoader($$$ARGS)'
