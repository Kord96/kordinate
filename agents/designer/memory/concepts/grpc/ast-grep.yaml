id: grpc-server-py
language: Python
rule:
  pattern: '$SERVER.add_insecure_port($$$ARGS)'
---
id: grpc-servicer-registration-py
language: Python
rule:
  pattern: '$FUNC($SERVICER, $SERVER)'
  regex: add_.*Servicer_to_server
---
id: grpc-channel-py
language: Python
rule:
  pattern: 'grpc.insecure_channel($$$ARGS)'
---
id: grpc-server-ts
language: TypeScript
rule:
  pattern: '$SERVER.addService($SERVICE, $$$ARGS)'
---
id: grpc-client-ts
language: TypeScript
rule:
  pattern: 'new $CLIENT($ADDR, $$$ARGS)'
---
id: grpc-load-package-ts
language: TypeScript
rule:
  pattern: 'loadPackageDefinition($$$ARGS)'
