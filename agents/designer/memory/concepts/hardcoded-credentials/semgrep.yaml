rules:
  - id: hardcoded-password
    pattern: |
      password = "..."
    message: "Hardcoded password — use environment variable or secrets manager"
    severity: ERROR
    languages: [python]
  - id: hardcoded-api-key
    pattern: |
      api_key = "..."
    message: "Hardcoded API key — use environment variable or secrets manager"
    severity: ERROR
    languages: [python]
  - id: hardcoded-secret
    pattern: |
      secret = "..."
    message: "Hardcoded secret — use environment variable or secrets manager"
    severity: ERROR
    languages: [python]
  - id: hardcoded-token
    pattern: |
      token = "..."
    message: "Hardcoded token — use environment variable or secrets manager"
    severity: WARNING
    languages: [python]
