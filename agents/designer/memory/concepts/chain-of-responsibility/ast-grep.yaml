id: chain-of-responsibility-handler-py
language: Python
rule:
  pattern: |
    def handle(self, $REQUEST):
        $$$BODY
  has:
    pattern: self.next_handler.handle($$$ARGS)
---
id: chain-of-responsibility-set-next-py
language: Python
rule:
  pattern: |
    def set_next(self, $HANDLER):
        self.next_handler = $HANDLER
        $$$BODY
---
id: chain-of-responsibility-middleware-py
language: Python
rule:
  pattern: |
    def $MIDDLEWARE($REQUEST, $NEXT):
        $$$BODY
  has:
    pattern: $NEXT($$$ARGS)
---
id: chain-of-responsibility-handler-ts
language: TypeScript
rule:
  pattern: |
    handle($REQUEST) {
        $$$BODY
    }
  has:
    pattern: this.next.handle($$$ARGS)
---
id: chain-of-responsibility-set-next-ts
language: TypeScript
rule:
  pattern: |
    setNext($HANDLER) {
        this.next = $HANDLER;
        $$$BODY
    }
---
id: chain-of-responsibility-middleware-ts
language: TypeScript
rule:
  pattern: |
    ($REQ, $RES, $NEXT) => {
        $$$BODY
    }
  has:
    pattern: $NEXT($$$ARGS)
