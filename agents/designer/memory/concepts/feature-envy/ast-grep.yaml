# Score 2: Feature Envy requires counting how many fields a method accesses from another
# class vs its own class -- a cross-reference analysis ast-grep cannot perform.
#
# The defining characteristic is: "a method accesses more fields from another class than
# from its own." This requires:
#   - Tracking which class each accessed attribute belongs to (type resolution)
#   - Counting accesses per class (metric)
#   - Comparing own-class vs other-class access ratios (cross-reference)
#
# The one weak structural hint is long getter chains (obj.a.b.c.d), which suggest
# reaching deep into another object's structure. This is low-confidence because getter
# chains can be legitimate (navigating a well-designed object graph, accessing config).

# Low-confidence heuristic: deep attribute chains (4+ levels) suggesting Law of Demeter violation
id: feature-envy-python-deep-chain
language: Python
rule:
  pattern: |
    $A.$B.$C.$D.$E
