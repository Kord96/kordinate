id: ir-emit-method-py
language: Python
rule:
  pattern: |
    def emit($SELF, $$$ARGS):
        $$$BODY
---
id: ir-basic-block-py
language: Python
rule:
  pattern: |
    class BasicBlock($$$BASES):
        $$$BODY
---
id: ir-builder-py
language: Python
rule:
  pattern: |
    class IRBuilder($$$BASES):
        $$$BODY
---
id: ir-emit-method-ts
language: TypeScript
rule:
  pattern: |
    emit($$$ARGS) {
        $$$BODY
    }
---
id: ir-basic-block-ts
language: TypeScript
rule:
  pattern: |
    class BasicBlock $$$DECL {
        $$$BODY
    }
---
id: ir-builder-ts
language: TypeScript
rule:
  pattern: |
    class IRBuilder $$$DECL {
        $$$BODY
    }
