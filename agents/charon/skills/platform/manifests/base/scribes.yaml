# Agent Scribe v2 Deployments — one per agent type.
# Replicas=1, strategy=Recreate (never run two scribes simultaneously).
# Consumes memory.updates.<agent>, merges into shared PVC, updates CLAUDE.md.
# v2: Uses Anthropic Haiku for semantic deduplication.
#     Routes memory to memory/global/ or memory/projects/<project>/ based on scope.
#     Requires Secret 'anthropic-api' with key 'api-key'.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scribe-augur
  labels: { app: kord-scribe, agent: augur }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: kord-scribe, agent: augur }
  template:
    metadata:
      labels: { app: kord-scribe, agent: augur }
    spec:
      serviceAccountName: kord
      containers:
        - name: scribe
          image: localhost:30500/agent-factory:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /kord/agents/augur/memory/global /kord/agents/augur/memory/projects
              cd /data/repos/kordinate/lib/agent-scribe && npm install --production 2>/dev/null
              exec node scribe.js
          env:
            - { name: AGENT_NAME, value: augur }
            - { name: AGENT_PROJECT_DIR, value: /kord/agents/augur }
            - { name: KAFKA_BROKERS, value: "kafka-kafka-bootstrap.dev.svc.cluster.local:9092" }
            - { name: HOME, value: /home/claude }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api
                  key: api-key
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: kord, mountPath: /kord }
            - { name: data, mountPath: /data/repos, readOnly: true }
      volumes:
        - name: kord
          persistentVolumeClaim: { claimName: kord }
        - name: data
          persistentVolumeClaim: { claimName: kord-repos }
