# Agent Scribe Deployments — one per agent type.
# Replicas=1, strategy=Recreate (never run two scribes simultaneously).
# Consumes memory.updates.<agent> from Kafka, deduplicates with Haiku.
# Code baked into image at /app/scribe/.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scribe-augur
  labels: { app: kord-scribe, agent: augur }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: kord-scribe, agent: augur }
  template:
    metadata:
      labels: { app: kord-scribe, agent: augur }
    spec:
      serviceAccountName: kord
      containers:
        - name: scribe
          image: REGISTRY/agent-base:latest
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              mkdir -p /kord/augur/memory/global /kord/augur/memory/projects
              cd /app/scribe && exec node scribe.js
          env:
            - { name: AGENT_NAME, value: augur }
            - { name: AGENT_STATE_DIR, value: /kord/augur }
            - { name: KAFKA_BROKERS, value: "kafka-kafka-bootstrap.dev.svc.cluster.local:9092" }
            - { name: HOME, value: /home/claude }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api
                  key: api-key
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: runtime, mountPath: /kord }
      volumes:
        - name: runtime
          persistentVolumeClaim: { claimName: agent-runtime }
