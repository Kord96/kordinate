# KEDA ScaledObjects for agent pods.
# Prerequisite: KEDA operator installed (kubectl apply -f https://keda.sh/docs/latest/deploy/)
#
# Scaling parameters (minReplicaCount, maxReplicaCount, cooldownPeriod) are set
# per-environment via overlay patches (e.g. overlays/platform/dev/scaling.yaml).
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agent-augur
spec:
  minReplicaCount: 0
  maxReplicaCount: 3
  cooldownPeriod: 300
  scaleTargetRef:
    name: agent-augur
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-kafka-bootstrap.master.svc.cluster.local:9092
        consumerGroup: agent-augur
        topic: jobs.augur
        lagThreshold: "1"
---
