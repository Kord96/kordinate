# Generated from agents/charon/skills/platform/agent-spec.yaml
# One request topic and one ScaledObject per agent.

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agent-augur
spec:
  pollingInterval: 30
  minReplicaCount: 0
  maxReplicaCount: 3
  cooldownPeriod: 300
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
        scaleUp:
          stabilizationWindowSeconds: 300
  scaleTargetRef:
    name: agent-augur
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-kafka-bootstrap.dev.svc.cluster.local:9092
        consumerGroup: agent.augur
        topic: agent.augur
        lagThreshold: "1"
        activationLagThreshold: "0"
        offsetResetPolicy: earliest

