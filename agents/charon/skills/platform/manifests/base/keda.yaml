---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agent-generic-opus
spec:
  pollingInterval: 30
  minReplicaCount: 1
  maxReplicaCount: 1
  cooldownPeriod: 300
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
        scaleUp:
          stabilizationWindowSeconds: 300
  scaleTargetRef:
    name: agent-generic-opus
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-kafka-bootstrap.dev.svc.cluster.local:9092
        consumerGroup: generic-opus
        topic: generic-opus
        lagThreshold: "1"
        activationLagThreshold: "0"
        offsetResetPolicy: earliest

