# KEDA ScaledObjects for agent pods.
# Prerequisite: KEDA operator installed (kubectl apply -f https://keda.sh/docs/latest/deploy/)
#
# Scaling parameters (minReplicaCount, maxReplicaCount, cooldownPeriod) are set
# per-environment via overlay patches (e.g. overlays/platform/dev/scaling.yaml).
#
# stabilizationWindowSeconds prevents rapid scale-up/down oscillation.
# restoreToOriginalReplicaCount returns to minReplicas on trigger deactivation.
# pollingInterval of 30s avoids hammering the Kafka API for lag metrics.
# offsetResetPolicy: earliest makes first-message wake-up deterministic for zero-scaled agents.
# activationLagThreshold: 0 ensures a single queued job wakes an idle agent immediately.
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agent-augur
spec:
  pollingInterval: 30
  minReplicaCount: 0
  maxReplicaCount: 3
  cooldownPeriod: 300
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
        scaleUp:
          stabilizationWindowSeconds: 300
  scaleTargetRef:
    name: agent-augur
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-kafka-bootstrap.dev.svc.cluster.local:9092
        consumerGroup: agent.augur
        topic: agent.augur
        lagThreshold: "1"
        activationLagThreshold: "0"
        offsetResetPolicy: earliest
