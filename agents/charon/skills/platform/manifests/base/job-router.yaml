# Job Router — replaces the old MCP agent server (Beorn).
# Routes MCP calls to Kafka topics, serves resource cache.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-router
  labels:
    app: job-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-router
  template:
    metadata:
      labels:
        app: job-router
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3100"
    spec:
      serviceAccountName: kord
      containers:
        - name: router
          image: localhost:30500/agent-factory:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              ln -sfn /kord/kordinate "$HOME/.kord" 2>/dev/null
              cd /kord/kordinate/lib/job-router && npm install --production 2>/dev/null
              exec node /kord/kordinate/lib/job-router/router.js
          env:
            - name: PORT
              value: "3100"
            - name: KAFKA_BROKERS
              value: kafka-kafka-bootstrap.dev.svc.cluster.local:9092
            - name: HOME
              value: /home/claude
            - name: KORDINATE_HOME
              value: /kord/kordinate
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          ports:
            - containerPort: 3100
              name: mcp
          readinessProbe:
            httpGet: { path: /health, port: 3100 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3100 }
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: kord
              mountPath: /kord
      volumes:
        - name: kord
          persistentVolumeClaim:
            claimName: kord
---
apiVersion: v1
kind: Service
metadata:
  name: job-router
spec:
  selector:
    app: job-router
  ports:
    - port: 3100
      targetPort: 3100
      name: mcp
