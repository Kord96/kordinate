# Webhook Receiver — GitHub push-event gateway for CI/CD pipeline.
# Code baked into image at /app/webhook-receiver/.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-receiver
  labels:
    app: webhook-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-receiver
  template:
    metadata:
      labels:
        app: webhook-receiver
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: kord
      containers:
        - name: receiver
          image: localhost:30500/agent-factory:latest
          command: ["/bin/bash", "-c"]
          args:
            - cd /app/webhook-receiver && exec node receiver.js
          env:
            - name: PORT
              value: "8080"
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-webhook
                  key: secret
            - name: JOB_ROUTER_URL
              value: http://job-router.kord.svc.cluster.local:3100
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-receiver
spec:
  selector:
    app: webhook-receiver
  ports:
    - port: 8080
      targetPort: 8080
      name: http
