# Agent pod Deployments — pod = persistent Claude session.
# Each pod runs the stream-json bridge (runner.js) with Claude as a long-lived process.
# Agents are project-agnostic; runner injects project context (name, memory paths) per-job.
# Init container sets up /kord/agents/<name>/ with memory/global/ and memory/projects/ dirs.
# Claude loads CLAUDE.md natively with @ imports for identity, memory, and team awareness.
# KEDA ScaledObjects control replicas (see keda.yaml).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-augur
  labels: { app: kord-agent, agent: augur }
spec:
  selector:
    matchLabels: { app: kord-agent, agent: augur }
  template:
    metadata:
      labels: { app: kord-agent, agent: augur }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: kord
      initContainers:
        - name: setup
          image: localhost:30500/agent-factory:latest
          command: ["/bin/bash", "/kord/kordinate/lib/scripts/setup-agent-dir.sh", "augur"]
          env:
            - { name: KORDINATE_HOME, value: /kord/kordinate }
          volumeMounts:
            - { name: kord, mountPath: /kord }
      containers:
        - name: agent
          image: localhost:30500/agent-factory:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              ln -sfn /kord/pass "$HOME/.password-store" 2>/dev/null
              ln -sfn /kord/gnupg "$HOME/.gnupg" 2>/dev/null
              ln -sfn /kord/claude-home "$HOME/.claude" 2>/dev/null
              ln -sfn /kord/claude-home.json "$HOME/.claude.json" 2>/dev/null
              chmod 700 /kord/pass /kord/gnupg 2>/dev/null || true
              cd /kord/kordinate/lib/agent-runner && npm install --production 2>/dev/null
              exec node runner.js
          env:
            - { name: AGENT_NAME, value: augur }
            - { name: AGENT_PROJECT_DIR, value: /kord/agents/augur }
            - { name: KAFKA_BROKERS, value: "kafka-kafka-bootstrap.dev.svc.cluster.local:9092" }
            - { name: HOME, value: /home/claude }
            - { name: KORDINATE_HOME, value: /kord/kordinate }
            - { name: PROJECTS_ROOT, value: /kord/projects }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 4Gi }
          ports:
            - { containerPort: 9090, name: status }
          readinessProbe:
            httpGet: { path: /health, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 9090 }
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - { name: kord, mountPath: /kord }
      volumes:
        - name: kord
          persistentVolumeClaim: { claimName: kord }
---
