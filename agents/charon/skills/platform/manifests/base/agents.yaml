            - { name: AGENT_PROFILE, value: "alfred" }
            - { name: AGENT_HOME_DIR, value: "/kord/agents/alfred-deepseek-chat" }
            - { name: AGENT_STATE_DIR, value: "/kord/agents/alfred-deepseek-chat" }
