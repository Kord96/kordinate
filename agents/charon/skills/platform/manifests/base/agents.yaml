# Agent pod Deployments — pod = persistent Claude session.
# Code is baked into layered images (agent-base plus per-agent derivatives). No runtime cloning.
# Init: setup-agent-dir.sh + deploy-runtime.sh seed memory from /app/agents/.
# Single PVC: agent-runtime mounted at /kord for memory, repos, team.
# KEDA ScaledObjects control replicas (see keda.yaml).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-augur
  labels: { app: kord-agent, agent: augur }
spec:
  selector:
    matchLabels: { app: kord-agent, agent: augur }
  template:
    metadata:
      labels: { app: kord-agent, agent: augur }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: kord
      initContainers:
        - name: setup
          image: REGISTRY/agent-augur:latest
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              bash /app/scripts/setup-agent-dir.sh augur
              KORDINATE_HOME=/app KORD_RUNTIME=/runtime bash /app/scripts/deploy-runtime.sh augur
          volumeMounts:
            - { name: runtime, mountPath: /kord }
            - { name: agent-runtime, mountPath: /runtime }
      containers:
        - name: agent
          image: REGISTRY/agent-augur:latest
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              exec openclaude-daemon
          env:
            - { name: AGENT_NAME, value: augur }
            - { name: AGENT_PROJECT_DIR, value: /runtime/augur }
            - { name: AGENT_STATE_DIR, value: /kord/augur }
            - { name: KAFKA_BROKERS, value: "kafka-kafka-bootstrap.dev.svc.cluster.local:9092" }
            - { name: HOME, value: /home/claude }
            - { name: KORDINATE_HOME, value: /app }
            - { name: PROJECTS_ROOT, value: /kord/shared/repos }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api
                  key: api-key
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 4Gi }
          ports:
            - { containerPort: 9090, name: status }
          readinessProbe:
            httpGet: { path: /health, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 9090 }
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - { name: runtime, mountPath: /kord }
            - { name: agent-runtime, mountPath: /runtime }
      volumes:
        - name: runtime
          persistentVolumeClaim: { claimName: agent-runtime }
        - name: agent-runtime
          emptyDir: {}
---
