---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-generic-opus
  labels: { app: kord-agent, agent: generic-opus }
spec:
  selector:
    matchLabels: { app: kord-agent, agent: generic-opus }
  template:
    metadata:
      labels: { app: kord-agent, agent: generic-opus }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: kord
      initContainers:
        - name: setup
          image: REGISTRY/agent-base:latest
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              bash /app/scripts/setup-agent-dir.sh generic-opus
          volumeMounts:
            - { name: runtime, mountPath: /kord }
            - { name: agent-runtime, mountPath: /runtime }
      containers:
        - name: agent
          image: REGISTRY/agent-base:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          command: ["/bin/bash", "-c"]
          args:
            - |
              exec klaude-daemon
          env:
            - { name: AGENT_NAME, value: "generic-opus" }
            - { name: AGENT_PROFILE, value: "generic" }
            - { name: AGENT_HOME_DIR, value: "/runtime/generic-opus" }
            - { name: AGENT_STATE_DIR, value: "/kord/generic-opus" }
            - { name: KAFKA_BROKERS, value: "kafka-kafka-bootstrap.dev.svc.cluster.local:9092" }
            - { name: HOME, value: "/home/node" }
            - { name: KORDINATE_HOME, value: "/app" }
            - { name: PROJECTS_ROOT, value: "/kord/shared/repos" }
            - { name: DISCOVERY_SERVER_URL, value: "http://kord-api:9091" }
            - { name: DAEMON_HEALTH_URL, value: "http://agent-generic-opus:9090/health" }
            - { name: DAEMON_RUNTIME, value: "claude-agent-sdk" }
            - { name: DAEMON_PROVIDER, value: "anthropic" }
            - { name: DAEMON_MODEL, value: "opus" }
            - { name: DAEMON_BACKEND, value: "anthropic" }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api
                  key: api-key
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 4Gi }
          ports:
            - { containerPort: 9090, name: status }
          readinessProbe:
            httpGet: { path: /health, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 9090 }
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - { name: runtime, mountPath: /kord }
            - { name: agent-runtime, mountPath: /runtime }
      volumes:
        - name: runtime
          persistentVolumeClaim: { claimName: agent-runtime }
        - name: agent-runtime
          emptyDir: {}
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: agent-generic-opus
  labels: { app: kord-agent, agent: generic-opus }
spec:
  selector:
    app: kord-agent
    agent: generic-opus
  ports:
    - name: health
      port: 9090
      targetPort: 9090

