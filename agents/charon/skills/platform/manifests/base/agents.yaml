kind: Deployment
metadata:
  name: agent-charon-gpt53-codex
  labels: { app: kord-agent, agent: charon-gpt53-codex }
spec:
  selector:
    matchLabels: { app: kord-agent, agent: charon-gpt53-codex }
  template:
    metadata:
      labels: { app: kord-agent, agent: charon-gpt53-codex }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:

      serviceAccountName: kord
      initContainers:
        - name: setup
          image: REGISTRY/agent-charon:latest
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              bash /app/scripts/setup-agent-dir.sh charon-gpt53-codex
              AGENT_MEMORY_BUNDLE=platform-core-v1 AGENT_SKILL_BUNDLE=platform-ops-v1 AGENT_RUNTIME_BUNDLE=ops-default-v1 KORDINATE_HOME=/app KORD_RUNTIME=/kord/agents bash /app/scripts/deploy-runtime.sh charon charon-gpt53-codex
          volumeMounts:
            - { name: runtime, mountPath: /kord }

      containers:
        - name: agent
          image: REGISTRY/agent-charon:latest
          imagePullPolicy: Always
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
                - SYS_ADMIN
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              if ! command -v bwrap >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then
                export DEBIAN_FRONTEND=noninteractive
                apt-get update >/dev/null
                apt-get install -y --no-install-recommends bubblewrap curl ca-certificates >/dev/null
              fi
              if ! command -v kubectl >/dev/null 2>&1; then
                curl -fsSL -o /usr/local/bin/kubectl https://dl.k8s.io/release/${KUBECTL_VERSION:-v1.34.5}/bin/linux/amd64/kubectl
                chmod +x /usr/local/bin/kubectl
              fi
              mkdir -p /home/node/.kube
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              SERVER=https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
              cat > /home/node/.kube/config <<KUBECONFIG_EOF
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  certificate-authority: ${CA}
                  server: ${SERVER}
                name: in-cluster
              contexts:
              - context:
                  cluster: in-cluster
                  namespace: kord
                  user: serviceaccount
                name: in-cluster
              current-context: in-cluster
              users:
              - name: serviceaccount
                user:
                  token: ${TOKEN}
              KUBECONFIG_EOF
              chmod 600 /home/node/.kube/config
              exec klaude-daemon
          env:
            - { name: AGENT_NAME, value: "charon-gpt53-codex" }
            - { name: AGENT_PROFILE, value: "charon" }
            - { name: AGENT_HOME_DIR, value: "/kord/agents/charon-gpt53-codex" }
            - { name: AGENT_STATE_DIR, value: "/kord/agents/charon-gpt53-codex" }
            - { name: DAEMON_WORKING_DIRECTORY, value: "/kord/agents/charon-gpt53-codex" }
            - { name: DAEMON_STATE_DIR, value: "/kord/agents/charon-gpt53-codex/.daemon-state" }
            - { name: DAEMON_SESSION_MAP_PATH, value: "/kord/agents/charon-gpt53-codex/.daemon-state/sessions.json" }
            - { name: KAFKA_BROKERS, value: "kafka-kafka-bootstrap.dev.svc.cluster.local:9092" }
            - { name: KAFKA_SESSION_TIMEOUT_MS, value: "30000" }
            - { name: KAFKA_HEARTBEAT_INTERVAL_MS, value: "3000" }
            # Standard Unix home for shells and CLIs that implicitly read $HOME.
            - { name: HOME, value: "/home/node" }
            # Baked Kordinate code root inside the image; keep distinct from $HOME and AGENT_HOME_DIR.
            - { name: KORDINATE_HOME, value: "/app" }
            - { name: PROJECTS_ROOT, value: "/kord/shared/repos" }
            - { name: DISCOVERY_SERVER_URL, value: "http://kord-api:9091" }
            - { name: DAEMON_HEALTH_URL, value: "http://agent-charon-gpt53-codex:9090/health" }
            - { name: DAEMON_RUNTIME, value: "codex-sdk" }
            - { name: DAEMON_PROVIDER, value: "openai" }
            - { name: DAEMON_MODEL, value: "gpt-5.3-codex" }
            - { name: DAEMON_BACKEND, value: "openai" }
            - { name: BACKEND_BASE_URL, value: "https://api.openai.com/v1" }
            - { name: CODEX_SKIP_GIT_REPO_CHECK, value: "true" }
            - { name: CODEX_SANDBOX_MODE, value: "danger-full-access" }
            - { name: CODEX_NETWORK_ACCESS_ENABLED, value: "true" }
            - { name: KUBECONFIG, value: "/home/node/.kube/config" }
            - { name: KUBECTL_VERSION, value: "v1.34.5" }
            - { name: AGENT_MEMORY_BUNDLE, value: "platform-core-v1" }
            - { name: AGENT_SKILL_BUNDLE, value: "platform-ops-v1" }
            - { name: AGENT_RUNTIME_BUNDLE, value: "ops-default-v1" }
            - name: BACKEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: codex-api
                  key: api-key
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 4Gi }
          ports:
            - { containerPort: 9090, name: status }
          readinessProbe:
            httpGet: { path: /health, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 9090 }
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - { name: runtime, mountPath: /kord }

      volumes:
        - name: runtime
          persistentVolumeClaim: { claimName: agent-runtime }

      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
