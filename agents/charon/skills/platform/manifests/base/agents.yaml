# Agent pod Deployments — pod = persistent Claude session.
# Code is baked into the agent-factory image. No runtime cloning.
# Init: setup-agent-dir.sh + deploy-runtime.sh seed memory from /app/agents/.
# Single PVC: agent-runtime mounted at /kord for memory, repos, team.
# KEDA ScaledObjects control replicas (see keda.yaml).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-augur
  labels: { app: kord-agent, agent: augur }
spec:
  selector:
    matchLabels: { app: kord-agent, agent: augur }
  template:
    metadata:
      labels: { app: kord-agent, agent: augur }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: kord
      initContainers:
        - name: setup
          image: localhost:30500/agent-factory:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              bash /app/scripts/setup-agent-dir.sh augur
              KORDINATE_HOME=/app bash /app/scripts/deploy-runtime.sh augur
          volumeMounts:
            - { name: runtime, mountPath: /kord }
      containers:
        - name: agent
          image: localhost:30500/agent-factory:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              ln -sfn "$AGENT_PROJECT_DIR/.claude" "$HOME/.claude" 2>/dev/null
              cp /secrets/claude.json "$HOME/.claude.json" 2>/dev/null
              cd /app/daemon && exec node daemon.js
          env:
            - { name: AGENT_NAME, value: augur }
            - { name: AGENT_PROJECT_DIR, value: /kord/agents/augur }
            - { name: KAFKA_BROKERS, value: "kafka-kafka-bootstrap.dev.svc.cluster.local:9092" }
            - { name: HOME, value: /home/claude }
            - { name: KORDINATE_HOME, value: /app }
            - { name: PROJECTS_ROOT, value: /kord/repos }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 4Gi }
          ports:
            - { containerPort: 9090, name: status }
          readinessProbe:
            httpGet: { path: /health, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 9090 }
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - { name: runtime, mountPath: /kord }
            - { name: claude-creds, mountPath: /secrets, readOnly: true }
      volumes:
        - name: runtime
          persistentVolumeClaim: { claimName: agent-runtime }
        - name: claude-creds
          secret:
            secretName: claude-credentials
---
