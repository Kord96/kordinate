---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-augur-opus
  labels: { app: kord-agent, agent: augur-opus }
spec:
  selector:
    matchLabels: { app: kord-agent, agent: augur-opus }
  template:
    metadata:
      labels: { app: kord-agent, agent: augur-opus }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: kord
      initContainers:
        - name: setup
          image: REGISTRY/agent-augur:latest
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              bash /app/scripts/setup-agent-dir.sh augur-opus
              KORDINATE_HOME=/app KORD_RUNTIME=/runtime bash /app/scripts/deploy-runtime.sh augur augur-opus
          volumeMounts:
            - { name: runtime, mountPath: /kord }
            - { name: agent-runtime, mountPath: /runtime }
      containers:
        - name: agent
          image: REGISTRY/agent-augur:latest
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              exec klaude-daemon
          env:
            - { name: AGENT_NAME, value: "augur-opus" }
            - { name: AGENT_PROFILE, value: "augur" }
            - { name: AGENT_PROJECT_DIR, value: "/runtime/augur-opus" }
            - { name: AGENT_STATE_DIR, value: "/kord/augur-opus" }
            - { name: KAFKA_BROKERS, value: "kafka-kafka-bootstrap.dev.svc.cluster.local:9092" }
            - { name: HOME, value: "/home/claude" }
            - { name: KORDINATE_HOME, value: "/app" }
            - { name: PROJECTS_ROOT, value: "/kord/shared/repos" }
            - { name: DISCOVERY_SERVER_URL, value: "http://klaude-discovery:9091" }
            - { name: DAEMON_HEALTH_URL, value: "http://agent-augur-opus:9090/health" }
            - { name: DAEMON_RUNTIME, value: "claude-sdk" }
            - { name: DAEMON_PROVIDER, value: "anthropic" }
            - { name: DAEMON_MODEL, value: "opus" }
            - { name: DAEMON_BACKEND, value: "anthropic" }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api
                  key: api-key
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 4Gi }
          ports:
            - { containerPort: 9090, name: status }
          readinessProbe:
            httpGet: { path: /health, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 9090 }
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - { name: runtime, mountPath: /kord }
            - { name: agent-runtime, mountPath: /runtime }
      volumes:
        - name: runtime
          persistentVolumeClaim: { claimName: agent-runtime }
        - name: agent-runtime
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-augur-opus
  labels: { app: kord-agent, agent: augur-opus }
spec:
  selector:
    app: kord-agent
    agent: augur-opus
  ports:
    - name: health
      port: 9090
      targetPort: 9090

