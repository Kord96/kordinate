apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  labels: { app: docs }
spec:
  replicas: 1
  selector:
    matchLabels: { app: docs }
  template:
    metadata:
      labels: { app: docs }
    spec:
      containers:
        - name: docs
          image: REGISTRY/docs:latest
          imagePullPolicy: Always
          workingDir: /app
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Wait for git-sync initial clone
              while [ ! -d /repo/kordinate-docs/src ]; do sleep 1; done
              # Copy repo to /app, install deps
              cp -r /repo/kordinate-docs/. /app/
              npm install 2>/dev/null
              # Background sync: only copy when git-sync pulls a new revision
              LAST_REV=""
              (while true; do
                sleep 3
                CURRENT_REV=$(readlink /repo/kordinate-docs 2>/dev/null)
                if [ -n "$CURRENT_REV" ] && [ "$CURRENT_REV" != "$LAST_REV" ]; then
                  cp -r /repo/kordinate-docs/src /repo/kordinate-docs/public /app/ 2>/dev/null
                  LAST_REV="$CURRENT_REV"
                fi
              done) &
              exec npm run dev -- --host 0.0.0.0
          env:
            - { name: CHOKIDAR_USEPOLLING, value: "true" }
            - name: DEV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docs-auth
                  key: dev-password
            - name: GUEST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docs-auth
                  key: guest-password
          ports:
            - { containerPort: 4321 }
          volumeMounts:
            - name: repo
              mountPath: /repo
              readOnly: true
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.4.1
          args:
            - --repo=https://github.com/Kord96/kordinate-docs.git
            - --period=3s
            - --root=/repo
            - --link=kordinate-docs
          volumeMounts:
            - name: repo
              mountPath: /repo
      volumes:
        - name: repo
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: docs
spec:
  selector:
    app: docs
  ports:
    - port: 80
      targetPort: 4321
