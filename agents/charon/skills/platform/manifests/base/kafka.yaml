# Strimzi Kafka cluster for agent job distribution (KRaft mode, no ZooKeeper).
# Deploy Strimzi operator first: kubectl apply -f https://strimzi.io/install/latest
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: combined
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 10Gi
    class: longhorn
  resources:
    requests:
      memory: 1Gi
      cpu: 250m
    limits:
      memory: 2Gi
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.2.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      log.retention.hours: 168
  entityOperator:
    topicOperator: {}
---
# Agent request topics — one request topic per agent.
# Requests are expected to include: { prompt, timeout_ms?, reflect?, reply_to }.
# reply_to is required by the new runtime contract.
# Responses are published by Klaude to the caller-specified reply topic and use:
# { status, output, reflection?: { project, general }, errors?: string[] }.
# Kordinate only provisions the request topics and supporting topics.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: agent.augur
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: "604800000"  # 7 days
