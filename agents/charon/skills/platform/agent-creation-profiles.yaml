version: 1

profiles:
  generic:
    description: Generic daemon-backed agent with no specialist seed requirements.
    defaults:
      flavor: generic
      image_customization: none
      provider: anthropic
      model: sonnet
      backend: anthropic
      secret_env: ANTHROPIC_API_KEY
      secret_name: anthropic-api
      secret_key: api-key
    required_choices: []

  generic-opus:
    description: Generic daemon-backed Claude Opus agent with no specialist seed requirements.
    defaults:
      flavor: generic
      image_customization: none
      provider: anthropic
      model: opus
      backend: anthropic
      secret_env: ANTHROPIC_API_KEY
      secret_name: anthropic-api
      secret_key: api-key
    required_choices: []

  augur-opus:
    description: Augur specialist pinned to Claude Opus via the native Claude SDK runtime.
    defaults:
      flavor: augur
      image_customization: agent-augur
      provider: anthropic
      model: opus
      backend: anthropic
      secret_env: ANTHROPIC_API_KEY
      secret_name: anthropic-api
      secret_key: api-key
    required_choices:
      - memory_bundle
      - runtime_bundle
    choices:
      memory_bundle:
        allowed:
          - analyze-holistic-v1
          - analyze-selective-v1
      runtime_bundle:
        allowed:
          - analyze-holistic-v1
          - analyze-selective-v1

  augur-gemini-pro:
    description: Augur specialist pinned to Gemini Pro over the OpenAI-compatible Gemini endpoint.
    defaults:
      flavor: augur
      image_customization: agent-augur
      provider: gemini
      model: gemini-3.1-pro-preview
      backend: gemini
      backend_base_url: https://generativelanguage.googleapis.com/v1beta/openai
      secret_env: BACKEND_API_KEY
      secret_name: gemini-api
      secret_key: api-key
    required_choices:
      - memory_bundle
      - runtime_bundle
    choices:
      memory_bundle:
        allowed:
          - analyze-holistic-v1
          - analyze-selective-v1
      runtime_bundle:
        allowed:
          - analyze-holistic-v1
          - analyze-selective-v1

  augur-deepseek-v32-reasoner:
    description: Augur specialist pinned to DeepSeek Reasoner.
    defaults:
      flavor: augur
      image_customization: agent-augur
      provider: deepseek
      model: deepseek-reasoner
      backend: deepseek
      backend_base_url: https://api.deepseek.com/v1
      secret_env: BACKEND_API_KEY
      secret_name: deepseek-api
      secret_key: api-key
    required_choices:
      - memory_bundle
      - runtime_bundle
    choices:
      memory_bundle:
        allowed:
          - analyze-holistic-v1
          - analyze-selective-v1
      runtime_bundle:
        allowed:
          - analyze-holistic-v1
          - analyze-selective-v1

  augur-glm5:
    description: Augur specialist pinned to GLM-5 through Fireworks.
    defaults:
      flavor: augur
      image_customization: agent-augur
      provider: fireworks
      model: accounts/fireworks/models/glm-5
      backend: fireworks
      backend_base_url: https://api.fireworks.ai/inference/v1
      secret_env: BACKEND_API_KEY
      secret_name: fireworks-api
      secret_key: api-key
    required_choices:
      - memory_bundle
      - runtime_bundle
    choices:
      memory_bundle:
        allowed:
          - analyze-holistic-v1
          - analyze-selective-v1
      runtime_bundle:
        allowed:
          - analyze-holistic-v1
          - analyze-selective-v1

  augur-gpt54:
    description: Augur specialist pinned to GPT-5.4 on the OpenAI API.
    defaults:
      flavor: augur
      image_customization: agent-augur
      provider: openai
      model: gpt-5.4
      backend: openai
      backend_base_url: https://api.openai.com/v1
      skip_git_repo_check: true
      secret_env: BACKEND_API_KEY
      secret_name: codex-api
      secret_key: api-key
    required_choices:
      - memory_bundle
      - runtime_bundle
    choices:
      memory_bundle:
        allowed:
          - analyze-holistic-v1
          - analyze-selective-v1
      runtime_bundle:
        allowed:
          - analyze-holistic-v1
          - analyze-selective-v1

  charon-sonnet:
    description: Charon specialist deployment using the built-in Charon flavor seed on Claude Sonnet.
    defaults:
      flavor: charon
      image_customization: agent-charon
      provider: anthropic
      model: sonnet
      backend: anthropic
      secret_env: ANTHROPIC_API_KEY
      secret_name: anthropic-api
      secret_key: api-key
    required_choices: []

  alfred-deepseek-chat:
    description: Alfred specialist deployment using the DeepSeek Chat-backed Alfred flavor seed.
    defaults:
      flavor: alfred
      image_customization: none
      provider: deepseek
      model: deepseek-chat
      backend: deepseek
      backend_base_url: https://api.deepseek.com/v1
      secret_env: DEEPSEEK_API_KEY
      secret_name: deepseek-api
      secret_key: api-key
    required_choices: []

  sauron-sonnet:
    description: Sauron specialist deployment using the built-in Sauron flavor seed on Claude Sonnet.
    defaults:
      flavor: sauron
      image_customization: none
      provider: anthropic
      model: sonnet
      backend: anthropic
      secret_env: ANTHROPIC_API_KEY
      secret_name: anthropic-api
      secret_key: api-key
    required_choices: []

  warden-haiku:
    description: Warden specialist deployment using the built-in Warden flavor seed on Claude Haiku.
    defaults:
      flavor: warden
      image_customization: none
      provider: anthropic
      model: haiku
      backend: anthropic
      secret_env: ANTHROPIC_API_KEY
      secret_name: anthropic-api
      secret_key: api-key
    required_choices: []
