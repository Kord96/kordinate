version: 2

runtime_profiles:
  gemini-sdk:
    toolGuidance:
      - Rely on the runtime's advertised tool schema instead of assuming tool names from other runtimes.
      - Do not invent helper names or wrap nonexistent tools inside Bash.
    runArtifactGuidance:
      - Use the prepared run artifact tools for generated analysis artifacts when available.
      - Treat `facts/index.json` as the authoritative inventory for optional fact files in this run.
  claude-agent-sdk:
    toolGuidance: []
  openclaude-harness:
    toolGuidance:
      - Rely on the runtime's advertised tool schema instead of assuming tool names from other runtimes.
      - Do not invent helper names or wrap nonexistent tools inside Bash.
  codex-sdk:
    toolGuidance: []

# Source-of-truth agent platform spec.
#
# `name` is the deployed agent identity.
# `flavor` selects the seeded specialist overlay:
# - `augur`, `charon`, `alfred`, `sauron`
# - `generic` for plain runtime/backend behavior with no seeded overlay
#
# `runtime.command` is the in-container executable. This should resolve to the
# shared daemon package baked into the image.
# `runtime.daemon` describes the shared daemon runtime/backend selection.

agents:
  - name: generic-opus
    flavor: generic
    image:
      base: agent-base
      customization: none
    runtime:
      command: ["klaude-daemon"]
      daemon:
        kind: claude-agent-sdk
        provider: anthropic
        model: opus
        default_timeout_ms: 1800000
        backend:
          name: anthropic
        secret:
          env: ANTHROPIC_API_KEY
          name: anthropic-api
          key: api-key
      kafka:
        request_topic: generic-opus
        reply_required: true
        request_schema:
          required: [type, sender, correlation_id, prompt]
          optional: [working_dir, timeout_ms, reflect, reflection_prompt, agent_params]
        response_schema:
          required: [type, sender, correlation_id, status, output]
          optional: [reflection, errors, metadata]
      state:
        agent_home_dir: /kord/agents/generic-opus
        state_dir: /kord/agents/generic-opus
    deploy:
      replicas:
        min: 1
        max: 1
        cooldown: 300
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 4Gi

  - name: augur-opus
    flavor: augur
    accepted_request_prefixes: ["/analyze"]
    image:
