version: 2

# Source-of-truth agent platform spec.
#
# `name` is the deployed agent identity.
# `flavor` selects the seeded specialist overlay:
# - `augur`, `charon`, `alfred`, `sauron`, `warden`
# - `generic` for plain runtime/backend behavior with no seeded overlay
#
# `runtime.command` is the in-container executable. This should resolve to the
# shared daemon package baked into the image.
# `runtime.daemon` describes the shared daemon runtime/backend selection.

agents:
  - name: augur
    flavor: augur
    image:
      base: agent-base
      customization: agent-augur
    runtime:
      command: ["klaude-daemon"]
      daemon:
        kind: openclaude-harness
        provider: anthropic
        model: sonnet
        backend:
          name: anthropic
        secret:
          env: ANTHROPIC_API_KEY
          name: anthropic-api
          key: api-key
      kafka:
        request_topic: agent.augur
        reply_required: true
        request_schema:
          required: [prompt, reply_to]
          optional: [timeout_ms, reflect]
        response_schema:
          required: [status, output]
          optional: [reflection, errors]
      state:
        project_dir: /runtime/augur
        state_dir: /kord/augur
    deploy:
      replicas:
        min: 0
        max: 3
        cooldown: 300
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 4Gi

  - name: augur-claude
