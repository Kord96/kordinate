        secret:
          env: ANTHROPIC_API_KEY
          name: anthropic-api
          key: api-key
      kafka:
        request_topic: augur-claude
        reply_required: true
        request_schema:
          required: [type, sender, correlation_id, prompt]
          optional: [working_dir, timeout_ms, reflect, reflection_prompt, agent_params]
        response_schema:
          required: [type, sender, correlation_id, status, output]
          optional: [reflection, errors, metadata]
      state:
        project_dir: /runtime/augur-claude
        state_dir: /kord/augur-claude
    deploy:
      replicas:
        min: 0
        max: 1
        cooldown: 300
      resources:
