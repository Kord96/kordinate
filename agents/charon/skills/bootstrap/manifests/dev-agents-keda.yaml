# KEDA ScaledObjects for agent pods.
# Prerequisite: KEDA operator installed (kubectl apply -f https://keda.sh/docs/latest/deploy/)
#
# Standby scaling:
# - minReplicaCount = standby count (always-warm pods)
# - Kafka consumer lag triggers scale-up
# - cooldownPeriod controls scale-down delay
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agent-augur
  namespace: dev
spec:
  scaleTargetRef:
    name: agent-augur
  minReplicaCount: 1      # standby: 1
  maxReplicaCount: 10
  cooldownPeriod: 300      # 5 minutes
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-kafka-bootstrap.dev.svc.cluster.local:9092
        consumerGroup: agent-augur
        topic: jobs.augur
        lagThreshold: "1"
---
