# Agent pod Deployments — one per agent type.
# All use the same agent-factory image, differentiated by AGENT_NAME env var.
# KEDA ScaledObjects control replicas (see dev-agents-keda.yaml).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-augur
  namespace: dev
  labels:
    app: kord-agent
    agent: augur
spec:
  replicas: 1  # standby count (KEDA manages scaling)
  selector:
    matchLabels:
      app: kord-agent
      agent: augur
  template:
    metadata:
      labels:
        app: kord-agent
        agent: augur
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: kord
      containers:
        - name: agent
          image: localhost:30500/agent-factory:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              ln -sfn /kord/pass "$HOME/.password-store" 2>/dev/null
              ln -sfn /kord/gnupg "$HOME/.gnupg" 2>/dev/null
              ln -sfn /kord/kordinate "$HOME/.kord" 2>/dev/null
              ln -sfn /kord/claude-home "$HOME/.claude" 2>/dev/null
              ln -sfn /kord/claude-home.json "$HOME/.claude.json" 2>/dev/null
              chmod 700 /kord/pass /kord/gnupg 2>/dev/null || true
              cd /kord/kordinate/lib/agent-runner && npm install --production 2>/dev/null
              exec node /kord/kordinate/lib/agent-runner/runner.js
          env:
            - name: AGENT_NAME
              value: augur
            - name: KAFKA_BROKERS
              value: kafka-kafka-bootstrap.dev.svc.cluster.local:9092
            - name: HOME
              value: /home/claude
            - name: KORDINATE_HOME
              value: /kord/kordinate
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 4Gi }
          ports:
            - containerPort: 9090
              name: status
          readinessProbe:
            httpGet: { path: /health, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 9090 }
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: kord
              mountPath: /kord
            - name: work
              mountPath: /work
      volumes:
        - name: kord
          persistentVolumeClaim:
            claimName: kord
        - name: work
          emptyDir: { sizeLimit: 2Gi }
---
