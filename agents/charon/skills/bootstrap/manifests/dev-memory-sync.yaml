# Memory Sync CronJob — merges per-job scratchpads every 30 minutes.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: memory-sync
  namespace: dev
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: kord
          containers:
            - name: sync
              image: localhost:30500/agent-factory:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  ln -sfn /kord/kordinate "$HOME/.kord" 2>/dev/null
                  exec node /kord/kordinate/lib/memory-service/sync.js
              env:
                - name: KORDINATE_HOME
                  value: /kord/kordinate
                - name: HOME
                  value: /home/claude
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
              volumeMounts:
                - name: kord
                  mountPath: /kord
          volumes:
            - name: kord
              persistentVolumeClaim:
                claimName: kord
          restartPolicy: OnFailure
