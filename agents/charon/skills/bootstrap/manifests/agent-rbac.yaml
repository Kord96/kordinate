# RBAC for Claude agents — two tiers of cluster access.
#
# readonly: default for all agents (sauron, augur, etc.)
#   - read all resources, exec into pods, read logs
#
# charon: full admin for charon agent only
#   - uses the existing k3s admin kubeconfig
#
# Bootstrap: bin/cluster-bootstrap applies this, generates readonly kubeconfig,
# and sets it as the default KUBECONFIG on the cluster.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-readonly
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-readonly
rules:
  # Read all standard resources
  - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Pod logs
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  # Pod exec (for debugging)
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Metrics
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-readonly
subjects:
  - kind: ServiceAccount
    name: agent-readonly
    namespace: kube-system
