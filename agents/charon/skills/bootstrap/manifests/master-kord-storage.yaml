##
## Kord — persistent system volume for the kordinate platform.
## RWX via Longhorn — allows multiple pods to mount (workstation, docs, etc).
##
## Layout:
##   /kord/shared/memory/   — shared runtime memory/protocols for all agents
##   /kord/shared/repos/    — shared cloned repos (readable by all)
##   /kord/workstation/home — persisted workstation home; mounted at /home/claude via symlink
##   /kord/alfred/          — Alfred-owned secrets and exported materials
##   /kord/<agent>/         — per-agent persistent state
##     /memory/             — canonical agent memory
##     /tmp/                — agent scratch space
##
## Initialized by a one-shot Job that creates the directory structure
## for built-in agents and shared platform state.
##
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kord
  labels:
    app: kord
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: STORAGE_CLASS
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kord-init
  labels:
    app: kord
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: init
          image: alpine/git
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p \
                /kord/shared/memory \
                /kord/shared/repos \
                /kord/workstation/home \
                /kord/alfred/pass \
                /kord/alfred/ssh \
                /kord/alfred/gnupg \
                /kord/alfred/exports \
                /kord/augur/memory /kord/augur/tmp \
                /kord/charon/memory /kord/charon/tmp \
                /kord/warden/memory /kord/warden/tmp \
                /kord/sauron/memory /kord/sauron/tmp \
                /kord/alfred/memory /kord/alfred/tmp

              chmod 700 /kord/alfred/pass /kord/alfred/ssh /kord/alfred/gnupg
              echo "kord volume ready"
          volumeMounts:
            - name: kord
              mountPath: /kord
      volumes:
        - name: kord
          persistentVolumeClaim:
            claimName: kord
