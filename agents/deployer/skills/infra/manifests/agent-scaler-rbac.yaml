# RBAC for workstation to scale agent-pool Deployments.
# Narrow scope: only scale/patch on Deployments in the gateway namespace
# with the label app=agent-pool.
#
# Applied during bootstrap alongside agent-rbac.yaml.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-scaler
  namespace: gateway
rules:
  # Scale deployments (kubectl scale uses the scale subresource)
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  # Read deployment status (for rollout status)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  # Read pods (for readiness checks)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workstation-agent-scaler
  namespace: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-scaler
subjects:
  - kind: ServiceAccount
    name: workstation
    namespace: gateway
