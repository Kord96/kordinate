## Master Alloy — metrics federation + log tailing
## ConfigMap is cluster-specific — generated by /infra generate-overlays
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels:
    app: monitoring
    component: alloy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: monitoring
      component: alloy
  template:
    metadata:
      labels:
        app: monitoring
        component: alloy
    spec:
      containers:
        - name: alloy
          image: grafana/alloy:v1.5.1
          args: [run, /etc/alloy/config.alloy, --stability.level=generally-available]
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: federate-logs
              mountPath: /data/federate
              readOnly: true
        - name: log-puller
          image: REGISTRY/log-puller:latest
          imagePullPolicy: Never
          args:
            - --registry=/etc/gateway-registry/gateways.yaml
            - --output-dir=/data/federate
            - --interval=60
            - --retention=7200
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: federate-logs
              mountPath: /data/federate
            - name: gateway-registry
              mountPath: /etc/gateway-registry
              readOnly: true
      volumes:
        - name: config
          configMap: { name: alloy-config }
        - name: federate-logs
          emptyDir: {}
        - name: gateway-registry
          configMap: { name: gateway-registry }
