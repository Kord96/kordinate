apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
spec:
  template:
    spec:
      containers:
        - name: alloy
          env:
            - name: CLUSTER_NAME
              value: vandc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  template:
    spec:
      containers:
        - name: tailscale
          env:
            - name: TS_HOSTNAME
              value: gateway-vandc
