##
## Gateway — Tailscale identity for the cluster
## Exposes Prometheus, Loki, and K8s API on the tailnet for master.
##
apiVersion: v1
kind: Secret
metadata:
  name: gateway-tailscale
  labels:
    app: monitoring
    component: gateway
stringData:
  TS_AUTHKEY: MUST_BE_SET
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-serve-config
  labels:
    app: monitoring
    component: gateway
data:
  serve.json: |
    {
      "TCP": {
        "6443": { "TCPForward": "kubernetes.default.svc.cluster.local:443" },
        "9090": { "TCPForward": "prometheus.monitor.svc.cluster.local:9090" },
        "3100": { "TCPForward": "loki.monitor.svc.cluster.local:3100" }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  labels:
    app: monitoring
    component: gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway
  labels:
    app: monitoring
    component: gateway
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway
  labels:
    app: monitoring
    component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway
subjects:
  - kind: ServiceAccount
    name: gateway
    namespace: monitor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: monitoring
    component: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: monitoring
      component: gateway
  template:
    metadata:
      labels:
        app: monitoring
        component: gateway
    spec:
      serviceAccountName: gateway
      containers:
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:latest
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: gateway-tailscale
                  key: TS_AUTHKEY
            - name: TS_HOSTNAME
              value: MUST_BE_SET_BY_OVERLAY
            - name: TS_USERSPACE
              value: "false"
            - name: TS_SERVE_CONFIG
              value: /etc/tailscale/serve.json
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
            - name: serve-config
              mountPath: /etc/tailscale
            - name: dev-tun
              mountPath: /dev/net/tun
      volumes:
        - name: tailscale-state
          emptyDir: {}
        - name: serve-config
          configMap:
            name: gateway-serve-config
        - name: dev-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
