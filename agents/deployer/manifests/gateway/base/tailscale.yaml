##
## Gateway Tailscale — provides Tailscale identity for the gateway namespace
## Same pattern as workstation's Tailscale sidecar but standalone.
## Enables master to reach gateway services over Tailscale.
##
## Secret "gateway-tailscale" is created by the deployer from
## pass store (kordinate/tailscale/auth_key).
##
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale
  labels:
    app: kord-infra
    component: tailscale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale
  labels:
    app: kord-infra
    component: tailscale
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale
  labels:
    app: kord-infra
    component: tailscale
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tailscale
subjects:
  - kind: ServiceAccount
    name: tailscale
    namespace: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale
  labels:
    app: kord-infra
    component: tailscale
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kord-infra
      component: tailscale
  template:
    metadata:
      labels:
        app: kord-infra
        component: tailscale
    spec:
      serviceAccountName: tailscale
      containers:
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:latest
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: gateway-tailscale
                  key: TS_AUTHKEY
            - name: TS_HOSTNAME
              value: gateway-home
            - name: TS_USERSPACE
              value: "false"
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
            - name: dev-tun
              mountPath: /dev/net/tun
      volumes:
        - name: tailscale-state
          emptyDir: {}
        - name: dev-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
