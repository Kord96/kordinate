##
## Prometheus — federated metrics store
## Scrapes metrics from both cluster gateways via Tailscale
##
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-admin-data
  labels:
    app: kord-infra
    component: prometheus
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: kord-infra
    component: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kord-infra
      component: prometheus
  template:
    metadata:
      labels:
        app: kord-infra
        component: prometheus
    spec:
      initContainers:
        - name: fix-prometheus-perms
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 65534:65534 /prometheus"]
          volumeMounts:
            - name: prometheus-data
              mountPath: /prometheus
          securityContext:
            runAsUser: 0
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - --storage.tsdb.retention.time=30d
            - --storage.tsdb.path=/prometheus
            - --web.listen-address=:9191
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - containerPort: 9191
          resources:
            requests:
              memory: 2Gi
              cpu: '1'
            limits:
              memory: 4Gi
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-admin-config
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-admin-data
