##
## Prometheus federation config — git-crypt encrypted
## Contains Tailscale IPs for cross-cluster federation
##
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-admin-config
  labels:
    app: kord-infra
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/node-alerts.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9191"]

      - job_name: federate-vandc
        honor_labels: true
        metrics_path: /federate
        params:
          'match[]':
            - '{__name__=~".+"}'
        scrape_interval: 30s
        static_configs:
          - targets: ["100.95.237.24:30091"]
            labels:
              source_cluster: vandc

      - job_name: federate-home
        honor_labels: true
        metrics_path: /federate
        params:
          'match[]':
            - '{__name__=~".+"}'
        scrape_interval: 30s
        static_configs:
          - targets: ["alloy-gateway.gateway.svc.cluster.local:9090"]
            labels:
              source_cluster: home

  node-alerts.yml: |
    groups:
      - name: node-resources
        interval: 30s
        rules:
          # ── CPU ──
          - alert: NodeCPUHigh
            expr: >
              (1 - avg by(node)(rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m])))
              >= 0.80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Node {{ $labels.node }} CPU usage {{ $value | humanizePercentage }}"
          - alert: NodeCPUCritical
            expr: >
              (1 - avg by(node)(rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m])))
              >= 0.95
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} CPU usage {{ $value | humanizePercentage }}"

          # ── Memory ──
          - alert: NodeMemoryHigh
            expr: >
              (1 - (node_memory_MemAvailable_bytes{job="node-exporter"}
                    / node_memory_MemTotal_bytes{job="node-exporter"}))
              >= 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Node {{ $labels.node }} memory usage {{ $value | humanizePercentage }}"
          - alert: NodeMemoryCritical
            expr: >
              (1 - (node_memory_MemAvailable_bytes{job="node-exporter"}
                    / node_memory_MemTotal_bytes{job="node-exporter"}))
              >= 0.95
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} memory usage {{ $value | humanizePercentage }}"

          # ── Disk ──
          - alert: NodeDiskHigh
            expr: >
              (1 - (node_filesystem_avail_bytes{job="node-exporter",mountpoint="/"}
                    / node_filesystem_size_bytes{job="node-exporter",mountpoint="/"}))
              >= 0.80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Node {{ $labels.node }} root disk usage {{ $value | humanizePercentage }}"
          - alert: NodeDiskCritical
            expr: >
              (1 - (node_filesystem_avail_bytes{job="node-exporter",mountpoint="/"}
                    / node_filesystem_size_bytes{job="node-exporter",mountpoint="/"}))
              >= 0.90
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} root disk usage {{ $value | humanizePercentage }}"
