##
## Master Prometheus — centralized metrics store (30d retention)
## Receives all metrics from Master Alloy via remote_write.
##
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-admin-data
  labels:
    app: monitoring
    component: prometheus
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-admin-config
  labels:
    app: monitoring
    component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9191"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: monitoring
    component: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: monitoring
      component: prometheus
  template:
    metadata:
      labels:
        app: monitoring
        component: prometheus
    spec:
      initContainers:
        - name: fix-prometheus-perms
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 65534:65534 /prometheus"]
          volumeMounts:
            - name: prometheus-data
              mountPath: /prometheus
          securityContext:
            runAsUser: 0
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - --storage.tsdb.retention.time=30d
            - --storage.tsdb.path=/prometheus
            - --web.listen-address=:9191
            - --config.file=/etc/prometheus/prometheus.yml
            - --web.enable-remote-write-receiver
          ports:
            - containerPort: 9191
          resources:
            requests:
              memory: 2Gi
              cpu: '1'
            limits:
              memory: 4Gi
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-admin-config
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-admin-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: monitoring
    component: prometheus
spec:
  type: ClusterIP
  selector:
    app: monitoring
    component: prometheus
  ports:
    - port: 9191
      targetPort: 9191
