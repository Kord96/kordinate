##
## Grafana — master visualization + image renderer
##
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  labels:
    app: kord-infra
    component: grafana
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: kord-infra
    component: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kord-infra
      component: grafana
  template:
    metadata:
      labels:
        app: kord-infra
        component: grafana
    spec:
      serviceAccountName: default
      initContainers:
        - name: fix-grafana-perms
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 472:472 /var/lib/grafana"]
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
          securityContext:
            runAsUser: 0
        - name: copy-dashboards
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /dashboards/logbd/Drill /dashboards/general
              [ -d /tmp/cm-business ] && cp /tmp/cm-business/*.json /dashboards/logbd/ 2>/dev/null || true
              [ -d /tmp/cm-drill ] && cp /tmp/cm-drill/*.json /dashboards/logbd/Drill/ 2>/dev/null || true
              [ -d /tmp/cm-general ] && cp /tmp/cm-general/*.json /dashboards/general/ 2>/dev/null || true
              echo "Copied $(find /dashboards -name '*.json' | wc -l) dashboards total"
          volumeMounts:
            - name: dashboards
              mountPath: /dashboards
            - name: db-business
              mountPath: /tmp/cm-business
            - name: db-drill
              mountPath: /tmp/cm-drill
            - name: db-general
              mountPath: /tmp/cm-general
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_INSTALL_PLUGINS
              value: "influxdata-flightsql-datasource"
            - name: GF_RENDERING_SERVER_URL
              value: "http://localhost:8081/render"
            - name: GF_RENDERING_CALLBACK_URL
              value: "http://localhost:3000/"
            - name: GF_LOG_FILTERS
              value: "rendering:debug"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards
              mountPath: /dashboards
        - name: grafana-renderer
          image: grafana/grafana-image-renderer:latest
          ports:
            - containerPort: 8081
          env:
            - name: ENABLE_METRICS
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: dashboards
          emptyDir: {}
        - name: grafana-provisioning
          configMap:
            name: grafana-provisioning
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: db-business
          configMap:
            name: grafana-db-business
            optional: true
        - name: db-drill
          configMap:
            name: grafana-db-drill
            optional: true
        - name: db-general
          configMap:
            name: grafana-db-general
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: kord-infra
    component: grafana
spec:
  type: ClusterIP
  selector:
    app: kord-infra
    component: grafana
  ports:
    - port: 3000
      targetPort: 3000
