##
## Master Loki — centralized log store (30d retention)
## Receives logs from Master Alloy via push API.
##
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-master-data
  labels:
    app: kord-infra
    component: loki
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-master-config
  labels:
    app: kord-infra
    component: loki
data:
  loki.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /data/loki
      storage:
        filesystem:
          chunks_directory: /data/loki/chunks
          rules_directory: /data/loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
      - from: 2020-10-24
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
    limits_config:
      retention_period: 720h
    compactor:
      working_directory: /data/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    app: kord-infra
    component: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kord-infra
      component: loki
  template:
    metadata:
      labels:
        app: kord-infra
        component: loki
    spec:
      securityContext:
        runAsUser: 0
      containers:
      - name: loki
        image: grafana/loki:3.0.0
        args:
        - -config.file=/etc/loki/loki.yml
        ports:
        - containerPort: 3100
        resources:
          requests:
            memory: 512Mi
            cpu: 500m
          limits:
            memory: 2Gi
        volumeMounts:
        - name: loki-config
          mountPath: /etc/loki
        - name: loki-data
          mountPath: /data/loki
      volumes:
      - name: loki-config
        configMap:
          name: loki-master-config
      - name: loki-data
        persistentVolumeClaim:
          claimName: loki-master-data
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    app: kord-infra
    component: loki
spec:
  type: ClusterIP
  selector:
    app: kord-infra
    component: loki
  ports:
  - name: http
    port: 3100
    targetPort: 3100
