project: admin
repo: https://github.com/Kord96/koordinate
cluster: home
namespace: master
method: kubectl
status: running
last_deployed: 2026-03-13

branches:
  dev: main

# SAFETY: The master namespace has independent Deployments:
#   prometheus, grafana, workstation
#
# The workstation Deployment hosts the Claude Code session.
# Applying workstation.yaml or kubectl apply -k master/ kills the session.
# Both are hard-blocked by guard-kubectl.sh — no override exists.
#
# Safe to apply from inside (individual manifests):
#   kubectl apply -f profile/manifests/master/prometheus.yaml -n master
#   kubectl apply -f profile/manifests/master/grafana.yaml -n master
#   kubectl apply -f profile/manifests/master/dashboards/ -n master
#
# NEVER safe from inside:
#   kubectl apply -k profile/manifests/master/    (hard-blocked)
#   kubectl apply -f ...workstation.yaml          (hard-blocked)
#
# Workstation restarts must be done externally (from the host).
safe_apply:
  - prometheus.yaml
  - grafana.yaml
  - dashboards
  - alloy.yaml
  - loki.yaml
