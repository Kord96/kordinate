project: registry
cluster: vandc
namespace: registry
method: kubectl
status: running
last_deployed: 2026-03-07

image: registry:2
components:
  - registry

config:
  hostPort: 5000
  hostPath: /var/lib/registry
  pinnedTo: vandc-66
  mirrors:
    - "registry:5000"
    - "10.95.43.66:5000"

notes: >
  Local container registry for the vandc cluster. Eliminates per-node
  image import (docker save | ssh | k3s ctr import). Build workflow:
  docker build -t 10.95.43.66:5000/<image>:<tag> .
  docker push 10.95.43.66:5000/<image>:<tag>
  kubectl apply -f manifest.yaml (pods pull from registry automatically)
