---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-opus-4-6
spec:
  template:
    spec:
      containers:
        - name: agent
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api
                  key: api-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-deepseek-v3-2
spec:
  template:
    spec:
      containers:
        - name: agent
          env:
            - name: FIREWORKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fireworks-api
                  key: api-key
            - name: OPENAI_BASE_URL
              value: https://api.fireworks.ai/inference/v1
            - name: OPENAI_MODEL
              value: accounts/fireworks/models/deepseek-v3p2
            - name: CLAUDE_CODE_USE_OPENAI
              value: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-gemini
spec:
  template:
    spec:
      containers:
        - name: agent
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api
                  key: api-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api
                  key: api-key
            - name: OPENAI_BASE_URL
              value: https://generativelanguage.googleapis.com/v1beta/openai
            - name: OPENAI_MODEL
              value: gemini-3.1-pro-preview
            - name: CLAUDE_CODE_USE_OPENAI
              value: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-glm5
spec:
  template:
    spec:
      containers:
        - name: agent
          env:
            - name: FIREWORKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fireworks-api
                  key: api-key
            - name: OPENAI_BASE_URL
              value: https://api.fireworks.ai/inference/v1
            - name: OPENAI_MODEL
              value: accounts/fireworks/models/glm-5
            - name: CLAUDE_CODE_USE_OPENAI
              value: "1"
