apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-charon
spec:
  template:
    spec:
      containers:
        - name: agent
          env:
            - name: AGENT_NAME
              value: charon
            - name: AGENT_PROJECT_DIR
              value: /kord/agents/charon
            - name: KAFKA_BROKERS
              value: kafka-kafka-bootstrap.dev.svc.cluster.local:9092
            - name: HOME
              value: /home/claude
            - name: KORDINATE_HOME
              value: /app
            - name: PROJECTS_ROOT
              value: /kord/repos
            - name: CODEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: codex-api
                  key: api-key
            - name: CHATGPT_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: codex-api
                  key: account-id
            - name: OPENAI_BASE_URL
              value: https://api.openai.com/v1
            - name: OPENAI_MODEL
              value: gpt-5.2-codex
            - name: CLAUDE_CODE_USE_OPENAI
              value: "1"
            - name: FIRECRAWL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: firecrawl-api
                  key: api-key
---
