apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agent-augur
spec:
  pollingInterval: 30
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 300
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
        scaleUp:
          stabilizationWindowSeconds: 300
---
