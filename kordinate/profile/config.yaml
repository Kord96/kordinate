# Kord96 Centralized Configuration
# All cluster IPs, ports, hostnames, and service endpoints in one place.
# Referenced by deploy configs, MCP servers, monitoring, and documentation.
#
# This file ships with placeholder values. Replace them with your own after install.
# Run: git update-index --assume-unchanged kordinate/profile/config.yaml
# to prevent local edits from appearing in git status.

clusters:
  example:
    name: example
    description: Example cluster (k3s)
    tailscale_ip: 100.x.x.x
    gateway_tailscale_ip: 100.x.x.x
    lan_network: 10.0.0.0/24
    gateway_lan_ip: 10.0.0.1
    nodes:
      - 10.0.0.1  # control-plane
      - 10.0.0.2  # worker
    namespaces: [gateway, master, monitor]
    manifests:
      gateway: agents/charon/manifests/gateway
      monitor: agents/charon/manifests/monitor
      master: agents/charon/manifests/master
      bootstrap: agents/charon/manifests/bootstrap
    workloads: []
    services:
      postgres:
        port: 30632
        user: myuser
        database: mydb
      redis:
        port: 30379
      metrics:
        port: 30091
      logs:
        port: 30101
      grafana:
        port: 30300
        namespace: master
      registry:
        port: 5000
        host: 10.0.0.1
        url: 10.0.0.1:5000

network:
  tailnet: example.ts.net
  grafana_public: grafana.example.com

cloudflare:
  account_id: your-account-id
  tunnel_id: your-tunnel-id
  tunnel_name: your-tunnel-name
  domains:
    - example.com

node_hostnames:
  node-1: 10.0.0.1
  node-2: 10.0.0.2
