# Field-level access control for config.yaml
# Maps dotted YAML paths to the agent authorized to modify them.
# Most specific path wins. Wildcard (*) matches any key at that level.
#
# Example: editing clusters.vandc.services.grafana checks:
#   1. clusters.*.services.grafana → sauron (match)
#   2. clusters.*.services → charon (less specific)
#   3. clusters.* → charon (least specific)

clusters: charon
clusters.*: charon
clusters.*.services.grafana: sauron

network: charon
cloudflare: charon
node_hostnames: charon
