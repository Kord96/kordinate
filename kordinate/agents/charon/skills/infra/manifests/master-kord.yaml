##
## Kord — HTTP-inspired route protocol server for agent orchestration.
## Registers capability-based MCP tools (e.g., analyze_architecture,
## write_memory) and routes requests to the right agent.
##
## MCP endpoint: POST /mcp (StreamableHTTP transport)
## Health: GET /health
##
## Uses a slim Alpine image (Node.js + claude CLI + git + gnupg).
## Shares the kord PVC for agent definitions, memory, and route configs.
##
## KEDA ScaledObject scales 0→1 on HTTP traffic, back to 0 after idle.
## If KEDA is not installed, the Deployment runs with replicas: 0 and
## must be manually scaled up. Install KEDA to enable auto-scaling.
##
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kord
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kord-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-readonly
subjects:
  - kind: ServiceAccount
    name: kord
    namespace: master
---
apiVersion: v1
kind: Service
metadata:
  name: kord
  labels:
    app: kord
spec:
  selector:
    app: kord
  ports:
    - port: 3100
      targetPort: 3100
      name: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kord
  labels:
    app: kord
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kord
  template:
    metadata:
      labels:
        app: kord
    spec:
      serviceAccountName: kord
      containers:
        - name: kord
          image: localhost:30500/agent-factory:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              # Bump file descriptor limits for concurrent agent spawns
              ulimit -n 1048576 2>/dev/null || true
              export KORD_ROOT="${KORD_ROOT:-/kord}"
              export KORDINATE_HOME="${KORDINATE_HOME:-$KORD_ROOT/kordinate}"
              export PATH="$HOME/.npm-global/bin:$KORDINATE_HOME/bin:$PATH"

              # Symlink persistent state from PVC
              ln -sfn "$KORD_ROOT/pass" "$HOME/.password-store"
              ln -sfn "$KORD_ROOT/gnupg" "$HOME/.gnupg"
              ln -sfn "$KORDINATE_HOME" "$HOME/.kord"
              chmod 700 "$KORD_ROOT/pass" "$KORD_ROOT/gnupg" 2>/dev/null || true

              # Claude credentials (shared PVC with workstation)
              [ -d "$HOME/.claude" ] && [ ! -L "$HOME/.claude" ] && rm -rf "$HOME/.claude"
              ln -sfn "$KORD_ROOT/claude-home" "$HOME/.claude"
              ln -sfn "$KORD_ROOT/claude-home.json" "$HOME/.claude.json"

              # Install dependencies (safety net — node_modules are on PVC)
              MCP_SERVER="$KORDINATE_HOME/lib/mcp-agent-server"
              (cd "$MCP_SERVER" && npm install --production 2>/dev/null || true)

              echo "Starting kord server on port ${PORT:-3100}..."
              exec node "$MCP_SERVER/server.js"
          ports:
            - containerPort: 3100
              name: mcp
          env:
            - name: HOME
              value: /home/claude
            - name: KORDINATE_HOME
              value: /kord/kordinate
            - name: REPO_ROOT
              value: /kord/projects/kordinate
            - name: KORD_ROOT
              value: /kord
            - name: PORT
              value: "3100"
          readinessProbe:
            httpGet:
              path: /health
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 8Gi
          volumeMounts:
            - name: kord
              mountPath: /kord
      volumes:
        - name: kord
          persistentVolumeClaim:
            claimName: kord
---
## KEDA ScaledObject — scales Deployment 0→1 on HTTP requests.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kord
  labels:
    app: kord
spec:
  scaleTargetRef:
    name: kord
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.master.svc.cluster.local:9191
        query: sum(rate(http_requests_total{app="kord"}[2m]))
        threshold: "0.01"
