##
## NFS Server — shared PVC exposed on port 2049 for cross-cluster access.
## Gateway Tailscale forwards :2049 so master can mount it remotely.
##
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-shared
  labels:
    app: gateway
    component: nfs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  labels:
    app: gateway
    component: nfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
      component: nfs
  template:
    metadata:
      labels:
        app: gateway
        component: nfs
    spec:
      containers:
        - name: nfs
          image: itsthenetwork/nfs-server-alpine:latest
          env:
            - name: SHARED_DIRECTORY
              value: /data
          ports:
            - containerPort: 2049
              name: nfs
          securityContext:
            privileged: true
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gateway-shared
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  labels:
    app: gateway
    component: nfs
spec:
  ports:
    - port: 2049
      targetPort: 2049
      name: nfs
  selector:
    app: gateway
    component: nfs
