##
## Ingress — Cloudflare tunnel + Caddy reverse proxy (sidecar pattern)
##
## cloudflared forwards tunnel traffic to Caddy on localhost:80,
## Caddy routes by hostname to backend services.
##
## Tunnel ingress is configured remotely on the Cloudflare dashboard
## (catch-all to http://localhost:80). Caddy handles host-based routing.
##
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-tunnel
  labels:
    app: monitoring
    component: ingress
stringData:
  TUNNEL_TOKEN: MUST_BE_SET
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-caddyfile
  labels:
    app: monitoring
    component: ingress
data:
  Caddyfile: |
    {
      auto_https off
    }

    :80 {
      @grafana host grafana.khaledkord.com
      handle @grafana {
        reverse_proxy grafana.master.svc.cluster.local:3000
      }

      # Add future services here:
      # @service host service.khaledkord.com
      # handle @service {
      #   reverse_proxy service.master.svc.cluster.local:PORT
      # }

      handle {
        respond "Not Found" 404
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress
  labels:
    app: monitoring
    component: ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring
      component: ingress
  template:
    metadata:
      labels:
        app: monitoring
        component: ingress
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel
                  key: TUNNEL_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
        - name: caddy
          image: caddy:2-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
      volumes:
        - name: caddyfile
          configMap:
            name: ingress-caddyfile
