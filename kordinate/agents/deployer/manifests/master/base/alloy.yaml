apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  labels:
    app: monitoring
    component: alloy
data:
  config.alloy: |
    // ===================================================
    // METRICS — pull from all Gateway Proms via /federate
    // ===================================================

    prometheus.scrape "federate_home" {
      targets = [{
        __address__ = "100.79.204.119:9090",
      }]
      metrics_path    = "/federate"
      params          = { "match[]" = ["{__name__=~\".+\"}"] }
      scrape_interval = "60s"
      scrape_timeout  = "25s"
      honor_labels    = true
      forward_to      = [prometheus.remote_write.master.receiver]
    }

    prometheus.scrape "federate_vandc" {
      targets = [{
        __address__ = "100.93.174.24:9090",
      }]
      metrics_path    = "/federate"
      params          = { "match[]" = ["{__name__=~\".+\"}"] }
      scrape_interval = "60s"
      scrape_timeout  = "25s"
      honor_labels    = true
      forward_to      = [prometheus.remote_write.master.receiver]
    }

    prometheus.remote_write "master" {
      endpoint {
        url = "http://prometheus.master.svc.cluster.local:9191/api/v1/write"
      }
    }

    // ===================================================
    // LOGS — tail JSON Lines files from gateway NFS shares
    // Sidecar on each cluster writes files to /data/federate/
    // Master mounts via NFS over Tailscale, tails with loki.source.file
    // ===================================================

    // -- home cluster logs -- (disabled: NFS not deployed)
    // local.file_match "logs_home" {
    //   path_targets = [{
    //     __path__ = "/data/federate/home/*.json",
    //     cluster  = "home",
    //   }]
    // }
    //
    // loki.source.file "logs_home" {
    //   targets    = local.file_match.logs_home.targets
    //   forward_to = [loki.process.federate.receiver]
    // }

    // -- vandc cluster logs --
    local.file_match "logs_vandc" {
      path_targets = [{
        __path__ = "/data/federate/vandc/*.json",
        cluster  = "vandc",
      }]
    }

    loki.source.file "logs_vandc" {
      targets    = local.file_match.logs_vandc.targets
      forward_to = [loki.process.federate.receiver]
    }

    // -- Parse federated log lines --
    // Each line: {"stream": {labels}, "ts": "...", "line": "..."}
    loki.process "federate" {
      // Extract the embedded stream labels and original log line
      stage.json {
        expressions = {
          stream_app       = "stream.app",
          stream_component = "stream.component",
          stream_namespace = "stream.namespace",
          stream_cluster   = "stream.cluster",
          stream_node      = "stream.node",
          stream_pod       = "stream.pod",
          stream_container = "stream.container",
          stream_level     = "stream.level",
          stream_consumer  = "stream.consumer",
          original_line    = "line",
        }
      }

      // Apply the original labels
      stage.labels {
        values = {
          app       = "stream_app",
          component = "stream_component",
          namespace = "stream_namespace",
          cluster   = "stream_cluster",
          node      = "stream_node",
          pod       = "stream_pod",
          container = "stream_container",
          level     = "stream_level",
          consumer  = "stream_consumer",
        }
      }

      // Replace the log line with the original content
      stage.output {
        source = "original_line"
      }

      forward_to = [loki.write.master.receiver]
    }

    // Write to Master Loki in master namespace
    loki.write "master" {
      endpoint {
        url = "http://loki.master.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels:
    app: monitoring
    component: alloy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: monitoring
      component: alloy
  template:
    metadata:
      labels:
        app: monitoring
        component: alloy
    spec:
      containers:
        - name: alloy
          image: grafana/alloy:v1.5.1
          args:
            - run
            - /etc/alloy/config.alloy
            - --stability.level=generally-available
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            # home: NFS not deployed — mount skipped
            - name: logs-vandc
              mountPath: /data/federate/vandc
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: alloy-config
        # home: NFS not deployed — volume skipped
        - name: logs-vandc
          persistentVolumeClaim:
            claimName: alloy-nfs-vandc
            readOnly: true
