## Generated by generate-config.py — do not edit directly.
## Regenerate: cd master && python3 generate-config.py
##
## Master Alloy — pulls metrics and logs from all cluster gateways.
## Metrics: pulls /federate from each gateway's Prom via Tailscale (:9090).
## Logs: puller sidecar fetches JSON Lines from gateway MinIO (:9000),
##        writes to shared volume, alloy tails with loki.source.file.
##
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  labels:
    app: monitoring
    component: alloy
data:
  config.alloy: |
    // ===================================================
    // METRICS — pull from all Gateway Proms via /federate
    // ===================================================

    prometheus.scrape "federate_home" {
      targets = [{
        __address__ = "100.113.48.89:9090",
      }]
      metrics_path    = "/federate"
      params          = { "match[]" = ["{__name__=~\".+\"}"] }
      scrape_interval = "60s"
      scrape_timeout  = "25s"
      honor_labels    = true
      forward_to      = [prometheus.remote_write.master.receiver]
    }

    prometheus.scrape "federate_vandc" {
      targets = [{
        __address__ = "100.107.8.117:9090",
      }]
      metrics_path    = "/federate"
      params          = { "match[]" = ["{__name__=~\".+\"}"] }
      scrape_interval = "60s"
      scrape_timeout  = "25s"
      honor_labels    = true
      forward_to      = [prometheus.remote_write.master.receiver]
    }

    prometheus.remote_write "master" {
      endpoint {
        url = "http://prometheus.master.svc.cluster.local:9191/api/v1/write"
      }
    }

    // ===================================================
    // LOGS — tail files written by the puller sidecar
    // Puller fetches from each gateway's MinIO (:9000)
    // and writes JSON Lines to /data/federate/<cluster>/
    // ===================================================

    local.file_match "logs_home" {
      path_targets = [{
        __path__ = "/data/federate/home/*.jsonl",
        cluster  = "home",
      }]
    }

    loki.source.file "logs_home" {
      targets    = local.file_match.logs_home.targets
      forward_to = [loki.process.federate.receiver]
    }

    local.file_match "logs_vandc" {
      path_targets = [{
        __path__ = "/data/federate/vandc/*.jsonl",
        cluster  = "vandc",
      }]
    }

    loki.source.file "logs_vandc" {
      targets    = local.file_match.logs_vandc.targets
      forward_to = [loki.process.federate.receiver]
    }

    // -- Parse federated log lines --
    // Each line: {"stream": {labels}, "ts": "...", "line": "..."}
    loki.process "federate" {
      stage.json {
        expressions = {
          stream_app       = "stream.app",
          stream_component = "stream.component",
          stream_namespace = "stream.namespace",
          stream_cluster   = "stream.cluster",
          stream_node      = "stream.node",
          stream_pod       = "stream.pod",
          stream_container = "stream.container",
          stream_level     = "stream.level",
          stream_consumer  = "stream.consumer",
          original_line    = "line",
        }
      }

      stage.labels {
        values = {
          app       = "stream_app",
          component = "stream_component",
          namespace = "stream_namespace",
          cluster   = "stream_cluster",
          node      = "stream_node",
          pod       = "stream_pod",
          container = "stream_container",
          level     = "stream_level",
          consumer  = "stream_consumer",
        }
      }

      stage.output {
        source = "original_line"
      }

      forward_to = [loki.write.master.receiver]
    }

    loki.write "master" {
      endpoint {
        url = "http://loki.master.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels:
    app: monitoring
    component: alloy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: monitoring
      component: alloy
  template:
    metadata:
      labels:
        app: monitoring
        component: alloy
    spec:
      containers:
        - name: alloy
          image: grafana/alloy:v1.5.1
          args:
            - run
            - /etc/alloy/config.alloy
            - --stability.level=generally-available
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: federate-logs
              mountPath: /data/federate
              readOnly: true
        - name: log-puller
          image: docker.io/library/log-puller:latest
          imagePullPolicy: Never
          args:
            - --registry=/etc/gateway-registry/gateways.yaml
            - --output-dir=/data/federate
            - --interval=60
            - --retention=7200
          volumeMounts:
            - name: federate-logs
              mountPath: /data/federate
            - name: gateway-registry
              mountPath: /etc/gateway-registry
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: federate-logs
          emptyDir: {}
        - name: gateway-registry
          configMap:
            name: gateway-registry
