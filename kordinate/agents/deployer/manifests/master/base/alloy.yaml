##
## Master Alloy — pulls metrics from both cluster gateways.
## Metrics: pulls /federate from each gateway's Prom via Tailscale (:9090).
## Logs: pending — will scrape :3101/federate when Loki federation sidecar is built.
## Writes metrics to Master Prometheus, logs to Master Loki.
##
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  labels:
    app: monitoring
    component: alloy
data:
  config.alloy: |
    // ═══════════════════════════════════════════════
    // METRICS — pull from both Gateway Proms via /federate
    // ═══════════════════════════════════════════════

    prometheus.scrape "federate_home" {
      targets = [{
        __address__ = "100.113.48.89:9090",
      }]
      metrics_path    = "/federate"
      params          = { "match[]" = ["{__name__=~\".+\"}"] }
      scrape_interval = "60s"
      scrape_timeout  = "25s"
      honor_labels    = true
      forward_to      = [prometheus.remote_write.master.receiver]
    }

    prometheus.scrape "federate_vandc" {
      targets = [{
        __address__ = "100.107.8.117:9090",
      }]
      metrics_path    = "/federate"
      params          = { "match[]" = ["{__name__=~\".+\"}"] }
      scrape_interval = "60s"
      scrape_timeout  = "25s"
      honor_labels    = true
      forward_to      = [prometheus.remote_write.master.receiver]
    }

    prometheus.remote_write "master" {
      endpoint {
        url = "http://prometheus.master.svc.cluster.local:9191/api/v1/write"
      }
    }

    // ═══════════════════════════════════════════════
    // LOGS — TODO: replace with :3101/federate scraping
    // when the Loki federation sidecar is built on each gateway.
    // ═══════════════════════════════════════════════

    // ── Shared log processing pipeline ──
    loki.process "pipeline" {
      // Parse JSON structured logs
      stage.json {
        expressions = {
          level    = "level",
          consumer = "consumer",
        }
      }

      stage.labels {
        values = {
          level    = "",
          consumer = "",
        }
      }

      forward_to = [loki.write.master.receiver]
    }

    // Write to Master Loki in master namespace
    loki.write "master" {
      endpoint {
        url = "http://loki.master.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels:
    app: monitoring
    component: alloy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: monitoring
      component: alloy
  template:
    metadata:
      labels:
        app: monitoring
        component: alloy
    spec:
      containers:
        - name: alloy
          image: grafana/alloy:v1.5.1
          args:
            - run
            - /etc/alloy/config.alloy
            - --stability.level=generally-available
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
      volumes:
        - name: config
          configMap:
            name: alloy-config
