##
## Gateway Registry — lists all cluster gateways for master to discover.
## Update gateway-ips.yaml and run generate-config.py to regenerate.
##
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-registry
  labels:
    app: monitoring
    component: master
data:
  gateways.yaml: |
    gateways:
      - name: home
        tailscale_ip: "100.113.48.89"
        ports:
          metrics: 9090
          minio: 9000
      - name: vandc
        tailscale_ip: "100.107.8.117"
        ports:
          metrics: 9090
          minio: 9000
