## Gateway Loki — local log store (30d retention)
## Includes a federation sidecar on :3101 that exposes /federate for master
## Alloy to scrape, replacing the K8s API log tailing approach.
## Receives logs from Alloy via push API.
## Exposed on tailnet via Tailscale for master to federate.
##
## NFS PV/PVC for federation output directory (NFSv4-only server)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gateway-nfs-federate
  labels:
    app: monitoring
    component: loki
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  mountOptions:
    - nfsvers=4
  nfs:
    server: nfs-server.gateway.svc.cluster.local
    path: /federate
    # NOTE: kubelet mounts NFS from the host, which cannot resolve cluster DNS.
    # On vandc, apply with: kubectl get svc -n gateway nfs-server -o jsonpath='{.spec.clusterIP}'
    # and patch the PV server field to the ClusterIP if DNS resolution fails.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-nfs-federate
  labels:
    app: monitoring
    component: loki
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  volumeName: gateway-nfs-federate
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-gateway-data
  labels:
    app: monitoring
    component: loki
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  labels:
    app: monitoring
    component: loki
data:
  loki.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /data/loki
      storage:
        filesystem:
          chunks_directory: /data/loki/chunks
          rules_directory: /data/loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
      - from: 2020-10-24
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
    limits_config:
      retention_period: 720h
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
    compactor:
      working_directory: /data/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    app: monitoring
    component: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: monitoring
      component: loki
  template:
    metadata:
      labels:
        app: monitoring
        component: loki
    spec:
      securityContext:
        runAsUser: 0
      containers:
        - name: loki
          image: grafana/loki:3.0.0
          args:
            - -config.file=/etc/loki/loki.yml
          ports:
            - containerPort: 3100
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki
            - name: loki-data
              mountPath: /data/loki
        - name: federate
          image: 10.95.43.66:5000/loki-federate:latest
          args:
            - --port=3101
            - --window=90
            - --output-dir=/data/federate
          ports:
            - containerPort: 3101
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 128Mi
          volumeMounts:
            - name: gateway-nfs
              mountPath: /data/federate
      volumes:
        - name: loki-config
          configMap:
            name: loki-config
        - name: loki-data
          persistentVolumeClaim:
            claimName: loki-gateway-data
        - name: gateway-nfs
          persistentVolumeClaim:
            claimName: gateway-nfs-federate
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    app: monitoring
    component: loki
spec:
  type: ClusterIP
  selector:
    app: monitoring
    component: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
    - name: federate
      port: 3101
      targetPort: 3101
