##
## Grafana datasources — provisioned via ConfigMap
## URLs point to standalone services in the master namespace.
##
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app: monitoring
    component: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus.master.svc.cluster.local:9191
        access: proxy
        isDefault: true
        editable: false
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.master.svc.cluster.local:3100
        access: proxy
        editable: false
