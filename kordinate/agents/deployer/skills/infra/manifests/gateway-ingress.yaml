##
## Ingress — Cloudflare tunnel + Caddy reverse proxy (sidecar pattern)
##
## cloudflared forwards tunnel traffic to Caddy on localhost:80,
## Caddy routes by hostname to backend services.
##
## Tunnel ingress is configured remotely on the Cloudflare dashboard
## (catch-all to http://localhost:80). Caddy handles host-based routing.
##
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-tunnel
  labels:
    app: monitoring
    component: ingress
stringData:
  TUNNEL_TOKEN: MUST_BE_SET
##
## Caddyfile ConfigMap: generated in overlay (profile/overlays/<cluster>/gateway/).
## The Deployment mounts it but this base does not define it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress
  labels:
    app: monitoring
    component: ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring
      component: ingress
  template:
    metadata:
      labels:
        app: monitoring
        component: ingress
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel
                  key: TUNNEL_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
        - name: caddy
          image: caddy:2-alpine
          command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--watch"]
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
      volumes:
        - name: caddyfile
          configMap:
            name: ingress-caddyfile
