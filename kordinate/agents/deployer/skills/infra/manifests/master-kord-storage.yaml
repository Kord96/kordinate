##
## Kord — persistent system volume for the kordinate platform.
## RWX so multiple pods (workstation, future agents) can mount it.
##
## Layout:
##   /kord/pass/        — password store (GPG-encrypted credentials)
##   /kord/ssh/         — SSH keys (user + host)
##   /kord/kordinate/   — kordinate runtime (~/.kord)
##   /kord/projects/    — cloned repos (each may have <repo>/.kord)
##
## Initialized by a one-shot Job that creates the directory structure
## and an empty git repo for the kordinate runtime.
##
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kord
  labels:
    app: kord
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: STORAGE_CLASS
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kord-init
  labels:
    app: kord
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: init
          image: alpine/git
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /kord/pass /kord/ssh /kord/projects

              if [ -d /kord/kordinate/.git ]; then
                echo "kordinate runtime already initialized, skipping"
              else
                git init /kord/kordinate
                cd /kord/kordinate
                git commit --allow-empty -m "init kord runtime"
                mkdir -p .worktrees .locks
                echo "kordinate runtime initialized"
              fi

              chmod 700 /kord/pass /kord/ssh
              echo "kord volume ready"
          volumeMounts:
            - name: kord
              mountPath: /kord
      volumes:
        - name: kord
          persistentVolumeClaim:
            claimName: kord
