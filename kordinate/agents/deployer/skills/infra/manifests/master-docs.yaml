##
## Docs — Astro Starlight documentation site at docs.khaledkord.com.
## Runs astro dev server with hot reload on port 4321.
## Source is mounted from the kord PVC so edits are reflected instantly.
## Caddy in the workstation pod reverse-proxies docs.khaledkord.com to this service.
##
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  labels:
    app: docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docs
  template:
    metadata:
      labels:
        app: docs
    spec:
      containers:
        - name: docs
          image: REGISTRY/docs:latest
          ports:
            - containerPort: 4321
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: kord
              mountPath: /app/src/content/docs
              subPath: projects/docs/src/content/docs
      volumes:
        - name: kord
          persistentVolumeClaim:
            claimName: kord
---
apiVersion: v1
kind: Service
metadata:
  name: docs
  labels:
    app: docs
spec:
  selector:
    app: docs
  ports:
    - port: 80
      targetPort: 4321
      name: http
