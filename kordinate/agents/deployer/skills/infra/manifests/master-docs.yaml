##
## Docs — Astro Starlight documentation site at docs.khaledkord.com.
## Two deployments: prod (stable snapshot) and dev (main branch, hot reload).
## Caddy reverse-proxies: / → prod, /dev/ → dev.
## Both share the kord PVC but use separate worktrees.
##
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  labels:
    app: docs
    tier: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docs
      tier: prod
  template:
    metadata:
      labels:
        app: docs
        tier: prod
    spec:
      containers:
        - name: docs
          image: REGISTRY/docs:latest
          ports:
            - containerPort: 4321
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 10
            periodSeconds: 10
          workingDir: /kord/projects/docs-prod
          volumeMounts:
            - name: kord
              mountPath: /kord

      volumes:
        - name: kord
          persistentVolumeClaim:
            claimName: kord
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-dev
  labels:
    app: docs
    tier: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docs
      tier: dev
  template:
    metadata:
      labels:
        app: docs
        tier: dev
    spec:
      containers:
        - name: docs
          image: REGISTRY/docs:latest
          ports:
            - containerPort: 4321
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 10
            periodSeconds: 10
          workingDir: /kord/projects/docs
          volumeMounts:
            - name: kord
              mountPath: /kord

      volumes:
        - name: kord
          persistentVolumeClaim:
            claimName: kord
---
apiVersion: v1
kind: Service
metadata:
  name: docs
  labels:
    app: docs
    tier: prod
spec:
  selector:
    app: docs
    tier: prod
  ports:
    - port: 80
      targetPort: 4321
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: docs-dev
  labels:
    app: docs
    tier: dev
spec:
  selector:
    app: docs
    tier: dev
  ports:
    - port: 80
      targetPort: 4321
      name: http
