##
## Grafana — master visualization + image renderer
##
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  labels:
    app: monitoring
    component: grafana
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: STORAGE_CLASS
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: monitoring
    component: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: monitoring
      component: grafana
  template:
    metadata:
      labels:
        app: monitoring
        component: grafana
    spec:
      serviceAccountName: default
      initContainers:
        - name: fix-grafana-perms
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 472:472 /var/lib/grafana"]
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
          securityContext:
            runAsUser: 0
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_INSTALL_PLUGINS
              value: "influxdata-flightsql-datasource"
            - name: GF_RENDERING_SERVER_URL
              value: "http://localhost:8081/render"
            - name: GF_RENDERING_CALLBACK_URL
              value: "http://localhost:3000/"
            - name: GF_LOG_FILTERS
              value: "rendering:debug"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: db-general
              mountPath: /dashboards/general
            - name: db-business
              mountPath: /dashboards/logbd
            - name: db-drill
              mountPath: /dashboards/logbd/Drill
        - name: datasource-reloader
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              HASH=$(md5sum /etc/grafana/provisioning/datasources/datasources.yaml | cut -d' ' -f1)
              while true; do
                sleep 30
                NEW=$(md5sum /etc/grafana/provisioning/datasources/datasources.yaml | cut -d' ' -f1)
                if [ "$NEW" != "$HASH" ]; then
                  wget -q --post-data='' -O- http://localhost:3000/api/admin/provisioning/datasources/reload 2>/dev/null && echo "Datasources reloaded" || echo "Reload failed"
                  HASH=$NEW
                fi
              done
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
        - name: grafana-renderer
          image: grafana/grafana-image-renderer:latest
          ports:
            - containerPort: 8081
          env:
            - name: ENABLE_METRICS
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: grafana-provisioning
          configMap:
            name: grafana-provisioning
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: db-general
          configMap:
            name: grafana-db-general
            optional: true
        - name: db-business
          configMap:
            name: grafana-db-business
            optional: true
        - name: db-drill
          configMap:
            name: grafana-db-drill
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: monitoring
    component: grafana
spec:
  type: ClusterIP
  selector:
    app: monitoring
    component: grafana
  ports:
    - port: 3000
      targetPort: 3000
