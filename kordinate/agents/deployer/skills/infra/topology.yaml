# What goes where — maps manifests to namespaces
# Read by /infra subcommands to know which manifests apply where
#
# Shared bases (prometheus.yaml, loki.yaml) are used by both monitor and master.
# Overlays customize per namespace (ports, retention, storage, sidecars).

gateway:
  - gateway-pod.yaml
  - gateway-minio.yaml
  - gateway-ingress.yaml

master:
  - master-kord-storage.yaml
  - master-workstation.yaml          # Caddyfile ConfigMap generated in overlay
  - prometheus.yaml                  # base — overlay sets: port=9191, retention=30d, PVC
  - loki.yaml                       # base — overlay sets: PVC name
  - master-grafana.yaml
  - master-alloy.yaml               # Deployment only — ConfigMap generated in overlay
  # Generated in overlay: workstation-caddyfile, grafana-datasources, alloy-config, gateway-registry

monitor:
  - prometheus.yaml            # base — overlay sets: port=9090, retention=7d, emptyDir
  - loki.yaml                  # base — overlay adds federation sidecar
  - monitor-alloy.yaml
  - monitor-alloy-config.yaml
  - monitor-node-exporter.yaml
  - monitor-kube-state-metrics.yaml

shared:
  - namespaces.yaml
  - agent-rbac.yaml
  - agent-scaler-rbac.yaml

images:
  - workstation
  - log-puller
  - loki-federate
