routes:
  - name: get_dashboard_catalog
    method: GET
    description: Available dashboards, metrics, and alert rules — names, types, conditions, scrape targets
    guidelines: |
      Return the catalog of configured dashboards, scraped metrics, and active alert rules.
      Draw from sauron memory and deployer infra manifests. Keep under 50 lines.
    cache:
      max_age: 5d
      inputs:
        - agents/sauron/memory/
        - agents/deployer/skills/infra/manifests/
      threshold: 0.05
      stale_threshold: 0.25

  - name: assess_monitoring_impact
    method: GET
    description: Monitoring impact assessment for infrastructure changes — gaps by severity, missing dashboards, metrics, alerts
    guidelines: |
      Assess monitoring coverage for the affected service.
      Report gaps, not what's already working. Keep under 50 lines.
    cache:
      max_age: 7d
      inputs:
        - agents/sauron/memory/
      threshold: 0.05
      stale_threshold: 0.30
