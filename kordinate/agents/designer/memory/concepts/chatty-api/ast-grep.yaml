# Score 2: Chatty API is a runtime behavioral anti-pattern -- "too many sequential API
# calls for a single user action" -- that cannot be detected from code structure alone.
#
# Detection requires understanding:
#   - How many HTTP requests are made per user action (runtime/network analysis)
#   - Whether sequential calls could be batched (API design knowledge)
#   - Whether the calls are to the same service or different services (context)
#
# While you could try to match "multiple fetch() calls in the same function," this
# would produce enormous false positive rates. Sequential API calls are normal in
# orchestration code, BFF layers, and backend service composition. The anti-pattern
# is specifically about CLIENT-side code making too many calls to assemble a single
# view -- a semantic distinction invisible in AST structure.
#
# This anti-pattern is best detected by:
#   - Network tab analysis (Chrome DevTools, HAR files)
#   - API gateway request logs correlated by user session
#   - Frontend performance monitoring tools (Lighthouse, WebPageTest)
