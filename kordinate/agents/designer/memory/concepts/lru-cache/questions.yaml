questions:
  - q: "Is there a bounded cache with explicit maxsize or capacity limiting the number of entries?"
    weight: 3
    signals: ["maxsize parameter", "capacity limit", "LRUCache with bound"]
  - q: "Does the cache evict the least-recently-used entry when it reaches capacity?"
    weight: 3
    signals: ["LRU eviction", "evict oldest accessed", "linked list + hash map"]
  - q: "Are cache hit/miss rates tracked via metrics or cache_info()?"
    weight: 2
    signals: ["cache_info()", "hit rate metric", "cache miss counter"]
  - q: "Is there a cache invalidation strategy such as TTL, explicit invalidation, or versioned keys?"
    weight: 1
    signals: ["TTL on cache entries", "explicit invalidation", "versioned cache key"]
threshold: 6
