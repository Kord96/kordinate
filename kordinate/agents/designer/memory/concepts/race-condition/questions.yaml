    weight: 3
    signals: ["count = count + 1 without lock", "concurrent map access without mutex", "global variable modified from multiple goroutines"]
  - q: "Are there check-then-act sequences on shared resources without atomicity guarantees?"
    weight: 3
    signals: ["if not exists then create without lock", "check-then-act without compare-and-swap", "uniqueness check followed by insert without transaction"]
  - q: "Are read-modify-write operations performed without atomic operations or locking?"
    weight: 2
    signals: ["increment without atomic", "append to shared list without lock", "update dict entry without synchronization"]
  - q: "Do tests pass locally but fail intermittently under parallel CI execution?"
    weight: 1
    signals: ["flaky test under concurrency", "heisenbug disappears under debugger", "non-deterministic test failures"]
threshold: 6
