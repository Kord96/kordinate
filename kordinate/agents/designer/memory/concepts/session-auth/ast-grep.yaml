id: session-express-session-ts
language: TypeScript
rule:
  pattern: 'session($$$OPTS)'
---
id: session-express-use-ts
language: TypeScript
rule:
  pattern: '$APP.use(session($$$OPTS))'
---
id: session-req-session-ts
language: TypeScript
rule:
  pattern: '$REQ.session.$PROP'
---
id: session-django-middleware-py
language: Python
rule:
  pattern: 'request.session[$KEY]'
---
id: session-flask-session-py
language: Python
rule:
  pattern: 'session[$KEY] = $VALUE'
---
id: session-flask-session-read-py
language: Python
rule:
  pattern: 'session.get($KEY, $$$DEFAULT)'
