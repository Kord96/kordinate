questions:
  - q: "Are there functions in a composable pipeline that process requests and call next() to forward to the next handler, distinct from framework lifecycle hooks like before_request/after_request?"
    weight: 3
    signals: ["app.use(fn)", "(req, res, next) signature", "async (ctx, next) pattern", "explicit middleware class or pipeline registration", "NOT before_request/after_request hooks alone"]
  - q: "Does each middleware handle a single cross-cutting concern such as auth, logging, or rate limiting?"
    weight: 2
    signals: ["auth middleware separate from logging", "single responsibility per middleware", "error handler at end"]
  - q: "Is middleware execution order intentional, with documentation or tests for ordering dependencies?"
    weight: 2
    signals: ["middleware registered in sequence", "auth before route handlers", "error handling last"]
  - q: "Do middleware functions either call next() or explicitly terminate the response, never silently dropping?"
    weight: 3
    signals: ["next() always called", "response terminated on auth failure", "no silent drops"]
threshold: 6
