questions:
  - q: "Do error boundary components wrap subtrees to catch rendering errors and display fallback UI?"
    weight: 3
    signals: ["ErrorBoundary with componentDidCatch or getDerivedStateFromError", "react-error-boundary with fallbackRender"]
  - q: "Are error boundaries placed at meaningful subtree boundaries, not just the application root?"
    weight: 2
    signals: ["per-route or per-feature error boundaries", "nested boundaries for granular degradation"]
  - q: "Do caught errors get reported to an error tracking service?"
    weight: 2
    signals: ["Sentry.captureException in error boundary", "error reporting call in componentDidCatch"]
  - q: "Does the fallback UI offer a recovery action like retry or navigation?"
    weight: 1
    signals: ["resetErrorBoundary or retry button in fallback", "fallback with link to navigate away"]
  - q: "Are async errors from data fetching handled in addition to synchronous render errors?"
    weight: 1
    signals: ["Suspense with error boundary for async errors", "promise rejection handling in boundary"]
threshold: 6
