# Score 3: Missing log context is fundamentally about ABSENCE of structured fields.
# ast-grep can match the positive shape -- bare string-only log calls with no
# structured arguments -- which is a useful approximation of the smell.

id: missing-log-context-bare-error-py
language: Python
rule:
  pattern: logger.error($MSG)
  constraints:
    MSG:
      regex: '^".*"$|^''.*''$|^f".*"$|^f''.*''$'
---
id: missing-log-context-bare-warning-py
language: Python
rule:
  pattern: logger.warning($MSG)
  constraints:
    MSG:
      regex: '^".*"$|^''.*''$|^f".*"$|^f''.*''$'
---
id: missing-log-context-bare-info-py
language: Python
rule:
  pattern: logger.info($MSG)
  constraints:
    MSG:
      regex: '^".*"$|^''.*''$|^f".*"$|^f''.*''$'
---
id: missing-log-context-bare-console-error-ts
language: TypeScript
rule:
  pattern: console.error($MSG)
  constraints:
    MSG:
      regex: '^".*"$|^''.*''$|^`.*`$'
---
id: missing-log-context-bare-console-warn-ts
language: TypeScript
rule:
  pattern: console.warn($MSG)
  constraints:
    MSG:
      regex: '^".*"$|^''.*''$|^`.*`$'
