id: webhook-hmac-verify-py
language: Python
rule:
  pattern: 'hmac.compare_digest($$$ARGS)'
---
id: webhook-hmac-new-py
language: Python
rule:
  pattern: 'hmac.new($$$ARGS)'
---
id: webhook-createHmac-ts
language: TypeScript
rule:
  pattern: 'crypto.createHmac($ALG, $SECRET)'
---
id: webhook-verify-signature-ts
language: TypeScript
rule:
  pattern: 'crypto.timingSafeEqual($$$ARGS)'
