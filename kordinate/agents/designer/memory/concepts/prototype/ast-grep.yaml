id: prototype-clone-method-py
language: Python
rule:
  pattern: |
    def clone(self, $$$ARGS):
        $$$BODY
---
id: prototype-deepcopy-py
language: Python
rule:
  pattern: copy.deepcopy($OBJ)
---
id: prototype-copy-py
language: Python
rule:
  pattern: copy.copy($OBJ)
---
id: prototype-object-create-ts
language: TypeScript
rule:
  pattern: Object.create($PROTO)
---
# Removed: `{ ...$OBJ }` -- too generic, matches ALL spread expressions.
# Spread is a general JS idiom, not specifically a prototype/clone pattern.
# Object.create and Object.assign are more specific indicators.
id: prototype-structuredClone-ts
language: TypeScript
rule:
  pattern: 'structuredClone($OBJ)'
---
id: prototype-object-assign-ts
language: TypeScript
rule:
  pattern: Object.assign({}, $$$SOURCES)
