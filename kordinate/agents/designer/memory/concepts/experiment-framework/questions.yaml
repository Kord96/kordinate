questions:
  - q: "Does the system assign users to experiment variants using deterministic bucketing?"
    weight: 3
    signals: ["assign_variant() or get_variant() with hash-based bucketing", "consistent variant assignment per user across sessions"]
  - q: "Are per-variant metrics tracked separately for statistical comparison?"
    weight: 3
    signals: ["track_metric() calls partitioned by variant", "metric collection per control and treatment groups"]
  - q: "Is experiment configuration (variants, traffic allocation, targeting) defined separately from application code?"
    weight: 2
    signals: ["experiment config in external service or config file", "traffic percentage and variant definitions outside code"]
  - q: "Do experiments have planned start/end criteria and a cleanup process?"
    weight: 1
    signals: ["experiment end date or significance threshold defined", "cleanup task to remove concluded experiment code"]
threshold: 6
