id: timeout-param-py
language: Python
rule:
  pattern: requests.$METHOD($$$ARGS, timeout=$TIMEOUT, $$$REST)
---
id: timeout-missing-py
language: Python
rule:
  pattern: requests.$METHOD($URL)
  not:
    has:
      pattern: timeout=$TIMEOUT
---
id: timeout-asyncio-wait-for-py
language: Python
rule:
  pattern: asyncio.wait_for($CORO, timeout=$TIMEOUT)
---
id: timeout-socket-py
language: Python
rule:
  pattern: $SOCK.settimeout($TIMEOUT)
---
id: timeout-context-go-py
language: Python
rule:
  pattern: aiohttp.ClientTimeout($$$ARGS)
---
id: timeout-abort-controller-ts
language: TypeScript
rule:
  pattern: new AbortController()
---
id: timeout-fetch-signal-ts
language: TypeScript
rule:
  pattern: fetch($URL, { $$$OPTS, signal: $SIGNAL, $$$REST })
---
id: timeout-settimeout-ts
language: TypeScript
rule:
  pattern: setTimeout($$$ARGS)
  inside:
    pattern: |
      const $CONTROLLER = new AbortController();
      $$$BODY
