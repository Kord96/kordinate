questions:
  - q: "Are there two or more code blocks of 10+ lines that are textually identical or differ only in variable names?"
    weight: 3
    signals: ["duplicated code blocks", "textually identical functions", "clone pair across files"]
  - q: "Does the same business rule, validation regex, or transformation logic appear in 3 or more locations?"
    weight: 3
    signals: ["repeated validation logic", "duplicated regex across modules", "same rule in multiple places"]
  - q: "Are there comments like 'copied from' or 'TODO: deduplicate' indicating known duplication?"
    weight: 2
    signals: ["copied-from comment", "deduplicate TODO", "acknowledged duplication"]
  - q: "Does fixing a bug in one location leave the same bug unfixed in duplicated code elsewhere?"
    weight: 1
    signals: ["diverged copies", "fix applied to one clone only", "inconsistent duplicated behavior"]
threshold: 6
