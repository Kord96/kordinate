id: read-through-loading-cache-py
language: Python
rule:
  pattern: |
    def load(self, $KEY):
        $$$BODY
---
id: read-through-cacheable-py
language: Python
rule:
  pattern: |
    @cached(ttl=$TTL)
    def $FUNC($$$ARGS):
        $$$BODY
---
id: read-through-cache-loader-py
language: Python
rule:
  pattern: '$CACHE = $BUILDER.build(loader=$LOADER)'
---
id: read-through-cacheable-decorator-ts
language: TypeScript
rule:
  pattern: |
    @Cacheable($$$ARGS)
    $METHOD($$$PARAMS) {
        $$$BODY
    }
---
id: read-through-loading-cache-ts
language: TypeScript
rule:
  pattern: |
    async load($KEY) {
        $$$BODY
    }
