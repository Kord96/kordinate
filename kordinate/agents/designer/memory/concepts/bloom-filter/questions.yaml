    weight: 2
    signals: ["secondary verification after positive", "bloom check then DB lookup", "two-stage membership"]
  - q: "Is there a configurable false positive rate parameter that determines the filter's size and hash count?"
    weight: 2
    signals: ["error_rate parameter", "configurable false positive rate", "sizing based on expected elements"]
