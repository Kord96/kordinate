questions:
  - q: "Does the system extract tenant identity from subdomains, headers, or JWT claims and use it to route requests to tenant-specific backends or shards?"
    weight: 3
    signals: ["subdomain tenant extraction", "X-Tenant-ID header routing", "shard router by tenant"]
  - q: "Are there tenant-specific connection pools or database connections selected based on tenant identity?"
    weight: 3
    signals: ["ConnectionPool.for_tenant", "pool registry keyed by tenant", "tenant-specific connection strings"]
  - q: "Does tenant resolution happen at the edge layer (gateway, load balancer, first middleware) before business logic executes?"
    weight: 2
    signals: ["gateway tenant extraction", "routing before business logic", "edge-level tenant resolution"]
  - q: "Is there a shard map or tenant configuration lookup that maps tenant IDs to specific backends or database instances?"
    weight: 2
    signals: ["ShardRouter.route", "consistent hashing by tenant", "TenantConfig.get mapping"]
threshold: 6
