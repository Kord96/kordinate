id: cache-aside-get-or-fetch-py
language: Python
rule:
  pattern: |
    $VALUE = $CACHE.get($KEY)
    if $VALUE is None:
        $$$BODY
---
id: cache-aside-set-with-ttl-py
language: Python
rule:
  pattern: $CACHE.set($KEY, $VALUE, ttl=$TTL)
---
id: cache-aside-setex-py
language: Python
rule:
  pattern: $CACHE.setex($KEY, $TTL, $VALUE)
---
id: cache-aside-decorator-py
language: Python
rule:
  pattern: |
    @cached(ttl=$TTL)
    def $FUNC($$$ARGS):
        $$$BODY
---
id: cache-aside-get-or-fetch-ts
language: TypeScript
rule:
  pattern: |
    const $VALUE = await $CACHE.get($KEY);
    if (!$VALUE) {
        $$$BODY
    }
---
id: cache-aside-set-with-ttl-ts
language: TypeScript
rule:
  pattern: "await $CACHE.set($KEY, $VALUE, { ttl: $TTL })"
---
id: cache-aside-invalidate-ts
language: TypeScript
rule:
  pattern: await $CACHE.del($KEY)
