questions:
  - q: "Do objects expose save/restore state methods that capture and reinstate internal state?"
    weight: 3
    signals: ["save_state() / restore_state()", "createMemento() / setMemento()", "state snapshot and restore"]
  - q: "Is there a caretaker managing a stack or list of opaque state snapshots for undo/redo?"
    weight: 3
    signals: ["undo_stack", "redo_stack", "caretaker holding memento history"]
  - q: "Are state snapshots opaque to the caretaker, preventing it from reading or modifying internal state?"
    weight: 2
    signals: ["caretaker stores but does not inspect", "opaque memento object", "encapsulated state copy"]
  - q: "Is memory usage bounded by limiting history depth or using incremental snapshots?"
    weight: 2
    signals: ["max history size", "incremental snapshot", "compressed state delta"]
threshold: 6
