questions:
  - q: "Does the codebase contain abstract base classes with a concrete method that calls multiple abstract or hook methods in a fixed sequence?"
    weight: 3
    signals: ["abstract class with final/concrete orchestrating method", "hook methods called in sequence", "subclasses override steps not algorithm"]
  - q: "Do subclasses override specific step methods while the overall algorithm structure remains in the base class?"
    weight: 3
    signals: ["_do_step or _on_before or _process overrides", "base class algorithm unchanged", "partial override of hooks"]
  - q: "Are hook methods named with underscore-prefixed conventions like _validate, _process, _on_before, _on_after?"
    weight: 1
    signals: ["_hook naming convention", "_do_step or _on_after methods", "protected method naming"]
  - q: "Is the template method itself protected from being overridden (final, non-virtual, or documented as do-not-override)?"
    weight: 2
    signals: ["final method annotation", "non-overridable orchestrating method", "algorithm skeleton is fixed"]
threshold: 6
