questions:
  - q: "Are application images built with all dependencies baked in and tagged with specific versions or commit SHAs?"
    weight: 3
    signals: ["image tag = commit SHA", "pinned version tag", "no latest tag"]
  - q: "Does the deployment strategy replace instances with new images rather than patching running ones?"
    weight: 3
    signals: ["rolling replacement", "terminate old launch new", "no in-place update"]
  - q: "Is there no SSH access or remote exec capability for modifying production instances after creation?"
    weight: 2
    signals: ["no SSH to production", "no kubectl exec in prod", "no remote shell access"]
  - q: "Is configuration injected at startup via environment variables rather than baked into the image?"
    weight: 1
    signals: ["env vars at startup", "mounted config", "config not in image"]
threshold: 6
