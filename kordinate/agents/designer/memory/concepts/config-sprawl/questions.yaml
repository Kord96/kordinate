questions:
  - q: "Is the same logical configuration setting defined in 3 or more distinct sources with no clear precedence order?"
    weight: 3
    signals: ["duplicate config across sources", "same key in env and file and code", "no single source of truth"]
  - q: "Does startup code pull configuration from multiple unrelated sources with ad-hoc precedence logic?"
    weight: 2
    signals: ["scattered config loading", "multiple config sources without unified loader", "ad-hoc override logic"]
  - q: "Can a configuration key be mistyped and silently fall back to a default instead of failing?"
    weight: 2
    signals: ["no config schema validation", "silent fallback on typo", "unvalidated config keys"]
  - q: "Does changing a config value in one place have no effect because another source overrides it?"
    weight: 2
    signals: ["shadowed config setting", "ineffective config change", "override from unknown source"]
threshold: 6
