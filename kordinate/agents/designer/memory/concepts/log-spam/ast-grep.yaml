# Score 3: Log spam requires detecting log calls INSIDE loops, which is a
# structural nesting relationship. ast-grep's `has` + `inside` can match this.

id: log-spam-info-in-for-py
language: Python
rule:
  inside:
    pattern: |
      for $VAR in $ITER:
          $$$BODY
  pattern: logger.info($$$ARGS)
---
id: log-spam-debug-in-for-py
language: Python
rule:
  inside:
    pattern: |
      for $VAR in $ITER:
          $$$BODY
  pattern: logger.debug($$$ARGS)
---
id: log-spam-info-in-while-py
language: Python
rule:
  inside:
    pattern: |
      while $COND:
          $$$BODY
  pattern: logger.info($$$ARGS)
---
id: log-spam-debug-in-while-py
language: Python
rule:
  inside:
    pattern: |
      while $COND:
          $$$BODY
  pattern: logger.debug($$$ARGS)
---
id: log-spam-console-in-for-ts
language: TypeScript
rule:
  inside:
    pattern: |
      for ($$$INIT) {
          $$$BODY
      }
  pattern: console.log($$$ARGS)
---
id: log-spam-console-in-foreach-ts
language: TypeScript
rule:
  inside:
    pattern: $ARR.forEach(($$$PARAMS) => { $$$BODY })
  pattern: console.log($$$ARGS)
---
id: log-spam-logger-in-for-ts
language: TypeScript
rule:
  inside:
    pattern: |
      for ($$$INIT) {
          $$$BODY
      }
  pattern: $LOGGER.info($$$ARGS)
