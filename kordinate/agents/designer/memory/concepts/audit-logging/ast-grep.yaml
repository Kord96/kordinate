id: audit-log-model-py
language: Python
rule:
  pattern: |
    class $NAME($$$BASES):
        $$$BODY
  constraints:
    NAME:
      regex: '.*Audit(Log|Trail|Entry|Record).*'
---
id: audit-log-decorator-py
language: Python
rule:
  pattern: |
    @audited
    def $FN($$$ARGS):
        $$$BODY
---
id: audit-log-decorator-alt-py
language: Python
rule:
  pattern: |
    @audit_log
    def $FN($$$ARGS):
        $$$BODY
---
id: audit-log-model-ts
language: TypeScript
rule:
  pattern: |
    class $NAME {
        $$$BODY
    }
  constraints:
    NAME:
      regex: '.*Audit(Log|Trail|Entry|Record).*'
---
id: audit-log-interface-ts
language: TypeScript
rule:
  pattern: |
    interface $NAME {
        $$$BODY
    }
  constraints:
    NAME:
      regex: '.*Audit(Log|Trail|Entry|Record).*'
