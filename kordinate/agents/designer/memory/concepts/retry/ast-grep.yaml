id: retry-tenacity-decorator-py
language: Python
rule:
  pattern: |
    @retry($$$ARGS)
    def $NAME($$$PARAMS):
        $$$BODY
---
id: retry-backoff-decorator-py
language: Python
rule:
  pattern: |
    @backoff.on_exception($$$ARGS)
    def $NAME($$$PARAMS):
        $$$BODY
---
id: retry-tenacity-wait-py
language: Python
rule:
  pattern: 'wait_exponential($$$ARGS)'
---
# Narrowed from generic `retry($FUNC, $$$OPTS)` which matched too many things.
# Now requires explicit retry config options.
id: retry-async-retry-ts
language: TypeScript
rule:
  any:
    - pattern: 'retry($FUNC, { retries: $N, $$$OPTS })'
    - pattern: 'retry($FUNC, { times: $N, $$$OPTS })'
    - pattern: 'retry($FUNC, { maxRetries: $N, $$$OPTS })'
---
id: retry-p-retry-ts
language: TypeScript
rule:
  pattern: 'pRetry($FUNC, $$$OPTS)'
