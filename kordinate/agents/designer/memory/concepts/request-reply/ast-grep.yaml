id: request-reply-nats-py
language: Python
rule:
  pattern: 'await $NC.request($SUBJECT, $PAYLOAD, timeout=$TIMEOUT)'
---
id: request-reply-correlation-id-py
language: Python
rule:
  pattern: '$MSG.correlation_id = $ID'
---
id: request-reply-reply-to-py
language: Python
rule:
  pattern: '$MSG.reply_to = $QUEUE'
---
id: request-reply-nats-ts
language: TypeScript
rule:
  pattern: 'await $NC.request($SUBJECT, $PAYLOAD, { timeout: $TIMEOUT })'
---
id: request-reply-correlation-id-ts
language: TypeScript
rule:
  pattern: 'correlationId: $ID'
---
id: request-reply-reply-to-ts
language: TypeScript
rule:
  pattern: 'replyTo: $QUEUE'
