questions:
  - q: "Are workflows defined as DAGs with explicit step dependencies and decorators like @task, @dag, @workflow, or @step?"
    weight: 3
    signals: ["DAG definition with dependencies", "@task or @workflow decorators", "step dependency graph"]
  - q: "Does the system track workflow execution state (pending, running, completed, failed) with a workflow_id or run_id?"
    weight: 3
    signals: ["workflow state tracking", "workflow_id or run_id", "step status persistence"]
  - q: "Are retry policies and timeouts defined per step rather than only at the global workflow level?"
    weight: 2
    signals: ["per-step retry policy", "step-level timeout config", "individual step failure handling"]
  - q: "Is workflow state persisted so that execution can resume from the point of failure after a crash?"
    weight: 2
    signals: ["persistent workflow state", "resume from failure point", "crash recovery for workflows"]
threshold: 6
