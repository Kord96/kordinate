questions:
  - q: "Is there a two-phase processing pipeline with a Lexer/Scanner producing tokens consumed by a Parser?"
    weight: 3
    signals: ["Lexer class", "Scanner with next_token", "Parser consuming token stream"]
  - q: "Is there a Token type or enum with variants for identifiers, literals, keywords, and operators?"
    weight: 3
    signals: ["Token enum", "TokenKind::Identifier", "token type variants"]
  - q: "Does the parser use peek(), advance(), expect(), or consume() methods to navigate the token stream?"
    weight: 2
    signals: ["peek() method", "advance()", "expect(TokenKind)"]
  - q: "Do tokens carry source location information (line, column) for error reporting?"
    weight: 1
    signals: ["token.line", "token.column", "source location on token"]
threshold: 6
