# Score 3: Deep nesting is about indentation depth, which ast-grep can partially
# match via nested structural patterns. We match the SMELL shape: deeply nested
# if-inside-if-inside-for chains and nested ternaries.

id: deep-nesting-if-if-if-if-py
language: Python
rule:
  pattern: |
    if $C1:
        $$$B1
        if $C2:
            $$$B2
            if $C3:
                $$$B3
                if $C4:
                    $$$B4
---
id: deep-nesting-for-if-for-if-py
language: Python
rule:
  pattern: |
    for $V1 in $I1:
        $$$B1
        if $C1:
            $$$B2
            for $V2 in $I2:
                $$$B3
                if $C2:
                    $$$B4
---
id: deep-nesting-if-if-if-if-ts
language: TypeScript
rule:
  pattern: |
    if ($C1) {
        $$$B1
        if ($C2) {
            $$$B2
            if ($C3) {
                $$$B3
                if ($C4) {
                    $$$B4
                }
            }
        }
    }
---
id: deep-nesting-nested-ternary-ts
language: TypeScript
rule:
  pattern: $A ? $B ? $C : $D : $E ? $F : $G
---
id: deep-nesting-for-for-for-ts
language: TypeScript
rule:
  pattern: |
    for ($$$I1) {
        $$$B1
        for ($$$I2) {
            $$$B2
            for ($$$I3) {
                $$$B3
            }
        }
    }
