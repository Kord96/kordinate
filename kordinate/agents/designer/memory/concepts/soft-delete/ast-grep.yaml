id: soft-delete-deleted-at-filter-py
language: Python
rule:
  pattern: .filter(deleted_at=None)
---
id: soft-delete-set-timestamp-py
language: Python
rule:
  pattern: $OBJ.deleted_at = $TIMESTAMP
---
id: soft-delete-restore-py
language: Python
rule:
  pattern: |
    def restore(self):
        $$$BODY
---
id: soft-delete-paranoid-ts
language: TypeScript
rule:
  pattern: "paranoid: true"
---
id: soft-delete-where-null-ts
language: TypeScript
rule:
  pattern: "deletedAt: null"
---
id: soft-delete-restore-ts
language: TypeScript
rule:
  pattern: '$OBJ.restore($$$ARGS)'
