questions:
  - q: "Are there subscribe/on/addListener methods paired with emit/notify/publish for event-driven communication?"
    weight: 3
    signals: ["emitter.on('event', handler)", "subscribe() / emit()", "addListener / dispatch"]
  - q: "Are subscriptions cleaned up on teardown to prevent memory leaks from ghost handlers?"
    weight: 3
    signals: ["removeEventListener in cleanup", "unsubscribe on destroy", "off() in componentWillUnmount"]
  - q: "Do event contracts define typed events rather than relying on arbitrary untyped string keys?"
    weight: 2
    signals: ["typed event classes", "event enum", "no stringly-typed event names"]
  - q: "Does an error in one observer prevent notification of remaining observers?"
    weight: 2
    signals: ["try-catch per observer", "error isolation in notification loop", "one handler failure does not block others"]
threshold: 6
