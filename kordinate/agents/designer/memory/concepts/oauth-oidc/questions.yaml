questions:
  - q: "Is there an authorization code flow with /authorize, /token, and /callback endpoints?"
    weight: 3
    signals: ["/authorize endpoint", "/token endpoint", "/callback redirect_uri"]
  - q: "Are access tokens validated by checking signature, expiry, issuer, and audience claims?"
    weight: 3
    signals: ["JWT signature verification", "exp claim check", "issuer and audience validation"]
  - q: "Are client credentials (client_id, client_secret) stored securely outside source code?"
    weight: 2
    signals: ["client_secret from env var", "secret in vault", "no hardcoded client_secret"]
  - q: "Is PKCE used for public clients that cannot securely store a client secret?"
    weight: 2
    signals: ["code_verifier", "code_challenge", "PKCE for SPA or mobile"]
threshold: 6
