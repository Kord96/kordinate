questions:
  - q: "Does the server hold HTTP requests open until new data is available or a timeout expires?"
    weight: 3
    signals: ["hold request until data", "server-side timeout on response", "wait for event then respond"]
  - q: "Does the client immediately re-request after receiving a response or timeout from the server?"
    weight: 3
    signals: ["immediate re-request", "reconnect on timeout", "polling loop with instant retry"]
  - q: "Is there error handling with backoff to prevent flooding the server during outages?"
    weight: 2
    signals: ["backoff on error", "exponential retry delay", "error backoff in poll loop"]
  - q: "Does the response include a version token or cursor so the client requests only new data?"
    weight: 1
    signals: ["ETag header", "cursor in response", "version token for next poll"]
threshold: 6
