# Score 2: Long Polling is a communication protocol pattern defined by runtime behavior
# (server holds request open until data or timeout), not code structure.
#
# The structural hints are:
#   - Polling loops with setTimeout/setInterval (but these are used for many non-polling purposes)
#   - Server-side timeout parameters on request handlers (but timeouts are universal)
#   - Immediate re-request after response (but retry-after-response is a common pattern)
#
# Every individual element is shared with non-polling code. A setTimeout wrapping a
# fetch could be polling, retry logic, periodic health checks, or animation timing.
# The combination that makes it long-polling -- "server holds, client immediately
# re-requests" -- spans client and server code and requires protocol-level understanding.
#
# This pattern is best detected by:
#   - Network analysis showing held connections with immediate re-request
#   - Code review identifying the request-hold-respond-reconnect cycle
#   - Framework-specific patterns (e.g., Django Channels, Socket.IO polling transport)
