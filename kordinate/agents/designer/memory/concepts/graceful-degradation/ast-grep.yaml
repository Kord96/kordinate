# Score 2: Graceful degradation is a system-level resilience strategy, not a code structure.
#
# The defining characteristic -- "system remains usable when a dependency fails" -- is a
# behavioral property visible only at runtime or through integration test coverage. The
# structural hints (try/except returning a default, circuit breaker fallback handlers) are
# indistinguishable from ordinary error handling without semantic understanding of intent.
#
# A try/except block returning a cached value COULD be graceful degradation or just a
# generic fallback. ast-grep cannot distinguish intentional degradation strategy from
# defensive coding. The pattern requires understanding:
#   - Which dependencies are critical vs non-critical (domain knowledge)
#   - Whether fallback responses are intentionally designed (intent)
#   - Whether the system recovers when the dependency returns (runtime behavior)
#
# None of these are detectable from syntax tree structure alone.
