# Score 2: God Object is a metric-based anti-pattern (line count, method count, import
# count) that ast-grep cannot detect because it has no counting or threshold capabilities.
#
# The defining characteristics are all quantitative:
#   - Classes exceeding 1000 lines
#   - Classes with 20+ public methods
#   - Classes importing from 5+ unrelated packages
#   - Instance variables numbering 15+ covering disparate domains
#
# ast-grep matches structural patterns, not metrics. It cannot count the number of
# methods in a class, measure line counts, or evaluate whether imports are "unrelated."
#
# The naming heuristic (classes named *Manager, *Handler, *Utils) is too broad to be
# useful -- these names are common in well-structured code too.
#
# This anti-pattern is best detected by:
#   - Linters with class-size rules (pylint max-statements, eslint max-lines-per-function)
#   - Static analysis tools that measure cyclomatic complexity per class
#   - Code metrics dashboards (SonarQube, CodeClimate)
