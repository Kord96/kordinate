routes:
  - name: scan_secrets
    method: POST
    description: Scan specified files for hardcoded secrets, PII, and exposed configuration before commit
    skill: scan-breaches

  - name: sanitize_content
    method: POST
    description: Classify content as config, credential, or memory — routes to the correct destination
    skill: sanitize

  - name: validate_output
    method: POST
    description: Run a validator script against an output directory with lock-based write enforcement
    skill: validate-output
