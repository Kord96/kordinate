routes:
  - name: get_concepts
    method: GET
    description: Look up a specific architectural pattern or anti-pattern — definition, detection rules, common violations
    skill: detect-concepts
    cache:
      max_age: 14d
      inputs:
        - agents/augur/memory/concepts/
        - agents/augur/memory/anti-patterns/
      threshold: 0.03
      stale_threshold: 0.20

  - name: analyze_architecture
    method: POST
    description: Full project analysis — architecture, patterns, dependencies, API surface, tech debt. Pass project path as first word.
    guidelines: |
      Run a full analysis suite against the target project. The message starts with the project path.

      1. Parse the project path from the first word of the message

      2. Parallel scan — run these three simultaneously (they are independent):
         - /detect-patterns — write patterns.md
         - /map-dependencies — write dependencies.md
         - /review-api — write api-review.md (skip if no HTTP endpoints detected)

      3. Debt assessment — after detect-patterns completes:
         - /assess-debt — write debt-assessment.md (skip if detect-patterns found nothing)

      4. Architecture — after all above complete:
         - /architect — write architecture.yaml (reads all previous outputs)

      5. Synthesize — re-read all 5 outputs together. Check for coherence:
         - Do component boundaries in architecture.yaml reflect what patterns and debt revealed?
         - Do dependency edges match what map-dependencies found?
         - Do failure modes account for the resilience patterns (or lack thereof) detected?
         - Does the architecture.yaml tell a consistent story across all analyses?

         Adjust architecture.yaml if the synthesis reveals inconsistencies.

      6. Write all outputs to <project>/.kord/agents/augur/memory/

      7. Return a manifest listing what was produced and what was skipped with reasons
    cache:
      max_age: 7d
      type: hash

  - name: review_patterns
    method: GET
    description: Architecture review for deployment and monitoring changes — violations by severity, affected files, suggested changes
    guidelines: |
      Review the proposed change against established patterns.
      Include specific file paths and what should change.
      Keep under 50 lines.
    cache:
      max_age: 7d
      inputs:
        - agents/augur/memory/
      threshold: 0.05
      stale_threshold: 0.30
