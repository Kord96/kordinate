questions:
  - q: "Is data partitioned across workers with a parallel map phase followed by a reduce/aggregate phase?"
    weight: 3
    signals: ["Mapper and Reducer classes", "groupByKey followed by reduceByKey", "parallel map then aggregate"]
  - q: "Are map functions stateless and pure, producing the same output for the same input?"
    weight: 2
    signals: ["no cross-record accumulation in map", "deterministic key-value emission"]
  - q: "Is there a shuffle or sort phase between the map and reduce stages?"
    weight: 3
    signals: ["shuffle phase", "intermediate key-value pairs sorted", "partitioner distributing keys"]
  - q: "Does the reduce function operate associatively so partial combines produce correct results?"
    weight: 2
    signals: ["combiner before reducer", "associative aggregation", "reduceByKey with commutative op"]
threshold: 6
