questions:
  - q: "Do services communicate exclusively through events with no central orchestrator coordinating the workflow?"
    weight: 3
    signals: ["event-only communication", "no orchestrator class", "decentralized service coordination"]
  - q: "Does each service consume events from one source and produce events to another, forming a chain?"
    weight: 2
    signals: ["topic-to-topic chaining", "consume-then-publish flow", "event relay between services"]
  - q: "Are event schemas versioned and do events carry correlation IDs for end-to-end traceability?"
    weight: 2
    signals: ["versioned event schema", "correlation ID in events", "traceable event contracts"]
  - q: "Is there an absence of Saga, Orchestrator, or Workflow coordinator classes for multi-service flows?"
    weight: 2
    signals: ["no saga coordinator", "no workflow engine", "no centralized process manager"]
threshold: 6
