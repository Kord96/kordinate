questions:
  - q: "Do services define explicit fallback responses when a dependency is unavailable or slow?"
    weight: 3
    signals: ["fallback response", "return cached value", "return default on timeout"]
  - q: "Are dependencies classified as critical vs non-critical with different failure handling for each?"
    weight: 2
    signals: ["critical dependency list", "non-essential feature disabled", "optional service check"]
  - q: "Is degraded mode observable through logs or metrics that indicate when fallbacks activate?"
    weight: 2
    signals: ["fallback activated metric", "degraded mode log", "staleness indicator in response"]
  - q: "Does the system recover automatically when a failed dependency comes back online?"
    weight: 2
    signals: ["circuit breaker half-open", "health check re-enables", "automatic recovery"]
threshold: 6
