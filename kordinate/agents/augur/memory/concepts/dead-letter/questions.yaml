questions:
  - q: "Are queues or topics configured with a dead-letter destination for messages that exceed retry limits?"
    weight: 3
    signals: ["DLQ or DLX configuration on queue", "RedrivePolicy or x-dead-letter-exchange settings"]
  - q: "Is there a maximum retry count after which messages are moved to the dead-letter queue?"
    weight: 2
    signals: ["max_retries or maxReceiveCount configuration", "retry_count tracked in message headers"]
  - q: "Do dead-lettered messages retain the original payload and failure metadata?"
    weight: 2
    signals: ["failure reason and stack trace stored with DLQ message", "x-death headers or error metadata preserved"]
  - q: "Does a replay or reprocessing mechanism exist for dead-letter queue messages?"
    weight: 2
    signals: ["DLQ consumer or replay endpoint", "redrive or reprocess command for failed messages"]
threshold: 6
