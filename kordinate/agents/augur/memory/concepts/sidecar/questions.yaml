questions:
  - q: "Are multi-container pods defined with a sidecar handling cross-cutting concerns alongside the main application?"
    weight: 3
    signals: ["two containers in same pod spec", "istio-proxy or envoy sidecar container", "fluentd log collector alongside app"]
  - q: "Does the sidecar communicate with the main container via localhost or shared volumes?"
    weight: 3
    signals: ["emptyDir shared volume between containers", "localhost communication between sidecar and app", "no network hop between co-located containers"]
  - q: "Is the sidecar limited to infrastructure concerns with no business logic?"
    weight: 2
    signals: ["sidecar handles only proxy or logging", "no domain logic in sidecar container", "infrastructure-only sidecar responsibility"]
  - q: "Is the sidecar lifecycle tied to the main container, starting before and stopping after?"
    weight: 1
    signals: ["sidecar starts before app container", "sidecar shutdown after main process exits", "lifecycle ordering between containers"]
threshold: 6
