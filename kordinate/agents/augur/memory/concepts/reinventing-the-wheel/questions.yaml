questions:
  - q: "Are there custom implementations of functionality already available in the standard library or well-maintained packages?"
    weight: 3
    signals: ["custom JSON parser replacing json.loads", "hand-rolled HTTP client over raw sockets", "reimplemented deepcopy or uuid generation"]
  - q: "Do custom utility modules overlap with libraries already in the project's dependency tree?"
    weight: 3
    signals: ["custom retry logic when tenacity is a dependency", "custom caching alongside existing cache library", "custom validation duplicating installed schema library"]
  - q: "Do the custom implementations lack edge case handling present in established solutions?"
    weight: 2
    signals: ["no unicode handling in custom parser", "missing timezone edge cases", "no encoding fallback in custom serializer"]
  - q: "Is there documentation explaining why the custom implementation was chosen over an existing library?"
    weight: 1
    signals: ["no rationale comment for custom code", "no build-vs-buy decision recorded", "missing justification for reimplementation"]
threshold: 6
