questions:
  - q: "Are tasks triggered by cron expressions or scheduled time intervals?"
    weight: 3
    signals: ["cron expression in config or decorator", "CronJob resource in Kubernetes manifest", "@scheduled or @periodic_task decorator"]
  - q: "Is there a scheduler library managing periodic task registration and execution?"
    weight: 3
    signals: ["APScheduler or celery.beat import", "node-cron or Quartz scheduler", "periodic task registration at startup"]
  - q: "Are overlapping executions of the same job handled to prevent stacking?"
    weight: 2
    signals: ["skip if previous run still active", "overlap protection on job trigger", "mutex or lock on concurrent job execution"]
  - q: "Are failed jobs retried or routed to a dead-letter mechanism?"
    weight: 1
    signals: ["job retry on failure", "dead-letter for failed scheduled tasks", "error handling with retry count"]
threshold: 6
