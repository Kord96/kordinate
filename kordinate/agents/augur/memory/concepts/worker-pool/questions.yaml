questions:
  - q: "Does the code create a fixed pool of workers (threads, processes, or goroutines) that pull tasks from a shared queue?"
    weight: 3
    signals: ["ThreadPoolExecutor or ProcessPoolExecutor", "fixed worker count", "shared task queue"]
  - q: "Are tasks submitted to the pool via submit(), map(), or apply_async() rather than spawning new threads per task?"
    weight: 3
    signals: ["submit() or map() to pool", "task dispatch to existing workers", "reusable worker threads"]
  - q: "Is the pool size configurable and is graceful shutdown implemented so pending tasks complete before termination?"
    weight: 2
    signals: ["max_workers configuration", "graceful pool shutdown", "pending tasks complete on exit"]
  - q: "Are exceptions from worker tasks captured and reported rather than silently swallowed?"
    weight: 1
    signals: ["exception capture from futures", "worker error reporting", "task failure not silently lost"]
threshold: 6
