id: component-function-ts
language: TypeScript
rule:
  pattern: |
    function $NAME($PROPS): JSX.Element {
        $$$BODY
    }
---
id: component-arrow-ts
language: TypeScript
rule:
  pattern: |
    const $NAME = ($PROPS) => {
        $$$BODY
    }
  has:
    any:
      - kind: jsx_element
      - kind: jsx_self_closing_element
      - kind: jsx_fragment
      - pattern: 'React.createElement($$$ARGS)'
---
id: component-defineComponent-ts
language: TypeScript
rule:
  pattern: 'defineComponent($$$ARGS)'
---
id: component-customElement-ts
language: TypeScript
rule:
  pattern: 'customElements.define($NAME, $CLASS)'
