questions:
  - q: "Do classes instantiate their own infrastructure dependencies internally rather than receiving them through constructor injection?"
    weight: 3
    signals: ["self.db = Database() inside constructor", "new HttpClient() in business logic", "internal dependency creation"]
  - q: "Are concrete class types used directly in method signatures and references with no interfaces or protocols between components?"
    weight: 3
    signals: ["concrete class references everywhere", "no interface or protocol abstraction", "direct type dependencies"]
  - q: "Does changing one class signature or interface break compilation or tests across 5 or more other files?"
    weight: 2
    signals: ["change cascades across files", "ripple effect from interface change", "widespread breakage from single edit"]
  - q: "Are direct database calls or HTTP requests embedded inside business logic methods rather than behind adapter interfaces?"
    weight: 2
    signals: ["SQL queries in business logic", "HTTP calls in domain methods", "infrastructure mixed with business rules"]
threshold: 6
