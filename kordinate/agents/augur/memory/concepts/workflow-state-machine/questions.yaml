threshold: 3
questions:
- q: Are there state enums or constants (PENDING, APPROVED, REJECTED, COMPLETED)?
  w: 2
  signals:
  - PENDING
  - APPROVED
  - REJECTED
  - COMPLETED
  - CANCELLED
- q: Is there transition validation logic (check current state before allowing change)?
  w: 2
- q: Does the project use a state machine or workflow library (XState, transitions,
    Temporal)?
  w: 2
  signals:
  - xstate
  - transitions
  - temporal
  - StateMachine
  - Workflow
- q: Are there guard conditions on state transitions?
  w: 1
  signals:
  - guard
  - can_transition
  - allowed_transitions
- q: Is state transition history recorded?
  w: 1
  signals:
  - history
  - transition_log
  - state_change
  - audit
