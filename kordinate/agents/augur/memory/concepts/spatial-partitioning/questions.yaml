questions:
  - q: "Is there a spatial data structure that accelerates range or proximity queries over positioned objects?"
    weight: 3
    signals: ["QuadTree or Octree class with insert and query", "SpatialHash bucketing objects by position", "RTree or BVH for bounding volume queries"]
  - q: "Are spatial queries returning candidates for a broad phase rather than doing final collision checks?"
    weight: 3
    signals: ["broad-phase candidate list from spatial query", "query_radius or query_rect returning nearby objects", "separate narrow-phase after spatial lookup"]
  - q: "Does the structure use recursive subdivision with bounded depth or cell size?"
    weight: 2
    signals: ["max depth limit on tree", "cell size bounded to prevent degenerate splits", "recursive subdivision of space into nodes"]
  - q: "Is the spatial structure updated incrementally as objects move rather than rebuilt entirely each frame?"
    weight: 1
    signals: ["incremental update on object move", "remove and re-insert on position change", "no full rebuild every frame"]
threshold: 6
