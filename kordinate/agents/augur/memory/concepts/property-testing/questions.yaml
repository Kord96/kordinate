    weight: 3
    signals: ["@given(st.integers())", "fc.property(fc.string())", "@Property with jqwik"]
  - q: "Do test assertions express universal invariants (idempotency, round-trip, commutativity) rather than checking specific input/output pairs?"
    weight: 3
    signals: ["assert encode(decode(x)) == x", "assert f(f(x)) == f(x)", "invariant over all inputs"]
  - q: "Are custom strategies composed to model actual domain constraints rather than generating arbitrary data?"
    weight: 2
    signals: ["st.builds(User)", "custom strategy for valid email", "domain-specific generator"]
  - q: "Does failure output show minimized counterexamples from shrinking?"
    weight: 2
    signals: ["shrunk counterexample", "Falsifying example", "minimal failing input"]
threshold: 6
