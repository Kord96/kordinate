# Score 3: Stringly-typed is about string literals used WHERE enums should be.
# We can match the smell shape: string comparison for branching, and string
# parsing with split() to extract structured data.

id: stringly-typed-string-branch-py
language: Python
rule:
  pattern: |
    if $VAR == $STR:
        $$$BODY
  constraints:
    STR:
      regex: '^".*"$|^''.*''$'
    VAR:
      regex: '(status|type|kind|role|state|mode|action|category|level)'
---
id: stringly-typed-string-split-py
language: Python
rule:
  pattern: $VAR.split($DELIM)[$INDEX]
---
id: stringly-typed-string-branch-ts
language: TypeScript
rule:
  pattern: |
    if ($VAR === $STR) {
        $$$BODY
    }
  constraints:
    STR:
      regex: '^".*"$|^''.*''$'
    VAR:
      regex: '(status|type|kind|role|state|mode|action|category|level)'
---
id: stringly-typed-switch-string-ts
language: TypeScript
rule:
  pattern: |
    switch ($VAR) {
        $$$CASES
    }
  constraints:
    VAR:
      regex: '(status|type|kind|role|state|mode|action|category|level)'
