# Score 2: Copy-Paste Programming is a cross-file clone detection problem that ast-grep
# cannot address.
#
# Detection requires comparing code blocks across multiple files to find:
#   - Textually identical blocks (Type-1 clones)
#   - Blocks identical except for variable renames (Type-2 clones)
#   - Structurally similar blocks with statement-level differences (Type-3 clones)
#
# ast-grep matches patterns within a single file and cannot compare AST subtrees across
# files. Even within a single file, it cannot detect "two blocks that look similar to
# each other" -- it needs a specific pattern to match against.
#
# The only structural hint -- comments like "# copied from" -- is a string match, not
# an AST pattern, and is better handled by grep.
#
# This anti-pattern is best detected by:
#   - Clone detection tools: jscpd, PMD CPD, Simian, SourcererCC
#   - IDE duplicate detection features
#   - Code review tooling that highlights similar blocks
