threshold: 3
questions:
- q: Does the project have HTTP route handlers (Express app.get, FastAPI @app.get,
    Spring @RestController)?
  w: 2
  signals:
  - app.get
  - app.post
  - '@app.get'
  - '@RestController'
  - HandleFunc
- q: Do route handlers delegate to a service or use-case layer rather than containing
    business logic directly?
  w: 2
- q: Is there a middleware chain (auth, validation, error handling) that requests
    pass through?
  w: 1
  signals:
  - middleware
  - Depends(
  - '@UseGuards'
  - router.use
- q: Are there request/response DTOs or schemas at the API boundary?
  w: 1
  signals:
  - Pydantic
  - BaseModel
  - Zod
  - schema
  - DTO
