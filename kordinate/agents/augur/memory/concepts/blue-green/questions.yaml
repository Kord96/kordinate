questions:
  - q: "Are there two parallel, identical environments (blue/green or active/standby) with only one receiving production traffic at a time?"
    weight: 3
    signals: ["dual environments", "blue/green labels", "active/standby deployment pair"]
  - q: "Is there an atomic traffic switch mechanism (DNS, load balancer, service selector) that cuts over from one environment to the other?"
    weight: 3
    signals: ["traffic switch", "LB target group swap", "service selector toggle"]
  - q: "Is the standby environment validated with health checks or smoke tests before receiving production traffic?"
    weight: 2
    signals: ["pre-switch health check", "smoke test on standby", "validation before cutover"]
  - q: "Can traffic be reverted to the previous environment as a rollback without redeployment?"
    weight: 2
    signals: ["instant rollback", "switch back to previous env", "revert traffic without redeploy"]
threshold: 6
