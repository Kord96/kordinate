questions:
  - q: "Are domain model classes free of ORM base classes and persistence imports?"
    weight: 3
    signals: ["plain class or dataclass with no ORM base", "no import of sqlalchemy/typeorm/hibernate in domain layer"]
  - q: "Do dedicated mapper classes or functions translate between domain objects and database rows?"
    weight: 3
    signals: ["to_entity() or from_row() methods", "mapper/ directory or mapper classes"]
  - q: "Are domain models free of save(), query(), or other persistence methods?"
    weight: 2
    signals: ["no save() or persist() on domain objects", "persistence operations only in repository or mapper layer"]
  - q: "Does the mapper handle bidirectional translation between domain and persistence representations?"
    weight: 1
    signals: ["to_row() and to_entity() in same mapper", "separate serialization and deserialization paths"]
threshold: 6
