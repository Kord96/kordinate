questions:
  - q: "Are there dicts, lists, or caches in long-running processes that grow monotonically with no eviction policy, TTL, or max size?"
    weight: 3
    signals: ["cache dict with no eviction", "append-only list without maxlen", "lru_cache with maxsize=None"]
  - q: "Do in-memory collections lack any size limit, TTL, or backpressure mechanism?"
    weight: 3
    signals: ["no maxsize or maxlen", "no TTL on cache entries", "no backpressure on queue"]
  - q: "Are there append-only patterns (history.append, log buffers, event collectors) that accumulate indefinitely in memory?"
    weight: 2
    signals: ["history.append in long-running process", "event collector without limit", "log buffer without rotation"]
  - q: "Do session stores, connection pools, or registries grow without a corresponding shrink or cleanup mechanism?"
    weight: 2
    signals: ["session store grows unbounded", "connection pool never shrinks", "registry without cleanup"]
threshold: 6
