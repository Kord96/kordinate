threshold: 3
questions:
- q: Does the project use a service mesh (Istio, Linkerd, Consul Connect)?
  w: 2
  signals:
  - istio
  - linkerd
  - consul
  - envoy
- q: Do pod specs have multiple containers (main app + sidecar)?
  w: 2
  signals:
  - sidecar
  - istio-proxy
  - envoy
  - initContainers
- q: Is mTLS between services handled by the mesh, not the application?
  w: 1
  signals:
  - PeerAuthentication
  - DestinationRule
  - mtls
- q: Are traffic policies (retries, timeouts, circuit breaking) configured at mesh
    level?
  w: 1
  signals:
  - VirtualService
  - DestinationRule
  - TrafficPolicy
