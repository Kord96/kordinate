questions:
  - q: "Is there a single entry point that routes requests to multiple backend services based on path, header, or method?"
    weight: 3
    signals: ["centralized routing", "path-based dispatch to backends", "ingress routing rules"]
  - q: "Are cross-cutting concerns like authentication, rate limiting, and request logging applied at a gateway layer before reaching backend services?"
    weight: 3
    signals: ["auth middleware at gateway", "rate limit before backend", "centralized policy enforcement"]
  - q: "Does the gateway contain no business logic, delegating all domain operations to downstream services?"
    weight: 2
    signals: ["thin routing layer", "no domain logic in gateway", "pure proxy with policy"]
  - q: "Are timeouts, circuit breakers, or retry policies configured per upstream backend at the gateway level?"
    weight: 2
    signals: ["per-backend timeout config", "circuit breaker at gateway", "upstream resilience settings"]
threshold: 6
