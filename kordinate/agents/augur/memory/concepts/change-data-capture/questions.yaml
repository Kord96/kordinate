questions:
  - q: "Is the database transaction log (WAL, binlog, oplog) being tailed to capture data changes?"
    weight: 3
    signals: ["WAL reader", "binlog consumer", "oplog tailing"]
  - q: "Are database changes published as events to downstream consumers via a connector or pipeline?"
    weight: 3
    signals: ["Debezium connector", "change event publishing", "CDC pipeline to message bus"]
  - q: "Does the system track its position in the change stream (LSN, offset) to survive restarts?"
    weight: 2
    signals: ["offset tracking", "LSN checkpoint", "connector position persistence"]
  - q: "Is there an outbox table that is polled or tailed as an alternative to direct log capture?"
    weight: 2
    signals: ["outbox table", "outbox polling", "transactional outbox pattern"]
threshold: 6
