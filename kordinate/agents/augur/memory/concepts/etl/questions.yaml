questions:
  - q: "Are there explicit extract, transform, and load stages with clear boundaries between them?"
    weight: 3
    signals: ["separate extract/transform/load functions or classes", "pipeline DAG with distinct ETL operator steps"]
  - q: "Does the extract phase track a bookmark or offset for incremental runs?"
    weight: 2
    signals: ["timestamp or offset checkpoint between runs", "incremental extraction based on last processed marker"]
  - q: "Is the load phase idempotent so re-running does not create duplicates?"
    weight: 2
    signals: ["upsert or merge on load", "idempotent write with deduplication key"]
  - q: "Is a pipeline orchestration framework managing execution order and dependencies?"
    weight: 2
    signals: ["Airflow DAG or dbt models/ directory", "Dagster @op/@job or Prefect @flow/@task decorators"]
threshold: 6
