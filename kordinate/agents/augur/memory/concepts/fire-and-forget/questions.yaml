questions:
  - q: "Are messages published without awaiting acknowledgment or checking the returned future?"
    weight: 3
    signals: ["producer.send() with no await or callback", "fire-and-forget send with no result handling"]
  - q: "Is there no error handling or retry logic on message publish failures?"
    weight: 3
    signals: ["try: send() except: pass pattern", "ignore_errors=True on message send"]
  - q: "Are async tasks dispatched with no result tracking or error callback?"
    weight: 2
    signals: ["celery.delay() with no result backend", "Task.Run() with no error callback or monitoring"]
  - q: "Is there no dead-letter queue or failure destination for undeliverable messages?"
    weight: 1
    signals: ["no DLQ configured for the topic/queue", "no failure handling for undeliverable messages"]
threshold: 6
