questions:
  - q: "Do functions contain 5 or more levels of if/for/try indentation?"
    weight: 3
    signals: ["5+ indent levels in a single function", "arrow-shaped code with peak indentation"]
  - q: "Are there long functions (40+ lines) where nested conditionals span most of the body?"
    weight: 2
    signals: ["function body dominated by nested if/else chains", "50+ line function with 3+ nesting levels"]
  - q: "Could nested conditions be replaced by guard clauses with early returns?"
    weight: 2
    signals: ["if condition that wraps entire function body", "no early return before deeply nested logic"]
  - q: "Are there nested ternary expressions or deeply nested callback chains?"
    weight: 2
    signals: ["a ? b ? c : d : e ternary chains", "callback inside callback inside callback"]
threshold: 6
