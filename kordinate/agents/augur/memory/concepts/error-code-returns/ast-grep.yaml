id: error-code-return-negative-one-py
language: Python
rule:
  pattern: 'return -1'
---
id: error-code-check-negative-one-py
language: Python
rule:
  pattern: 'if $VAR == -1:'
---
# Removed: `if $VAR is None:` -- too generic, matches standard Python idiom
# Removed: `if ($VAR === null) { ... }` -- too generic, matches standard null checks
# These only indicate error-code-returns when paired with return of sentinel values,
# but ast-grep cannot correlate across function boundaries.
id: error-code-return-negative-one-ts
language: TypeScript
rule:
  pattern: 'return -1;'
---
id: error-code-check-negative-one-ts
language: TypeScript
rule:
  pattern: 'if ($VAR === -1) { $$$BODY }'
