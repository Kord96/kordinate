questions:
  - q: "Do error log lines contain only a bare message string with no structured fields or request identifiers?"
    weight: 3
    signals: ["logger.error('failed')", "log.Println(err.Error())", "console.error(message)"]
  - q: "Is there no middleware or decorator that binds a request ID or correlation ID to the logging context?"
    weight: 3
    signals: ["no structlog.bind at request entry", "no MDC.put for request ID", "no trace context propagation"]
  - q: "Can a single request be traced across multiple log lines without manual timestamp alignment?"
    weight: 2
    signals: ["no request_id in log fields", "no correlation_id", "log lines lack common identifier"]
  - q: "Do log statements omit the operation name, entity ID, or input that caused the failure?"
    weight: 2
    signals: ["error logged without entity context", "no operation name in log", "which user? which request?"]
threshold: 6
