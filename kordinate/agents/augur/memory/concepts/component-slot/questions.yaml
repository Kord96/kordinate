questions:
  - q: "Does a component define named insertion points where parent-provided content is rendered?"
    weight: 3
    signals: ["named slot", "content projection point", "v-slot or ng-content or slot element"]
  - q: "Does a child component pass data back to the parent through scoped slots or render props?"
    weight: 3
    signals: ["scoped slot data", "render prop function", "slot props passed to parent"]
  - q: "Are there compound components where sub-components share context and compose within a root?"
    weight: 2
    signals: ["compound component pattern", "Root/Trigger/Content composition", "shared context between sub-components"]
  - q: "Does the component provide default content for optional slots as a fallback?"
    weight: 1
    signals: ["default slot content", "fallback rendering", "optional slot with default"]
threshold: 6
