# Score 2: Facade is a design intent pattern with only weak naming heuristics.
#
# The structural signature -- a class that delegates to multiple subsystem classes without
# adding business logic -- cannot be distinguished from any wrapper, adapter, or service
# class by AST structure alone. ast-grep cannot determine whether a class "simplifies" an
# interface or whether it delegates without adding logic.
#
# The only structural hint is naming convention, provided below as a low-confidence heuristic.
# This will produce false positives (classes named *Facade that aren't the GoF pattern) and
# miss true facades that use other naming conventions (*Client, *Gateway, or domain names).

# Low-confidence heuristic: classes explicitly named *Facade
id: facade-python-naming
language: Python
rule:
  pattern: |
    class $NAME:
      $$$BODY
  constraints:
    NAME:
      regex: "\\w+Facade$"
