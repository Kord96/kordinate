questions:
  - q: "Does a single class provide a simplified interface that delegates to multiple subsystem classes, even if it is not named Facade?"
    weight: 3
    signals: ["one class orchestrating calls to several internal components", "simplified method hiding multi-step subsystem interaction", "constructor initializes 3+ subsystem objects", "Bot/App/Engine class unifying polling, API, and dispatch", "Java ClientAndServer or Manager class wrapping lifecycle + API", "Java @Service injecting 3+ services and delegating", "BFF class aggregating multiple backend service calls"]
  - q: "Does the facade delegate to subsystem classes without containing business logic itself?"
    weight: 3
    signals: ["facade methods only coordinate and delegate", "no domain rules or computations in the facade"]
  - q: "Are the underlying subsystem classes still directly accessible for advanced use cases?"
    weight: 2
    signals: ["subsystem classes have public APIs independent of facade", "facade is optional convenience, not mandatory indirection"]
  - q: "Does the class hide the complexity of initializing and coordinating multiple subsystems behind a simple public API (e.g., run(), start(), send())?"
    weight: 2
    signals: ["single run/start method hides subsystem orchestration", "user interacts with one class instead of wiring subsystems manually", "subsystem wiring in constructor or setup method"]
  - q: "Are there module-level convenience functions (validate, parse, build) or a DAG/Pipeline class that internally creates objects, configures them, and runs multi-step operations in a single call?"
    weight: 2
    signals: ["validate() function creating validator and returning result", "DAG.build() coordinating render + execute + hooks", "module-level function hiding internal class instantiation"]
  - q: "Does an SDK client or App class expose a small set of high-level methods (send, createFunction, message, action) while hiding internal comm handlers, middleware chains, execution engines, or API clients?"
    weight: 2
    signals: ["Inngest client hiding InngestCommHandler and InngestApi", "App class hiding middleware pipeline and receivers", "Api object aggregating subsystem references (api.actions, api.servers)"]
threshold: 5
