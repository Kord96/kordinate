id: hydration-hydrateRoot-ts
language: TypeScript
rule:
  pattern: 'hydrateRoot($$$ARGS)'
---
id: hydration-reactdom-hydrate-ts
language: TypeScript
rule:
  pattern: 'ReactDOM.hydrate($$$ARGS)'
---
id: hydration-dehydrate-ts
language: TypeScript
rule:
  pattern: 'dehydrate($CLIENT)'
---
id: hydration-boundary-ts
language: TypeScript
rule:
  pattern: '<HydrationBoundary $$$ATTRS>$$$CHILDREN</HydrationBoundary>'
---
id: hydration-suppress-warning-ts
language: TypeScript
rule:
  pattern: 'suppressHydrationWarning'
