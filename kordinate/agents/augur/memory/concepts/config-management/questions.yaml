questions:
  - q: "Is configuration externalized from code and loaded from environment variables, config files, or a config server?"
    weight: 3
    signals: ["env var loading", "config file parsing at startup", "centralized config server"]
  - q: "Is configuration validated at startup with fail-fast behavior on missing or malformed values?"
    weight: 2
    signals: ["startup validation", "fail-fast on bad config", "schema-based config check"]
  - q: "Is there a hierarchical override system (defaults < environment < instance < explicit)?"
    weight: 2
    signals: ["config override precedence", "layered config sources", "environment-specific overrides"]
  - q: "Are secrets handled separately from plain configuration (not co-located in the same config file)?"
    weight: 1
    signals: ["separate secret management", "secrets not in config file", "vault or secret store reference"]
  - q: "Is there a feature flag system with a defined lifecycle for flag creation, rollout, and cleanup?"
    weight: 1
    signals: ["feature toggle system", "flag lifecycle management", "feature flag with rollout plan"]
threshold: 6
