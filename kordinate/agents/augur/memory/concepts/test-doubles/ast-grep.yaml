id: testdouble-mock-patch-py
language: Python
rule:
  pattern: |
    @patch($TARGET, $$$ARGS)
    def $NAME($$$PARAMS):
        $$$BODY
---
id: testdouble-magicmock-py
language: Python
rule:
  pattern: '$NAME = MagicMock($$$ARGS)'
---
id: testdouble-mock-return-py
language: Python
rule:
  pattern: '$MOCK.return_value = $VALUE'
---
id: testdouble-jest-fn-ts
language: TypeScript
rule:
  pattern: 'jest.fn($$$ARGS)'
---
id: testdouble-jest-spyon-ts
language: TypeScript
rule:
  pattern: 'jest.spyOn($OBJ, $METHOD)'
---
id: testdouble-jest-mock-ts
language: TypeScript
rule:
  pattern: 'jest.mock($MODULE, $$$ARGS)'
---
id: testdouble-sinon-stub-ts
language: TypeScript
rule:
  pattern: 'sinon.stub($$$ARGS)'
