questions:
  - q: "Are there separate model, view, and controller layers with distinct responsibilities in the directory structure?"
    weight: 3
    signals: ["models/ views/ controllers/ directories", "UserController class", "UserModel class"]
  - q: "Do controllers handle HTTP input and delegate to models/services without containing business logic themselves?"
    weight: 3
    signals: ["thin controller delegating to service", "controller calls model method", "no SQL in controller"]
  - q: "Do views contain only presentation logic with no database queries or business rules?"
    weight: 2
    signals: ["template renders model data", "no DB calls in view", "no business logic in template"]
  - q: "Do models manage data access and business logic without knowledge of the HTTP or view layer?"
    weight: 2
    signals: ["model has no request/response imports", "model unaware of views", "pure domain logic in model"]
threshold: 6
