threshold: 3
questions:
- q: Is Redis, Memcached, DynamoDB, etcd, or Consul used as a primary or major data
    store?
  w: 2
  signals:
  - redis
  - memcached
  - dynamodb
  - etcd
  - consul
- q: Is data accessed primarily by key lookup (no complex queries or joins)?
  w: 2
- q: Are there TTL/expiry settings on stored entries?
  w: 1
  signals:
  - TTL
  - expire
  - SETEX
  - ttl
- q: Are there atomic operations (increment, compare-and-swap, SETNX)?
  w: 1
  signals:
  - INCR
  - SETNX
  - compare_and_swap
  - atomic
