questions:
  - q: "Do methods access more fields from another class than from their own class?"
    weight: 3
    signals: ["method reads 4+ fields of another object, 0-1 of its own", "heavy use of other_obj.field1, other_obj.field2 throughout"]
  - q: "Are there getter chains traversing object graphs to extract data for local computation?"
    weight: 3
    signals: ["order.customer.address.city style chains", "deep property access across 3+ object boundaries"]
  - q: "Do static methods or utility functions operate entirely on another class's data?"
    weight: 2
    signals: ["static method taking an object and using only its attributes", "free function that should be a method on the data class"]
  - q: "Are there long parameter lists where all parameters come from a single other object?"
    weight: 1
    signals: ["function(obj.a, obj.b, obj.c, obj.d) unpacking one object", "destructuring another object into method parameters"]
threshold: 6
