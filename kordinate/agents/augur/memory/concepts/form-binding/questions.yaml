questions:
  - q: "Are form inputs connected to state through structured binding (controlled inputs, v-model, ngModel)?"
    weight: 3
    signals: ["value + onChange controlled inputs in React", "v-model or bind:value on form elements"]
  - q: "Is form validation defined as a schema separate from the UI rendering logic?"
    weight: 2
    signals: ["Zod z.object() or Yup yup.object().shape() schema", "zodResolver or yupResolver connecting schema to form library"]
  - q: "Are field-level errors displayed adjacent to their corresponding inputs?"
    weight: 2
    signals: ["errors.fieldName rendered next to input", "per-field error messages with touched state tracking"]
  - q: "Is form state managed by a form library rather than individual useState calls per field?"
    weight: 2
    signals: ["useForm or useFormik managing all field state", "FormGroup/FormBuilder for reactive form state"]
  - q: "Does the form handle dirty-state tracking and submission guards?"
    weight: 1
    signals: ["isDirty or formState.dirty tracking", "submit button disabled while validation errors exist"]
threshold: 6
