questions:
  - q: "Are there loops that repeatedly check a condition with a sleep/delay call, polling for state changes instead of being notified?"
    weight: 3
    signals: ["while loop with sleep and condition check", "polling loop", "sleep-then-check pattern"]
  - q: "Could the polling be replaced by an event-driven mechanism (callbacks, condition variables, pub/sub, filesystem watchers)?"
    weight: 3
    signals: ["event-driven alternative exists", "webhooks available but unused", "OS wait primitives not used"]
  - q: "Is CPU usage or thread consumption elevated during idle periods due to continuous polling?"
    weight: 2
    signals: ["CPU busy while idle", "threads consumed by polling", "unnecessary resource drain"]
  - q: "Is response to state changes delayed by a fixed polling interval rather than being immediate?"
    weight: 2
    signals: ["latency floor equals poll interval", "delayed detection", "response time bound by sleep duration"]
threshold: 6
