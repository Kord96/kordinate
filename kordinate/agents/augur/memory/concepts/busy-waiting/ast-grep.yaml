id: busy-waiting-sleep-loop-py
language: Python
rule:
  pattern: |
    while $COND:
        time.sleep($INTERVAL)
        $$$BODY
---
id: busy-waiting-spin-loop-py
language: Python
rule:
  pattern: |
    while not $CONDITION:
        pass
---
id: busy-waiting-poll-break-py
language: Python
rule:
  pattern: |
    while True:
        $$$BEFORE
        time.sleep($INTERVAL)
        $$$AFTER
        if $COND:
            break
---
id: busy-waiting-setinterval-poll-ts
language: TypeScript
rule:
  pattern: |
    setInterval(() => {
        $$$BODY
    }, $INTERVAL)
  has:
    pattern: if ($COND) { $$$HANDLER }
---
id: busy-waiting-while-sleep-ts
language: TypeScript
rule:
  pattern: |
    while ($COND) {
        await $SLEEP($INTERVAL);
        $$$BODY
    }
