questions:
  - q: "Does the server respond with Content-Type text/event-stream using SSE wire format?"
    weight: 3
    signals: ["text/event-stream content type header", "data: prefixed lines in response stream", "event: field for named event types"]
  - q: "Does the client use EventSource to receive server-pushed events?"
    weight: 3
    signals: ["new EventSource(url)", "onmessage or addEventListener on EventSource", "onerror handler for reconnection"]
  - q: "Do events include id fields enabling resume via Last-Event-ID after reconnection?"
    weight: 2
    signals: ["id: field in event stream", "Last-Event-ID header on reconnect", "resume from last received event ID"]
  - q: "Does the server handle client disconnection gracefully and clean up resources?"
    weight: 1
    signals: ["detect closed connection", "cleanup on client disconnect", "bounded concurrent SSE client count"]
threshold: 6
