questions:
  - q: "Is there a class that implements one interface by delegating to an object with a different interface, translating between the two?"
    weight: 3
    signals: ["interface translation", "wraps adaptee and exposes target interface", "delegates to foreign API"]
  - q: "Are third-party library types isolated behind a project-specific interface so callers never import the external SDK directly?"
    weight: 3
    signals: ["vendor wrapper", "SDK isolation", "swap vendor by changing adapter only"]
  - q: "Does the translation layer map errors and exceptions from the external system into domain-appropriate error types?"
    weight: 2
    signals: ["exception translation", "error mapping", "adaptee errors converted to domain errors"]
  - q: "Is the adapter stateless, holding only a reference to the adaptee without accumulating its own mutable state?"
    weight: 1
    signals: ["stateless wrapper", "passthrough delegation", "no adapter-owned state"]
  - q: "Are there multiple Receiver, Handler, or Provider implementations that each adapt a different framework or vendor to a common internal interface?"
    weight: 3
    signals: ["ExpressReceiver/HTTPReceiver/SocketModeReceiver adapting to Receiver interface", "AiAdapter implementations for OpenAI/Anthropic/Gemini", "normalize_handler adapting arbitrary function signatures to framework-expected callable"]
threshold: 5
