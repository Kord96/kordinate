questions:
  - q: "Are metric labels populated from unbounded user-supplied or request-specific data like user IDs or full URL paths?"
    weight: 3
    signals: ["labels=[\"user_id\"]", "labels=[\"request_id\"]", "raw URL path as label value"]
  - q: "Are metric names generated dynamically using string formatting or interpolation?"
    weight: 3
    signals: ["f\"request_{endpoint}_total\"", "dynamic metric name construction", "metric name from user input"]
  - q: "Do label values come from a set that grows with traffic rather than a fixed low-cardinality enumeration?"
    weight: 2
    signals: ["email as label", "session ID in labels", "unbounded label values"]
  - q: "Is there evidence of Prometheus memory pressure or growing scrape duration related to metric volume?"
    weight: 2
    signals: ["prometheus_tsdb_head_series growing", "scrape duration increasing", "OOM on metrics endpoint"]
threshold: 6
