questions:
  - q: "Do multiple services share the same database or schema?"
    weight: 3
    signals: ["multiple services with connection strings to same DB", "shared tables accessed by different service codebases"]
  - q: "Must services be deployed together or in a specific coordinated order?"
    weight: 3
    signals: ["deployment scripts that deploy multiple services in sequence", "deploy service A breaks service B if not co-deployed"]
  - q: "Do synchronous call chains span 5 or more services to complete a single request?"
    weight: 2
    signals: ["request traces showing 5+ synchronous hops", "service A calls B calls C calls D in chain"]
  - q: "Do shared libraries contain business logic imported by multiple services?"
    weight: 2
    signals: ["shared-lib or common package with domain logic", "business rules in library used by 3+ services"]
  - q: "Is there a single CI pipeline that builds and deploys all services together?"
    weight: 1
    signals: ["monorepo CI that builds all services in one pipeline", "single deployment artifact for multiple services"]
threshold: 7
