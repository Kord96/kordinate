rules:
  - id: pickle-loads-untrusted
    pattern: |
      pickle.loads($DATA)
    message: "pickle.loads on potentially untrusted data — use json or safer alternative"
    severity: ERROR
    languages: [python]
  - id: eval-usage
    pattern: |
      eval($INPUT)
    message: "eval() on potentially untrusted input — avoid or use ast.literal_eval"
    severity: ERROR
    languages: [python]
  - id: yaml-unsafe-load
    pattern: |
      yaml.load($DATA)
    message: "yaml.load without SafeLoader — use yaml.safe_load or yaml.load(data, Loader=SafeLoader)"
    severity: WARNING
    languages: [python]
  - id: exec-usage
    pattern: |
      exec($INPUT)
    message: "exec() on potentially untrusted input"
    severity: ERROR
    languages: [python]
