questions:
  - q: "Is there a main loop that separates input processing, state update, and rendering into distinct phases?"
    weight: 3
    signals: ["while running", "process_input", "update", "render"]
  - q: "Does the loop calculate delta time between frames for frame-rate-independent updates?"
    weight: 3
    signals: ["delta_time", "dt = current - last", "elapsed"]
  - q: "Is there a fixed timestep accumulator separating simulation updates from variable-rate rendering?"
    weight: 2
    signals: ["FIXED_DT", "accumulator += dt", "fixed_update"]
  - q: "Does the loop include interpolation between previous and current state for smooth rendering?"
    weight: 1
    signals: ["interpolate", "lerp", "alpha = accumulator / FIXED_DT"]
threshold: 6
