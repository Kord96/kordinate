questions:
  - q: "Does a single logical change require editing files across many unrelated directories or packages?"
    weight: 3
    signals: ["one feature touching 10+ files in 5+ directories", "bug fix spanning many packages", "git commits modifying unrelated modules for one change"]
  - q: "Are cross-cutting concerns duplicated in every module rather than centralized?"
    weight: 3
    signals: ["auth check copied into each handler", "logging format repeated across modules", "validation logic duplicated per endpoint"]
  - q: "Is the same conditional logic scattered across multiple modules?"
    weight: 2
    signals: ["if feature_x check in many files", "same branching condition in unrelated packages", "feature flag checked in 10+ locations"]
  - q: "Do simple feature requests take disproportionately long due to coordinated multi-file edits?"
    weight: 1
    signals: ["small feature requires large PR", "developers fear missing a location", "high regression rate despite thorough changes"]
threshold: 6
