questions:
  - q: "Do conditionals or function arguments contain unexplained numeric literals with no named constant?"
    weight: 3
    signals: ["if count > 42", "sleep(3.5)", "retry_limit = 5 inline"]
  - q: "Are the same hardcoded values duplicated across multiple files without a shared constant definition?"
    weight: 3
    signals: ["same number in two conditionals", "duplicated threshold across modules"]
  - q: "Do array indices encode business meaning without a named accessor or constant?"
    weight: 2
    signals: ["data[7]", "row[3] used as address field"]
  - q: "Are string literals used as identifiers or config keys in multiple locations without a shared definition?"
    weight: 2
    signals: ["repeated string key across files", "status == 'active' in multiple places"]
threshold: 6
