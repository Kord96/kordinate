questions:
  - q: "Do two or more modules import each other directly or through a transitive chain (A imports B imports A, or A->B->C->A)?"
    weight: 3
    signals: ["mutual import", "transitive import cycle", "A-imports-B-imports-A"]
  - q: "Are there deferred imports inside function bodies or TYPE_CHECKING blocks used to work around import cycles?"
    weight: 3
    signals: ["function-level import", "TYPE_CHECKING guard", "deferred import to break cycle"]
  - q: "Does rearranging imports or moving code between files cause runtime ImportError or AttributeError?"
    weight: 2
    signals: ["order-dependent imports", "partially initialized module", "runtime import failure"]
  - q: "Does unit testing a single module pull in a chain of seemingly unrelated modules?"
    weight: 1
    signals: ["test pulls transitive deps", "unexpected import chain in tests", "isolated test requires full graph"]
threshold: 6
