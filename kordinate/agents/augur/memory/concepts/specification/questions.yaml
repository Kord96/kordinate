questions:
  - q: "Are there business rule objects with an is_satisfied_by method that evaluates a candidate?"
    weight: 3
    signals: ["is_satisfied_by(candidate) method", "Specification or Spec class", "predicate object passed to filtering method"]
  - q: "Are specifications composable via and, or, and not combinators?"
    weight: 3
    signals: ["and_spec() or or_spec() combinators", "composed specification from smaller rules", "specification chaining with boolean operators"]
  - q: "Does each specification encapsulate a single business rule named in domain language?"
    weight: 2
    signals: ["IsEligibleForDiscount specification", "one rule per specification class", "domain-named predicate object"]
  - q: "Are the same specifications used for both in-memory filtering and query generation?"
    weight: 1
    signals: ["dual-purpose spec for validation and query", "specification translated to SQL predicate", "same rule for collection filter and database query"]
  - q: "Are there lists of predicate functions (conditions, guards, validators) evaluated as boolean gates for state transitions, operations, or workflow steps?"
    weight: 3
    signals: ["conditions list with all(cond(instance) for cond in conditions)", "conditions_met evaluating predicate list", "guard conditions on state machine transitions", "precondition callables checked before operation"]
threshold: 6
