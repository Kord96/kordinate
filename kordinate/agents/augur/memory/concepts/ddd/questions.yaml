questions:
  - q: "Do aggregate root classes enforce invariants by rejecting invalid state transitions?"
    weight: 3
    signals: ["validation logic in aggregate methods", "state mutation only through aggregate operations"]
  - q: "Are domain events published when aggregate state changes?"
    weight: 3
    signals: ["DomainEvent classes with past-tense names", "publish_event or emit after state change"]
  - q: "Are repository interfaces defined in the domain layer with implementations in infrastructure?"
    weight: 2
    signals: ["Repository interface in domain/ package", "repository implementation in infrastructure/ or infra/"]
  - q: "Is the codebase organized into bounded contexts with separate domain models per context?"
    weight: 2
    signals: ["separate domain directories per context like ordering/ shipping/", "no cross-context domain object imports"]
  - q: "Do value objects enforce equality by value rather than identity?"
    weight: 1
    signals: ["__eq__ based on fields not id", "ValueObject base class or immutable data classes"]
threshold: 7
