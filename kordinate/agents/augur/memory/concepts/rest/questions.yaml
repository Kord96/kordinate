questions:
  - q: "Are URLs structured as resource nouns with HTTP methods mapped to CRUD operations?"
    weight: 3
    signals: ["GET /users for list, POST /users for create", "resource-based URL paths like /users/123", "PUT or PATCH for updates, DELETE for removal"]
  - q: "Are HTTP status codes used semantically rather than returning 200 for everything?"
    weight: 3
    signals: ["201 Created on POST success", "404 Not Found for missing resources", "422 or 400 for validation errors"]
  - q: "Is there an OpenAPI or Swagger specification file for the API?"
    weight: 2
    signals: ["openapi.yaml or swagger.json in repo", "API spec generated from annotations", "schema-first API definition"]
  - q: "Are list endpoints paginated to prevent unbounded result sets?"
    weight: 1
    signals: ["cursor-based pagination parameters", "offset and limit query params", "next page link in response"]
threshold: 6
