questions:
  - q: "Are domain concepts like email, money, or user ID represented as bare strings, floats, or ints without dedicated types?"
    weight: 3
    signals: ["email as plain str", "price as float", "user_id as int with no wrapper"]
  - q: "Is the same validation logic for a primitive (regex, range check) duplicated across multiple locations?"
    weight: 3
    signals: ["email regex in 3+ files", "same format check repeated", "validation scattered across callers"]
  - q: "Do function signatures accept multiple same-typed parameters where mix-ups would cause silent bugs?"
    weight: 2
    signals: ["fn(str, str, str) for name, email, phone", "user_id and order_id both int", "no type distinction"]
  - q: "Are money calculations performed with float arithmetic and ad-hoc rounding scattered through business logic?"
    weight: 2
    signals: ["float for currency", "round(price * 1.1, 2)", "no Decimal or integer-cents"]
threshold: 6
