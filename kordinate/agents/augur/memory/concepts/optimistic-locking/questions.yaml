questions:
  - q: "Do mutable entities have a version column that is atomically incremented on every update?"
    weight: 3
    signals: ["version column on entity", "@Version annotation", "lock_version field"]
  - q: "Do write operations use conditional updates that fail if the version has changed since the read?"
    weight: 3
    signals: ["UPDATE WHERE version = ?", "ConditionalCheckFailedException", "StaleObjectError handling"]
  - q: "Is conflict handling explicit with retry, merge, or user-facing conflict resolution?"
    weight: 2
    signals: ["retry with fresh data on conflict", "OptimisticLockException caught", "conflict surfaced to user"]
  - q: "Are ETag/If-Match headers used at the API layer so clients participate in conflict detection?"
    weight: 2
    signals: ["ETag response header", "If-Match conditional request", "412 Precondition Failed"]
threshold: 6
