questions:
  - q: "Are offsets committed only after the store write succeeds, not before?"
    weight: 3
    signals: ["commit after flush success", "enable.auto.commit=false", "offset management after store write confirmation"]
  - q: "Are records buffered before flushing to the store with size and time-based triggers?"
    weight: 3
    signals: ["buffered writes with flush threshold", "flush on buffer size or time interval", "batch accumulation before store write"]
  - q: "Are store writes idempotent to handle safe replay on reprocessing?"
    weight: 2
    signals: ["idempotent upsert on store write", "deduplication key on records", "safe to replay same batch"]
  - q: "Is consumer group rebalancing handled without data loss or duplication?"
    weight: 1
    signals: ["rebalance listener draining buffer", "partition revocation flushes pending", "no data loss on consumer group rebalance"]
threshold: 6
