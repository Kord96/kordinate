questions:
  - q: "Is schema validation applied at API boundaries before request data reaches business logic?"
    weight: 3
    signals: ["pydantic BaseModel on endpoint", "zod schema validation", "joi.validate on request"]
  - q: "Do validation errors return specific field-level messages indicating what failed and why?"
    weight: 2
    signals: ["field-level error response", "validation error details", "which field and constraint"]
  - q: "Are SQL queries and shell commands parameterized rather than built with string concatenation?"
    weight: 3
    signals: ["parameterized query with ?", "bind parameters $1", "no string concatenation for SQL"]
  - q: "Is validation enforced on the server side as the authoritative check, not relying solely on client-side validation?"
    weight: 1
    signals: ["server-side validation", "not trusting client input", "re-validate on server"]
threshold: 6
