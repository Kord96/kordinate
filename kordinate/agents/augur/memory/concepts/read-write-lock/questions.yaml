questions:
  - q: "Are there separate lock acquisition paths for read versus write operations on shared resources?"
    weight: 3
    signals: ["RWMutex with RLock and Lock", "ReentrantReadWriteLock with readLock and writeLock", "shared_lock and unique_lock on same resource"]
  - q: "Are multiple concurrent readers permitted while writers get exclusive access?"
    weight: 3
    signals: ["concurrent reads allowed", "exclusive write lock blocks readers", "shared access for reads only"]
  - q: "Is the lock scope minimal, held only for the duration of the critical section?"
    weight: 2
    signals: ["lock released immediately after read", "defer unlock after critical section", "lock not held during I/O or network calls"]
  - q: "Is write starvation addressed so writers eventually acquire the lock under heavy read load?"
    weight: 1
    signals: ["writer priority or fairness policy", "lock acquisition timeout configured", "fair read-write lock"]
threshold: 6
