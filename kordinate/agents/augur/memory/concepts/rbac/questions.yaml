questions:
  - q: "Is there a role-permission mapping that associates roles with specific permissions?"
    weight: 3
    signals: ["role-permission table", "permission set per role", "ClusterRole with rules defining verbs and resources"]
  - q: "Are permission checks enforced at the middleware or guard layer rather than scattered in business logic?"
    weight: 3
    signals: ["@requires_role decorator", "authorize middleware on routes", "CanActivate guard checking roles"]
  - q: "Are roles assigned to users or groups through an explicit assignment mechanism?"
    weight: 2
    signals: ["user-role assignment table", "RoleBinding binding role to subject", "role granted via admin interface"]
  - q: "Does the system enforce least-privilege defaults for new users or service accounts?"
    weight: 1
    signals: ["default role is viewer or readonly", "namespace-scoped Role preferred over ClusterRole", "minimal permissions on creation"]
threshold: 6
