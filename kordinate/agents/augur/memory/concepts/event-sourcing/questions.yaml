questions:
  - q: "Is aggregate state derived solely by replaying an append-only sequence of events?"
    weight: 3
    signals: ["apply() methods on aggregates that mutate state from events", "load_events() and replay to reconstruct state"]
  - q: "Are events stored in an append-only event store or stream?"
    weight: 3
    signals: ["EventStore or EventStream with append_events()", "EventStoreDB client or append-only table"]
  - q: "Are events named as immutable past-tense facts?"
    weight: 2
    signals: ["OrderPlaced, PaymentReceived event class names", "events describe what happened, never mutated after write"]
  - q: "Do snapshots exist for aggregates with long event histories?"
    weight: 1
    signals: ["Snapshot class or snapshot repository", "snapshot interval configuration for aggregate replay"]
threshold: 6
