  - q: "Do plugins implement a well-defined interface or base class that the core depends on?"
    weight: 3
    signals: ["plugin interface contract", "PluginBase class", "hookspec / hookimpl decorators"]
  - q: "Are plugins discovered dynamically at startup via directory scanning or entry_points configuration?"
