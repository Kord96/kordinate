questions:
  - q: "Is there a plugin registry or manager that handles registration, initialization, and teardown of plugins?"
    weight: 3
    signals: ["PluginManager class", "register_plugin()", "load_plugins() at startup"]
  - q: "Do plugins implement a well-defined interface or base class that the core depends on?"
    weight: 3
    signals: ["plugin interface contract", "PluginBase class", "hookspec / hookimpl decorators"]
  - q: "Are plugins discovered dynamically at startup via directory scanning or entry_points configuration?"
    weight: 2
    signals: ["plugins/ directory scanned", "entry_points in pyproject.toml", "auto-discovery at boot"]
  - q: "Does the core application function correctly without any plugins loaded?"
    weight: 2
    signals: ["graceful degradation without plugins", "optional plugin hooks", "core runs standalone"]
  - q: "Does the framework provide use_*() or register() methods that plug capability modules (CORS, auth, OpenAPI) into the core without modifying it?"
    weight: 2
    signals: ["app.use_cors() or app.use_authentication() adding capabilities", "app.assistant() plugging behavioral module", "config.plugins array loading from plugin directories"]
threshold: 5
