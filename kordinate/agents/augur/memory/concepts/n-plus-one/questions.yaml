questions:
  - q: "Are database queries executed inside a loop that iterates over a collection of parent records?"
    weight: 3
    signals: ["for item in items: item.related.load()", "query inside for loop", "SELECT per iteration"]
  - q: "Are ORM relationships accessed without prefetch_related, includes, or a JOIN on the parent query?"
    weight: 3
    signals: ["missing prefetch_related", "no includes() on association", "lazy loading triggered in loop"]
  - q: "Do SQL logs show N identical SELECT statements differing only by a foreign key value within one request?"
    weight: 2
    signals: ["repeated SELECT by FK", "N queries for N children", "query count scales with result set"]
  - q: "Does request latency scale linearly with the number of records returned?"
    weight: 2
    signals: ["slow with large datasets", "fast in dev slow in prod", "linear query growth"]
threshold: 6
