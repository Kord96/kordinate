questions:
  - q: "Have fields been removed or had their types changed in API responses without a version increment or deprecation period?"
    weight: 3
    signals: ["field removed without warning", "type changed in response", "schema change with no version bump"]
  - q: "Is there no API versioning strategy (no /v1/ prefix, no Accept header versioning, no version parameter)?"
    weight: 3
    signals: ["unversioned endpoints", "no versioning scheme", "single URL with no version"]
  - q: "Have endpoint paths been renamed or restructured without maintaining backward-compatible aliases?"
    weight: 2
    signals: ["URL path renamed", "endpoint moved with no redirect", "route change breaks clients"]
  - q: "Is there no machine-readable API schema (OpenAPI, Protobuf) or contract test suite that would catch breaking changes in CI?"
    weight: 2
    signals: ["no API schema", "no contract tests", "changes detected only by downstream failures"]
threshold: 6
