questions:
  - q: "Are JSON blobs or JSONB columns accessed via string keys without a validation model?"
    weight: 3
    signals: ["data['field'] access with no Pydantic model", "JSONB column queried with string keys in 10+ locations", "raw dict consumed without schema validation"]
  - q: "Are different parts of the codebase assuming different shapes for the same JSON data?"
    weight: 3
    signals: ["inconsistent key access patterns for same data", "schema drift between producer and consumer", "no single type definition for stored JSON"]
  - q: "Are KeyError or TypeError exceptions occurring in production from missing JSON fields?"
    weight: 2
    signals: ["KeyError on data access in logs", "TypeError from unexpected None in JSON field", "missing field causes runtime exception"]
  - q: "Are new fields added to JSON blobs without versioning or migration?"
    weight: 1
    signals: ["migration-free schema changes", "new field added without consumer update", "no JSON schema versioning"]
threshold: 6
