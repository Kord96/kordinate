questions:
  - q: "Is there an explicit transition table mapping (state, event) pairs to next states?"
    weight: 3
    signals: ["transition dict from state-event to next state", "createMachine with state definitions", "transition function with guard conditions"]
  - q: "Are states defined as enums or constants with no implicit state changes via direct assignment?"
    weight: 3
    signals: ["State enum with defined members", "status constants with transition enforcement", "state only changed through transition mechanism"]
  - q: "Are entry and exit actions tied to transitions rather than scattered through business logic?"
    weight: 2
    signals: ["on_enter and on_exit hooks on states", "before_transition and after_transition callbacks", "lifecycle actions declared in state definition"]
  - q: "Are invalid transitions rejected with clear errors rather than silently ignored?"
    weight: 1
    signals: ["error raised on invalid transition", "transition validation before state change", "guard rejects disallowed state move"]
threshold: 6
