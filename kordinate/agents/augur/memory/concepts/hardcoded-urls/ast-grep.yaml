# Score 3: Hardcoded URLs are string literals, so matching them requires regex
# constraints on string values. ast-grep can match URL-like string patterns.

id: hardcoded-urls-http-literal-py
language: Python
rule:
  pattern: $VAR = $URL
  constraints:
    URL:
      regex: '^"https?://[^"]*"$|^''https?://[^'']*''$'
---
id: hardcoded-urls-localhost-py
language: Python
rule:
  pattern: $URL
  constraints:
    URL:
      regex: '".*localhost:\d+.*"|''.*localhost:\d+.*'''
---
id: hardcoded-urls-ip-literal-py
language: Python
rule:
  pattern: $URL
  constraints:
    URL:
      regex: '"https?://\d+\.\d+\.\d+\.\d+.*"|''https?://\d+\.\d+\.\d+\.\d+.*'''
---
id: hardcoded-urls-http-literal-ts
language: TypeScript
rule:
  pattern: $VAR = $URL
  constraints:
    URL:
      regex: '^"https?://[^"]*"$|^''https?://[^'']*''$'
---
id: hardcoded-urls-localhost-ts
language: TypeScript
rule:
  pattern: $URL
  constraints:
    URL:
      regex: '".*localhost:\d+.*"|''.*localhost:\d+.*''|`.*localhost:\d+.*`'
---
id: hardcoded-urls-fetch-literal-ts
language: TypeScript
rule:
  pattern: fetch($URL, $$$OPTS)
  constraints:
    URL:
      regex: '^"https?://.*"$|^''https?://.*''$'
