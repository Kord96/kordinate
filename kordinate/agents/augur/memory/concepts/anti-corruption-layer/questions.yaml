questions:
  - q: "Is there a dedicated translation layer with separate model classes for external systems distinct from the internal domain model?"
    weight: 3
    signals: ["external DTO vs domain model", "separate representations", "mapper between external and internal"]
  - q: "Does the domain code never import or reference types from the external system directly?"
    weight: 3
    signals: ["no external imports in domain", "isolation boundary", "domain depends on ACL interface only"]
  - q: "Are mapping and translation functions centralized in dedicated mapper or translator classes rather than scattered across services?"
    weight: 2
    signals: ["centralized mapping", "translator class", "single place for conversion logic"]
  - q: "Do changes to the external API require updates only in the translation layer without touching domain logic?"
    weight: 2
    signals: ["external change isolation", "domain unaffected by API change", "translation absorbs external drift"]
threshold: 6
