questions:
  - q: "Is there a central coordinator class managing a sequence of saga steps with forward and compensating actions?"
    weight: 3
    signals: ["SagaOrchestrator or SagaCoordinator class", "step definitions with execute and compensate methods", "central class driving step sequence"]
  - q: "Is saga state persisted so recovery can resume or compensate after a crash?"
    weight: 3
    signals: ["saga state written to database", "step status tracked as pending/completed/compensated", "persistent saga log or event store"]
  - q: "Is compensation executed in reverse order of completed steps on failure?"
    weight: 2
    signals: ["reverse-order compensation on failure", "rollback completed steps from last to first", "compensate only completed steps"]
  - q: "Are step executions idempotent so retries do not cause duplicate side effects?"
    weight: 1
    signals: ["idempotency key on step execution", "deduplication on retry", "safe to replay step"]
threshold: 6
