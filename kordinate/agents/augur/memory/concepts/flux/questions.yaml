questions:
  - q: "Is application state held in a central store as a single source of truth?"
    weight: 3
    signals: ["store object holding global state", "createStore or defineStore with centralized state"]
  - q: "Are state changes driven by dispatching action objects to reducer or mutation functions?"
    weight: 3
    signals: ["dispatch(action) calls triggering state updates", "reducer functions transforming state in response to actions"]
  - q: "Are reducers or mutations pure functions with no side effects?"
    weight: 2
    signals: ["reducer returns new state without mutating arguments", "no API calls or async logic inside reducers"]
  - q: "Are side effects handled in middleware, thunks, or sagas rather than in reducers or components?"
    weight: 1
    signals: ["redux-thunk or redux-saga for async operations", "side effects isolated in middleware layer"]
threshold: 6
