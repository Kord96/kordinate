questions:
  - q: "Are nodes and edges explicitly typed with properties/attributes attached to each?"
    weight: 3
    signals: ["Node class with label and properties dict", "Edge with type and attributes", "typed relationships in graph schema"]
  - q: "Does the system use a graph database or library for traversal queries?"
    weight: 3
    signals: ["Neo4j or Gremlin client", "Cypher MATCH queries", "networkx or petgraph traversal calls"]
  - q: "Are multi-hop traversal queries a core access pattern?"
    weight: 2
    signals: ["path queries with variable depth", "shortest path computations", "MATCH (a)-[*2..5]->(b) patterns"]
  - q: "Is there a defined graph schema specifying valid node labels and relationship types?"
    weight: 1
    signals: ["schema definition for node types", "relationship type enum or constants", "graph schema migration"]
threshold: 6
