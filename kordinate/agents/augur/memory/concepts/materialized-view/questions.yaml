questions:
  - q: "Are pre-computed query results stored as denormalized tables or cache entries separate from the source data?"
    weight: 3
    signals: ["CREATE MATERIALIZED VIEW", "denormalized projection table", "pre-computed read model"]
  - q: "Is there a defined refresh mechanism that rebuilds the materialized data on a schedule or in response to events?"
    weight: 3
    signals: ["REFRESH MATERIALIZED VIEW", "cron rebuild job", "event-driven projection update"]
  - q: "Do read queries target the materialized view while writes go to the normalized source of truth?"
    weight: 2
    signals: ["reads from view, writes to source", "CQRS read model", "flat lookup cache"]
  - q: "Is staleness of the materialized data monitored or bounded by a defined tolerance?"
    weight: 2
    signals: ["refresh duration tracked", "staleness age metric", "CONCURRENTLY refresh"]
threshold: 6
