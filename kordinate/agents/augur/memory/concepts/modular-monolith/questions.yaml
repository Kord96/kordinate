questions:
  - q: "Is the application deployed as a single unit with explicit internal module boundaries and restricted cross-module imports?"
    weight: 3
    signals: ["single Dockerfile with modules/ directory", "import restrictions between modules", "explicit public API per module"]
  - q: "Are module boundaries enforced by linting, architecture tests, or build constraints at build time?"
    weight: 3
    signals: ["ArchUnit tests", "eslint import boundaries", "build constraint preventing cross-module access"]
  - q: "Do modules communicate through defined contracts, events, or mediator rather than direct internal class imports?"
    weight: 2
    signals: ["inter-module events", "mediator for cross-module calls", "public interface per module"]
  - q: "Are database tables logically partitioned by module even though they share a physical database?"
    weight: 2
    signals: ["schema per module", "table prefix per domain", "no cross-module table joins"]
threshold: 6
