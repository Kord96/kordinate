questions:
  - q: "Is a single technology used for three or more fundamentally different purposes with workarounds for its limitations?"
    weight: 3
    signals: ["same DB for OLTP and analytics", "Celery for scheduling and orchestration", "workaround code for tool limitation"]
  - q: "Do architectural decisions consistently favor one tool regardless of whether better-fit alternatives exist?"
    weight: 2
    signals: ["always use X pattern", "no ADR evaluating alternatives", "default to same framework"]
  - q: "Does workaround code to compensate for tool limitations exceed the actual business logic it supports?"
    weight: 3
    signals: ["shims around tool gaps", "custom wrappers for unsupported features", "extensive compatibility layer"]
  - q: "Does one shared infrastructure component create cross-workload performance interference?"
    weight: 1
    signals: ["analytics queries slow transactions", "single database bottleneck", "shared queue contention"]
threshold: 6
