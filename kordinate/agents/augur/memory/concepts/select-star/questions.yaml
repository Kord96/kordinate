questions:
  - q: "Does SELECT * appear in production query paths rather than explicit column lists?"
    weight: 3
    signals: ["SELECT * in raw SQL strings", "Model.objects.all() without .only() or .values()", "findAll without projection parameter"]
  - q: "Are ORM queries loading full objects when only one or two fields are needed by the caller?"
    weight: 3
    signals: ["full model loaded but only name accessed", "no .defer() or .only() on queryset", "repository returns entire entity for summary endpoint"]
  - q: "Is query response payload significantly larger than what the consuming code actually uses?"
    weight: 2
    signals: ["wide row fetched but few columns used", "serializer outputs subset of loaded fields", "unnecessary columns transferred over wire"]
  - q: "Are index-only scans prevented because queries request all columns?"
    weight: 1
    signals: ["query plan shows full table scan", "covering index not used due to SELECT *", "database I/O higher than expected"]
threshold: 6
