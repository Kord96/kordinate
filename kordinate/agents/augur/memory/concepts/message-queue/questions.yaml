questions:
  - q: "Are messages delivered point-to-point where each message is consumed by exactly one consumer?"
    weight: 3
    signals: ["single consumer per message", "worker dequeues from named queue", "visibility timeout"]
  - q: "Is there explicit message acknowledgment after successful processing?"
    weight: 3
    signals: ["ack() after processing", "message.acknowledge()", "nack on failure"]
  - q: "Are failed messages retried with backoff and eventually routed to a dead-letter queue?"
    weight: 2
    signals: ["dead-letter queue configured", "retry with backoff", "max delivery attempts"]
  - q: "Do consumers handle redelivered messages idempotently in case of ack timeout or crash?"
    weight: 2
    signals: ["idempotent consumer", "deduplication by message ID", "at-least-once with idempotency"]
threshold: 6
