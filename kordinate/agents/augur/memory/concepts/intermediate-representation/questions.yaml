questions:
  - q: "Is there a structured intermediate form sitting between the AST and final output with typed instructions in basic blocks?"
    weight: 3
    signals: ["IR instruction type", "basic block with instructions", "SSA form variables"]
  - q: "Are there optimization or transformation passes that operate on the IR before code generation?"
    weight: 3
    signals: ["optimization pass", "IR transform", "pass manager"]
  - q: "Does an IRBuilder or emit() API construct IR instructions from higher-level AST nodes?"
    weight: 2
    signals: ["IRBuilder", "emit() method", "lower AST to IR"]
  - q: "Is the lowering from AST to IR a separate, testable phase rather than interleaved with parsing?"
    weight: 1
    signals: ["separate lowering phase", "AST to IR pass", "distinct parse and lower stages"]
threshold: 6
