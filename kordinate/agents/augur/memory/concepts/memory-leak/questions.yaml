questions:
  - q: "Are event listeners or subscriptions registered without corresponding removal in teardown or cleanup?"
    weight: 3
    signals: ["addEventListener without removeEventListener", "on() without off()", "setInterval never cleared"]
  - q: "Do in-memory collections (dicts, lists, caches) grow without bounds or eviction in long-running processes?"
    weight: 3
    signals: ["unbounded dict.append in loop", "global cache with no max size", "no TTL on cache entries"]
  - q: "Are resources (file handles, connections, sockets) opened without context managers or try-finally cleanup?"
    weight: 2
    signals: ["open() without with", "missing close()", "no using block"]
  - q: "Do circular references exist that could prevent garbage collection in reference-counted runtimes?"
    weight: 2
    signals: ["object A references B references A", "parent-child circular ref", "no weakref for back-references"]
threshold: 6
