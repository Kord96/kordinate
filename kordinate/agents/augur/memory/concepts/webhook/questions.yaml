questions:
  - q: "Does the system register callback URLs and deliver HTTP POST requests to them when events occur?"
    weight: 3
    signals: ["webhook_url or callback_url registration", "HTTP POST on event", "event-driven callback delivery"]
  - q: "Are webhook payloads signed with HMAC and verified on the receiving side?"
    weight: 3
    signals: ["X-Hub-Signature or X-Signature-256", "hmac.compare_digest verification", "shared secret payload signing"]
  - q: "Does the webhook delivery system retry failed deliveries with exponential backoff?"
    weight: 2
    signals: ["retry on 4xx/5xx", "exponential backoff on failure", "delivery retry logic"]
  - q: "Are idempotency keys or event IDs included in payloads so receivers can deduplicate?"
    weight: 1
    signals: ["idempotency key in payload", "event_id for deduplication", "at-least-once with dedup support"]
  - q: "Does the system receive incoming webhook events from external platforms (Slack, GitHub, Stripe) via HTTP POST endpoints with request signature verification?"
    weight: 3
    signals: ["HTTPReceiver/ExpressReceiver handling incoming webhooks", "verifyRequestSignature or X-Slack-Signature validation", "incoming HTTP POST from external platform with secret verification"]
threshold: 5
