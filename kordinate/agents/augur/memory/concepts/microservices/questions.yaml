questions:
  - q: "Are there multiple independently deployable services, each with its own build artifact or Dockerfile?"
    weight: 3
    signals: ["separate Dockerfile per service", "independent deployment pipelines", "service-per-directory layout"]
  - q: "Does each service own its data store without sharing database tables with other services?"
    weight: 3
    signals: ["per-service database", "no shared tables across services", "schema ownership boundary"]
  - q: "Do services communicate via explicit contracts such as protobuf, OpenAPI specs, or async messaging?"
    weight: 2
    signals: ["gRPC proto definitions", "OpenAPI spec per service", "AsyncAPI schema"]
  - q: "Can individual services be scaled, deployed, and rolled back without coordinating releases of others?"
    weight: 2
    signals: ["independent rollback", "per-service scaling config", "no deployment coupling"]
threshold: 6
