    signals: ["logger.error(e); raise e", "log(e); throw e", "catch log and rethrow"]
  - q: "Is the same exception logged at multiple layers as it propagates up the call stack?"
    weight: 3
    signals: ["duplicate error entries", "same exception logged at each layer", "multiple stack depths"]
  - q: "Do error count dashboards show inflated numbers that are multiples of actual failure occurrences?"
    weight: 2
    signals: ["error rate inflation", "3x actual failures", "duplicate error metrics"]
  - q: "Do catch blocks log the full stack trace and then rethrow the same exception unchanged?"
    weight: 2
    signals: ["log stack trace then throw", "catch rethrow unchanged", "no wrapping on rethrow"]
