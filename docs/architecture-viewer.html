          'font-size': '9px',
          'font-family': 'Inter, sans-serif',
          'color': 'rgba(255,255,255,0.25)',
          'text-rotation': 'autorotate',
          'text-margin-y': -10,
          'text-background-color': '#1a1a2e',
          'text-background-opacity': 0.85,
          'text-background-padding': '3px',
          'text-background-shape': 'roundrectangle'
        }
      },
      // Hover glow
      {
        selector: 'node.hover-glow',
        style: {
          'overlay-color': '#7b68ee',
          'overlay-opacity': 0.15,
          'overlay-padding': 8
        }
      },
      // Highlighted edges
      {
        selector: 'edge.highlighted',
        style: {
          'line-color': 'rgba(123,104,238,0.6)',
          'target-arrow-color': 'rgba(123,104,238,0.6)',
          'color': 'rgba(255,255,255,0.7)',
          'width': 2.5,
          'z-index': 999
        }
      },
      // Flow-highlighted edges
      {
        selector: 'edge.flow-highlight',
        style: {
          'line-color': 'rgba(123,104,238,0.7)',
          'target-arrow-color': 'rgba(123,104,238,0.7)',
          'color': 'rgba(255,255,255,0.8)',
          'width': 3,
          'z-index': 1000
        }
      },
      // Dimmed
      {
        selector: 'node.dimmed',
        style: { 'opacity': 0.2 }
      },
      {
        selector: 'edge.dimmed',
        style: { 'opacity': 0.08 }
      },
      // Expandable cue: + badge
      {
        selector: 'node[?collapsed][?hasChildren]',
        style: {
          'border-width': 2
        }
      }
    ]
  });

  // === GRAPH BUILDING =======================================================

  // Find the visible ancestor of a node (the highest collapsed parent, or self)
  function findVisibleAncestor(id) {
    if (!nodeMap[id]) return null;
    // Walk up from id; return the first ancestor that IS in the graph
    var current = id;
    while (current) {
      if (cy.getElementById(current).length > 0) return current;
      current = nodeMap[current] ? nodeMap[current].parent : null;
    }
    return null;
  }

  // Build the current visible graph
  function rebuildGraph(animateLayout) {
    var elements = [];
    var visibleIds = new Set();

    function addNode(id, parentIdInGraph) {
      var n = nodeMap[id];
      if (!n) return;
      visibleIds.add(id);

      var isExpanded = expandedNodes[id];
      var kids = childrenOf[id] || [];
      var hasKids = kids.length > 0;
      var desc = countDescendants(id);

      var label = n.name;
      if (hasKids && !isExpanded) {
        label = n.name + '  [' + desc + ']';
      }

      var nodeData = {
        id: id,
        label: label,
        nodeType: n.type,
        description: n.description || '',
        hasChildren: hasKids,
        collapsed: hasKids && !isExpanded,
        file: n.file || '',
        origName: n.name
      };
      if (parentIdInGraph && isExpanded) {
        // Only set compound parent if parent is expanded
      }
      if (parentIdInGraph) {
        nodeData.parent = parentIdInGraph;
      }

      elements.push({ group: 'nodes', data: nodeData });

      if (isExpanded && hasKids) {
        kids.forEach(function(kid) {
          addNode(kid, id);
        });
      }
    }

    rootIds.forEach(function(rid) {
      addNode(rid, null);
    });

    // Build edges: only between visible nodes
    var edgeElements = [];
    RAW.edges.forEach(function(e, i) {
      var src = findVisibleNodeForEdge(e.source, visibleIds);
      var tgt = findVisibleNodeForEdge(e.target, visibleIds);
      if (src && tgt && src !== tgt) {
        // Check if this edge already exists (avoid duplicates)
        var edgeKey = src + '->' + tgt;
        var exists = edgeElements.some(function(ee) {
          return ee.data.source === src && ee.data.target === tgt;
        });
        if (!exists) {
          // Determine if edge crosses group boundary
          var srcTop = getTopLevel(src);
          var tgtTop = getTopLevel(tgt);
          var edgeStyle = srcTop !== tgtTop ? 'dashed' : 'solid';
          edgeElements.push({
            group: 'edges',
            data: {
              id: 'edge-' + i + '-' + src + '-' + tgt,
              source: src,
              target: tgt,
              label: e.label || '',
              edgeStyle: edgeStyle,
              flowId: e.flowId || ''
            }
          });
        }
      }
    });

    elements = elements.concat(edgeElements);

    // Apply to cytoscape
    cy.elements().remove();
    cy.add(elements);

    // Update counter
    updateNodeCounter(visibleIds.size);

    // Layout
    var layoutOpts = {
      name: 'cose-bilkent',
      quality: 'proof',
      nodeDimensionsIncludeLabels: true,
      idealEdgeLength: visibleIds.size > 30 ? 80 : 120,
      nodeRepulsion: visibleIds.size > 30 ? 6000 : 8000,
      edgeElasticity: 0.45,
      nestingFactor: 0.1,
      gravity: 0.25,
      gravityRange: 3.8,
      numIter: 2500,
      tile: true,
      tilingPaddingVertical: 16,
      tilingPaddingHorizontal: 16,
      animate: animateLayout ? 'end' : false,
      animationDuration: animateLayout ? 400 : 0,
      fit: true,
      padding: 100
    };

    cy.layout(layoutOpts).run();

    // Make collapsed group nodes ungrabified for clean click
    cy.nodes('[?collapsed]').ungrabify();
  }

  function findVisibleNodeForEdge(nodeId, visibleIds) {
    var current = nodeId;
    while (current) {
      if (visibleIds.has(current)) return current;
      current = nodeMap[current] ? nodeMap[current].parent : null;
    }
    return null;
  }

  function getTopLevel(id) {
    var current = id;
    while (nodeMap[current] && nodeMap[current].parent) {
      current = nodeMap[current].parent;
    }
    return current;
  }

  // === EXPAND / COLLAPSE ====================================================

  function expandNode(id) {
    if (!childrenOf[id] || childrenOf[id].length === 0) return;
    expandedNodes[id] = true;
    rebuildGraph(true);
    updateBreadcrumb(id);
  }

  function collapseNode(id) {
    // Collapse this node and all descendants
    delete expandedNodes[id];
    function collapseDescendants(nid) {
      var kids = childrenOf[nid] || [];
      kids.forEach(function(kid) {
        delete expandedNodes[kid];
        collapseDescendants(kid);
      });
    }
    collapseDescendants(id);
    rebuildGraph(true);
    // Update breadcrumb to parent
    var parent = nodeMap[id] ? nodeMap[id].parent : null;
    updateBreadcrumb(parent);
  }

  function expandAll() {
    RAW.nodes.forEach(function(n) {
      if (n.hasChildren) expandedNodes[n.id] = true;
    });
    rebuildGraph(false);
    updateBreadcrumb(null);
  }

  function collapseAll() {
    expandedNodes = {};
    rebuildGraph(true);
    updateBreadcrumb(null);
  }

  function resetView() {
    expandedNodes = {};
    focusedNodeId = null;
    rebuildGraph(false);
    updateBreadcrumb(null);
    setTimeout(function() { cy.fit(undefined, 100); }, 300);
  }

  // === BREADCRUMB ===========================================================

  function updateBreadcrumb(activeNodeId) {
    var bc = document.getElementById('breadcrumb');
    bc.innerHTML = '';

    // Always show "System" root
    var rootCrumb = document.createElement('span');
    rootCrumb.className = 'bc-crumb' + (!activeNodeId ? ' current' : '');
    rootCrumb.textContent = 'System';
    rootCrumb.onclick = function() {
      collapseAll();
    };
    bc.appendChild(rootCrumb);

    if (!activeNodeId) return;

    var ancestors = getAncestors(activeNodeId);
    ancestors.forEach(function(id, idx) {
      var sep = document.createElement('span');
      sep.className = 'bc-sep';
      sep.textContent = '\u203A';
      bc.appendChild(sep);

      var crumb = document.createElement('span');
      var isLast = idx === ancestors.length - 1;
      crumb.className = 'bc-crumb' + (isLast ? ' current' : '');
      crumb.textContent = nodeMap[id].name;
      if (!isLast) {
        crumb.onclick = (function(nid) {
          return function() {
            // Collapse everything below this node
            var kids = childrenOf[nid] || [];
            kids.forEach(function(kid) {
              delete expandedNodes[kid];
              function collapseBelow(cid) {
                var ck = childrenOf[cid] || [];
                ck.forEach(function(c) {
                  delete expandedNodes[c];
                  collapseBelow(c);
                });
              }
              collapseBelow(kid);
            });
            rebuildGraph(true);
            updateBreadcrumb(nid);
          };
        })(id);
      }
      bc.appendChild(crumb);
    });
  }

  // === NODE COUNTER =========================================================

  function updateNodeCounter(visible) {
    var counter = document.getElementById('node-counter');
    counter.innerHTML = 'Showing <strong>' + visible + '</strong> of <strong>' + totalNodes + '</strong> nodes';
  }

  // === TOOLTIP ==============================================================

  var tooltip = document.getElementById('tooltip');
  var ttLabel = tooltip.querySelector('.tt-label');
  var ttType = tooltip.querySelector('.tt-type');
  var ttFile = tooltip.querySelector('.tt-file');
  var ttDesc = tooltip.querySelector('.tt-desc');
  var ttExports = tooltip.querySelector('.tt-exports');
  var ttChildrenHint = tooltip.querySelector('.tt-children-hint');

  function showTooltip(cyNode) {
    var id = cyNode.data('id');
    var n = nodeMap[id];
    if (!n) return;

    var cfg = getTypeConfig(n.type);
    ttLabel.textContent = n.name;
    ttType.textContent = n.type.replace(/-/g, ' ');
    ttType.style.color = cfg.bg === 'rgba(255,255,255,0.03)' ? '#7b68ee' : cfg.bg;
    ttFile.textContent = n.file || '';
    ttFile.style.display = n.file ? 'block' : 'none';
    ttDesc.textContent = n.description || '';

    // Exports
    if (n.exports && n.exports.length > 0) {
      var html = '<div class="tt-exports-title">Exports (' + n.exports.length + ')</div>';
      n.exports.forEach(function(exp) {
        html += '<div class="tt-export-item">';
        html += '<span class="export-name">' + escapeHtml(exp.name) + '</span>';
        if (exp.kind) html += '<span class="export-kind"> (' + exp.kind + ')</span>';
        html += '</div>';
      });
      ttExports.innerHTML = html;
      ttExports.style.display = 'block';
    } else {
      ttExports.style.display = 'none';
    }

    // Children hint
    var kids = childrenOf[id] || [];
    if (kids.length > 0 && !expandedNodes[id]) {
      ttChildrenHint.textContent = 'Click to expand ' + countDescendants(id) + ' child nodes';
      ttChildrenHint.style.display = 'block';
    } else if (kids.length > 0 && expandedNodes[id]) {
      ttChildrenHint.textContent = 'Right-click to collapse';
      ttChildrenHint.style.display = 'block';
    } else {
      ttChildrenHint.style.display = 'none';
    }

    tooltip.classList.add('visible');
  }

  function hideTooltip() {
    tooltip.classList.remove('visible');
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // === FLOW FILTERS =========================================================

  var flows = [
    { id: 'ssr-prefetch-flow', name: 'SSR Prefetch', color: '#4a90d9' },
    { id: 'infinite-scroll-flow', name: 'Infinite Scroll', color: '#1abc9c' },
    { id: 'load-more-flow', name: 'Load More', color: '#e67e22' },
    { id: 'cart-flow', name: 'Cart Flow', color: '#9b59b6' },
    { id: 'theme-flow', name: 'Theme Toggle', color: '#e74c3c' }
  ];

  var activeFlow = null;

  function buildFlowFilters() {
    var container = document.getElementById('flow-filters');
    flows.forEach(function(flow) {
      var pill = document.createElement('button');
      pill.className = 'flow-pill';
      pill.textContent = flow.name;
      pill.dataset.flowId = flow.id;
      pill.onclick = function() {
        if (activeFlow === flow.id) {
          activeFlow = null;
          pill.classList.remove('active');
          cy.elements().removeClass('dimmed flow-highlight highlighted');
        } else {
          activeFlow = flow.id;
          document.querySelectorAll('.flow-pill').forEach(function(p) { p.classList.remove('active'); });
          pill.classList.add('active');
          highlightFlow(flow.id);
        }
      };
      container.appendChild(pill);
    });
  }

  function highlightFlow(flowId) {
    cy.elements().removeClass('dimmed flow-highlight highlighted');
    var flowEdges = cy.edges().filter(function(e) { return e.data('flowId') === flowId; });
    if (flowEdges.length === 0) return;

    var connectedNodes = flowEdges.connectedNodes();
    // Also include parent compound nodes
    var allRelevant = connectedNodes.union(flowEdges);
    connectedNodes.forEach(function(n) {
      var ancestors = n.ancestors();
      allRelevant = allRelevant.union(ancestors);
    });

    cy.elements().not(allRelevant).addClass('dimmed');
    flowEdges.addClass('flow-highlight');
  }

  // === EVENT HANDLERS =======================================================

  // Click to expand
  cy.on('tap', 'node', function(e) {
    var node = e.target;
    var id = node.data('id');
    var hasKids = (childrenOf[id] || []).length > 0;

    if (hasKids && !expandedNodes[id]) {
      expandNode(id);
    }
  });

  // Right-click to collapse
  cy.on('cxttap', 'node', function(e) {
    e.preventDefault();
    var node = e.target;
    var id = node.data('id');
    if (expandedNodes[id]) {
      collapseNode(id);
    }
  });

  // Prevent default context menu
  document.getElementById('cy').addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // Tooltip on hover
  cy.on('mouseover', 'node', function(e) {
    var node = e.target;
    showTooltip(node);
    node.addClass('hover-glow');

    // Highlight connected edges
    if (!activeFlow) {
      var connected = node.connectedEdges();
      var neighbors = node.neighborhood().add(node);
      connected.addClass('highlighted');
      cy.elements().not(neighbors).not(connected).addClass('dimmed');
    }
  });

  cy.on('mouseout', 'node', function(e) {
    hideTooltip();
    e.target.removeClass('hover-glow');
    if (!activeFlow) {
      cy.elements().removeClass('highlighted dimmed');
    }
  });

  cy.on('mousemove', function(e) {
    if (tooltip.classList.contains('visible') && e.originalEvent) {
      var x = e.originalEvent.clientX;
      var y = e.originalEvent.clientY;
      var pad = 16;
      var tw = tooltip.offsetWidth;
      var th = tooltip.offsetHeight;
      var left = x + pad;
      var top = y + pad;
      if (left + tw > window.innerWidth - 20) left = x - tw - pad;
      if (top + th > window.innerHeight - 20) top = y - th - pad;
      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';
    }
  });

  // Cursor hints
  cy.on('mouseover', 'node[?collapsed][?hasChildren]', function() {
    document.getElementById('cy').style.cursor = 'pointer';
  });
  cy.on('mouseout', 'node[?collapsed][?hasChildren]', function() {
    document.getElementById('cy').style.cursor = 'default';
  });
  cy.on('mouseover', 'node[!collapsed][?hasChildren]', function() {
    document.getElementById('cy').style.cursor = 'pointer';
  });
  cy.on('mouseout', 'node[!collapsed][?hasChildren]', function() {
    document.getElementById('cy').style.cursor = 'default';
  });

  // === BUTTON HANDLERS ======================================================

  document.getElementById('btn-expand-all').addEventListener('click', expandAll);
  document.getElementById('btn-collapse-all').addEventListener('click', collapseAll);
  document.getElementById('btn-reset').addEventListener('click', resetView);
  document.getElementById('btn-fit').addEventListener('click', function() {
    cy.animate({ fit: { padding: 100 }, duration: 400, easing: 'ease-in-out-cubic' });
  });

  // === INIT =================================================================

  buildFlowFilters();
  rebuildGraph(false);
  updateBreadcrumb(null);

  cy.ready(function() {
    setTimeout(function() {
      cy.fit(undefined, 100);
      cy.panBy({ x: 0, y: 50 });
    }, 300);
  });

  window.cy = cy;
  window.archData = RAW;
  window.expandNode = expandNode;
  window.collapseNode = collapseNode;

})();
</script>
</body>
</html>
