schema: ownership-policy/v1

# Current pod-agent runtime ownership manifest.
# This file is for the main guard path and intentionally replaces the former
# KORD-based ownership lookup for curated runtime files.

config:
  - file: agents/alfred/profile/config.yaml
    mode: top_level_key
    ownership:
      clusters: alfred
      network: alfred
      cloudflare: charon

protected_paths:
  - path: .claude/ownership-policy.yaml
    owner: team
    reason: Guard ownership manifest on workstation
  - path: settings.json
    owner: team
    reason: Hook and environment configuration
  - path: shared/memory/auth-protocol.md
    owner: shared
    reason: Authentication protocol
  - path: shared/memory/credentials-protocol.md
    owner: shared
    reason: Credentials protocol
  - path: shared/memory/memory-protocol.md
    owner: shared
    reason: Memory protocol
  - path: shared/memory/gemini-protocol.md
    owner: shared
    reason: Gemini protocol
  - path: agents/alfred/profile/locks/
    owner: alfred
    reason: Alfred-owned auth lock source
  - path: shared/runtime/profile/locks/
    owner: shared
    reason: Runtime lock projection
  - path: .local/share/kordinate/locks/
    owner: shared
    reason: Runtime lock cache
  - path: .local/share/kordinate/profile/
    owner: shared
    reason: Runtime profile projection cache
  - path: shared/runtime/profile/overlays/
    owner: shared
    reason: Runtime overlay projection
  - path: shared/runtime/profile/backend-aliases.yaml
    owner: shared
    reason: Runtime backend alias projection
  - path: shared/runtime/profile/model-profiles.yaml
    owner: shared
    reason: Runtime model profile projection
  - path: shared/klaude-daemon/
    owner: shared
    reason: Shared Klaude daemon runtime implementation
  - path: shared/skills/validate-output/
    owner: shared
    reason: Shared validation protocol and invocation contract
  - path: shared/skills/sanitize/
    owner: shared
    reason: Shared sanitize protocol and secret/config classification workflow
  - path: agents/alfred/profile/backend-aliases.yaml
    owner: alfred
    reason: Alfred-owned backend alias source
  - path: agents/alfred/profile/model-profiles.yaml
    owner: alfred
    reason: Alfred-owned model profile source
  - path: agents/alfred/profile/config.example.yaml
    owner: alfred
    reason: Alfred-owned config example source
  - path: agents/alfred/profile/overlays/
    owner: alfred
    reason: Alfred-owned overlay source
  - path: agents/alfred/profile/config.yaml
    owner: alfred
    reason: Alfred-owned cluster and service configuration source
  - path: shared/runtime/profile/config.yaml
    owner: shared
    reason: Runtime config projection
  - path: agents/augur/memory/concepts.md
    owner: augur
    reason: Augur concept catalog
  - path: agents/augur/memory/anti-patterns.md
    owner: augur
    reason: Augur anti-pattern catalog
  - path: agents/augur/memory/abstractions.md
    owner: augur
    reason: Augur abstraction catalog
  - path: agents/augur/memory/app-contract.md
    owner: augur
    reason: Augur app contract
  - path: agents/augur/memory/tools.md
    owner: augur
    reason: Augur tool reference
  - path: agents/augur/memory/workflow.md
    owner: augur
    reason: Augur workflow reference
  - path: agents/augur/skills/analyze/validator/validate.py
    owner: augur
    reason: Augur-owned output validator
