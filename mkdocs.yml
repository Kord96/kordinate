site_name: Kordinate
site_url: https://kord96.github.io/kordinate/
site_description: A framework for kording specialized agents into a team
repo_url: https://github.com/Kord96/kordinate

theme:
  name: material
  logo: assets/logo_light.png
  favicon: assets/logo_dark.png
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/extra.js

nav:
  - Home: index.md
  - Framework:
      - Core Agents:
          - Root: framework/root.md
          - Scribe: framework/scribe.md
      - 2D Memory: framework/memory.md
      - Consultation: framework/consultation.md
      - "Example: Infra Team":
          - Deployer: infra/infrastructure.md
          - Sauron: infra/monitoring.md
  - Installation:
      - Linking: reference/linking.md
      - Sessions & Branches: installation/sessions.md
