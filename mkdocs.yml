site_name: Kordinate
site_url: https://kord96.github.io/kordinate/
site_description: A framework for kording specialized agents into a team
repo_url: https://github.com/Kord96/kordinate

theme:
  name: material
  logo: assets/logo_light.png
  favicon: assets/logo_dark.png
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - toc:
      permalink: true

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/extra.js

nav:
  - Home: index.md
  - Architecture:
      - Overview: framework/overview.md
      - Guards: framework/guards.md
      - Kords: framework/kords.md
  - Recall System: framework/memory.md
  - "Example: Infra Team":
      - Deployer: infra/infrastructure.md
      - Sauron: infra/monitoring.md
  - Installation:
      - Linking: reference/linking.md
      - Sessions & Branches: installation/sessions.md
