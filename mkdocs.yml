site_name: Kordinate
site_url: https://kord96.github.io/kordinate/
site_description: A framework for kording specialized agents into a team
repo_url: https://github.com/Kord96/kordinate

theme:
  name: material
  logo: assets/logo_light.png
  favicon: assets/logo_dark.png
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/extra.js

nav:
  - Home: index.md
  - Framework:
      - Core Agents: framework/agents.md
      - Memory: framework/memory.md
      - Consultation: framework/consultation.md
      - Hooks: framework/hooks.md
      - Linking: framework/linking.md
  - "Example: Infra Team":
      - Infrastructure: infra/infrastructure.md
      - Monitoring: infra/monitoring.md
  - Kording Guide: kording-guide.md
  - Reference:
      - Source Map: reference/source-map.md
      - Patterns:
          - Index: reference/patterns/index.md
          - API Gateway: reference/patterns/api-gateway.md
          - Backpressure: reference/patterns/backpressure.md
          - Bulkhead: reference/patterns/bulkhead.md
          - Choreography: reference/patterns/choreography.md
          - Circuit Breaker: reference/patterns/circuit-breaker.md
          - CQRS: reference/patterns/cqrs.md
          - DDD: reference/patterns/ddd.md
          - ETL: reference/patterns/etl.md
          - Event Sourcing: reference/patterns/event-sourcing.md
          - Hexagonal: reference/patterns/hexagonal.md
          - Plugin: reference/patterns/plugin.md
          - Retry: reference/patterns/retry.md
          - Saga: reference/patterns/saga.md
          - Service Manager: reference/patterns/service-manager.md
          - Sidecar: reference/patterns/sidecar.md
          - Stream to Store: reference/patterns/stream-to-store.md
      - Libraries:
          - Index: reference/libraries/index.md
          - klog: reference/libraries/klog.md
          - Orchestrator: reference/libraries/orchestrator.md
          - Stoik: reference/libraries/stoik.md
